<title>기업 해독</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 종목 탭 → 머리말(요약·3축) → 2열 카드 격자(실적·이익의 질·구성·성장 단계·동종사·주가·밸류·재검토·사실·공시). scripts/company_decode/cli.py render 가 DATA 를 채운다 */
:root {
  --bg: #f1f3f4; --surface: #ffffff; --ink: #1a1f24; --muted: #5f6b73; --line: #d9dee2;
  --accent: #1d5f8a; --accent-soft: #dbe8f1; --bar: #9db7cb; --bar2: #1d5f8a; --neg: #b8442f; --ok: #237a45; --ok-soft: #e0f1e6;
  --warn: #b8442f; --warn-soft: #f7e2dc; --watch: #9a6a10; --watch-soft: #f5ebd6; --pend: #66707a; --pend-soft: #e8ebee;
  --mix1: #1d5f8a; --mix2: #4f8fb8; --mix3: #8fb9d4; --mix4: #c98b3c; --mix5: #7c8d99;
  --font: "IBM Plex Sans KR", "Malgun Gothic", sans-serif; --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171b; --surface: #1a2126; --ink: #e2e8ec; --muted: #94a2ab; --line: #2b353c;
  --accent: #6db3e0; --accent-soft: #1d3342; --bar: #3d5c72; --bar2: #6db3e0; --neg: #ef8a73; --ok: #6fcf8f; --ok-soft: #1c3326;
  --warn: #ef8a73; --warn-soft: #3d241e; --watch: #e0b45a; --watch-soft: #3a2f18; --pend: #9aa6ae; --pend-soft: #262e33;
  --mix1: #6db3e0; --mix2: #4a8ab5; --mix3: #2f6286; --mix4: #d9a159; --mix5: #7f909b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12171b; --surface: #1a2126; --ink: #e2e8ec; --muted: #94a2ab; --line: #2b353c;
  --accent: #6db3e0; --accent-soft: #1d3342; --bar: #3d5c72; --bar2: #6db3e0; --neg: #ef8a73; --ok: #6fcf8f; --ok-soft: #1c3326;
  --warn: #ef8a73; --warn-soft: #3d241e; --watch: #e0b45a; --watch-soft: #3a2f18; --pend: #9aa6ae; --pend-soft: #262e33;
  --mix1: #6db3e0; --mix2: #4a8ab5; --mix3: #2f6286; --mix4: #d9a159; --mix5: #7f909b; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 16px; }
.wrap > * { min-width: 0; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { font: inherit; font-weight: 600; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.head { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; }
.head-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.head h1 { font-size: 24px; }
.mono { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.price { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; margin-left: auto; }
.summary { font-size: 15px; }
.axes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.axis { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; }
.axis .k { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.axis .v { font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card h2 { font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card h2 small { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.card.wide { grid-column: 1 / -1; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--font); font-size: 10.5px; fill: var(--muted); }
svg .lbl { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.note { font-size: 12px; color: var(--muted); }
.stages { display: grid; gap: 10px; }
.stage-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 4px 12px; align-items: center; }
.stage-row .n { font-weight: 600; font-size: 13.5px; }
.stage-row .d { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.dots { display: flex; align-items: center; }
.dots span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); flex: none; }
.dots span.on { background: var(--accent); }
.dots b { height: 2px; flex: 1; background: var(--line); }
.dots b.on { background: var(--accent); }
.stage-axis { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; font-size: 10.5px; color: var(--muted); }
.stage-axis div:last-child { display: flex; justify-content: space-between; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 1px; }
.tile .k { font-size: 11.5px; color: var(--muted); }
.tile .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 11.5px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); padding: 5px 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.c-ok { background: var(--ok-soft); color: var(--ok); } .c-warn { background: var(--warn-soft); color: var(--warn); }
.c-watch { background: var(--watch-soft); color: var(--watch); } .c-pending { background: var(--pend-soft); color: var(--pend); }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 13px; }
dt { color: var(--muted); } dd { margin: 0; }
.ev { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
.ev span:nth-child(odd) { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.views { display: flex; gap: 6px; }
.views button { font: inherit; font-weight: 600; padding: 7px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.views button[aria-selected="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.ovtool { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
.ovtool label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.ovtool input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 170px; }
#ovw table th { cursor: pointer; white-space: nowrap; user-select: none; }
#ovw table th.on { color: var(--ink); }
#ovw tbody tr { cursor: pointer; } #ovw tbody tr:hover { background: var(--accent-soft); }
#ovw td.num, #ovw th.num { text-align: right; font-variant-numeric: tabular-nums; }
#ovw .nm { font-weight: 600; } #ovw .cd { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
#ovw .neg { color: var(--neg); } #ovw .pos { color: var(--ok); }
footer { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
.tbl-scroll { overflow-x: auto; }
@media (max-width: 760px) { .grid, .axes { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .price { margin-left: 0; } }
</style>

<div class="wrap">
  <div class="views" id="views"><button data-v="ovw">개요</button><button data-v="det">종목 상세</button></div>
  <section id="ovw"></section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="head" id="head"></section>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const fmt = (v, d = 1) => v == null ? "—" : v.toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
const won = v => v == null ? "—" : Math.round(v).toLocaleString("ko-KR");
const NS = "http://www.w3.org/2000/svg";

function svg(w, h, body) { return `<svg viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`; }
function scale(d0, d1, r0, r1) { return v => r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0); }
function nice(lo, hi) { const span = hi - lo || 1, step = Math.pow(10, Math.floor(Math.log10(span / 4))); const m = [1, 2, 2.5, 5, 10].find(m => span / (m * step) <= 5) * step; return { lo: Math.floor(lo / m) * m, hi: Math.ceil(hi / m) * m, step: m }; }

// 막대(매출) + 선(영업이익률)
function revenueChart(a, half) {
  const labels = a.years.map(String).concat(half.label), rev = a.revenue.concat(half.revenue), op = a.op.concat(half.op);
  const opm = rev.map((r, i) => r && op[i] != null ? op[i] / r * 100 : null);
  const W = 560, H = 230, L = 40, R = 40, T = 12, B = 34, n = labels.length, bw = (W - L - R) / n;
  const ys = nice(0, Math.max(...rev.filter(v => v != null))), y = scale(ys.lo, ys.hi, H - B, T);
  const mv = opm.filter(v => v != null), ms = nice(Math.min(0, ...mv), Math.max(...mv)), y2 = scale(ms.lo, ms.hi, H - B, T);
  let g = "";
  for (let v = ys.lo; v <= ys.hi + 1e-9; v += ys.step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v, 0)}</text>`;
  for (let v = ms.lo; v <= ms.hi + 1e-9; v += ms.step) g += `<text x="${W - R + 6}" y="${y2(v) + 3}">${fmt(v, 0)}%</text>`;
  rev.forEach((v, i) => { if (v == null) return; const x = L + i * bw + bw * .18, isHalf = i >= a.years.length;
    g += `<rect x="${x}" y="${y(v)}" width="${bw * .64}" height="${y(0) - y(v)}" fill="${isHalf ? "var(--bar2)" : "var(--bar)"}" rx="2"><title>${labels[i]} 매출 ${fmt(v)}억</title></rect>`;
    g += `<text x="${L + i * bw + bw / 2}" y="${H - B + 14}" text-anchor="middle">${labels[i].replace("FY", "").replace(" 20", "'")}</text>`; });
  const pts = opm.map((v, i) => v == null ? null : [L + i * bw + bw / 2, y2(v)]);
  const seg = (a0, a1) => pts.slice(a0, a1).filter(Boolean).map((p, j) => (j ? "L" : "M") + p.join(",")).join("");
  g += `<path d="${seg(0, a.years.length)}" fill="none" stroke="var(--watch)" stroke-width="2"/>`;
  g += `<path d="${seg(a.years.length, n)}" fill="none" stroke="var(--watch)" stroke-width="2" stroke-dasharray="4 3"/>`;
  pts.forEach((p, i) => { if (p) g += `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--watch)"><title>${labels[i]} 영업이익률 ${fmt(opm[i])}%</title></circle>`; });
  g += `<line x1="${L + a.years.length * bw}" x2="${L + a.years.length * bw}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
  return svg(W, H, g);
}

// 순이익 vs 영업현금흐름
function qualityChart(a, half) {
  const labels = a.years.map(String).concat(half.label), ni = a.ni.concat(half.ni), cf = a.ocf.concat(half.ocf);
  const vals = ni.concat(cf).filter(v => v != null), s = nice(Math.min(0, ...vals), Math.max(0, ...vals));
  const W = 560, H = 210, L = 40, R = 10, T = 10, B = 30, n = labels.length, bw = (W - L - R) / n, y = scale(s.lo, s.hi, H - B, T);
  let g = "";
  for (let v = s.lo; v <= s.hi + 1e-9; v += s.step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v, 0)}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/>`;
  labels.forEach((lb, i) => {
    [[ni[i], "var(--bar)", "순이익"], [cf[i], "var(--accent)", "영업CF"]].forEach(([v, c, nm], k) => { if (v == null) return;
      const x = L + i * bw + bw * (.14 + k * .36), top = Math.min(y(v), y(0));
      g += `<rect x="${x}" y="${top}" width="${bw * .34}" height="${Math.abs(y(v) - y(0))}" fill="${c}" rx="1.5"><title>${lb} ${nm} ${fmt(v)}억</title></rect>`; });
    g += `<text x="${L + i * bw + bw / 2}" y="${H - B + 14}" text-anchor="middle">${lb.replace("FY", "").replace(" 20", "'")}</text>`; });
  g += `<line x1="${L + a.years.length * bw}" x2="${L + a.years.length * bw}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
  return svg(W, H, g);
}

function mixChart(mix) {
  const per = Object.entries(mix.periods), W = 560, rowH = 30, L = 92, R = 8, H = per.length * rowH + 6;
  const colors = ["var(--mix1)", "var(--mix2)", "var(--mix3)", "var(--mix4)", "var(--mix5)"];
  let g = "";
  per.forEach(([p, vals], r) => { let x = L; const yy = r * rowH + 4;
    g += `<text x="0" y="${yy + 15}" class="lbl">${p.length > 12 ? p.slice(0, 12) + "…" : p}</text>`;
    vals.forEach((v, i) => { const w = (W - L - R) * v / 100;
      g += `<rect x="${x}" y="${yy}" width="${Math.max(w - 1, 0)}" height="${rowH - 10}" fill="${colors[i]}"><title>${mix.cats[i]} ${fmt(v)}%</title></rect>`;
      if (w > 34) g += `<text x="${x + w / 2}" y="${yy + 14}" text-anchor="middle" style="fill:#fff;font-weight:600">${fmt(v, 0)}%</text>`;
      x += w; }); });
  const lg = mix.cats.map((c, i) => `<span><i style="background:${colors[i]}"></i>${c}</span>`).join("");
  return svg(W, H, g) + `<div class="legend">${lg}</div>`;
}

function stagesHtml(dr, stages) {
  const rows = dr.map(([n, st, d]) => {
    if (st == null) return `<div class="stage-row"><div class="n">${n}</div><div class="d">단계 미판정${d ? " · " + d : ""}</div></div>`;
    let dots = "";
    for (let i = 1; i <= 5; i++) { dots += `<span class="${i <= st ? "on" : ""}" title="${stages[i - 1]}"></span>`; if (i < 5) dots += `<b class="${i < st ? "on" : ""}"></b>`; }
    return `<div class="stage-row"><div class="n">${n}</div><div class="dots" aria-label="${stages[st - 1]} 단계">${dots}</div><div class="d">${stages[st - 1]} · ${d}</div></div>`; }).join("");
  return `<div class="stage-axis"><div></div><div>${stages.map(s => `<span>${s}</span>`).join("")}</div></div><div class="stages">${rows}</div>`;
}

function peerChart(peers) {
  const pts = peers.filter(p => p.revYoY != null && p.opMargin != null);
  const W = 560, H = 250, L = 40, R = 16, T = 14, B = 34;
  const xs = nice(Math.min(0, ...pts.map(p => p.revYoY)), Math.max(...pts.map(p => p.revYoY))), ys = nice(Math.min(0, ...pts.map(p => p.opMargin)), Math.max(...pts.map(p => p.opMargin)));
  const x = scale(xs.lo, xs.hi, L, W - R), y = scale(ys.lo, ys.hi, H - B, T);
  let g = "";
  for (let v = ys.lo; v <= ys.hi + 1e-9; v += ys.step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v, 0)}%</text>`;
  for (let v = xs.lo; v <= xs.hi + 1e-9; v += xs.step) g += `<text x="${x(v)}" y="${H - B + 14}" text-anchor="middle">${fmt(v, 0)}%</text>`;
  g += `<line x1="${x(0)}" x2="${x(0)}" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="2 3"/>`;
  g += `<text x="${W - R}" y="${H - 4}" text-anchor="end">매출 성장률 FY2025 →</text><text x="${L}" y="${T - 4}">↑ 영업이익률</text>`;
  const placed = [];   // 라벨 겹침 회피: 가까운 라벨이 있으면 아래로 13px씩 민다
  [...pts].sort((a, b) => y(a.opMargin) - y(b.opMargin)).forEach(p => { const cx = x(p.revYoY), cy = y(p.opMargin), anchor = p.self ? "middle" : (cx > W - 170 ? "end" : "start"), dx = anchor === "end" ? -9 : anchor === "start" ? 9 : 0;
    let ly = p.self ? cy - 12 : cy + 4;
    while (placed.some(q => Math.abs(q.y - ly) < 13 && Math.abs(q.x - (cx + dx)) < 150)) ly += p.self ? -13 : 13;
    placed.push({ x: cx + dx, y: ly });
    g += `<circle cx="${cx}" cy="${cy}" r="${p.self ? 7 : 5}" fill="${p.self ? "var(--accent)" : "var(--bar)"}" stroke="var(--surface)" stroke-width="1.5"/>`;
    if (!p.self && ly !== cy + 4) g += `<line x1="${cx}" y1="${cy}" x2="${cx + dx * .6}" y2="${ly - 4}" stroke="var(--muted)" stroke-width=".7"/>`;
    g += `<text x="${cx + dx}" y="${ly}" text-anchor="${anchor}" class="${p.self ? "lbl" : ""}">${p.name} · PBR ${p.pbr == null ? "—" : fmt(p.pbr, 2)}</text>`; });
  const missing = peers.filter(p => p.revYoY == null || p.opMargin == null).map(p => `${p.name}(PBR ${p.pbr == null ? "—" : fmt(p.pbr, 2)})`);
  return svg(W, H, g) + (missing.length ? `<div class="note">재무 결측으로 점 제외: ${missing.join(" · ")}</div>` : "");
}

function priceChart(pr) {
  const s = pr.series, W = 560, H = 220, L = 46, R = 70, T = 10, B = 26;
  const vals = s.map(p => p.c).concat([pr.stop, pr.target]), ys = nice(Math.min(...vals), Math.max(...vals));
  const x = scale(0, s.length - 1, L, W - R), y = scale(ys.lo, ys.hi, H - B, T);
  let g = "";
  for (let v = ys.lo; v <= ys.hi + 1e-9; v += ys.step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${won(v)}</text>`;
  const i52 = Math.max(0, s.length - 51);
  g += `<rect x="${x(i52)}" y="${y(pr.hi52)}" width="${x(s.length - 1) - x(i52)}" height="${y(pr.lo52) - y(pr.hi52)}" fill="var(--accent-soft)" opacity=".7"><title>52주 범위 ${won(pr.lo52)}~${won(pr.hi52)}</title></rect>`;
  let lastYear = "";
  s.forEach((p, i) => { const yr = p.d.slice(0, 4); if (yr !== lastYear) { lastYear = yr; g += `<text x="${x(i)}" y="${H - B + 14}">${yr}</text>`; } });
  g += `<path d="${s.map((p, i) => (i ? "L" : "M") + x(i) + "," + y(p.c)).join("")}" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`;
  [[pr.target, "var(--ok)", "목표"], [pr.stop, "var(--warn)", "손절"]].forEach(([v, c, nm]) => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="5 4"/><text x="${W - R + 4}" y="${y(v) + 4}" style="fill:${c};font-weight:600">${nm} ${won(v)}</text>`; });
  g += `<circle cx="${x(s.length - 1)}" cy="${y(pr.last)}" r="3.5" fill="var(--ink)"/><text x="${W - R + 4}" y="${y(pr.last) + 4}" class="lbl">${won(pr.last)}</text>`;
  return svg(W, H, g);
}

const TPC = { "상향": ["c-ok", "상향"], "하향": ["c-warn", "하향"], "신규": ["c-watch", "신규"], "유지": ["c-pending", "유지"] };

  const up = tp.avg && price ? (tp.avg / price - 1) * 100 : null;

// ── 개요: 모든 종목을 한 표로(필터·정렬) — 행을 누르면 종목 상세로 ──
const OVF = { judged: true, held: false, loss: false, gap: false, warn: false, top: false, q: "" };
let OVS = { k: "held", dir: -1 };
function ovRow(c, i) {
  const p = c.period, rv = p.revenue || [null, null], op = p.op || [null, null], ni = p.ni || [null, null];
  const g = rv[0] > 0 && rv[1] != null ? (rv[1] / rv[0] - 1) * 100 : null;
  const gap = op[1] != null && ni[1] != null && (Math.sign(op[1]) !== Math.sign(ni[1]) || Math.abs(ni[1]) >= 2 * Math.abs(op[1])) && Math.abs(ni[1] - op[1]) > 20;
  const st = c.drivers.filter(d => d[1] != null).map(d => d[1]);
  const a5 = c.score.a5;
  return { i, c, name: c.name, g, op: op[1], mg: rv[1] > 0 && op[1] != null ? op[1] / rv[1] * 100 : null, loss: op[1] != null && op[1] < 0, gap,
    warn: c.checks.filter(x => x[3] === "warn").length, stage: st.length ? Math.max(...st) : null, a5r: a5 && a5.r != null ? a5.r : null, a5f: a5 ? a5.f : null, live: c.score.live ? c.score.live.total : null, held: c.held.length,
    opPrev: op[0], ocf: (p.ocf || [null, null])[1], opUp: op[0] != null && op[1] != null && op[1] > 0 && op[1] > op[0], tpu: c.tp ? c.tp.chg["상향"] : 0, tpd: c.tp ? c.tp.chg["하향"] : 0, judged: c.judged };
}
function renderOv() {
  const all = DATA.companies.map(ovRow);
  const q = OVF.q.trim().toLowerCase();
  const rows = all.filter(r => (!OVF.judged || r.judged) && (!OVF.held || r.held) && (!OVF.loss || r.loss) && (!OVF.gap || r.gap) && (!OVF.warn || r.warn >= 3) && (!OVF.top || (r.a5r != null && r.a5r <= 100))
    && (!q || r.name.toLowerCase().includes(q) || r.c.ticker.includes(q)));
  const key = OVS.k, nz = v => v == null ? -Infinity * OVS.dir : v;
  rows.sort((a, b) => key === "name" ? OVS.dir * a.name.localeCompare(b.name, "ko") : (nz(a[key]) - nz(b[key])) * OVS.dir || a.i - b.i);
  const f1 = (v, d = 1) => v == null ? "—" : fmt(v, d), sg = v => v == null ? "—" : (v >= 0 ? "+" : "") + fmt(v, 1) + "%";
  const th = (k, lb, cls = "") => `<th class="${cls} ${OVS.k === k ? "on" : ""}" data-k="${k}">${lb}${OVS.k === k ? (OVS.dir > 0 ? " ▲" : " ▼") : ""}</th>`;
  const flags = r => [r.loss ? '<span class="chip c-warn">영업적자</span>' : "", r.gap ? '<span class="chip c-watch">순이익 괴리</span>' : ""].join(" ");
  const tb = rows.map(r => `<tr data-i="${r.i}"><td><span class="nm">${r.name}</span><span class="cd">${r.c.ticker}</span></td>
    <td class="num">${r.a5f == null ? "—" : f1(r.a5f)}</td><td class="num">${r.a5r == null ? "유보" : r.a5r.toLocaleString()}</td><td class="num" title="${r.c.score.live ? r.c.score.live.grade : "관심종목 밖 — 라이브 점수 없음"}">${r.live == null ? "—" : f1(r.live)}</td><td>${r.c.held.join(" · ") || "—"}</td>
    <td class="num ${r.g == null ? "" : r.g < 0 ? "neg" : "pos"}">${sg(r.g)}</td><td class="num ${r.loss ? "neg" : ""}">${f1(r.op, 0)}</td><td class="num">${f1(r.mg)}${r.mg == null ? "" : "%"}</td>
    <td class="num ${r.warn >= 3 ? "neg" : ""}">${r.warn}</td><td class="num">${r.stage == null ? "—" : r.stage}</td>
    <td class="num">${r.c.tp ? `${r.tpu}↑ ${r.tpd}↓` : "—"}</td><td>${flags(r)}</td></tr>`).join("");
  // 조건 통과 상위 10 — 미리 정한 기계적 조건. 추천·전망이 아니며 조건은 결과를 보고 바꾸지 않는다.
  const pass = all.filter(r => r.judged && r.opUp && r.warn <= 1 && r.ocf != null && r.ocf > 0 && !r.gap && r.stage != null && r.stage >= 4);
  pass.sort((a, b) => (b.a5f == null ? -1 : b.a5f) - (a.a5f == null ? -1 : a.a5f));
  const top10 = pass.slice(0, 10), nj = all.filter(r => r.judged).length;
  const srow = (r, k) => `<tr data-i="${r.i}"><td class="num">${k + 1}</td><td><span class="nm">${r.name}</span><span class="cd">${r.c.ticker}</span></td><td class="num">${r.a5f == null ? "—" : fmt(r.a5f, 1)}</td>
    <td class="num ${r.g < 0 ? "neg" : "pos"}">${r.g == null ? "—" : (r.g >= 0 ? "+" : "") + fmt(r.g, 1) + "%"}</td><td class="num">${fmt(r.opPrev, 0)} → ${fmt(r.op, 0)}</td><td class="num">${fmt(r.ocf, 0)}</td><td class="num">${r.warn}</td><td class="num">${r.stage}</td><td>${r.c.held.join(" · ") || "—"}</td></tr>`;
  const scr = `<div class="card wide"><h2>조건 통과 상위 10 <small>투자 권유 아님 · 미리 정한 기계적 조건 · 판단 ${nj}종목 중 ${pass.length}종목 통과</small></h2>
    <div class="note">조건(모두 충족): ① H1 영업이익 흑자이고 전년 동기보다 증가 ② 재검토 체크리스트 경고 1개 이하 ③ H1 영업현금흐름 플러스 ④ 순이익 괴리 표시 없음 ⑤ 성장 동력 최고 단계 4 이상 — 통과 종목을 A5 점수 순으로 10개. 앞으로의 수익률을 예측하는 근거는 없으며, 조건은 결과를 보고 바꾸지 않는다. 금융업(보험·증권·카드·지주)은 영업이익·영업CF의 의미가 비금융과 달라도 같은 조건을 그대로 적용해 통과할 수 있고, 영업이익 자료가 없는 종목은 조건 ①에서 빠진다.</div>
    <div class="tbl-scroll"><table><thead><tr><th class="num">#</th><th>종목</th><th class="num">A5 점수</th><th class="num">H1 매출 증감</th><th class="num">H1 영업이익(억)</th><th class="num">H1 영업CF(억)</th><th class="num">경고</th><th class="num">최고 단계</th><th>모의 보유</th></tr></thead>
    <tbody>${top10.map(srow).join("") || '<tr><td colspan="9" class="note">조건을 모두 통과한 종목이 없습니다.</td></tr>'}</tbody></table></div></div>`;
  const chk = (k, lb) => `<label><input type="checkbox" data-f="${k}" ${OVF[k] ? "checked" : ""}>${lb}</label>`;
  $("#ovw").innerHTML = scr + `<div class="card wide"><h2>종목 개요 <small>${rows.length}종목 표시 / 전체 ${all.length} · 판단 ${all.filter(r => r.judged).length} · 열 이름을 누르면 정렬 · 행을 누르면 종목 상세</small></h2>
    <div class="ovtool"><input type="search" id="ovq" placeholder="종목명·코드" value="${OVF.q}">${chk("judged", "판단 있는 종목만")}${chk("held", "모의 보유")}${chk("loss", "영업적자")}${chk("gap", "순이익 괴리")}${chk("warn", "경고 3개 이상")}${chk("top", "A5 100위 이내")}</div>
    <div class="tbl-scroll"><table><thead><tr>${th("name", "종목")}${th("a5f", "A5 점수", "num")}${th("a5r", "A5 순위", "num")}${th("live", "라이브 점수", "num")}${th("held", "모의 보유")}${th("g", "H1 매출 증감", "num")}${th("op", "H1 영업이익(억)", "num")}${th("mg", "영업이익률", "num")}${th("warn", "경고", "num")}${th("stage", "최고 단계", "num")}${th("tpu", "목표가 변동", "num")}<th>표시</th></tr></thead><tbody>${tb || '<tr><td colspan="12" class="note">조건에 맞는 종목이 없습니다.</td></tr>'}</tbody></table></div>
    <div class="note">A5 점수 = 공시 시점(PIT) 재무·주가 기준 월간 점수(순위는 커버리지 60% 미만이면 유보) · 라이브 점수 = 현재 시세 기준 대시보드 점수(관심종목 351종목만, 밖은 —) · 두 점수는 서로 다른 점수라 섞어 보지 않는다 · 경고 = 재검토 체크리스트의 경고 개수 · 최고 단계 = 성장 동력 단계(1 기술 확보 ~ 5 이익·현금, 판단 없는 종목은 —) · 순이익 괴리 = H1 순이익이 영업이익과 부호가 다르거나 2배 이상 차이 · 모의 보유 = VM 5개 슬리브 중 보유한 곳</div></div>`;
}
function setView(v) {
  document.querySelectorAll("#views button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  ["#tabs", "#head", "#grid", "#foot"].forEach(s => { $(s).hidden = v === "ovw"; });
  $("#ovw").hidden = v !== "ovw";
  if (v === "ovw") renderOv();
  try { localStorage.setItem("decode-view", v); } catch (e) {}
}
$("#views").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setView(b.dataset.v); });
$("#ovw").addEventListener("click", e => {
  const h = e.target.closest("th[data-k]");
  if (h) { OVS = { k: h.dataset.k, dir: OVS.k === h.dataset.k ? -OVS.dir : (h.dataset.k === "name" || h.dataset.k === "a5r" ? 1 : -1) }; return renderOv(); }
  const r = e.target.closest("tr[data-i]"); if (r) { render(+r.dataset.i); setView("det"); }
});
$("#ovw").addEventListener("change", e => { const f = e.target.dataset.f; if (f) { OVF[f] = e.target.checked; renderOv(); } });
$("#ovw").addEventListener("input", e => { if (e.target.id === "ovq") { OVF.q = e.target.value; const pos = e.target.selectionStart; renderOv(); const n = $("#ovq"); n.focus(); n.setSelectionRange(pos, pos); } });
let start = 0; try { const s = localStorage.getItem("decode-tab"); const k = DATA.companies.findIndex(c => c.ticker === s); if (k >= 0) start = k; } catch (e) {}
render(start);
let v0 = "ovw"; try { v0 = localStorage.getItem("decode-view") || "ovw"; } catch (e) {}
setView(v0);
</script>
