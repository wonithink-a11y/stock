<body>
<nav class="sitenav" aria-label="사이트 메뉴">

</nav>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span>

    <header class="app-header">
      <span id="market-status-slot"></span>

      </div>
    </header>
    <main id="tab-main"></main>
  </div>
