<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 스코어링 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%8A</text></svg>">
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550;
    --text: #e6ebf5; --muted: #8b96ad; --accent: #4d9fff;
    --good: #2ecc71; --mid: #f1c40f; --bad: #e74c3c;
    --up: #f2555a; --down: #4c8dff;   /* 가격·수급 방향 — 한국식(상승 빨강·하락 파랑), 2026-10-13. 좋음/나쁨은 --good/--bad */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; padding: 20px; }
  header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  h1 { font-size: 20px; }
  #updated { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  nav button { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { color: var(--text); border-color: var(--accent); background: #1e2a44; }
  #nav { margin-bottom: 8px; }
  #subnav button { padding: 5px 12px; font-size: 13px; }
  .today-compact th, .today-compact td { padding: 6px 8px; font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .home-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; align-items: start; }
  .home-v { font-size: 19px; }
  .home-tick { padding: 12px 14px; box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); }   /* 칸 수가 안 나눠떨어져도 빈 회색 칸이 안 생기게 */
  .home-hero a { color: var(--accent); text-decoration: none; }
  .home-hero { display: flex; flex-wrap: wrap; gap: 20px 24px; padding: 20px; border-radius: 12px; }
  .home-breadth { flex: 1 1 240px; display: flex; flex-direction: column; gap: 12px; padding-left: 24px; border-left: 1px solid var(--border); }
  @media (max-width: 700px) { .home-breadth { padding-left: 0; border-left: 0; padding-top: 16px; border-top: 1px solid var(--border); } }
  .home-conf { font-size: 12px; padding: 1px 8px; border-radius: 6px; background: #2a2416; color: #f3c76e; white-space: nowrap; }
  .home-bar { display: grid; grid-template-columns: 96px 1fr 72px; gap: 10px; align-items: center; font-size: 13px; margin-bottom: 6px; }
  .home-bar > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 마감 리포트 탭(시안 2026-10-13) */
  .mrep-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .mrep-arrow { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: #c9d1dc; cursor: pointer; }
  .mrep-arrow:disabled { color: #4a5260; cursor: default; }
  .mrep-sel { height: 40px; padding: 0 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font: inherit; font-size: 13px; }
  .mrep-tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  .mrep-tabs button { min-height: 34px; padding: 0 18px; border: 0; border-radius: 7px; background: transparent; color: #c9d1dc; font: inherit; cursor: pointer; }
  .mrep-tabs button.on { background: #1e2a44; color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
  .mrep-tabs button:disabled { color: #4a5260; cursor: default; }
  .mrep-top { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
  .mrep-top > .card { margin: 0; border-radius: 12px; }
  .mrep-idx { flex: 1 1 200px; padding: 18px; }
  .mrep-big { font-size: 30px; font-weight: 700; line-height: 1.2; }
  .mrep-head { flex: 2 1 360px; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 18px 20px; background: #1b1d1a; border-color: #3a3220; }
  .mrep-head p { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.55; }
  .mrep-cap { font-size: 12px; font-weight: 600; color: #c9a75e; letter-spacing: .04em; }
  .mrep-no { width: 26px; height: 26px; border-radius: 50%; background: #26324a; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: none; }
  .mrep-conf { font-size: 12px; border: 1px solid currentColor; border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
  .mrep-ev { display: flex; flex-direction: column; gap: 8px; padding-left: 12px; border-left: 2px solid var(--border); font-size: 13px; }
  .mrep-rc { display: grid; grid-template-columns: 40px 1fr; gap: 6px 10px; font-size: 13px; }
  .mrep-sec { display: grid; grid-template-columns: 92px 1fr 52px 52px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 5px; }
  .mrep-sec > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrep-tbl th, .mrep-tbl td { text-align: right; padding: 8px 6px; font-size: 13px; }
  .mrep-tbl th:first-child, .mrep-tbl td:first-child { text-align: left; }
  .mrep-tile { padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
  .mrep-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #26324a; }
  @media (max-width: 600px) {
    /* 폰: 한 화면에 더 많이(2026-10-14 사용자 요청) — 날짜·시장 선택을 한 줄로(제목은 드롭다운·탭과 겹쳐 숨김), 카드·글자 축소 */
    .mrep-bar { flex-wrap: nowrap; gap: 8px; margin-bottom: 10px; }
    .mrep-bar h2 { display: none; }
    .mrep-bar > div:first-child { flex-wrap: nowrap; gap: 6px; }
    .mrep-arrow, .mrep-sel { height: 36px; }
    .mrep-arrow { width: 36px; }
    .mrep-tabs { padding: 3px; }
    .mrep-tabs button { min-height: 30px; padding: 0 12px; }
    .mrep-top { gap: 8px; margin-bottom: 12px; }
    .mrep-idx { flex-basis: 140px; padding: 10px 12px; }
    .mrep-big { font-size: 21px; }
    .mrep-head { padding: 12px 14px; gap: 4px; }
    .mrep-head p { font-size: 15px; line-height: 1.5; }
    #content h3 { font-size: 15px !important; margin-bottom: 8px !important; }
    #content .card { padding: 12px; }
    #content article.card { gap: 8px !important; }
    .mrep-ev { gap: 5px; font-size: 12.5px; }
    .mrep-rc { font-size: 12.5px; gap: 4px 8px; }
    .mrep-sec { margin-bottom: 3px; font-size: 12.5px; grid-template-columns: 80px 1fr 46px 46px; }
    .mrep-tbl th, .mrep-tbl td { padding: 6px 4px; font-size: 12.5px; }
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-h { text-align: center; color: var(--muted); font-size: 12px; padding: 2px 0; }
  .cal-c { min-height: 74px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 5px; background: var(--card); font-size: 11px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-c.out { background: transparent; border-color: transparent; }
  .cal-c.empty { opacity: .55; }
  .cal-c[data-events-day] { cursor: pointer; }
  .cal-c[data-events-day]:hover { border-color: var(--accent); }
  .cal-c.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cal-c.sel { background: #1e2a44; border-color: var(--accent); }
  .cal-d { font-size: 12px; color: var(--muted); }
  .cal-b { white-space: nowrap; }
  .cal-agenda { display: none; }
  .cal-ag { display: flex; justify-content: space-between; gap: 8px; padding: 9px 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; cursor: pointer; font-size: 13px; }
  .cal-ag.sel { background: #1e2a44; border-color: var(--accent); }
  @media (max-width: 640px) { .cal-grid { display: none; } .cal-agenda { display: block; } }
  /* (480px 이하 #nav 규칙은 아래 탭 막대로 옮김 — 2026-10-14) */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 15px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .table-wrap { overflow-x: auto; container-type: inline-size; }   /* 펼침 행 요약을 보이는 폭에 맞춘다(100cqw) */
  .grade { font-weight: 700; padding: 2px 8px; border-radius: 6px; display: inline-block; }
  .grade-A { background: #14532d; color: #6ee7a0; }
  .grade-B { background: #1e3a5f; color: #7cc0ff; }
  .grade-C { background: #3f3f24; color: #e8e28a; }
  .grade-D { background: #4a2e1a; color: #f0a868; }
  .grade-E { background: #4c1d1d; color: #f38b8b; }
  .grade-H { background: #333a47; color: #aab4c8; } /* 유보 */
  .pos { color: var(--up); } .neg { color: var(--down); }
  .ok { color: var(--good); } .err { color: var(--bad); }   /* 방향이 아니라 상태(연결·검증) */
  .hm { position: relative; width: 100%; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .hm-g { position: absolute; box-sizing: border-box; border: 1px solid var(--bg); }
  .hm-gh { font-size: 11px; font-weight: 600; padding: 1px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .hm-s { position: absolute; box-sizing: border-box; border: 1px solid rgba(15,20,32,.6); cursor: pointer; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; line-height: 1.15; }
  .hm-s span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  .hm-s:hover { outline: 2px solid #fff; z-index: 2; }
  .warn-tag { display: inline-block; background: #4c1d1d; color: #f38b8b; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
  .group-tag { display: inline-block; background: #1e3a5f; color: #9ecbff; font-size: 11px; padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
  .mkt-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  .mkt-KR { background: #253a5e; color: #8fc1ff; }
  .mkt-US { background: #3d2e5e; color: #c5a8ff; }
  .group-filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .group-filter button { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 12px; }
  .group-filter button.active { color: var(--text); border-color: var(--accent); background: #1e2a44; }
  .regime { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .regime .score { font-size: 34px; font-weight: 700; }
  .regime-favorable { color: var(--good); } .regime-neutral { color: var(--mid); }
  .regime-caution { color: #f0a868; } .regime-risk { color: var(--bad); }
  .muted { color: var(--muted); font-size: 13px; }
  .bar-bg { background: #2a3550; border-radius: 4px; height: 8px; width: 120px; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 8px; border-radius: 4px; background: var(--accent); display: block; }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; line-height: 1.6; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }
  .cyc-tl { border-left: 2px solid var(--border); margin-left: 8px; padding-left: 18px; }
  .cyc-item { position: relative; margin-bottom: 14px; }
  .cyc-item::before { content: ''; position: absolute; left: -24px; top: 14px; width: 10px; height: 10px;
                      border-radius: 50%; background: var(--border); }
  .cyc-item.now::before { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .phase-tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-right: 6px; }
  .ph-TOP { background: #4c1d1d; color: #f38b8b; }
  .ph-A1 { background: #4a2e1a; color: #f0a868; }
  .ph-A2 { background: #3f3f24; color: #e8e28a; }
  .ph-BOTTOM { background: #14532d; color: #6ee7a0; }
  .ph-B1 { background: #1e3a5f; color: #7cc0ff; }
  .ph-B2 { background: #3d2e5e; color: #c5a8ff; }
  .sector-tag { display: inline-block; background: #253a5e; color: #9ecbff; font-size: 11px;
                padding: 1px 7px; border-radius: 4px; margin: 1px 3px 1px 0; }
  .fit-tag { display: inline-block; background: #14532d; color: #6ee7a0; font-size: 11px;
             padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
  .egg-wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }

  /* ── 종목 스코어 탭 (108종목 대응) ─────────────────────── */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--card); border: none; color: var(--muted); padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .seg button.active { background: #1e2a44; color: var(--text); }
  .search { background: #131a29; border: 1px solid var(--border); color: var(--text);
            padding: 6px 10px; border-radius: 8px; font-size: 13px; min-width: 150px; }
  .search::placeholder { color: var(--muted); }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .filter-row .lbl { color: var(--muted); font-size: 11px; margin-right: 2px; min-width: 34px; }
  .chip { background: var(--card); border: 1px solid var(--border); color: var(--muted);
          padding: 4px 11px; border-radius: 14px; cursor: pointer; font-size: 12px; }
  .chip.active { color: var(--text); border-color: var(--accent); background: #1e2a44; }
  .chip .cnt { opacity: .6; margin-left: 4px; font-size: 11px; }
  .disc-list { display: flex; flex-direction: column; }
  .disc-row { display: grid; grid-template-columns: 46px 150px 130px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 13.5px; }
  .disc-row:hover { background: #1c263c; }
  .disc-r { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #c9d1dc; }
  .mkt-seg { display: flex; width: 100%; max-width: 560px; margin-bottom: 12px; }
  .mkt-seg button { flex: 1; padding: 9px 6px; font-size: 14px; white-space: nowrap; }
  .mkt-seg .cnt { opacity: .6; margin-left: 4px; font-size: 11px; }
  .fsel-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
  .fsel { flex: 1 1 80px; max-width: 220px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .fsel span { font-size: 11px; color: var(--muted); }
  .fsel select { width: 100%; height: 38px; padding: 0 8px; background: #131a29; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; font-size: 13px; }
  .fsel.on select { border-color: var(--accent); background: #1e2a44; }
  .fsel-row .chip { height: 38px; }
  @media (max-width: 600px) { .mkt-seg .cnt { display: none; } .mkt-seg button { font-size: 13px; padding: 9px 2px; } }
  .a5bar { display: inline-block; width: 56px; height: 6px; background: var(--border); border-radius: 3px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .a5bar i { display: block; height: 100%; background: var(--accent); }
  .a5v { font-variant-numeric: tabular-nums; font-size: 13px; }

  .modal[hidden] { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(6,9,16,.72); z-index: 50;
           display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 24px 12px; }
  .scd-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
             padding: 18px; width: 100%; max-width: 740px; margin: auto; }

  .summary-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat { background: #131a29; border: 1px solid var(--border); border-radius: 8px; padding: 7px 13px; }
  .stat .k { color: var(--muted); font-size: 11px; display: block; }
  .stat .v { font-size: 17px; font-weight: 700; }

  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th .arr { opacity: .5; font-size: 10px; }

  /* 업종별 보기 */
  .sec-block { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .sec-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px;
              background: #161f31; cursor: pointer; flex-wrap: wrap; }
  .sec-head:hover { background: #1a2540; }
  .sec-name { font-weight: 700; font-size: 14px; }
  .sec-metrics { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .sec-metric { text-align: right; }
  .sec-metric .k { color: var(--muted); font-size: 10px; display: block; }
  .sec-metric .v { font-size: 14px; font-weight: 700; }
  .sec-body { padding: 0 14px 12px; }
  .caret { color: var(--muted); font-size: 11px; width: 12px; display: inline-block; }
  .conf { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
  .conf-low { background: #4c1d1d; color: #f38b8b; }
  .conf-medium { background: #3f3f24; color: #e8e28a; }
  .conf-high { background: #14532d; color: #6ee7a0; }
  .dist { display: inline-flex; height: 8px; width: 110px; border-radius: 4px; overflow: hidden; background: #2a3550; }
  .dist span { height: 8px; }
  .d-A { background: #2ecc71; } .d-B { background: #4d9fff; } .d-C { background: #f1c40f; }
  .d-D { background: #e67e22; } .d-E { background: #e74c3c; } .d-H { background: #55607a; }

  /* 비고 */
  .note-box { background: #131a29; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0;
              padding: 10px 13px; margin: 8px 0 12px; }
  .note-box ol { margin: 6px 0 0 16px; }
  .note-box li { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 5px; white-space: normal; }
  .note-title { font-size: 12px; font-weight: 700; color: #9ecbff; }
  .adj { color: var(--muted); font-size: 11px; margin-top: 6px; white-space: normal; }
  .row-detail td { background: #131a29; white-space: normal; }
  .info-btn { background: none; border: 1px solid var(--border); color: var(--muted);
              border-radius: 4px; font-size: 10px; padding: 1px 5px; cursor: pointer; }
  .info-btn:hover { color: var(--text); border-color: var(--accent); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #1c263c; }
  .sitenav { gap: 4px; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .sitenav a { color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 6px; }
  .sitenav a:hover { color: var(--text); background: var(--card); }
  .sitenav a[aria-current="page"] { color: var(--text); background: var(--card); font-weight: 600; }
  .sitenav .ext { margin-left: auto; }
  a.chip { text-decoration: none; display: inline-block; }
  /* 넓은 화면(≥1000px): 왼쪽 메뉴에 그룹·세부 탭을 모두 펼친다. 좁은 화면은 위쪽 그룹 버튼 + 세부 탭 그대로 */
  #side { display: none; }
  .rk-sub { display: none; }
  @media (max-width: 600px) {
    .rk-col, .m-hide { display: none; }
    .rk-sub { display: block; font-size: 11px; white-space: nowrap; }
    /* 폰 전 탭 공통(2026-10-14 사용자 요청 — 위아래 폭 줄이기): 표 칸·칩·제목·행 간격 축소 */

  stockContext: null,      // docs/data/stock-context.json (52주 고저·증권사 목표가 — 맥락 전용, 점수에 안 씀)
  eventsMonth: null,       // 일정 달력의 표시 월(YYYY-MM, 없으면 이번 달)
  eventsDay: null,         // 일정 달력에서 고른 날짜

  etfSearch: '',

    open: false, ticker: null, name: null, market: null,

    range: 250,            // 일봉 표시 개수(9999=전체)

  },

  recoSearch: '',          // 추천 이력 탭 - 종목명·코드 검색(입력하면 날짜와 무관하게 전 기간)
};

const MACRO_LABELS = {
  yieldcurve: "장단기 금리차 (10Y-2Y)",
  hyspread: "하이일드 스프레드",
  vix: "VIX 변동성지수",
  liquidity: "유동성 (M2 YoY)",
  dollar: "달러 인덱스",
  style: "성장/가치 스타일",
  breadth: "시장 참여 폭 (Breadth)",
  buffett: "버핏지수 (시총/GDP)",
  cape: "CAPE (Shiller P/E)",
  kospi: "KOSPI",
  kosdaq: "KOSDAQ",
  kospi200: "KOSPI200 지수",
  kospi200fut: "KOSPI200 선물 (근월물, KRX)",
  usdkrw: "USD/KRW",
  us2y: "미국 2년물 국채금리",
  us10y: "미국 10년물 국채금리",
  us30y: "미국 30년물 국채금리",
  wti: "WTI 원유",
  btc: "BTC/USD"
};
// 업종 표시명 (latest.json의 sectorCaution.label이 우선, 없을 때 폴백)
const SECTOR_LABEL = {
  general: '일반 (제조·유통 등)', financial: '금융', holding: '지주회사',
  utility: '전력·가스', construction: '건설', shipping: '해운·조선',
  airline: '항공', bio: '제약·바이오', telecom: '통신', reit: '리츠·부동산',
};
// 업종별 보기에서의 표시 순서 (신뢰도 낮은 업종을 위로 올려 눈에 띄게)
const SECTOR_ORDER = ['holding','utility','construction','shipping','airline','bio','telecom','reit','general','financial']; // 금융은 맨 아래 (10년 PIT 진단: 등급이 순서를 못 세움)

async function loadJson(name) {
  try {
    const res = await fetch(`data/${name}.json?t=${Date.now()}`);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function gradeChip(grade) {
  if (!grade) return '<span class="grade grade-H">N/A</span>';
  const c = grade.charAt(0);
  const cls = ['A','B','C','D','E'].includes(c) ? c : 'H';
  const label = cls === 'H' ? '유보' : c;
  return `<span class="grade grade-${cls}" title="${esc(grade)}">${label}</span>`;
}

function gradeKey(grade) {
  if (!grade) return 'H';
  const c = grade.charAt(0);
  return ['A','B','C','D','E'].includes(c) ? c : 'H';
}

function mktChip(market) {
  const m = market || 'KR';
  return `<span class="mkt-tag mkt-${m}">${m}</span>`;
}

function fmtPct(v) {
  if (v === null || v === undefined) return '-';
  const cls = v >= 0 ? 'pos' : 'neg';
  return `<span class="${cls}">${v >= 0 ? '+' : ''}${v}%</span>`;
}

function fmtNum(v) { return v === null || v === undefined ? '-' : Number(v).toLocaleString(); }

// new Date().toISOString()는 UTC라 KST 자정~오전9시엔 날짜가 하루 밀린다(절대 규칙 3).
// "오늘"이 필요한 곳은 전부 이걸로 통일한다.
function kstYmd() { return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10); }

function fmtEok(v) {
  if (v === null || v === undefined || isNaN(v)) return '-';
  const n = Number(v);
  if (Math.abs(n) < 1e8) return Math.round(n / 1e4).toLocaleString() + '만';
  return Math.round(n / 1e8).toLocaleString() + '억';
}

function pctCell(pct) {
  if (pct === null || pct === undefined || pct === '' || isNaN(pct)) return '<span class="muted">-</span>';
  const n = Number(pct);
  const cls = n >= 0 ? 'pos' : 'neg';
  return `<span class="${cls}">${n >= 0 ? '+' : ''}${n}%</span>`;
}

function fmtPrice(v, market) {
  if (v === null || v === undefined) return '-';
  return market === 'US' ? `$${Number(v).toLocaleString()}` : `${Number(v).toLocaleString()}원`;
}

function coverageBar(cov) {
  if (!cov) return '-';
  const pct = Math.round(cov.overall * 100);
  return `<span class="bar-bg"><span class="bar-fill" style="width:${pct}%"></span></span> <span class="muted">${pct}%</span>`;
}

// ---------- 종목 스코어 탭 ----------

const sectorOf = (r) => r.sectorType || 'general';
const sectorName = (r) => (r.sectorCaution && r.sectorCaution.label) || SECTOR_LABEL[sectorOf(r)] || sectorOf(r);

/** 알림·표에서 소음이 되는 상시 속성 플래그는 경고 열에서 숨긴다 (비고로 대체 표시) */
const HIDDEN_WARNINGS = new Set(['sectorAdjusted', 'lowSectorConfidence']);

function confChip(conf) {
  if (!conf) return '';
  const t = { low: '신뢰도 낮음', medium: '신뢰도 보통', high: '신뢰도 높음' }[conf] || conf;
  return `<span class="conf conf-${conf}">${t}</span>`;
}

/** 등급 분포 막대 */
function distBar(rows) {
  const order = ['A','B','C','D','E','H'];
  const cnt = {};
  rows.forEach(r => { const k = gradeKey(r.grade); cnt[k] = (cnt[k] || 0) + 1; });
  const total = rows.length || 1;
  const segs = order.filter(k => cnt[k]).map(k =>
    `<span class="d-${k}" style="width:${(cnt[k] / total * 100).toFixed(1)}%" title="${k === 'H' ? '유보' : k}등급 ${cnt[k]}개"></span>`).join('');
  return `<span class="dist">${segs}</span>`;
}

function avgScore(rows) {
  const v = rows.map(r => r.totalScore).filter(x => x !== null && x !== undefined);
  if (!v.length) return null;
  return Math.round(v.reduce((a, b) => a + b, 0) / v.length * 10) / 10;
}

// KR은 코스닥150 태그가 없으면 코스피로 간주(태그 안 늘려도 됨).
// US는 sp500/nasdaq100 둘 다 태그된 종목(87개 중복)은 양쪽 배너에 다 나온다 -
// 실제 지수 소속이 원래 배타적이지 않으므로 자연스러운 동작.
function matchesMarketIndex(r, idx) {
  const g = r.groups || [];
  if (idx === 'kospi') return r.market === 'KR' && !g.includes('kosdaq150');
  if (idx === 'kosdaq') return r.market === 'KR' && g.includes('kosdaq150');
  if (idx === 'sp500') return r.market === 'US' && g.includes('sp500');
  if (idx === 'nasdaq100') return r.market === 'US' && g.includes('nasdaq100');
  return true;
}

function applyFilters(all) {
  const q = state.search.trim().toLowerCase();
  return all.filter(r => {
    if (!matchesMarketIndex(r, state.marketIndexFilter)) return false;
    if (state.groupFilter !== 'all' && !(r.groups || []).includes(state.groupFilter)) return false;
    if (state.sectorFilter !== 'all' && sectorOf(r) !== state.sectorFilter) return false;
    if (state.gradeFilter !== 'all' && gradeKey(r.grade) !== state.gradeFilter) return false;
    if (q && !(String(r.name).toLowerCase().includes(q) || String(r.ticker).toLowerCase().includes(q))) return false;
    return true;
  });
}

function sortRows(rows) {
  const k = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
  const val = (r) => {
    if (k === 'name') return r.name || '';
    if (k === 'grade') return 'ABCDEH'.indexOf(gradeKey(r.grade));
    if (k === 'coverage') return r.dataCoverage ? r.dataCoverage.overall : -1;
    if (k === 'sector') return sectorName(r);
    if (k === 'rankH5') { const x = rankH5Of(r); return x ? x[0] : -1; }
    return r.totalScore ?? -1;
  };
  // 금융업은 PBR 이 구조적으로 낮아 A 에 쏠리고 등급이 순서를 못 세운다(10년 PIT 진단 2026-10-25) — 점수는 그대로 두고 목록 맨 아래로
  const lastFin = k !== 'name' && k !== 'sector';
  return [...rows].sort((a, b) => {
    if (lastFin) { const fa = sectorOf(a) === 'financial', fb = sectorOf(b) === 'financial'; if (fa !== fb) return fa ? 1 : -1; }
    const x = val(a), y = val(b);
    if (typeof x === 'string') return x.localeCompare(y, 'ko') * dir;
    return (x - y) * dir;
  });
}

// 가격·거래량 순위 [pct(100=그날 1위), rank] — 기존 점수와 별개, 등급·추천에 안 쓴다
function rankH5Of(r) {
  const d = state.rankH5;
  return (r.market === 'KR' && d && d.byTicker && d.byTicker[r.ticker]) || null;
}
function rankH5Cell(r) {
  const x = rankH5Of(r), d = state.rankH5;
  if (!x) return (r.market === 'KR' && d) ? '<span class="muted" title="적격 밖 — 20일 거래대금 중앙값 10억 원 미만·우선주 등">-</span>' : '<span class="muted">-</span>';
  return `<span title="${esc(d.asOf)} 기준 적격 ${d.n}종목 중 ${x[1]}위 · 5거래일 모델, 관찰용">${x[0]}</span>`;
}
// 폰: 4번째 칸이 화면 밖이라(375px 에서 x=346) 점수 칸 아래 한 줄로 같이 보인다 — 넓은 화면에선 숨김
function rankH5Sub(r) {
  const x = rankH5Of(r);
  return x ? `<span class="rk-sub muted">가격·거래량 ${x[0]}</span>` : '';
}

function th(key, label, cls = '') {
  const on = state.sortKey === key;
  const arr = on ? (state.sortDir === 'asc' ? '▲' : '▼') : '⇅';
  return `<th class="sortable ${cls}" data-sort="${key}">${label} <span class="arr">${arr}</span></th>`;
}

// docs/data/trade-levels.json = config/policies/portfolio.v1.json(PF-1.2)의 규칙을
// prices.json 에 적용한 것. 새 규칙이 아니라 정책을 읽어 계산만 한다.
// ★ 그 정책은 registry 미등록 = 미발효 초안이라 화면도 그 상태를 그대로 쓴다.
function tradeLevelOf(ticker) {
  const d = state.tradeLevels;
  return (d && d.byTicker && d.byTicker[ticker]) || null;
}

function tradeLevelBlock(tl) {
  const d = state.tradeLevels || {};
  const num = (v, digits) => (v === null || v === undefined) ? null
    : v.toLocaleString('ko-KR', { maximumFractionDigits: digits === undefined ? 0 : digits });
  const draft = d.status && d.status !== 'ADOPTED'
    ? `<span class="warn-tag">미발효 초안</span>` : '';
  const cell = (k, v) => `<div class="sec-metric"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;

  // 손절·목표가 null 인 것은 결측이 아니라 정책 판단이다(절대 규칙 1) -
  // 정책이 스스로 적어 보낸 사유를 그대로 쓴다. 화면이 문구를 지어내지 않는다.
  const hasStop = tl.stop !== null && tl.stop !== undefined;
  const exitRow = hasStop
    ? cell('손절', `${num(tl.stop)}<span class="muted"> (${num(tl.stopPct, 1)}%)</span>`)
      + cell('목표', tl.target === null ? '<span class="muted">없음</span>'
          : `${num(tl.target)}<span class="muted"> (${num(tl.targetPct, 1)}%)</span>`)
    : '';

  return `<div class="note-title" style="margin-top:8px">포지션 기준 ${esc(d.policy || '')} ${draft}</div>
    <div class="sec-metrics" style="margin:4px 0">
      ${cell('계좌 비중', `${num(tl.positionPct, 2)}%${tl.capped ? ' <span class="muted">(상한)</span>' : ''}`)}
      ${cell('100만원당', tl.sharesPerMillionKRW < 1 ? '<span class="muted">1주 미만</span>' : `${num(tl.sharesPerMillionKRW)}주`)}
      ${cell('최소 필요자본', `${num(tl.minCapitalKRW)}원`)}
      ${cell('ATR14', `${num(tl.atr14)}<span class="muted"> (${num(tl.atrPct, 2)}%)</span>`)}
      ${exitRow}
    </div>
    ${hasStop ? '' : `<div class="adj">${esc(d.provisionalNote || '')}</div>`}
    ${d.note ? `<div class="adj">${esc(d.note)}</div>` : ''}
    ${d.tradeStateChecked === false && d.tradeStateNote ? `<div class="adj">${esc(d.tradeStateNote)}</div>` : ''}`;
}

// 긴 표는 처음 LIMIT_STEP 행만 보이고 '더 보기'로 늘린다. sig(필터·정렬을 이은 문자열)가 바뀌면 처음으로 돌아간다.
const LIMIT_STEP = 50;
function limited(key, sig, rows) {
  const st = state.lim[key] && state.lim[key].sig === sig ? state.lim[key] : (state.lim[key] = { sig, n: LIMIT_STEP });
  const more = rows.length > st.n
    ? `<div style="text-align:center;margin:8px 0"><button class="chip" data-more="${esc(key)}">더 보기 (${st.n}/${rows.length})</button> <button class="chip" data-more="${esc(key)}" data-all="1">전체 보기</button></div>` : '';
  return { shown: rows.slice(0, st.n), more };
}

function stockRow(r) {
  const warns = (r.warnings || []).filter(w => !HIDDEN_WARNINGS.has(w));
  const hasNote = !!r.sectorCaution;
  const tl = tradeLevelOf(r.ticker);
  const hasDetail = true;   // 펼치면 해독 요약(그래픽)이 나온다 — 모든 종목
  const open = !!state.openRows[r.ticker];
  const main = `
    <tr class="${hasDetail ? 'clickable' : ''}" data-row="${esc(r.ticker)}">
      <td><strong data-chart="${esc(r.ticker)}" data-chart-name="${esc(r.name)}" style="cursor:pointer;text-decoration:underline dotted var(--muted)" title="차트 보기">${esc(r.name)}</strong> <span class="muted">${esc(r.ticker)}</span>${mktChip(r.market)}${cycleFitTag(r.ticker)}
        ${(r.groups || []).length ? `<br>${(r.groups || []).map(g => `<span class="group-tag">${esc((((state.latest || {}).groupLabels || {})[g] || g).split(' ')[0])}</span>`).join('')}` : ''}</td>
      <td>${r.totalScore ?? '-'}${rankH5Sub(r)}</td>
      <td>${gradeChip(r.grade)}</td>
      <td class="rk-col">${rankH5Cell(r)}</td>
      <td><span class="sector-tag">${esc(sectorName(r))}</span>${r.sectorCaution ? ' ' + confChip(r.sectorCaution.confidence) : ''}</td>
      <td>${fmtPrice(r.currentPrice, r.market)}</td>
      <td>${coverageBar(r.dataCoverage)}</td>
      <td>${warns.map(w => `<span class="warn-tag">${esc(w)}</span>`).join('') || '-'}</td>
      <td>${hasDetail ? `<button class="info-btn" data-row="${esc(r.ticker)}">${open ? '접기' : '요약'}</button>` : '<span class="muted">-</span>'}</td>
    </tr>`;
  if (!open || !hasDetail) return main;
  const c = r.sectorCaution;
  return main + `
    <tr class="row-detail"><td colspan="9"><div style="position:sticky;left:10px;max-width:calc(100cqw - 20px)">
      ${decodeSummaryHtml(r)}
      <button class="chip" data-chart="${esc(r.ticker)}" data-chart-name="${esc(r.name)}" data-chart-vtab="decode" style="margin-top:8px">🔎 전체 해독 — 점수 구성·업종 흐름·수급 차트</button>
      ${tl || hasNote ? `<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12px">포지션 기준·업종 비고 (글)</summary>` : ''}
      ${tl ? tradeLevelBlock(tl) : ''}
      ${hasNote ? `<div class="note-title">${esc(c.label)} — ${esc(c.confidenceLabel || '')}</div>
      <ol>${c.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ol>` : ''}
      ${hasNote && c.adjustedMetrics && c.adjustedMetrics.length ? `<div class="adj">업종 기준으로 채점된 지표: ${c.adjustedMetrics.map(esc).join(', ')}</div>` : ''}
      ${hasNote && c.excludedMetrics && c.excludedMetrics.length ? `<div class="adj">평가 제외: ${c.excludedMetrics.map(m => esc(m.label) + ' (' + esc(m.reason) + ')').join(' / ')}</div>` : ''}
      ${tl || hasNote ? '</details>' : ''}
    </div></td></tr>`;
}

function tableFor(rows, key) {
  const sig = [state.search, state.sectorFilter, state.gradeFilter, state.groupFilter, state.marketIndexFilter, state.sortKey, state.sortDir].join('|');
  const { shown, more } = limited('sc:' + key, sig, rows);
  return `<div class="table-wrap"><table>
    <thead><tr>${th('name','종목')}${th('totalScore','점수')}${th('grade','등급')}${th('rankH5','가격·거래량','rk-col')}${th('sector','업종')}<th>종가</th>${th('coverage','커버리지')}<th>경고</th><th>비고</th></tr></thead>
    <tbody>${shown.map(stockRow).join('')}</tbody></table></div>${more}`;
}

function renderSectorView(filtered) {
  const bySector = {};
  filtered.forEach(r => { (bySector[sectorOf(r)] = bySector[sectorOf(r)] || []).push(r); });
  const keys = Object.keys(bySector).sort((a, b) => {
    const ia = SECTOR_ORDER.indexOf(a), ib = SECTOR_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  if (!keys.length) return '<div class="empty">조건에 맞는 종목이 없습니다.</div>';

  return keys.map(k => {
    const rows = sortRows(bySector[k]);
    const sample = rows.find(r => r.sectorCaution) || rows[0];
    const caution = sample && sample.sectorCaution;
    const label = caution ? caution.label : (SECTOR_LABEL[k] || k);
    const isCollapsed = !state.secOpen[k] && !state.search.trim() && state.sectorFilter === 'all';
    const notesOpen = !!state.openNotes[k];
    const avg = avgScore(rows);

    const head = `<div class="sec-head" data-sector-toggle="${esc(k)}">
      <span class="caret">${isCollapsed ? '▶' : '▼'}</span>
      <span class="sec-name">${esc(label)}</span>
      ${caution ? confChip(caution.confidence) : ''}
      <div class="sec-metrics">
        <div class="sec-metric"><span class="k">종목</span><span class="v">${rows.length}</span></div>
        <div class="sec-metric"><span class="k">평균</span><span class="v">${avg ?? '-'}</span></div>
        <div class="sec-metric"><span class="k">등급 분포</span>${distBar(rows)}</div>
      </div></div>`;

    if (isCollapsed) return `<div class="sec-block">${head}</div>`;

    const noteBox = caution ? `
      <div class="note-box">
        <div class="note-title">이 업종 채점 시 주의사항 ${notesOpen ? '' : `(${caution.notes.length}개)`}
          <button class="info-btn" data-note-toggle="${esc(k)}" style="margin-left:6px">${notesOpen ? '접기' : '펼치기'}</button></div>
        ${notesOpen ? `<ol>${caution.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ol>` : ''}
      </div>` : '';

    return `<div class="sec-block">${head}<div class="sec-body">${noteBox}${tableFor(rows, k)}</div></div>`;
  }).join('');
}

// ---------- 전 종목(A5) — 관심종목 밖까지 KR 전 종목의 주간 PIT 점수. 라이브 스코어와 섞지 않는다 ----------
const A5_AXES = [['재무', 30], ['밸류', 50], ['기술', 20]];   // KR-2.4 categoryWeights × 100 = 기여 최대치
const A5_FLAG = { VERY_LOW_CONFIDENCE: '신뢰 매우 낮음', LOW_CONFIDENCE: '신뢰 낮음', MISSING_DATA: '결측', PARTIAL_CALCULATION: '부분 계산' };
function renderA5() {
  if (state.a5 === undefined) {
    state.a5 = null;
    loadJson('a5-latest').then(x => { state.a5 = x || false; if (state.tab === 'a5') render(); });
  }
  if (state.a5 === null) return '<div class="card empty">전 종목 점수를 불러오는 중...</div>';
  if (state.a5 === false) return '<div class="card empty">A5 점수 파일이 아직 없습니다.</div>';
  const d = state.a5, q = (state.a5Search || '').trim(), mk = state.a5Market || 'all', lim = state.a5Limit || 100;
  const mine = new Set(((state.latest && state.latest.results) || []).map(r => r.ticker));
  // 거래대금 적격 = rank-h5 와 같은 기준(20일 중앙값 10억↑·보통주) — 2025~ 진단에서 이 구간만 등급 순서가 섰다. 금융은 등급이 순서를 못 세워 맨 아래
  const liq = state.a5Liq && state.rankH5 && state.rankH5.byTicker;
  const isFin = (x) => /금융|보험|은행|증권|신탁|집합투자|투자업|여신/.test(x.s || '');
  const rows = d.items.filter(x => (mk === 'all' || x.m === mk) && (!q || x.t.startsWith(q) || (x.n || '').includes(q)) && (!liq || liq[x.t]))
    .map((x, i) => [isFin(x), i, x]).sort((a, b) => (a[0] - b[0]) || (a[1] - b[1])).map(a => a[2]);
  const bar = (v, max) => v == null ? '<span class="muted">—</span>'
    : `<span class="a5bar"><i style="width:${Math.max(0, Math.min(100, v / max * 100))}%"></i></span><span class="a5v">${v.toFixed(1)}</span>`;
  const chip = (val, text) => `<button class="chip ${mk === val ? 'active' : ''}" data-a5-market="${val}">${text}</button>`;
  const body = rows.slice(0, lim).map(x => `<tr>
      <td class="muted" title="${x.p == null ? '커버리지 60% 미만' : '상위 ' + x.p.toFixed(1) + '%'}">${x.r == null ? '유보' : x.r.toLocaleString() + '위'}</td>
      <td><strong>${esc(x.n || x.t)}</strong> <span class="muted">${esc(x.t)}</span>${mine.has(x.t) ? ' <span class="chip" style="padding:1px 6px;font-size:11px">관심</span>' : ''}</td>
      <td class="muted">${esc(x.m || '-')}</td>
      <td style="text-align:right"><strong>${x.f == null ? '-' : x.f.toFixed(1)}</strong></td>
      ${A5_AXES.map(([, max], i) => `<td>${bar(x.c[i], max)}</td>`).join('')}
      <td class="muted" style="text-align:right">${x.cov == null ? '-' : Math.round(x.cov) + '%'}</td>
      <td class="muted" style="white-space:normal;max-width:220px">${esc(x.s || '')}${x.fl.length ? ' · ' + x.fl.map(f => esc(A5_FLAG[f] || f)).join(' · ') : ''}</td>
    </tr>`).join('');
  return `<div class="toolbar">
      <input class="search" id="a5Search" placeholder="종목명·코드 검색" value="${esc(state.a5Search || '')}">
      ${chip('all', '전체')}${chip('KOSPI', 'KOSPI')}${chip('KOSDAQ', 'KOSDAQ')}
      ${state.rankH5 ? `<button class="chip ${state.a5Liq ? 'active' : ''}" data-a5-liq="1" title="20일 거래대금 중앙값 10억 원 이상 보통주만 — 매매 가능한 종목">거래대금 10억↑</button>` : ''}
      <span class="muted">기준일 ${esc(d.asOf)} · ${esc(d.criteria)} · ${rows.length.toLocaleString()}종목</span>
    </div>
    <div class="card" style="padding:0"><div class="table-wrap"><table class="a5-tbl">
      <thead><tr><th>순위</th><th>종목</th><th>시장</th><th style="text-align:right">총점</th>${A5_AXES.map(([n, m]) => `<th>${n} /${m}</th>`).join('')}<th style="text-align:right">커버리지</th><th>업종 · 표시</th></tr></thead>
      <tbody>${body || '<tr><td colspan="9" class="muted">검색 결과 없음</td></tr>'}</tbody>
    </table></div></div>
    ${rows.length > lim ? `<div style="text-align:center;margin-top:10px"><button class="chip" data-a5-more="1">더 보기 (${(rows.length - lim).toLocaleString()}종목 남음)</button></div>` : ''}`;
}

function renderScores() {
  const d = state.latest;
  if (!d || !d.results || d.results.length === 0) return '<div class="card empty">아직 분석 결과가 없습니다. Actions가 처음 실행된 후 표시됩니다.</div>';
  const all = d.results;
  const labels = d.groupLabels || {};

  // ── 필터 UI
  const groups = [...new Set(all.flatMap(r => r.groups || []))];
  const sectorCounts = {};
  all.forEach(r => { sectorCounts[sectorOf(r)] = (sectorCounts[sectorOf(r)] || 0) + 1; });
  const sectorKeys = Object.keys(sectorCounts).sort((a, b) => {
    const ia = SECTOR_ORDER.indexOf(a), ib = SECTOR_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const chip = (attr, val, text, cnt, cur) =>
    `<button class="chip ${cur === val ? 'active' : ''}" data-${attr}="${esc(val)}">${esc(text)}${cnt !== undefined ? `<span class="cnt">${cnt}</span>` : ''}</button>`;

  const toolbar = `<div class="toolbar">
    <div class="seg">
      <button data-view="sector" class="${state.viewMode === 'sector' ? 'active' : ''}">업종별</button>
      <button data-view="list" class="${state.viewMode === 'list' ? 'active' : ''}">전체 목록</button>
    </div>
    <input class="search" id="stockSearch" placeholder="종목명·코드 검색" value="${esc(state.search)}">
    <span class="muted" id="filterCount"></span>
  </div>`;

  const opt = (val, text, cnt, cur) => `<option value="${esc(val)}"${cur === val ? ' selected' : ''}>${esc(text)}${cnt !== undefined ? ` (${cnt})` : ''}</option>`;
  const sel = (key, label, opts) => `<label class="fsel${state[key + 'Filter'] !== 'all' ? ' on' : ''}"><span>${label}</span><select data-fsel="${key}">${opts}</select></label>`;
  const anyFilter = ['sector', 'grade', 'group'].some(k => state[k + 'Filter'] !== 'all');
  const filters = `<div class="fsel-row">
    ${sel('sector', '업종', opt('all', '전체', all.length, state.sectorFilter) + sectorKeys.map(k => opt(k, SECTOR_LABEL[k] || k, sectorCounts[k], state.sectorFilter)).join(''))}
    ${sel('grade', '등급', opt('all', '전체', undefined, state.gradeFilter) + ['A', 'B', 'C', 'D', 'E', 'H'].map(g => {
      const c = all.filter(r => gradeKey(r.grade) === g).length;
      return c ? opt(g, g === 'H' ? '유보' : g, c, state.gradeFilter) : '';
    }).join(''))}
    ${groups.length ? sel('group', '그룹', opt('all', '전체', undefined, state.groupFilter) + groups.map(g => opt(g, labels[g] || g, all.filter(r => (r.groups || []).includes(g)).length, state.groupFilter)).join('')) : ''}
    ${anyFilter ? '<button class="chip" data-filter-reset="1">초기화</button>' : ''}
  </div>`;

  // ── 시장/지수 배너(코스피 기본) - 전체 종목(all) 기준 개수, 선택은 다른 필터와 별개
  const marketIndexBanner = [
    ['kospi', '코스피'], ['kosdaq', '코스닥'], ['sp500', 'S&P500'], ['nasdaq100', '나스닥100'],
  ].map(([idx, label]) => {
    const cnt = all.filter(r => matchesMarketIndex(r, idx)).length;
    return `<button data-market-index="${idx}" class="${state.marketIndexFilter === idx ? 'active' : ''}">${label}<span class="cnt">${cnt}</span></button>`;
  }).join('');

  const filtered = applyFilters(all);

  // ── 요약 스트립
  const lowConf = filtered.filter(r => r.sectorCaution && r.sectorCaution.confidence === 'low').length;
  const held = filtered.filter(r => r.dataCoverage && !r.dataCoverage.sufficient).length;
  const unmapped = filtered.filter(r => (r.warnings || []).includes('unmappedSector')).length;
  const topGrade = filtered.filter(r => ['A','B'].includes(gradeKey(r.grade))).length;
  const strip = `<div class="summary-strip">
    <div class="stat"><span class="k">표시 종목</span><span class="v">${filtered.length}<span class="muted" style="font-size:12px"> / ${all.length}</span></span></div>
    <div class="stat"><span class="k">평균 점수</span><span class="v">${avgScore(filtered) ?? '-'}</span></div>
    <div class="stat"><span class="k">A·B등급</span><span class="v">${topGrade}</span></div>
    <div class="stat"><span class="k">유보</span><span class="v">${held}</span></div>
    <div class="stat"><span class="k">저신뢰 업종</span><span class="v">${lowConf}</span></div>
    ${unmapped ? `<div class="stat"><span class="k">업종 미분류</span><span class="v" style="color:var(--bad)">${unmapped}</span></div>` : ''}
  </div>`;

  const body = state.viewMode === 'sector'
    ? renderSectorView(filtered)
    : (filtered.length ? tableFor(sortRows(filtered), 'list') : '<div class="empty">조건에 맞는 종목이 없습니다.</div>');

  const uni = d.universeVersion ? ` · 유니버스 ${esc(d.universeVersion)}(${d.universeSize ?? all.length}종목)` : '';

  return `<div class="card">
    <div class="seg mkt-seg">${marketIndexBanner}</div>
    ${toolbar}${filters}${strip}${body}
    <p class="muted" style="margin-top:12px;white-space:normal">업종 행 = 접기·펼치기 · <strong>'신뢰도 낮음'</strong> 업종은 비고를 먼저 읽으세요${uni}
      <span style="cursor:help" title="종목 행을 클릭하면 그 업종의 채점 주의사항이 열립니다. '신뢰도 낮음' 업종은 점수 자체의 예측력이 떨어집니다. 커버리지가 낮으면 config/fundamentals.json 보강으로 유보가 해제됩니다.">ⓘ</span></p></div>`;
}

function renderPortfolio(part) {
  const want = k => !part || part === k;
  const rg = state.regime;
  const mc = state.macro;
  const pf = state.portfolio;
  let html = '';
  if (rg && want('regime')) {
    html += `<div class="card"><div class="regime">
      <span class="score regime-${rg.grade}">${rg.score}</span>
      <div><div><strong>시장 국면: ${esc(rg.grade)}</strong> <span class="muted">(한국 시장 기준)</span></div><div class="muted">${esc(rg.action)}</div>
      ${(rg.specialFlags || []).length ? `<div class="muted">⚑ ${rg.specialFlags.map(esc).join(', ')}</div>` : ''}</div>
    </div></div>`;
  }
  if (want('regime') && mc && mc.indicators && mc.indicators.length > 0) {
    const chgCell = (v, unit) => {
      if (v == null) return '<span class="muted">-</span>';
      const cls = v >= 0 ? 'pos' : 'neg';
      return `<span class="${cls}">${v >= 0 ? '+' : ''}${v}${unit}</span>`;
    };
    const macroRows = mc.indicators.map(it => {
      const label = MACRO_LABELS[it.key] || it.key;
      const c = it.changes || {};
      const unit = it.changeUnit || '%';
      return `<tr>
        <td>${esc(label)}</td>
        <td><strong>${esc(it.display != null ? it.display : it.value)}</strong></td>
        <td>${chgCell(c.d1, unit)}</td>
        <td>${chgCell(c.d30, unit)}</td>
        <td>${chgCell(c.d90, unit)}</td>
        <td>${chgCell(c.d180, unit)}</td>
        <td>${chgCell(c.d365, unit)}</td>
      </tr>`;
    }).join('');
    html += `<div class="card"><h2>매크로 지표</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>지표</th><th>현재값</th><th>1일</th><th>30일</th><th>90일</th><th>180일</th><th>1년</th></tr></thead>
        <tbody>${macroRows}</tbody>
      </table></div>
      <p class="muted" style="margin-top:8px">%p = 절대 포인트차(금리·스프레드류) · % = 상대 변화율. 캘린더일 기준(휴장일은 직전 거래일 값으로 대체).</p>
    </div>`;
  }
  const etf = state.etf;
  if (want('etfwatch') && etf && etf.curated && etf.curated.length > 0) {
    const watchRows = [...etf.curated.map(r => ({ ...r, name: r.label })),
      ...(etf.vixEtn || []).map(r => ({ ...r, name: r.label })), etf.gold].filter(Boolean).map(r => `
      <tr>
        <td>${esc(r.name)}</td>
        <td>${fmtNum(r.close)}</td>
        <td>${pctCell(r.pct)}</td>
        <td>${fmtEok(r.value)}</td>
      </tr>`).join('');
    html += `<div class="card"><h2>관심 ETF/ETN</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>종목</th><th>종가</th><th>등락률</th><th>거래대금</th></tr></thead>
        <tbody>${watchRows}</tbody>
      </table></div>
      <p class="muted" style="margin-top:8px">기준일 ${esc(etf.updatedAt || '-')}</p>
    </div>`;
  }
  if (want('etfwatch') && etf && etf.top50 && etf.top50.length > 0) {
    const top50Rows = etf.top50.map((r, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${esc(r.name)}</td>
        <td>${fmtNum(r.close)}</td>
        <td>${pctCell(r.pct)}</td>
        <td>${fmtEok(r.value)}</td>
      </tr>`).join('');
    html += `<div class="card"><h2>거래대금 상위 ETF (${etf.top50.length}개)</h2>
      <p class="muted" style="margin-bottom:8px">레버리지·인버스 포함 그대로 - 실제 거래대금 순위입니다.</p>
      <div class="table-wrap" style="max-height:480px;overflow-y:auto"><table>
        <thead><tr><th>#</th><th>종목</th><th>종가</th><th>등락률</th><th>거래대금</th></tr></thead>
        <tbody>${top50Rows}</tbody>
      </table></div>
    </div>`;
  }
  if (want('holdings') && pf && pf.holdings && pf.holdings.length > 0) {
    const rows = pf.holdings.map(h => `
      <tr>
        <td><strong>${esc(h.name)}</strong> <span class="muted">${esc(h.ticker)}</span>${mktChip(h.market)}</td>
        <td>${fmtNum(h.quantity)}주</td>
        <td>${fmtPrice(h.avgPrice, h.market)} → ${fmtPrice(h.currentPrice, h.market)}</td>
        <td>${fmtPct(h.unrealizedPnLPct)}</td>
        <td>${h.stockScore ?? '-'} ${gradeChip(h.stockGrade)}</td>
        <td><strong>${esc(h.referenceSignal)}</strong><div class="muted" style="white-space:normal;max-width:280px">${esc(h.signalReason)}</div></td>
      </tr>`).join('');
    html += `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>종목</th><th>수량</th><th>평단→현재</th><th>손익</th><th>점수</th><th>참고 신호</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="muted" style="margin-top:10px">신호는 손익과 무관하게 종목 자체 점수 + 시장 국면으로만 산출됩니다.</p></div>`;
  } else if (want('holdings')) {
    html += '<div class="card empty">보유 종목이 없습니다. config/holdings.json에 추가하세요.</div>';
  }
  return html || '<div class="card empty">데이터가 아직 없습니다.</div>';
}

function renderReco() {
  const d = state.reco;
  if (!d || !d.performance || d.performance.length === 0) return '<div class="card empty">추천 이력이 아직 없습니다. B등급 이상 종목이 나오면 자동 기록됩니다.</div>';
  // 추천 당시 점수는 recommendations.json에 박제된 값, 현재 점수는 latest.json의
  // 오늘자 채점 결과를 티커로 조인한 것 - 두 파일이 갱신 주기가 달라 서로 다른
  // 시점의 값이다(latest.json이 매번 최신, 추천 당시는 그 추천이 나온 날 그대로).
  const currentByTicker = {};
  ((state.latest && state.latest.results) || []).forEach(r => { currentByTicker[r.ticker] = r; });

  // 945건을 세로로 나열하면 안 읽히므로 날짜 하나만 골라 본다 — 날짜가 100개를 넘어
  // 칩으로 깔면 폰 화면을 다 덮어서(2026-10-14 사용자 캡처) ◀ 날짜 ▶ + 드롭다운으로 바꿨다(마감 리포트 탭과 같은 모양).
  // 시장 구분은 recommendations.json 에 지수 소속이 없어 latest.json 의 groups 를 티커로 붙여 스코어 탭과 같은 규칙(matchesMarketIndex)으로 가른다.
  // 지금 유니버스에서 빠진 종목은 groups 가 비어 KR 은 코스피로 잡힌다(소수).
  const withGroups = p => ({ market: p.market, groups: (currentByTicker[p.ticker] || {}).groups || [] });
  const marketBanner = [['all', '전체'], ['kospi', '코스피'], ['kosdaq', '코스닥'], ['sp500', 'S&P500'], ['nasdaq100', '나스닥100']]
    .map(([idx, label]) => `<button data-reco-market="${idx}" class="${state.recoMarket === idx ? 'active' : ''}">${label}</button>`).join('');
  const perf = d.performance.filter(p => matchesMarketIndex(withGroups(p), state.recoMarket));
  const q = state.recoSearch.trim().toLowerCase();
  const head = `<div class="seg mkt-seg" style="margin-bottom:8px">${marketBanner}</div>
    <input class="search" id="recoSearch" placeholder="종목명·코드 검색 (전 기간)" value="${esc(state.recoSearch)}" style="margin-bottom:10px">`;

  const byDate = {};
  perf.forEach(p => { (byDate[p.recommendedDate] = byDate[p.recommendedDate] || []).push(p); });
  const dates = Object.keys(byDate).sort().reverse();
  if (!dates.length) return `<div class="card">${head}<p class="muted">이 시장의 추천 이력이 없습니다.</p></div>`;
  const activeDate = (state.recoDate && byDate[state.recoDate]) ? state.recoDate : dates[0];

  const ai = dates.indexOf(activeDate), older = dates[ai + 1], newer = ai > 0 ? dates[ai - 1] : null;
  const arrow = (date, label, path) => `<button class="mrep-arrow"${date ? ` data-reco-date="${esc(date)}"` : ' disabled'} aria-label="${label}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="${path}"/></svg></button>`;
  const dateTabs = `<div style="display:flex;align-items:center;gap:8px">
    ${arrow(older, '이전 날짜', 'M15 18l-6-6 6-6')}
    <select class="mrep-sel" data-reco-select aria-label="추천 날짜">${dates.map(date => `<option value="${esc(date)}"${date === activeDate ? ' selected' : ''}>${date.slice(2).replace(/-/g, '.')} · ${byDate[date].length}건</option>`).join('')}</select>
    ${arrow(newer, '다음 날짜', 'M9 18l6-6-6-6')}
  </div>`;

  // 검색어가 있으면 날짜 선택을 건너뛰고 전 기간에서 찾는다 — 한 종목이 언제 몇 번 추천됐는지 보는 용도.
  const rows = q
    ? perf.filter(p => String(p.name).toLowerCase().includes(q) || String(p.ticker).toLowerCase().includes(q))
        .sort((a, b) => String(b.recommendedDate).localeCompare(String(a.recommendedDate)))
    : byDate[activeDate];
  const rl = limited('reco', [state.recoMarket, q, activeDate].join('|'), rows);
  const rowHtml = (p) => {
    const cur = currentByTicker[p.ticker];
    const curCell = cur
      ? `${gradeChip(cur.grade)} ${cur.totalScore ?? '-'}`
      : '<span class="muted" title="현재 채점 유니버스에 없음(상장폐지·유니버스 변경 등)">-</span>';
    return `<tr>
      <td><strong>${esc(p.name)}</strong> <span class="muted">${esc(p.ticker)}</span>${mktChip(p.market)}${q ? `<br><span class="muted" style="font-size:11px">${esc(p.recommendedDate)} 추천</span>` : ''}</td>
      <td>${gradeChip(p.gradeAtRecommendation)} ${p.scoreAtRecommendation}</td>
      <td>${curCell}</td>
      <td>${fmtPrice(p.priceAtRecommendation, p.market)} → ${fmtPrice(p.currentPrice, p.market)}</td>
      <td>${fmtPct(p.changePct)}</td>
      <td style="font-size:12px">${sectorSurgeCell(p.ticker, p.market)}</td>
    </tr>`;
  };

  return `<div class="card">
    ${head}
    ${q ? `<p class="muted" style="margin-bottom:8px">'${esc(state.recoSearch.trim())}' 전 기간 ${rows.length}건</p>`
        : `<div style="margin-bottom:10px">${dateTabs}</div>
    <p class="muted" style="margin-bottom:8px">${esc(activeDate)} 추천 · ${rows.length}건 · ${rows[0].holdingDays}일 전</p>`}
    <div class="table-wrap"><table>
      <thead><tr><th>종목</th><th>추천 당시</th><th>현재 점수</th><th>추천가→현재가</th><th>변동률</th><th title="지금 기준 · 전일 대비 +5% 이상 / 업종 종목">업종 현재 급등</th></tr></thead>
      <tbody>${rl.shown.map(rowHtml).join('')}</tbody></table></div>${rl.more}
  </div>`;
}

function renderBacktestMarket(title, benchName, d) {
  if (!d) return '';
  let html = `<div class="card"><h2>${title}</h2>
    <p><strong>표본 ${d.sampleCount}건</strong> <span class="muted">| 거래비용 ${d.transactionCostPct}% 차감 | 벤치마크 ${benchName}</span></p>
    <p style="margin-top:8px">IC(점수↔수익률 순위상관): ${Object.entries(d.ic).map(([h,v]) => `${h}=<strong>${v ?? 'N/A'}</strong>`).join(' · ')}</p>
    <p style="margin-top:8px">등급 단조성: <strong>${d.gradeMonotonic ? '충족 ✓' : '불충족 ✗'}</strong></p>`;
  const gradeRows = Object.entries(d.byGrade).map(([g, s]) => {
    const h = s.horizons;
    const cell = (x) => x ? `${x.avgReturnPct ?? '-'}% <span class="muted">(승률 ${x.winRatePct ?? '-'}%)</span>` : '-';
    return `<tr><td>${gradeChip(g)} <span class="muted">${s.count}건</span></td><td>${cell(h.d20)}</td><td>${cell(h.d60)}</td><td>${cell(h.d120)}</td></tr>`;
  }).join('');
  html += `<div class="table-wrap" style="margin-top:10px"><table>
    <thead><tr><th>등급</th><th>20일 평균</th><th>60일 평균</th><th>120일 평균</th></tr></thead>
    <tbody>${gradeRows}</tbody></table></div>`;
  const vs = d.verdicts || [];
  html += `${vs.length ? `<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12px">검증 메모 ${vs.length}개</summary>${vs.map(v => `<p class="muted" style="margin-top:6px">• ${esc(v)}</p>`).join('')}</details>` : ''}</div>`;
  return html;
}

function renderBacktest() {
  const d = state.backtest;
  if (!d || d.status !== 'ok') {
    const msg = d && d.message ? d.message : '이력이 쌓이면 (약 1개월 후부터) 주간 백테스트 결과가 표시됩니다.';
    return `<div class="card empty">${esc(msg)}</div>`;
  }
  const m = d.markets || {};
  let html = `<div class="card muted">이력 ${d.historyDays}일 누적 | 갱신 ${new Date(d.updatedAt).toLocaleDateString('ko-KR')}</div>`;
  html += renderBacktestMarket('🇰🇷 한국 (KR)', 'KOSPI', m.KR);
  html += renderBacktestMarket('🇺🇸 미국 (US)', 'S&P500', m.US);
  if (!m.KR && !m.US) html = '<div class="card empty">아직 시장별 표본이 없습니다.</div>';
  return html;
}

// ---------- 경기사이클 (코스톨라니 달걀) ----------

function cycleFitTag(ticker) {
  const c = state.cycle;
  if (!c || !c.currentPhase || !c.sectorMap) return '';
  const sectors = c.sectorMap[ticker] || [];
  const fav = c.currentPhase.favorableSectors || [];
  return sectors.some(s => fav.includes(s))
    ? ' <span class="fit-tag" title="현재 금리 국면에서 역사적으로 강했던 섹터">🥚국면적합</span>' : '';
}

function renderEggSvg(c) {
  const cx = 150, cy = 150, rx = 100, ry = 125;
  const cur = c.currentPhase ? c.currentPhase.id : null;
  const pts = (c.phases || []).map(p => {
    const rad = (p.angle - 90) * Math.PI / 180;
    const x = cx + rx * Math.cos(rad), y = cy + ry * Math.sin(rad);
    const isCur = p.id === cur;
    const anchor = x < cx - 10 ? 'end' : x > cx + 10 ? 'start' : 'middle';
    const lx = cx + (rx + 14) * Math.cos(rad), ly = cy + (ry + 16) * Math.sin(rad);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isCur ? 9 : 5}"
        fill="${isCur ? '#4d9fff' : '#2a3550'}" stroke="${isCur ? '#e6ebf5' : 'none'}" stroke-width="2"/>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="middle"
        fill="${isCur ? '#e6ebf5' : '#8b96ad'}" font-size="11" font-weight="${isCur ? '700' : '400'}">${p.label}</text>`;
  }).join('');
  return `<svg class="cycle-ring" viewBox="0 0 300 300" width="280" height="280" style="flex-shrink:0">
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#2a3550" stroke-width="2"/>
    <text x="${cx}" y="${cy - 8}" text-anchor="middle" fill="#8b96ad" font-size="11">금리 사이클</text>
    <text x="${cx}" y="${cy + 10}" text-anchor="middle" fill="#8b96ad" font-size="10">(시계방향 순환)</text>
    ${pts}</svg>`;
}

function renderCycle() {
  const c = state.cycle;
  if (!c) return '<div class="card empty">사이클 데이터(cycles.json)를 불러오지 못했습니다.</div>';
  let html = '';
  const cp = c.currentPhase;
  if (cp) {
    html += `<div class="card"><div class="egg-wrap">${renderEggSvg(c)}
      <div style="flex:1;min-width:260px">
        <h2><span class="phase-tag ph-${cp.id}">${cp.id}</span>현재 국면: ${esc(cp.label)}</h2>
        <details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">근거 보기</summary>
          <p class="muted" style="margin-top:6px;line-height:1.6">${esc(cp.note)}</p></details>
        <p style="margin-top:10px;font-size:13px">역사적 강세 섹터:
          ${(cp.favorableSectors || []).map(s => `<span class="sector-tag">${esc(s)}</span>`).join('')}</p>
        <p class="muted" style="margin-top:6px;font-size:12px">주의: ${(cp.cautionSectors || []).map(esc).join(', ')}
          <span class="muted">| 기준금리 ${cp.rateKR}% (${esc(cp.asOf)})</span></p>
      </div></div></div>`;
  }
  html += `<div class="card"><h2>2000년 이후 사이클 타임라인 <span style="cursor:help;font-weight:400" title="${c.theory ? esc(c.theory.summary) : ''}">ⓘ</span></h2><div class="cyc-tl">`;
  html += (c.timeline || []).map((t, i) => `
    <div class="cyc-item${i === 0 ? ' now' : ''}">
      <div><span class="phase-tag ph-${t.phaseId}">${esc(t.phase)}</span><strong>${esc(t.period)}</strong>
        <span class="muted" style="margin-left:8px">${esc(t.rate)}</span></div>
      <div class="muted" style="margin:4px 0">${esc(t.market)}</div>
      <div>${(t.leaders || []).map(l => `<span class="sector-tag">${esc(l)}</span>`).join('')}</div>
      <div class="muted" style="font-size:12px;margin-top:3px">${esc(t.events)}</div>
    </div>`).join('');
  html += `</div><p class="muted" style="margin-top:8px">⚠️ 과거 기록이며 같은 국면이 와도 같은 섹터가 주도한다는 보장은 없습니다(참고용).</p></div>`;
  return html;
}

function renderDisclosures() {
  const d = state.disclosures;
  if (!d) return '<div class="card empty">공시 데이터(disclosures.json)를 불러오지 못했습니다.</div>';
  const items = d.items || [];
  const counts = {};
  items.forEach(i => counts[i.category] = (counts[i.category] || 0) + 1);
  const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const filtered = state.discFilter === 'all' ? items : items.filter(i => i.category === state.discFilter);

  const dl = limited('disc', state.discFilter, filtered);
  let html = `<div class="card">
    <h2>DART 공시 <span class="muted" style="font-weight:400">${esc(d.range.bgnDe)}~${esc(d.range.endDe)} · 투자영향 큰 유형만 자동 수집 · ${items.length}건</span></h2>
    <label class="fsel" style="max-width:280px;margin-bottom:10px"><span>유형</span><select data-disc-select>
      <option value="all"${state.discFilter === 'all' ? ' selected' : ''}>전체 (${items.length})</option>
      ${cats.map(c => `<option value="${esc(c)}"${state.discFilter === c ? ' selected' : ''}>${esc(c)} (${counts[c]})</option>`).join('')}
    </select></label>
    <div class="disc-list">${dl.shown.map(i => `<a class="disc-row" href="${esc(i.url)}" target="_blank" rel="noopener">
      <span class="muted num">${esc(i.rceptDt.slice(4, 6))}/${esc(i.rceptDt.slice(6, 8))}</span>
      <b>${esc(i.name)}</b>
      <span>${i.level === 'high' ? `<span class="warn-tag">${esc(i.category)}</span>` : `<span class="group-tag">${esc(i.category)}</span>`}</span>
      <span class="disc-r">${esc(i.reportNm)} <span class="muted">↗</span></span>
    </a>`).join('') || '<p class="empty">해당 유형의 공시가 없습니다</p>'}</div>${dl.more}
  </div>`;
  return html;
}

function newsRow(a, showWhy) {
  const t = new Date(a.pubDate);
  const timeStr = isNaN(t) ? '' : t.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const lvlCls = a.level === 'bad' ? 'warn-tag' : a.level === 'good' ? 'fit-tag' : 'group-tag';
  return `<div style="padding:9px 2px;border-bottom:1px solid var(--border)">
    <a href="${esc(a.link)}" target="_blank" rel="noopener" style="color:var(--text);text-decoration:none;font-size:14px;line-height:1.4">${esc(a.title)}</a>
    <div class="muted" style="font-size:11px;margin-top:4px">${esc(a.source || '')} · ${timeStr}${showWhy && a.why ? ` · <span class="${lvlCls}">${esc(a.why)}</span>` : ''}</div>
  </div>`;
}

function renderNews() {
  const n = state.news;
  if (!n) return '<div class="card empty">뉴스 데이터(news.json)를 불러오지 못했습니다.</div>';
  const g = state.newsGroup;
  let html = `<div class="card">
    <h2>뉴스 <span class="muted" style="font-weight:400">최근 ${n.retentionDays}일 · 네이버+구글뉴스 · 갱신 ${new Date(n.updatedAt).toLocaleString('ko-KR')}</span></h2>
    <div class="group-filter">
      <button data-news-group="brief" class="chip ${g === 'brief' ? 'active' : ''}">📌 꼭 볼 뉴스<span class="cnt">${n.briefing.length}</span></button>
      ${(n.groups || []).map(gr => {
        const cnt = (n.market || []).filter(m => m.group === gr.key).reduce((s, m) => s + (m.items || []).length, 0);
        return `<button data-news-group="${esc(gr.key)}" class="chip ${g === gr.key ? 'active' : ''}">${esc(gr.label)}<span class="cnt">${cnt}</span></button>`;
      }).join('')}
    </div>`;

  let rows;
  if (g === 'brief') {
    rows = n.briefing.map(a => newsRow(a, true));
  } else {
    rows = (n.market || []).filter(m => m.group === g).flatMap(m => m.items || []).map(a => newsRow(a, false));
  }
  html += rows.join('') || '<p class="muted">해당 분류에 최근 기사가 없습니다.</p>';
  html += `</div>`;
  return html;
}

const FLOW_HEADLINE = ['개인', '외국인', '기관합계'];
const FLOW_TREND_SERIES = ['외국인', '개인', '기관합계'];

// 투자자구분 하나를 한 줄(라벨 + 일별 상승/하락색 막대 + 우측 기간합계)로 그린다.
// 시장수급(renderFlows)·종목별 수급(renderFlowsTab) 둘 다 이 한 줄 형태를 쓴다 -
// 한 그래프에 여러 구분을 욱여넣으면 안 읽힌다는 피드백으로 분리했다.
function investorTrendRow(label, vals, dateLabels) {
  // 0선을 가운데 두고 위=순매수·아래=순매도. 예전엔 0선이 바닥이라 음수 막대가
  // 박스 밖으로 나가 세로 스크롤로만 보였다(막대 절반 높이로 줄여 둘 다 보인다).
  const half = 20, barW = 8, barGap = 2;
  const trendMax = Math.max(...vals.map(v => Math.abs(v)), 1);
  const dayBars = vals.map((v, i) => {
    const h = Math.max(2, Math.round(Math.abs(v) / trendMax * half));
    const top = v >= 0 ? half - h : half;
    return `<div style="width:${barW}px;height:${half * 2}px;position:relative;flex-shrink:0" title="${esc(dateLabels[i])} ${v >= 0 ? '+' : ''}${fmtEok(v)}">
      <div style="position:absolute;left:0;right:0;top:${top}px;height:${h}px;background:${v >= 0 ? 'var(--up)' : 'var(--down)'};border-radius:1px"></div>
    </div>`;
  }).join('');
  const sum = vals.reduce((s, v) => s + v, 0);
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <div style="width:48px;font-size:13px;flex-shrink:0">${esc(label)}</div>
    <div style="display:flex;align-items:flex-start;gap:${barGap}px;height:${half * 2}px;overflow-x:auto;background:linear-gradient(var(--border),var(--border)) 0 50%/100% 1px no-repeat">${dayBars}</div>
    <div class="${sum >= 0 ? 'pos' : 'neg'}" style="min-width:84px;text-align:right;flex-shrink:0">${sum >= 0 ? '+' : ''}${fmtEok(sum)}</div>
  </div>`;
}

// 장중 잠정 수급 - market_flows.json(pykrx 확정치)은 평일 18:20 KST 이후에야
// 나온다. 그 전에 대략적인 방향이라도 보려고 VM 중계(scripts/kis-minute-history-api.py
// /market-trend, 네이버 지수 API 프록시)를 60초마다 당긴다. 실패하면 조용히
// 접는다 - 확정치 화면은 그대로 보여야 한다.
function ensureMarketTrend() {
  const t = state.marketTrend;
  if (t.pending || (t.fetchedAt && Date.now() - t.fetchedAt < 60000)) return;
  t.pending = true;
  fetch('https://wonithink-stock.duckdns.org/market-trend')
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { t.data = d; t.error = null; })
    .catch(e => { t.error = String(e); })
    .finally(() => {
      t.pending = false; t.fetchedAt = Date.now();
      if (state.tab === 'flows') render(); else if (state.tab === 'today') renderTodaySoft();
    });
}

function renderMarketTrendLive() {
  const t = state.marketTrend;
  if (!t.data) return t.error ? '' : '<p class="muted" style="margin:6px 0 0">장중 잠정치 불러오는 중…</p>';
  const rows = Object.entries(t.data.markets || {}).map(([mkt, v]) => {
    const cells = [['개인', v.personalEok], ['외국인', v.foreignEok], ['기관', v.institutionalEok]].map(([n, x]) =>
      x === null || x === undefined
        ? `<span class="muted">${n} -</span>`
        : `<span>${n} <b class="${x >= 0 ? 'pos' : 'neg'}">${x >= 0 ? '+' : ''}${x.toLocaleString()}억</b></span>`).join('<span class="muted"> · </span>');
    return `<div style="margin:4px 0"><span style="display:inline-block;width:64px">${esc(mkt)}</span>${cells}</div>`;
  }).join('');
  return `<div style="margin:8px 0 14px;padding:10px 12px;border:1px solid var(--border);border-radius:8px">
    <div class="muted" style="margin-bottom:6px">오늘 장중 <b>잠정치</b> (네이버 지수, 확정치 아님) · ${esc(t.data.markets.KOSPI?.bizdate || '')} · 60초마다 갱신</div>
    ${rows}
  </div>`;
}

function renderFlows() {
  ensureMarketTrend();
  const mf = state.marketFlows;
  if (!mf) return '<div class="card empty">시장 수급 데이터(market_flows.json)를 불러오지 못했습니다.</div>';
  const mkt = state.flowsMarket;
  const days = (mf.markets[mkt] || {}).days || [];
  if (!days.length) return '<div class="card empty">데이터 없음</div>';
  const idx = state.flowsDateIdx === null ? days.length - 1 : Math.min(state.flowsDateIdx, days.length - 1);
  const day = days[idx];

  const marketTabs = Object.keys(mf.markets).map(m =>
    `<button data-flows-market="${esc(m)}" class="chip ${mkt === m ? 'active' : ''}">${esc(m)}</button>`).join('');
  const dateTabs = days.slice(-10).map((d, i) => {
    const realIdx = days.length - Math.min(10, days.length) + i;
    const label = `${d.date.slice(4, 6)}/${d.date.slice(6, 8)}`;
    return `<button data-flows-date="${realIdx}" class="chip ${realIdx === idx ? 'active' : ''}">${label}</button>`;
  }).join('');

  // 그 날 전 구분(12종)을 |net| 큰 순으로 그대로 막대로 보여준다 - 접어두지 않는다
  const allCats = day.items.filter(it => it.name !== '전체')
    .sort((a, b) => Math.abs(b.net) - Math.abs(a.net));
  const maxAbs = Math.max(...allCats.map(it => Math.abs(it.net)), 1);
  const bars = allCats.map(it => {
    const pct = Math.round(Math.abs(it.net) / maxAbs * 100);
    const cls = it.net >= 0 ? 'pos' : 'neg';
    const label = it.name === '기관합계' ? '기관' : it.name;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div style="width:64px;font-size:13px">${esc(label)}</div>
      <div class="bar-bg" style="width:220px"><span class="bar-fill" style="width:${pct}%;background:${it.net >= 0 ? 'var(--up)' : 'var(--down)'}"></span></div>
      <div class="${cls}" style="font-family:inherit;min-width:90px;text-align:right">${it.net >= 0 ? '+' : ''}${fmtEok(it.net)}</div>
    </div>`;
  }).join('');

  // 일별 추이: 외국인/개인/기관 하루하루 사고파는 방향 + 우측에 기간 합계
  const trendDateLabels = days.map(d => `${d.date.slice(4, 6)}/${d.date.slice(6, 8)}`);
  const trendChart = FLOW_TREND_SERIES.map(k => {
    const vals = days.map(d => (d.items.find(it => it.name === k) || {}).net || 0);
    return investorTrendRow(k === '기관합계' ? '기관' : k, vals, trendDateLabels);
  }).join('');

  return `<div class="card">
    <h2>시장 투자자별 순매수 <span class="muted" style="font-weight:400">KRX(pykrx) 일별 확정치, KST 기준일</span></h2>
    ${renderMarketTrendLive()}
    <div class="group-filter" style="margin-bottom:4px">${marketTabs}</div>
    <div class="group-filter">${dateTabs}</div>
    <p class="muted" style="margin:10px 0 4px">${mkt} · ${day.date.slice(0,4)}-${day.date.slice(4,6)}-${day.date.slice(6,8)} 순매수(금액) · 큰 순 정렬 — 위 날짜를 눌러 다른 날 보기</p>
    <div style="margin:10px 0 16px">${bars}</div>
    <h2 style="margin-top:18px">일별 추이 <span class="muted" style="font-weight:400">외국인/개인/기관 순매수(금액) · 우측=기간합계</span></h2>
    <div style="margin-top:10px">${trendChart}</div>
  </div>`;
}

const LIVE_WS_URL = 'wss://wonithink-stock.duckdns.org/live-ws';
// docs/data/live-watchlist.json이 단일 출처 - scripts/kis-live-relay.py·
// scripts/build-watchlist-daily.py도 같은 파일을 읽는다(예전엔 세 곳에
// 각각 하드코딩돼 있었다). init()에서 채워지기 전까지는 빈 배열 - 탭을
// 아직 안 열었으면 렌더 자체가 안 되니 안전하다.
let LIVE_WATCHLIST = [];

function connectLive() {
  if (state.live.ws) return;  // 이미 연결됐거나 연결 시도 중
  state.live.status = 'connecting';
  let ws;
  try {
    ws = new WebSocket(LIVE_WS_URL);
  } catch (e) {
    state.live.status = 'error';
    return;
  }
  state.live.ws = ws;
  ws.onopen = () => { state.live.status = 'connected'; scheduleLiveRender(); };
  ws.onmessage = (ev) => {
    try {
      const tick = JSON.parse(ev.data);
      state.live.ticks[tick.ticker] = tick;
      updateCandle(tick);
      scheduleLiveRender();
    } catch (e) { /* 파싱 실패한 메시지는 무시 */ }
  };
  ws.onclose = () => {
    state.live.ws = null;
    state.live.status = 'disconnected';
    scheduleLiveRender();
    if (state.tab === 'live') setTimeout(connectLive, 3000);  // 탭을 보고 있을 때만 재연결
  };
  ws.onerror = () => { /* onclose가 뒤이어 호출되므로 여기선 상태만 남겨두고 별도 처리 안 함 */ };
}

// 틱이 여러 종목에서 초당 여러 번 올 수 있어 매번 innerHTML을 다시 그리면
// 낭비다 - 300ms 안에 몰린 갱신은 한 번만 반영한다
function scheduleLiveRender() {
  if (state.live.renderPending) return;
  state.live.renderPending = true;
  setTimeout(() => {
    state.live.renderPending = false;
    if (state.tab === 'live') render();
  }, 300);
}

// 틱을 종목별 1분봉으로 누적한다. 분이 바뀌면 진행 중이던 봉을 확정하고
// 새 봉을 연다 - 서버는 원 틱만 주므로 이 집계는 순전히 클라이언트 몫이다.
function updateCandle(t) {
  if (!t.time || t.time.length !== 6 || !t.price) return;
  const price = Number(t.price);
  const vol = Number(t.volume) || 0;
  if (!isFinite(price)) return;
  const minute = t.time.slice(0, 4);
  let c = state.live.candles[t.ticker];
  if (!c) c = state.live.candles[t.ticker] = { bars: [], cur: null };
  if (!c.cur || c.cur.minute !== minute) {
    if (c.cur) c.bars.push(c.cur);
    if (c.bars.length > 120) c.bars.shift();  // 무한정 안 쌓는다
    c.cur = { minute, o: price, h: price, l: price, c: price, v: vol };
  } else {
    c.cur.h = Math.max(c.cur.h, price);
    c.cur.l = Math.min(c.cur.l, price);
    c.cur.c = price;
    c.cur.v += vol;
  }
}

function candleSeries(ticker, n) {
  const c = state.live.candles[ticker];
  if (!c) return [];
  const all = c.cur ? c.bars.concat([c.cur]) : c.bars;
  return all.slice(-n);
}

// 1분봉 n개를 묶어 5/15/60분봉으로 만든다. 시가=첫봉 시가, 종가=마지막봉
// 종가, 고가/저가는 묶음 내 최대/최소, 거래량은 합산 - 표준 리샘플링.
function aggregateBars(bars, minutes) {
  if (minutes <= 1) return bars;
  const out = [];
  for (let i = 0; i < bars.length; i += minutes) {
    const chunk = bars.slice(i, i + minutes);
    if (!chunk.length) continue;
    out.push({
      minute: chunk[0].minute || chunk[0].time,
      o: chunk[0].o, c: chunk[chunk.length - 1].c,
      h: Math.max(...chunk.map(b => b.h)),
      l: Math.min(...chunk.map(b => b.l)),
      v: chunk.reduce((s, b) => s + (b.v || 0), 0),
    });
  }
  return out;
}

// 과거 날짜 분봉 조회(kis-minute-history-api.py) - 캐시에 없으면 요청하고,
// 응답이 오면 다시 그리도록 render()를 부른다. 호출 시점엔 그냥 캐시나
// null을 반환해서 렌더가 막히지 않게 한다(스피너 대신 "불러오는 중" 표시).
function getHistoricalBars(ticker, date) {
  const key = `${ticker}_${date}`;
  if (key in state.live.historyCache) return state.live.historyCache[key];
  if (!state.live.historyLoading[key]) {
    state.live.historyLoading[key] = true;
    fetch(`https://wonithink-stock.duckdns.org/minute-history?ticker=${ticker}&date=${date}`)
      .then(r => r.json())
      .then(d => {
        const bars = (d.bars || []).map(b => ({ minute: b.time.slice(0, 4), time: b.time, o: b.open, h: b.high, l: b.low, c: b.close, v: b.volume }));
        state.live.historyCache[key] = bars;
      })
      .catch(() => { state.live.historyCache[key] = []; })
      .finally(() => { delete state.live.historyLoading[key]; if (state.tab === 'live' || state.detail.open) render(); });
  }
  return null;
}

// 오늘 분봉은 페이지를 연 시점부터 웹소켓 틱으로만 쌓여서 새로고침하면
// 사라진다. KIS의 날짜지정 분봉조회는 당일도 지금까지 쌓인 걸 그대로
// 주므로, 그걸로 "라이브가 시작되기 전" 구간을 한 번 채워 넣는다 - 이후는
// updateCandle()의 실시간 틱이 그대로 이어 붙인다. 티커당 한 번만 시드.
function seedTodayFromHistory(ticker) {
  const c = state.live.candles[ticker];
  if (c && c.seeded) return;
  const key = `${ticker}_today`;
  if (state.live.historyLoading[key]) return;
  state.live.historyLoading[key] = true;
  const todayYmd = kstYmd().replace(/-/g, '');
  fetch(`https://wonithink-stock.duckdns.org/minute-history?ticker=${ticker}&date=${todayYmd}`)
    .then(r => r.json())
    .then(d => {
      const histBars = (d.bars || []).map(b => ({ minute: b.time.slice(0, 4), time: b.time, o: b.open, h: b.high, l: b.low, c: b.close, v: b.volume }));
      let cc = state.live.candles[ticker];
      if (!cc) cc = state.live.candles[ticker] = { bars: [], cur: null };
      // 이미 실시간 틱으로 갖고 있는 분(cur 포함)은 KIS 스냅샷보다 최신일
      // 수 있으니 덮어쓰지 않는다 - 과거 구간만 앞에 채워 넣는다.
      const haveMinutes = new Set(cc.bars.map(b => b.minute).concat(cc.cur ? [cc.cur.minute] : []));
      const fill = histBars.filter(b => !haveMinutes.has(b.minute));
      cc.bars = fill.concat(cc.bars).sort((a, b) => a.minute.localeCompare(b.minute));
      cc.seeded = true;
    })
    .catch(() => { const cc = state.live.candles[ticker]; if (cc) cc.seeded = true; })
    .finally(() => { delete state.live.historyLoading[key]; if (state.tab === 'live') render(); });
}

// bars가 비어도 안전하게 "대기 중" 표시. grid/labels는 상세 차트에서만 켠다.
function candleSvg(bars, w, h, opts) {
  opts = opts || {};
  if (!bars.length) {
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
      <text x="${w/2}" y="${h/2}" text-anchor="middle" fill="#8b96ad" font-size="10">대기 중</text></svg>`;
  }
  const hi = Math.max(...bars.map(b => b.h));
  const lo = Math.min(...bars.map(b => b.l));
  const range = (hi - lo) || Math.max(1, hi * 0.001);
  const padTop = opts.labels ? 14 : 3, padBottom = opts.labels ? 16 : 3;
  const usableH = h - padTop - padBottom;
  const bw = w / bars.length;
  const bodyW = Math.max(1, bw * 0.6);
  const y = (v) => padTop + (hi - v) / range * usableH;

  const grid = opts.grid ? [0.25, 0.5, 0.75].map(f => {
    const gy = (padTop + f * usableH).toFixed(1);
    return `<line x1="0" y1="${gy}" x2="${w}" y2="${gy}" stroke="#2a3550" stroke-width="1" stroke-dasharray="2,3"/>`;
  }).join('') : '';

  let marks;
  if (opts.mode === 'line') {
    // 종가만 이은 라인 - 기간이 길 때(수백 개 봉) 캔들보다 훨씬 읽기 쉽다
    const pts = bars.map((b, i) => `${(i * bw + bw / 2).toFixed(1)},${y(b.c).toFixed(1)}`).join(' ');
    const first = bars[0], lastB = bars[bars.length - 1];
    const lineColor = lastB.c >= first.o ? '#f2555a' : '#4c8dff';
    marks = `<polyline points="${pts}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linejoin="round"/>`;
  } else {
    marks = bars.map((b, i) => {
      const cx = i * bw + bw / 2;
      const up = b.c >= b.o;
      const color = up ? '#f2555a' : '#4c8dff';
      const yO = y(b.o), yC = y(b.c), yH = y(b.h), yL = y(b.l);
      const bodyTop = Math.min(yO, yC).toFixed(1);
      const bodyH = Math.max(1, Math.abs(yC - yO)).toFixed(1);
      return `<line x1="${cx.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${yL.toFixed(1)}" stroke="${color}" stroke-width="1"/>
        <rect x="${(cx - bodyW / 2).toFixed(1)}" y="${bodyTop}" width="${bodyW.toFixed(1)}" height="${bodyH}" rx="0.5" fill="${color}"/>`;
    }).join('');
  }

  const labels = opts.labels
    ? `<text x="4" y="10" fill="#8b96ad" font-size="10">${fmtNum(hi)}</text>
       <text x="4" y="${padTop + usableH - 3}" fill="#8b96ad" font-size="10">${fmtNum(lo)}</text>`
    : '';

  // x축 시간/날짜 라벨 - 봉마다 찍으면 겹치니 5개 안팎으로만 골라 찍는다.
  // 분봉이면 time(HHMMSS)/minute(HHMM)을 HH:MM으로, 일봉이면 date를 MM/DD로.
  const barLabel = (b) => {
    if (b.time && b.time.length >= 4) return `${b.time.slice(0, 2)}:${b.time.slice(2, 4)}`;
    if (b.minute && b.minute.length >= 4) return `${b.minute.slice(0, 2)}:${b.minute.slice(2, 4)}`;
    if (b.date) return b.date.slice(5).replace('-', '/');
    return '';
  };
  let xLabels = '';
  if (opts.labels && bars.length > 1) {
    const n = Math.min(5, bars.length);
    const idxs = Array.from({ length: n }, (_, i) => Math.round(i * (bars.length - 1) / (n - 1)));
    const uniqIdxs = [...new Set(idxs)];
    xLabels = uniqIdxs.map(i => {
      const cx = i * bw + bw / 2;
      const anchor = i === 0 ? 'start' : i === bars.length - 1 ? 'end' : 'middle';
      const tx = i === 0 ? 2 : i === bars.length - 1 ? w - 2 : cx;
      return `<text x="${tx.toFixed(1)}" y="${h - 3}" text-anchor="${anchor}" fill="#8b96ad" font-size="9">${esc(barLabel(bars[i]))}</text>`;
    }).join('');
  }

  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${grid}${marks}${labels}${xLabels}</svg>`;
}

// ---------- 종목 상세(차트) 모달 - MA20/60·볼린저·RSI 지표, 옛 Claude Cowork
// "주식" 프로젝트의 openDetail/renderChart를 이 프로젝트 관례(CSS 변수·색상)로 이식 ----------

function smaArr(a, p) {
  const out = a.map(() => null); let sum = 0;
  for (let i = 0; i < a.length; i++) { sum += a[i]; if (i >= p) sum -= a[i - p]; if (i >= p - 1) out[i] = sum / p; }
  return out;
}
function stdArr(a, p, means) {
  const out = a.map(() => null);
  for (let i = p - 1; i < a.length; i++) { let s = 0; const m = means[i]; for (let j = i - p + 1; j <= i; j++) { const dd = a[j] - m; s += dd * dd; } out[i] = Math.sqrt(s / p); }
  return out;
}
function rsiArr(a, p) {
  const out = a.map(() => null);
  for (let i = p; i < a.length; i++) {
    let g = 0, l = 0;
    for (let j = i - p + 1; j <= i; j++) { const df = a[j] - a[j - 1]; if (df > 0) g += df; else l -= df; }
    if (g + l === 0) { out[i] = 50; continue; }
    const rs = l === 0 ? Infinity : g / l; out[i] = 100 - 100 / (1 + rs);
  }
  return out;
}
function retN(closes, k) {
  const n = closes.length; if (n < k + 1) return null;
  const base = closes[n - 1 - k]; if (!base) return null;
  return (closes[n - 1] / base - 1) * 100;
}
function retYTD(closes, dates) {
  const n = closes.length; if (!n) return null;
  const yr = dates[n - 1].slice(0, 4); let base = null;
  for (let i = n - 1; i >= 0; i--) { if (dates[i].slice(0, 4) < yr) { base = closes[i]; break; } }
  if (base === null) base = closes[0]; if (!base) return null;
  return (closes[n - 1] / base - 1) * 100;
}

let pricesLoading = false;
function ensurePrices() {
  if (state.prices || pricesLoading) return;
  pricesLoading = true;
  loadJson('prices').then(d => { state.prices = d || { byTicker: {} }; pricesLoading = false; if (state.detail.open) render(); });
}

let flowsLoading = false;
// PIT 가치 검증 범위 — scripts/build-value-scope.js 가 주 1회 쓰는 docs/data/value-scope.json. 표시 전용(점수와 무관).
let valueScopeLoading = false;
function ensureValueScope() {
  if (state.valueScope !== undefined || valueScopeLoading) return;
  valueScopeLoading = true;
  loadJson('value-scope').then(d => { state.valueScope = d || null; valueScopeLoading = false; render(); });
}
const VALUE_SCOPE_REASON = { COMPOUND_EVENT: '기업행위 중첩', MERGER_UNHANDLED: '합병·분할 미처리', RIGHTS_FORMULA_UNVERIFIED: '권리 공식 미검증',
  CAPITAL_REDUCTION_TYPE_UNKNOWN: '감자 유형 미상', NO_PRICE: '가격 없음', NOT_IN_UNIVERSE: '검증 유니버스 밖', NO_VALUATION_INPUT: '입력 부족', RESOLVE_ERROR: '산출 오류' };
function valueScopeTile(r) {

  if (r.market !== 'KR') return decodeTile(label, '-', '국내 종목만', 'neutral');

  if (!v) return decodeTile(label, '-', '관심종목 아님', 'neutral');
  if (v.inScope) return decodeTile(label, '범위 안', `PER/PBR 시점 보정됨 · ${esc(vs.asOf)}`, 'neutral');
  return decodeTile(label, '범위 밖', `${esc(v.reason)} · ${esc(VALUE_SCOPE_REASON[v.reason] || '')} (검증 안 된 가치)`, 'neutral');
}
