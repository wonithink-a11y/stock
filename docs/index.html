function openStockDetail(ticker, name, vtab) {

// 캔들+MA20/60+볼린저(위) · 거래량(중) · RSI14(아래) 3단 SVG. bars={date|time|minute,o,h,l,c,v}
function detailChartSvg(bars, w, mode, target) {
  if (!bars.length) return '<div class="empty" style="padding:30px;text-align:center">데이터가 없습니다.</div>';
  const closes = bars.map(b => b.c), highs = bars.map(b => b.h), lows = bars.map(b => b.l), opens = bars.map(b => b.o), vols = bars.map(b => b.v || 0);
  const ma20a = smaArr(closes, 20), ma60a = smaArr(closes, 60), stdev = stdArr(closes, 20, ma20a);
  const bbU = ma20a.map((mm, i) => (mm != null && stdev[i] != null) ? mm + 2 * stdev[i] : null);
  const bbL = ma20a.map((mm, i) => (mm != null && stdev[i] != null) ? mm - 2 * stdev[i] : null);
  const rsi = rsiArr(closes, 14);

  const PH = 200, VH = 40, RH = 64, GAP = 8, padT = 8, padB = 4, padL = 4, padR = 50;
  const totalH = padT + PH + GAP + VH + GAP + RH + padB;
  const m = bars.length;
  let pmin = Infinity, pmax = -Infinity;
  for (let i = 0; i < m; i++) {
    pmin = Math.min(pmin, lows[i], bbL[i] == null ? Infinity : bbL[i]);
    pmax = Math.max(pmax, highs[i], bbU[i] == null ? -Infinity : bbU[i]);
  }
  if (!isFinite(pmin) || !isFinite(pmax)) { pmin = Math.min(...lows); pmax = Math.max(...highs); }
  const px = (i) => padL + (m <= 1 ? 0 : (i * (w - padL - padR) / (m - 1)));
  const bw = Math.max(1, (w - padL - padR) / m * 0.62);
  const py = (v) => padT + PH * (1 - (v - pmin) / ((pmax - pmin) || 1));
  const vmax = Math.max(1, ...vols);
  const vTop = padT + PH + GAP;
  const vy = (v) => vTop + VH * (1 - v / vmax);
  const rTop = vTop + VH + GAP;
  const ry = (v) => rTop + RH * (1 - v / 100);

  const line = (arr, fn, color, sw, dash) => {
    let d = '';
    for (let i = 0; i < arr.length; i++) { if (arr[i] == null) continue; d += (d ? 'L' : 'M') + px(i).toFixed(1) + ',' + fn(arr[i]).toFixed(1); }
    return d ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="${sw}"${dash ? ` stroke-dasharray="${dash}"` : ''}/>` : '';
  };

  let grid = '';
  for (let k = 0; k <= 3; k++) {
    const v = pmin + (pmax - pmin) * k / 3, y = py(v);
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${(w - padR).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2a3550" stroke-width="0.5"/><text x="${(w - padR + 4).toFixed(1)}" y="${y.toFixed(1)}" dominant-baseline="middle" font-size="10" fill="#8b96ad">${fmtNum(Math.round(v))}</text>`;
  }

  let priceBody = '';
  if (mode === 'line') {
    priceBody = line(closes, py, '#e6ebf5', 1.5);
  } else {
    for (let i = 0; i < m; i++) {
      const up = closes[i] >= opens[i], col = up ? '#f2555a' : '#4c8dff';
      const x = px(i), yO = py(opens[i]), yC = py(closes[i]);
      const top = Math.min(yO, yC), bh = Math.max(1, Math.abs(yO - yC));
      priceBody += `<line x1="${x.toFixed(1)}" y1="${py(highs[i]).toFixed(1)}" x2="${x.toFixed(1)}" y2="${py(lows[i]).toFixed(1)}" stroke="${col}" stroke-width="1"/><rect x="${(x - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`;
    }
  }

  let volBody = '';
  for (let i = 0; i < m; i++) {
    const up = closes[i] >= opens[i], col = up ? 'rgba(242,85,90,.5)' : 'rgba(76,141,255,.5)';
    const y = vy(vols[i]);
    volBody += `<rect x="${(px(i) - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, vTop + VH - y).toFixed(1)}" fill="${col}"/>`;
  }

  const rsiBands = `<rect x="${padL}" y="${ry(70).toFixed(1)}" width="${(w - padL - padR).toFixed(1)}" height="${(ry(30) - ry(70)).toFixed(1)}" fill="#4d9fff" opacity="0.06"/>
    <line x1="${padL}" y1="${ry(70).toFixed(1)}" x2="${(w - padR).toFixed(1)}" y2="${ry(70).toFixed(1)}" stroke="#e74c3c" stroke-width="0.5" stroke-dasharray="3 3"/>
    <line x1="${padL}" y1="${ry(30).toFixed(1)}" x2="${(w - padR).toFixed(1)}" y2="${ry(30).toFixed(1)}" stroke="#4d9fff" stroke-width="0.5" stroke-dasharray="3 3"/>
    <text x="${(w - padR + 4).toFixed(1)}" y="${ry(70).toFixed(1)}" dominant-baseline="middle" font-size="10" fill="#8b96ad">70</text>
    <text x="${(w - padR + 4).toFixed(1)}" y="${ry(30).toFixed(1)}" dominant-baseline="middle" font-size="10" fill="#8b96ad">30</text>
    <text x="${padL + 2}" y="${(rTop + 11).toFixed(1)}" font-size="10" fill="#8b96ad">RSI 14</text>`;

  target.view = { bars };
  target.viewGeom = { w, padL, padR, m };

  return `<div class="scd-chartwrap" style="position:relative">
    <svg viewBox="0 0 ${w} ${totalH}" preserveAspectRatio="none" style="width:100%;height:auto;display:block">
      ${grid}
      ${line(bbU, py, '#4d9fff', 0.8, '3 2')}${line(bbL, py, '#4d9fff', 0.8, '3 2')}
      ${priceBody}
      ${line(ma20a, py, '#f1c40f', 1)}${line(ma60a, py, '#8b96ad', 1)}
      ${volBody}
      ${rsiBands}${line(rsi, ry, '#c5a8ff', 1.2)}
    </svg>
    <div class="scd-cross" style="position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:0.5;display:none;pointer-events:none"></div>
  </div>
  <div class="scdOhlc muted" style="font-size:12px;margin-top:4px;font-family:inherit">&nbsp;</div>`;
}

// 차트 위 커서(모바일은 탭) → 그 봉의 날짜·시고저종·거래량. detailChartSvg가 채운
// target.view/viewGeom을 읽는다 - innerHTML 교체마다 매번 다시 붙여야 한다.
// containerSel로 모달(#stockModal)·실시간 탭(#content) 등 여러 곳에서 같은
// 함수를 쓸 수 있게 한다(id 중복 대신 class .scdOhlc + 컨테이너 스코프).
function attachDetailHover(containerSel, target) {
  const wrap = document.querySelector(`${containerSel} .scd-chartwrap`);
  const out = document.querySelector(`${containerSel} .scdOhlc`);
  const v = target.view, g = target.viewGeom;
  if (!wrap || !out || !v || !g || !v.bars.length) return;
  const cross = wrap.querySelector('.scd-cross');
  const m = v.bars.length;
  function show(idx) {
    idx = Math.max(0, Math.min(m - 1, idx));
    const b = v.bars[idx];
    const lab = b.date || (b.time ? `${b.time.slice(0, 2)}:${b.time.slice(2, 4)}` : (b.minute ? `${b.minute.slice(0, 2)}:${b.minute.slice(2, 4)}` : ''));
    const prev = idx > 0 ? v.bars[idx - 1].c : b.o;
    const chg = prev ? (b.c / prev - 1) * 100 : 0;
    const cls = chg > 0 ? 'pos' : chg < 0 ? 'neg' : 'muted';
    out.innerHTML = `<strong>${esc(lab)}</strong> 시${fmtNum(b.o)} 고${fmtNum(b.h)} 저${fmtNum(b.l)} <strong>종${fmtNum(b.c)}</strong> <span class="${cls}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span> 거래량${fmtNum(b.v || 0)}`;
  }
  function locate(clientX) {
    const r = wrap.getBoundingClientRect();
    const vbX = (clientX - r.left) / r.width * g.w;
    const step = (g.w - g.padL - g.padR) / Math.max(1, m - 1);
    const idx = Math.round((vbX - g.padL) / step);
    if (cross) { cross.style.left = Math.max(0, Math.min(r.width, clientX - r.left)) + 'px'; cross.style.display = 'block'; }
    show(idx);
  }
  wrap.onmousemove = (e) => locate(e.clientX);
  wrap.onmouseleave = () => { if (cross) cross.style.display = 'none'; show(m - 1); };
  wrap.ontouchstart = wrap.ontouchmove = (e) => { if (e.touches && e.touches[0]) { locate(e.touches[0].clientX); e.preventDefault(); } };
  show(m - 1);
}

// RSI/볼린저%B/52주 위치·고점대비/MA정배열역배열/이격도 - 항상 전체 시계열(daily)
// 기준으로 계산한다. 표시 범위(1M/3M/...) 버튼은 차트만 잘라 보여줄 뿐 이 값들과 무관하다.
function badgesFor(dailyBars) {
  const closes = dailyBars.map(b => b.c), highs = dailyBars.map(b => b.h), lows = dailyBars.map(b => b.l);
  const n = closes.length; if (!n) return '';
  const last = closes[n - 1];
  const ma20a = smaArr(closes, 20), ma60a = smaArr(closes, 60);
  const ma20 = ma20a[n - 1], ma60 = ma60a[n - 1];
  const stdev = stdArr(closes, 20, ma20a)[n - 1];
  const bbU = (ma20 != null && stdev != null) ? ma20 + 2 * stdev : null;
  const bbL = (ma20 != null && stdev != null) ? ma20 - 2 * stdev : null;
  const pctB = (bbU != null && bbL != null && bbU !== bbL) ? (last - bbL) / (bbU - bbL) : null;
  const rsi = rsiArr(closes, 14)[n - 1];
  const hi = Math.max(...highs), lo = Math.min(...lows);
  const fromHi = (last / hi - 1) * 100;
  const posHL = (hi !== lo) ? (last - lo) / (hi - lo) * 100 : null;
  const disp = ma20 != null ? (last / ma20 - 1) * 100 : null;
  let arrange = '혼조';
  if (ma20 != null && ma60 != null) { if (last > ma20 && ma20 > ma60) arrange = '정배열'; else if (last < ma20 && ma20 < ma60) arrange = '역배열'; }
  const rangeLabel = n >= 200 ? '52주' : `${n}봉`;
  const badge = (t) => `<span class="chip" style="cursor:default">${t}</span>`;
  return [
    rsi != null ? badge(`RSI ${rsi.toFixed(1)} · ${rsi >= 70 ? '과매수' : rsi <= 30 ? '과매도' : '중립'}`) : '',
    pctB != null ? badge(`볼린저 %B ${pctB.toFixed(2)} · ${pctB >= 1 ? '상단돌파' : pctB >= 0.8 ? '상단권' : pctB <= 0 ? '하단이탈' : pctB <= 0.2 ? '하단권' : '중앙'}`) : '',
    badge(`${rangeLabel} 고점 대비 ${fromHi >= 0 ? '+' : ''}${fromHi.toFixed(1)}%`),
    posHL != null ? badge(`${rangeLabel} 위치 ${posHL.toFixed(0)}%`) : '',
    badge(`MA20·60 ${arrange}`),
    disp != null ? badge(`MA20 이격도 ${disp >= 0 ? '+' : ''}${disp.toFixed(1)}%`) : '',
  ].filter(Boolean).join(' ');
}

function retChip(label, v) {
  const box = (inner) => `<div class="chip" style="cursor:default;display:flex;flex-direction:column;align-items:center;min-width:52px;gap:2px">${inner}</div>`;
  if (v === null || v === undefined || Number.isNaN(v)) return box(`<span style="font-size:10px;color:var(--muted)">${label}</span><b class="muted">-</b>`);
  const cls = v > 0 ? 'pos' : v < 0 ? 'neg' : 'muted';
  return box(`<span style="font-size:10px;color:var(--muted)">${label}</span><b class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</b>`);
}

function modalShell(dt, inner) {
  return `<div class="scd-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <h3 style="margin:0">${esc(dt.name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(dt.ticker)}</span></h3>
      <button data-detail-close="1" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px">×</button>
    </div>
    ${inner}
  </div>`;
}

function renderStockModal() {
  const el = document.getElementById('stockModal');
  const dt = state.detail;
  if (!dt.open) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;

  if (dt.vtab === 'decode') {   // 기업 해독은 가격 시계열이 없어도 열린다
    el.innerHTML = modalShell(dt, `<div class="group-filter" style="margin-bottom:12px">${detailVtabBtns(dt)}</div>${renderDecodeTab(dt)}`);
    return;
  }
  if (!state.prices) { el.innerHTML = modalShell(dt, '<div class="empty" style="padding:30px;text-align:center">불러오는 중...</div>'); return; }
  const rec = state.prices.byTicker ? state.prices.byTicker[dt.ticker] : null;
  if (!rec || !rec.c || rec.c.length < 2) {
    el.innerHTML = modalShell(dt, '<div class="empty" style="padding:30px;text-align:center">주가 시계열이 아직 없습니다.</div>');
    return;
  }
  dt.market = rec.market;
  const dailyBars = rec.d.map((d, i) => ({ date: d, o: rec.o[i], h: rec.h[i], l: rec.l[i], c: rec.c[i], v: rec.v[i] }));
  const n = dailyBars.length;
  const last = dailyBars[n - 1];
  const d1 = retN(rec.c, 1);
  const priceStr = dt.market === 'US' ? '$' + fmtNum(last.c) : fmtNum(last.c) + '원';
  const cls = d1 > 0 ? 'pos' : d1 < 0 ? 'neg' : 'muted';

  const vtabBtns = detailVtabBtns(dt);

  const body = dt.vtab === 'flows' ? renderFlowsTab(dt) : renderChartTab(dt, dailyBars, n, rec);

  const content = `
    <div style="margin-bottom:10px">
      <div style="font-size:13px;color:var(--muted)">${esc(last.date || '')}${dt.market ? mktChip(dt.market) : ''} 종가</div>
      <div style="font-size:22px;font-weight:700">${priceStr} <span class="${cls}" style="font-size:14px;font-weight:400">${d1 > 0 ? '+' : ''}${d1 != null ? d1.toFixed(2) : '-'}%</span></div>
    </div>
    <div class="group-filter" style="margin-bottom:12px">${vtabBtns}</div>
    ${body}`;

  el.innerHTML = modalShell(dt, content);
  if (dt.vtab === 'chart') attachDetailHover('#stockModal', state.detail);
}

function detailVtabBtns(dt) {
  return `
    <button data-detail-vtab="chart" class="chip ${dt.vtab === 'chart' ? 'active' : ''}">📈 차트</button>
    <button data-detail-vtab="flows" class="chip ${dt.vtab === 'flows' ? 'active' : ''}">💰 수급</button>
    <button data-detail-vtab="decode" class="chip ${dt.vtab === 'decode' ? 'active' : ''}">🔎 해독</button>
    <a class="chip" href="https://claude.ai/artifact/V8PbDHh47YRRbKw6YqHMkk" target="_blank" rel="noopener noreferrer" title="비공개 — 내 Claude 계정 로그인 필요">🧭 Claude 판정 ↗</a>`;
}

// ---------- 기업 해독 카드 v0 (자동 데이터만 · 관찰용 · 점수·추천을 바꾸지 않는다) ----------
// 기준표(criteria)는 registry 가 가리키는 버전을 GitHub 에서 읽는다 — 채점에 쓰인 것과 같은 파일. 근거는 docs/factor-evidence.json(손 관리).
const RAW_BASE = 'https://raw.githubusercontent.com/wonithink-a11y/stock/main/';
function ensureDecodeRefs() {
  if (state.decodeRefs || state.decodeRefsLoading) return;
  state.decodeRefsLoading = true;
  Promise.all([
    fetch('factor-evidence.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(RAW_BASE + 'config/policies/registry.json').then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(async ([evidence, registry]) => {
    const criteria = {};
    for (const mk of ['KR', 'US']) {
      const ent = registry && registry.criteria && registry.criteria[mk];
      if (ent) criteria[mk] = { version: ent.version, path: ent.path, data: await fetch(RAW_BASE + ent.path).then(r => r.ok ? r.json() : null).catch(() => null) };
    }
    state.decodeRefs = { evidence, criteria };
    state.decodeRefsLoading = false;
    render();
  });
}

const DECODE_CATS = [['fundamental', '재무'], ['valuation', '밸류에이션'], ['technical', '기술'], ['supplyDemand', '수급']];
const EVIDENCE_BADGE = { validated: ['검증됨(조건부)', 'ok'], reversed: ['반대 방향으로 검증', 'ok'], weak: ['약함·미확정', 'muted'], rejected: ['기각', 'err'], untested: ['미검증', 'muted'] };

function decodeSection(title, basis, inner) {
  return `<div style="margin:14px 0 4px"><h4 style="margin:0 0 4px">${title}</h4><div class="muted" style="font-size:11px;margin-bottom:6px">${basis}</div>${inner}</div>`;
}

function fmtRaw(d) {
  const v = d.raw !== undefined ? d.raw : d.value !== undefined ? d.value : d.signal !== undefined ? d.signal : d.trend !== undefined ? d.trend
    : d.peg !== undefined ? d.peg : d.marginOfSafety !== undefined ? d.marginOfSafety : d.confirmed !== undefined ? d.confirmed : null;
  if (v === null || v === undefined) return '<span class="muted">-</span>';
  if (typeof v === 'number') return esc(String(Math.round(v * 1000) / 1000));
  return esc(String(v));
}

// ---------- 해독 탭 요약·그래픽 (2026-09-26 v0.5) — 한눈에: 한 줄 결론 · 신호등 · 차트 3개. 자세한 표는 아래 '자세히 보기' ----------
// 모든 판정은 규칙(아래 상수)으로 만든다 — 같은 데이터면 같은 문장. 매수·매도 신호가 아니다.
const DECODE_RULES = { lowTrust: 0.2, midTrust: 0.5, strongRs: 0.05, broad: 0.7, pricey: 0.67, cheap: 0.33, soonDays: 14 };
const DECODE_REPORTS = { '005930': 'docs/cards/005930-pilot-2026-09.md' };   // 정성 분석 보고서(시범) — 생기면 추가
const STATUS_COLOR = { validated: 'var(--pos, #22c55e)', reversed: 'var(--pos, #22c55e)', weak: '#9ca3af', untested: '#6b7280', rejected: 'var(--neg, #ef4444)' };

function decodeCompute(r) {
  const refs = state.decodeRefs;
  const crit = refs && refs.criteria[r.market] && refs.criteria[r.market].data;
  const ev = r.market === 'KR' ? ((refs && refs.evidence && refs.evidence.factors) || {}) : {};
  const ov = crit && r.sectorType && r.sectorType !== 'general' && crit.sectorOverrides ? crit.sectorOverrides[r.sectorType] : null;
  const weights = (ov && ov.categoryWeights) || (crit && crit.categoryWeights) || {};
  // 점수 기여: 범주 점수×가중치 / Σ가중치(데이터 있는 범주) → 범주 안에서는 지표 점수×지표 가중으로 나눈다(기술 지표는 가중이 없어 동일)
  let wsum = 0;
  DECODE_CATS.forEach(([k]) => { const b = (r.breakdown || {})[k]; if (b && b.score != null && weights[k]) wsum += weights[k]; });
  const parts = [];
  DECODE_CATS.forEach(([k, label]) => {
    const b = (r.breakdown || {})[k];
    if (!b || b.score == null || !weights[k] || !wsum) return;
    const catPts = b.score * weights[k] / wsum;
    const defs = crit && crit[k] ? (crit[k].metrics || crit[k].indicators || {}) : {};
    const fs = Object.entries(b.detail || {}).filter(([, d]) => d.score != null);
    const fw = fk => (defs[fk] && defs[fk].weight != null ? defs[fk].weight : 1);
    const denom = fs.reduce((a, [fk, d]) => a + d.score * fw(fk), 0);
    fs.forEach(([fk, d]) => parts.push({ cat: label, key: fk, label: d.label || fk, pts: denom ? catPts * d.score * fw(fk) / denom : 0, status: (ev[fk] || {}).status || 'untested' }));
  });
  const total = parts.reduce((a, p) => a + p.pts, 0);
  const validated = parts.filter(p => p.status === 'validated' || p.status === 'reversed').reduce((a, p) => a + p.pts, 0);
  const rejected = parts.filter(p => p.status === 'rejected').reduce((a, p) => a + p.pts, 0);
  // 업종·테마
  const ss = state.sectorStrength, ts = state.themeStrength;
  const sector = ss && (ss.groups || []).find(x => (x.tickers || []).includes(r.ticker));
  let theme = null;
  for (const node of ((ts && ts.tree) || [])) for (const sub of (node.subs || [])) {
    const m = (sub.members || []).find(x => x.t === r.ticker);
    if (m && sub.stats && (!theme || m.primary)) theme = { name: `${node.theme} › ${sub.theme}`, st: sub.stats };
  }
  // PBR 위치
  const results = (state.latest && state.latest.results) || [];
  const pbrOf = x => { const d = (((x.breakdown || {}).valuation || {}).detail || {}).pbr; return d && typeof d.raw === 'number' && d.raw > 0 ? d.raw : null; };
  const mine = pbrOf(r);
  const pool = mine == null ? [] : results.filter(x => x.market === r.market && pbrOf(x) != null).map(pbrOf);
  const pbrPct = mine == null || !pool.length ? null : pool.filter(v => v < mine).length / pool.length;
  // 수급(KR)
  let flows = null;
  if (r.market === 'KR') { ensureFlows(); flows = state.flows && (state.flows.byTicker || {})[r.ticker]; }
  // 일정
  const kst = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' })); kst.setHours(0, 0, 0, 0);
  const next = ((state.events && state.events.events) || []).filter(e => e.code === r.ticker)
    .map(e => ({ ...e, d: Math.round((new Date(e.date + 'T00:00:00') - kst) / 864e5) })).filter(e => e.d >= 0).sort((a, b) => a.d - b.d)[0] || null;
  return { parts, total, validatedShare: total ? validated / total : null, rejectedShare: total ? rejected / total : null, sector, theme, mine, pbrPct, poolN: pool.length, flows, next, fin: ((r.breakdown || {}).fundamental || {}).detail || {} };
}

function decodeHeadline(r, c) {
  const R = DECODE_RULES, s = [];
  if (r.market !== 'KR') s.push('미국 종목은 우리 연구로 검증한 지표가 없다 — 점수는 참고용.');
  else if (c.validatedShare != null) {
    if (c.validatedShare < R.lowTrust) s.push(`점수 ${r.totalScore}(${String(r.grade || '').slice(0, 1)})의 ${Math.round((1 - c.validatedShare) * 100)}%는 우리 연구에서 검증되지 않았거나 기각된 지표에서 나왔다.`);
    else if (c.validatedShare < R.midTrust) s.push(`점수 ${r.totalScore}의 ${Math.round(c.validatedShare * 100)}%만 검증된 지표에서 나왔다.`);
    else s.push(`점수 ${r.totalScore}의 ${Math.round(c.validatedShare * 100)}%가 검증된 지표에서 나왔다.`);
  }
  const g = c.theme ? c.theme.st : c.sector;
  if (g && g.rs && g.rs['1m'] != null) {
    const rs = g.rs['1m'], br = g.breadth20;
    if (rs >= R.strongRs) s.push(`${c.theme ? '테마' : '업종'}는 한 달간 시장보다 ${Math.round(rs * 100)}%p 강하다${br != null && br >= R.broad ? '(상승이 넓게 퍼짐)' : ''}.`);
    else if (rs <= -R.strongRs) s.push(`${c.theme ? '테마' : '업종'}는 한 달간 시장보다 ${Math.round(-rs * 100)}%p 약하다.`);
  }
  if (c.pbrPct != null) {
    if (c.pbrPct >= R.pricey) s.push(`PBR ${c.mine.toFixed(2)}배는 비교 종목 중 비싼 쪽 ${Math.round((1 - c.pbrPct) * 100)}%에 든다.`);
    else if (c.pbrPct <= R.cheap) s.push(`PBR ${c.mine.toFixed(2)}배는 비교 종목 중 싼 쪽 ${Math.round(c.pbrPct * 100 + 1)}%에 든다(저평가 판정 아님).`);
  }
  if (c.next && c.next.d <= R.soonDays) s.push(`${c.next.d === 0 ? '오늘' : c.next.d + '일 뒤'} ${c.next.title}.`);
  return s.join(' ');
}

function decodeTile(label, value, sub, tone) {
  const bg = { good: 'rgba(34,197,94,.14)', bad: 'rgba(239,68,68,.14)', mid: 'rgba(234,179,8,.14)', neutral: 'rgba(148,163,184,.12)' }[tone || 'neutral'];
  return `<div style="background:${bg};border-radius:10px;padding:10px 12px;min-width:0">
    <div class="muted" style="font-size:12px">${label}</div><div style="font-size:20px;font-weight:600;margin:2px 0">${value}</div><div class="muted" style="font-size:12px">${sub}</div></div>`;
}

function decodeBars(items) {   // items: [{label, v}] v = 비율(±) → 0 기준 좌우 막대
  const mx = Math.max(0.05, ...items.map(i => Math.abs(i.v || 0)));
  return items.map(i => {
    const v = i.v || 0, w = Math.round(Math.abs(v) / mx * 50);
    return `<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0">
      <span class="muted" style="width:44px">${i.label}</span>
      <div style="flex:1;position:relative;height:12px;background:rgba(148,163,184,.12);border-radius:3px">
        <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(148,163,184,.5)"></div>
        <div style="position:absolute;top:0;height:12px;border-radius:3px;${v >= 0 ? `left:50%;width:${w}%;background:var(--up)` : `right:50%;width:${w}%;background:var(--down)`}"></div>
      </div><span style="width:58px;text-align:right" class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${(v * 100).toFixed(1)}%</span></div>`;
  }).join('');
}

function fmtEok(v) {   // 원 → '−2.1조' / '+3,217억'
  const a = Math.abs(v), sg = v < 0 ? '−' : '+';
  return a >= 1e12 ? `${sg}${(a / 1e12).toFixed(1)}조` : `${sg}${(a / 1e8).toLocaleString('ko-KR', { maximumFractionDigits: 0 })}억`;
}

function decodeFlowSvg(rows) {   // 최근 20거래일 누적 순매수(외국인·기관)
  const last = rows.slice(-20);
  const cum = k => { let a = 0; return last.map(x => (a += (x[k] || 0))); };
  const f = cum('foreign'), g = cum('institution');
  const all = [...f, ...g, 0], mn = Math.min(...all), mx = Math.max(...all), W = 320, H = 110, P = 6;
  const y = v => P + (H - 2 * P) * (1 - (v - mn) / ((mx - mn) || 1));
  const x = i => P + i * (W - 2 * P) / Math.max(1, last.length - 1);
  const line = (arr, col) => `<polyline fill="none" stroke="${col}" stroke-width="2" points="${arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:420px;height:auto">
    <line x1="${P}" x2="${W - P}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(148,163,184,.5)" stroke-dasharray="3 3"/>
    ${line(f, '#60a5fa')}${line(g, '#f59e0b')}</svg>
    <div style="font-size:12px"><span style="color:#60a5fa">━ 외국인 ${fmtEok(f[f.length - 1])}</span> · <span style="color:#f59e0b">━ 기관 ${fmtEok(g[g.length - 1])}</span>
    <span class="muted"> · 최근 ${last.length}거래일 누적(${esc(last[0].date)}~${esc(last[last.length - 1].date)}, 수량×종가 근사)</span></div>`;
}

// 한 줄 결론·신호등 5칸·재무 칩·보고서 링크 — 해독 탭 맨 위와 메인 표 펼침 행이 같이 쓴다
function decodeSummaryHtml(r, c) {
  ensureDecodeRefs();
  if (!state.decodeRefs) return '<p class="muted">기준표·근거를 불러오는 중...</p>';
  c = c || decodeCompute(r);
  const R = DECODE_RULES;
  const vs = c.validatedShare;
  const tiles = [
    r.market !== 'KR' ? decodeTile('점수 신뢰도', '미검증', '미국 지표는 검증 전', 'neutral')
      : decodeTile('점수 신뢰도', vs == null ? '-' : vs < R.lowTrust ? '낮음' : vs < R.midTrust ? '보통' : '높음', `검증 지표 몫 ${vs == null ? '-' : Math.round(vs * 100) + '%'}`, vs == null ? 'neutral' : vs < R.lowTrust ? 'bad' : vs < R.midTrust ? 'mid' : 'good'),
    valueScopeTile(r),
    decodeTile('가격(PBR)', c.mine == null ? '-' : c.mine.toFixed(2) + '배', c.pbrPct == null ? '비교 불가' : `${c.poolN}종목 중 비싼 쪽 ${Math.round((1 - c.pbrPct) * 100)}%`, c.pbrPct == null ? 'neutral' : c.pbrPct >= R.pricey ? 'bad' : c.pbrPct <= R.cheap ? 'good' : 'mid'),
    (() => { const g = c.theme ? c.theme.st : c.sector; const rs = g && g.rs ? g.rs['1m'] : null;
      return decodeTile(c.theme ? '테마 흐름(1개월)' : '업종 흐름(1개월)', rs == null ? '-' : `${rs >= 0 ? '+' : ''}${(rs * 100).toFixed(1)}%p`, rs == null ? '소속 정보 없음' : '시장 대비', rs == null ? 'neutral' : rs >= R.strongRs ? 'good' : rs <= -R.strongRs ? 'bad' : 'mid'); })(),
    (() => { if (r.market !== 'KR') return decodeTile('수급', '-', '미국 미제공', 'neutral');
      if (!c.flows || !c.flows.length) return decodeTile('수급 20일', '-', state.flows ? '데이터 없음' : '불러오는 중', 'neutral');
      const s = k => c.flows.slice(-20).reduce((a, x) => a + (x[k] || 0), 0); const fo = s('foreign'), ins = s('institution');
      return decodeTile('수급 20일', `${fo + ins >= 0 ? '순매수' : '순매도'}`, `외국인 ${fmtEok(fo)} · 기관 ${fmtEok(ins)}`, fo + ins >= 0 ? 'good' : 'bad'); })(),
    (() => { const w = ((state.stockContext || {}).week52 || {})[r.ticker], px = r.currentPrice;
      if (!w || !px) return decodeTile('52주 위치', '-', '이력 부족', 'neutral');
      const hi = Math.max(w.high, px), lo = Math.min(w.low, px), pos = hi > lo ? (px - lo) / (hi - lo) : null;
      return decodeTile('52주 위치', pos == null ? '-' : Math.round(pos * 100) + '%', `고점 ${fmtPrice(hi, r.market)} 대비 ${((px / hi - 1) * 100).toFixed(1)}%`, 'neutral'); })(),
    (() => { // 목표가가 있는 종목만 칸을 낸다(없음·실패·수집 전은 숨김)
      const t = targetOf(r); if (!t) return '';
      const val = r.market === 'US' ? t.mean : t.median, up = r.currentPrice ? val / r.currentPrice - 1 : null;
      const sub = r.market === 'US' ? `평균 ${fmtPrice(t.mean, 'US')} · 의견 ${t.buy + t.hold + t.sell}명(매수 ${t.buy}·보유 ${t.hold}·매도 ${t.sell})`
        : `중앙 ${fmtPrice(t.median, 'KR')} · ${t.brokers}곳${t.brokers < 3 ? '뿐' : ''}`;
      return decodeTile(r.market === 'US' ? '월가 목표가' : '증권사 목표가', up == null ? '-' : `${up >= 0 ? '+' : ''}${(up * 100).toFixed(0)}%`, sub, 'neutral'); })(),
    decodeTile('다음 일정', c.next ? (c.next.d === 0 ? '오늘' : 'D-' + c.next.d) : '-', c.next ? `${c.next.date.slice(5)} ${esc(c.next.title)}` : '수집된 일정 없음', c.next && c.next.d <= R.soonDays ? 'mid' : 'neutral'),
  ].join('');

  // 재무 한 줄 — 기준 시점 명시
  const f = c.fin, fv = k => f[k] && f[k].raw != null ? f[k].raw : null;
  const finRow = Object.keys(f).length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-top:6px">
    ${[['ROE', fv('roe'), '%'], ['부채비율', fv('debtRatio'), '%'], ['매출성장', fv('revenueGrowthYoY'), '%'], ['유동비율', fv('currentRatio'), '%']].filter(x => x[1] != null).map(([l, v, u]) => `<span style="background:rgba(148,163,184,.12);border-radius:6px;padding:4px 8px">${l} <strong>${Math.round(v * 10) / 10}${u}</strong></span>`).join('')}
    </div><div class="muted" style="font-size:11px;margin-top:4px">재무는 <strong>최근 사업보고서(연간) 기준</strong> — 올해 분기 실적은 점수에 반영되지 않는다(시스템 한계).${r.market === 'KR' ? ' 목표가는 KIS 회원 증권사별 최근 목표가의 중앙값(최근 180일) — 맥락용, 점수에 안 쓴다.' : ''}</div>` : '';

  const report = DECODE_REPORTS[r.ticker] ? `<a href="https://github.com/wonithink-a11y/stock/blob/main/${DECODE_REPORTS[r.ticker]}" target="_blank" rel="noopener" style="display:block;margin:10px 0;padding:10px 12px;border:1px solid rgba(96,165,250,.5);border-radius:10px;text-decoration:none;color:#93c5fd">📄 이 회사 사업 분석 보고서 보기 — 무엇으로 돈을 버는지 · 성장 동력 단계 · 위험·재검토 조건 (공시 원문 인용)</a>` : '';

  return `<div style="padding:10px 12px;border-radius:10px;background:rgba(148,163,184,.12);line-height:1.6;margin-bottom:10px">${esc(decodeHeadline(r, c))}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px">${tiles}</div>
    ${finRow}${usTargetHtml(r)}${report}`;
}

// 목표가 — stock-context.json 의 targets(국내 KIS)·usTargets(미국 야후). 있는 종목만 객체, 나머지 null.
function targetOf(r) {
  const T = (state.stockContext || {})[r.market === 'US' ? 'usTargets' : 'targets'], t = T && T.byTicker[r.ticker];
  return t && t.status === 'ok' ? t : null;
}
function usTargetHtml(r) {
  const t = r.market === 'US' && targetOf(r); if (!t) return '';
  const td = 'padding:4px 2px;font-size:12px;vertical-align:top';
  const rows = (t.recent || []).map(([d, firm, grade, tp, prior]) => `<tr><td class="muted" style="${td};white-space:nowrap">${d.slice(5)}</td>
    <td style="${td}">${esc(firm)} <span class="muted">${esc(grade || '')}</span></td>
    <td style="${td};text-align:right;white-space:nowrap">${tp == null ? '<span class="muted">미제시</span>' : fmtPrice(tp, 'US')}${prior != null && tp != null && prior !== tp ? `<br><span class="muted">(${fmtPrice(prior, 'US')})</span>` : ''}</td></tr>`).join('');
  const asOf = ((state.stockContext || {}).usTargets || {}).asOf || '';
  return `<details style="margin-top:8px;font-size:12px"><summary>월가 목표가 범위 ${fmtPrice(t.low, 'US')} ~ ${fmtPrice(t.high, 'US')}${rows ? ` · 최근 변경 ${t.recent.length}건` : ''}</summary>
    ${rows ? `<table style="width:100%;margin-top:6px;border-collapse:collapse">${rows}</table>` : ''}
    <div class="muted" style="font-size:11px;margin-top:4px">야후 파이낸스 애널리스트 집계 · ${esc(asOf)} — 맥락용, 점수·매매에 안 쓴다. 괄호는 직전 목표가.</div></details>`;
}

// 지분·이벤트 — Actions stock-events 가 매일 쓰는 docs/data/stock-events.json(DART majorstock·elestock·주요 공시 1년).
// 해독 탭을 처음 열 때 한 번만 받는다. 관찰용.
const EVENT_COLOR = { 수주: '#22c55e', 희석: '#ef4444', 자사주: '#3b82f6', '출자·인수': '#a855f7', '기술·계약': '#14b8a6',
  주주환원: '#0ea5e9', '감자·최대주주': '#f97316', 해명: '#9ca3af' };
function stockEventsHtml(ticker) {
  if (state.stockEvents === undefined) {
    state.stockEvents = 'loading';
    fetch('data/stock-events.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)
      .then(j => { state.stockEvents = j; if (state.detail.open && state.detail.vtab === 'decode') renderStockModal(); });
    return '';
  }
  const v = state.stockEvents && state.stockEvents !== 'loading' && state.stockEvents.items[ticker];
  if (!v) return '';
  const pct = x => x == null ? '-' : x.toFixed(2) + '%';
  const chg = x => x == null ? '<span class="muted">첫 보고</span>' : `<span class="${x > 0 ? 'pos' : x < 0 ? 'neg' : 'muted'}">${x > 0 ? '+' : ''}${x.toFixed(2)}%p</span>`;
  const hist = h => (h || []).map(p => pct(p[1])).join(' → ');
  const ymd = s => s ? `${s.slice(2, 4)}.${s.slice(4, 6)}.${s.slice(6, 8)}` : '';
  const major = v.major.length ? `<table style="font-size:12px;margin:4px 0"><thead><tr><th>보고자</th><th style="text-align:right">보유</th><th style="text-align:right">직전 대비</th><th>흐름</th><th>보고일</th></tr></thead><tbody>${v.major.slice(0, 8).map(m =>
    `<tr${/국민연금/.test(m.who) ? ' style="background:rgba(59,130,246,.12)"' : ''}><td>${esc(m.who)}</td><td style="text-align:right">${pct(m.rate)}</td><td style="text-align:right">${chg(m.chg)}</td><td class="muted">${esc(hist(m.hist))}</td><td class="muted">${ymd(m.date)}</td></tr>`).join('')}</tbody></table>`
    : '<p class="muted" style="font-size:12px">최근 2년 안에 5% 보고가 없습니다.</p>';
  const big = v.bigHolders.length ? `<p style="font-size:12px;margin:4px 0">10% 이상 주주: ${v.bigHolders.slice(0, 4).map(b => `${esc(b.who)} ${pct(b.rate)}${b.first ? ' <span class="muted">(첫 보고)</span>' : ''}`).join(' · ')}</p>` : '';
  const ex = v.execs6m;
  const execLine = ex.n ? `<p class="muted" style="font-size:11px;margin:2px 0">임원 지분 보고 6개월 ${ex.n}건(늘어남 ${ex.up} · 줄어듦 ${ex.down}) — 주식보상과 장내매수가 구분되지 않아 매수 신호로 읽지 않습니다.</p>` : '';
  const cats = {};
  v.events.forEach(e => { cats[e.cat] = (cats[e.cat] || 0) + 1; });
  const chips = Object.entries(cats).map(([c, n]) => `<span style="display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;margin:2px;background:${EVENT_COLOR[c] || '#6b7280'}33;border:1px solid ${EVENT_COLOR[c] || '#6b7280'}">${esc(c)} ${n}</span>`).join('');
  const evList = v.events.slice(0, 12).map(e => `<li style="margin:2px 0"><span class="muted">${ymd(e.d)}</span> <span style="color:${EVENT_COLOR[e.cat] || '#9ca3af'}">[${esc(e.cat)}]</span> <a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${esc(e.rcept)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(e.nm)}</a></li>`).join('');
  return `<div style="margin-top:16px;padding:12px;border:1px solid var(--border);border-radius:10px">
    <h4 style="margin:0 0 4px">🏦 지분·이벤트 <span class="muted" style="font-weight:400;font-size:12px">DART · ${esc((state.stockEvents.updatedAt || '').slice(0, 10))}</span></h4>
    <div style="font-size:12px;font-weight:600;margin-top:6px">누가 들고 있나 — 5% 이상 주주</div>${major}${big}${execLine}
    <div style="font-size:12px;font-weight:600;margin-top:10px">회사가 한 일 — 최근 1년 주요 공시 ${v.events.length}건</div>
    <div style="margin:4px 0">${chips || '<span class="muted" style="font-size:12px">해당 공시 없음</span>'}</div>
    ${evList ? `<details><summary style="cursor:pointer;font-size:12px">최근 공시 목록</summary><ul style="margin:4px 0 0;padding-left:18px;font-size:12px">${evList}</ul></details>` : ''}
    <p class="muted" style="font-size:11px;margin:6px 0 0">지분 API 는 최근 약 2년치만 제공 — 그 안에 보고가 없는 주주(변동 1%p 미만인 국민연금 등)는 빠집니다. 5% 보고는 매매보다 늦게(기관은 다음 달 10일까지) 나옵니다. 관찰용 — 점수·매매에 쓰지 않습니다.</p>
  </div>`;
}

// AI 공시 해독 — Actions decode-gemini 가 새 정기보고서마다 쓰는 docs/data/decode/{ticker}.json.
// 인용은 코드가 DART 원문과 대조해 통과한 것만 있다. 없으면(아직 안 돌았거나 대상 밖) 칸을 조용히 뺀다.
const AI_SECTIONS = { A_사업구조: '사업 구조', A_고객: '고객', A_시장지위: '시장 지위', A_원재료: '원재료', A_주요계약: '주요 계약',
  B_성장동력: '성장 동력 단계', C_전망: '회사 전망', E_위험: '위험' };
function aiDecodeHtml(ticker) {
  state.aiDecode = state.aiDecode || {};
  const d = state.aiDecode[ticker];
  if (d === undefined) {
    state.aiDecode[ticker] = 'loading';
    fetch(`data/decode/${ticker}.json`, { cache: 'no-store' })
      .then(r => r.ok ? r.json() : 'none').catch(() => 'none')
      .then(j => { state.aiDecode[ticker] = j; if (state.detail.open && state.detail.ticker === ticker && state.detail.vtab === 'decode') renderStockModal(); });
    return '';
  }
  if (d === 'loading' || d === 'none' || !d) return '';
  const secs = Object.entries(AI_SECTIONS).map(([k, label]) => {
    const its = (d.items || []).filter(i => i.section === k);
    if (!its.length) return '';
    return `<details style="margin:4px 0"><summary style="cursor:pointer">${label} <span class="muted">${its.length}</span></summary><ul style="margin:4px 0 0;padding-left:18px">${its.map(i =>
      `<li style="margin:4px 0">${i.stage ? `<b>${esc(i.stage)}</b> ` : ''}${esc(i.claim)}<div class="muted" style="font-size:11px;border-left:2px solid var(--border);padding-left:6px;margin-top:2px">“${esc(i.quote)}”</div></li>`).join('')}</ul></details>`;
  }).join('');
  return `<div style="margin-top:16px;padding:12px;border:1px solid var(--border);border-radius:10px">
    <h4 style="margin:0 0 4px">🤖 AI 공시 해독 <span class="muted" style="font-weight:400;font-size:12px">${esc(d.reportNm || '')} · 접수 ${esc(d.rceptDt || '')} · ${esc(d.model || '')}</span></h4>
    <p class="muted" style="font-size:11px;margin:0 0 8px">사람 검토 안 됨. 문장마다 DART 원문 인용을 붙였고, 인용이 원문에 그대로 있는지·숫자가 인용 안에 있는지를 코드가 확인한 것만 남겼습니다(통과 ${d.kept} · 탈락 ${d.dropped}). 점수·매매에 쓰지 않습니다.
      <a href="https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${esc(d.rceptNo)}" target="_blank" rel="noopener">원문 보기</a></p>
    ${d.summary ? `<p style="margin:0 0 6px"><b>${esc(d.summary)}</b></p>` : ''}
    ${(d.insights || []).length ? `<ul style="margin:0 0 8px;padding-left:18px">${d.insights.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
    ${secs}</div>`;
}

function renderDecodeTab(dt) {
  ensureDecodeRefs();
  const results = (state.latest && state.latest.results) || [];
  const r = results.find(x => x.ticker === dt.ticker);
  if (!r) return '<div class="empty" style="padding:20px">이 종목은 스코어링 대상(latest.json)에 없습니다 — 해독할 점수가 없습니다.</div>';
  if (!state.decodeRefs) return '<p class="muted">기준표·근거를 불러오는 중...</p>';
  const c = decodeCompute(r);

  // 차트 1: 점수를 무엇이 만들었나(지표별 기여, 근거 색)
  const scoreBar = c.parts.filter(p => p.pts > 0.05).sort((a, b) => b.pts - a.pts);
  const bar = `<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0">${scoreBar.map(p => `<div title="${esc(p.label)} ${p.pts.toFixed(1)}점" style="width:${(p.pts / c.total * 100).toFixed(1)}%;background:${STATUS_COLOR[p.status]};border-right:1px solid rgba(0,0,0,.25)"></div>`).join('')}</div>`;
  const legend = scoreBar.slice(0, 6).map(p => `<div style="display:flex;justify-content:space-between;font-size:12px;margin:2px 0"><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${STATUS_COLOR[p.status]};margin-right:6px"></span>${esc(p.label)}</span><span class="muted">${p.pts.toFixed(1)}점</span></div>`).join('');
  const chart1 = `<div><h4 style="margin:0 0 2px">점수 ${r.totalScore}점은 무엇이 만들었나</h4>
    <div class="muted" style="font-size:11px">막대 길이 = 그 지표가 총점에 보탠 점수 · <span style="color:#22c55e">■</span> 우리 연구에서 검증 <span style="color:#9ca3af">■</span> 미검증·약함 <span style="color:#ef4444">■</span> 기각${r.market !== 'KR' ? ' (미국은 전부 미검증)' : ''}</div>${bar}${legend}</div>`;

  // 차트 2: 업종·테마 흐름(시장 대비)
  const W = ['1w', '1m', '3m', '6m'], WL = { '1w': '1주', '1m': '1개월', '3m': '3개월', '6m': '6개월' };
  const grp = (name, st) => `<div style="margin-bottom:8px"><div style="font-size:12px;margin-bottom:2px"><strong>${esc(name)}</strong> <span class="muted">(${st.n}종목 · 20일선 위 ${st.breadth20 != null ? Math.round(st.breadth20 * 100) + '%' : '-'})</span></div>${decodeBars(W.map(k => ({ label: WL[k], v: st.rs[k] })))}</div>`;
  const chart2 = r.market !== 'KR' ? '' : `<div><h4 style="margin:0 0 2px">업종·테마 흐름 (시장 대비)</h4><div class="muted" style="font-size:11px">그룹 종목 중앙값 − 추천범위 전체 중앙값 · 기준 ${esc((state.sectorStrength && state.sectorStrength.asOf) || '-')}</div>
    ${c.theme ? grp('테마 ' + c.theme.name, c.theme.st) : ''}${c.sector ? grp('업종 ' + c.sector.group, c.sector) : ''}${!c.theme && !c.sector ? '<p class="muted">업종·테마 소속 정보 없음(업종은 다음 일일 분석 뒤 표시)</p>' : ''}
    ${c.sector && c.sector.capTop && c.sector.capTopWeight >= 0.49 ? `<p class="muted" style="font-size:11px">업종 시총의 ${Math.round(c.sector.capTopWeight * 100)}%가 ${esc(c.sector.capTop.name)} — 업종 수치를 산업 전체로 읽지 말 것</p>` : ''}</div>`;

  // 차트 3: 수급
  const chart3 = r.market !== 'KR' || !c.flows || !c.flows.length ? '' : `<div><h4 style="margin:0 0 2px">누가 사고 있나 (20거래일 누적)</h4>${decodeFlowSvg(c.flows)}</div>`;

  return `<div style="font-size:13px">${decodeSummaryHtml(r, c)}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:14px">${chart1}${chart2}${chart3}</div>
    ${r.market === 'KR' ? stockEventsHtml(dt.ticker) + aiDecodeHtml(dt.ticker) : ''}
    <details style="margin-top:14px"><summary style="cursor:pointer">자세히 보기 — 지표별 점수·연구 근거·공시 목록</summary>${renderDecodeDetails(dt)}</details>
    <p class="muted" style="font-size:11px;margin-top:10px">판정은 모두 정해진 규칙으로 만든다(같은 데이터면 같은 문장). 매수·매도 신호가 아니며 점수·추천·매매를 바꾸지 않는다.</p></div>`;
}

// 자세히 보기(v0 표) — 요약 아래 접힌 영역
function renderDecodeDetails(dt) {
  ensureDecodeRefs();
  const results = (state.latest && state.latest.results) || [];
  const r = results.find(x => x.ticker === dt.ticker);
  if (!r) return '<div class="empty" style="padding:20px">이 종목은 스코어링 대상(latest.json)에 없습니다 — 해독할 점수가 없습니다.</div>';
  const refs = state.decodeRefs;
  const crit = refs && refs.criteria[r.market] && refs.criteria[r.market].data;
  const critVer = refs && refs.criteria[r.market] ? `${r.market}-${refs.criteria[r.market].version}` : '(불러오는 중)';
  // 근거 표는 국내 연구 결과다 — 미국 종목에 붙이면 검증 범위 밖 일반화가 된다(표시하지 않는다)
  const ev = r.market === 'KR' ? ((refs && refs.evidence && refs.evidence.factors) || {}) : {};
  const evBase = (refs && refs.evidence && refs.evidence.base) || '';
  const asOf = (state.latest.updatedAt || '').slice(0, 16).replace('T', ' ');

  // ① 점수 해부
  const ov = crit && r.sectorType && r.sectorType !== 'general' && crit.sectorOverrides ? crit.sectorOverrides[r.sectorType] : null;
  const weights = (ov && ov.categoryWeights) || (crit && crit.categoryWeights) || {};
  let wsum = 0, wacc = 0;
  const catRows = DECODE_CATS.map(([k, label]) => {
    const b = (r.breakdown || {})[k];
    const cov = ((r.dataCoverage || {}).byCategory || {})[k];
    const w = weights[k];
    if (b && b.score !== null && b.score !== undefined && w) { wsum += w; wacc += b.score * w; }
    return `<tr><td>${label}</td><td>${b && b.score != null ? b.score : '<span class="muted">결측</span>'}</td><td>${w != null ? Math.round(w * 100) + '%' : '-'}</td>
      <td>${cov ? `${cov.valid}/${cov.total}` : '-'}</td></tr>`;
  }).join('');
  const recomputed = wsum ? Math.round(wacc / wsum * 10) / 10 : null;
  const check = recomputed === null ? '' : Math.abs(recomputed - r.totalScore) <= 0.5
    ? `<span class="muted">검산: 범주 점수 × 가중치 = ${recomputed} (일치)</span>`
    : `<span class="neg">검산 불일치: 단순 가중합 ${recomputed} ≠ 총점 ${r.totalScore} — 엔진이 추가 보정을 한다(원인 미확인)</span>`;
  const factorRows = DECODE_CATS.map(([k, label]) => {
    const det = ((r.breakdown || {})[k] || {}).detail || {};
    const metricDefs = crit && crit[k] ? (crit[k].metrics || crit[k].indicators || {}) : {};
    return Object.entries(det).map(([fk, d]) => {
      const e = ev[fk];
      const badge = e ? `<span class="${EVIDENCE_BADGE[e.status][1]}">${EVIDENCE_BADGE[e.status][0]}</span>` : `<span class="muted">${r.market === 'KR' ? '근거 표 없음' : '미국 미검증'}</span>`;
      const fw = metricDefs[fk] && metricDefs[fk].weight != null ? Math.round(metricDefs[fk].weight * 100) + '%' : '';
      const score = d.score === null || d.score === undefined ? '<span class="muted">결측(분모 제외)</span>' : Math.round(d.score * 10) / 10;
      return `<tr><td class="muted">${label}</td><td>${esc(d.label || fk)}</td><td>${fmtRaw(d)}</td><td>${score}</td><td class="muted">${fw}</td><td>${badge}</td></tr>`;
    }).join('');
  }).join('');
  const cov = r.dataCoverage || {};
  const minCov = crit ? crit.minimumDataCoverage : null;
  const warns = (r.warnings || []).map(w => `<li>${esc(typeof w === 'string' ? w : (w.label || w.message || JSON.stringify(w)))}</li>`).join('');
  const cautions = ov && ov.cautions ? `<div style="margin-top:6px"><strong>업종 보정(${esc(ov.label || r.sectorType)}) 주의</strong><ul style="margin:4px 0;padding-left:18px">${ov.cautions.map(c => `<li class="muted">${esc(c)}</li>`).join('')}</ul></div>` : '';
  const sec1 = decodeSection('① 왜 이 점수인가', `기준 ${esc(critVer)} · 채점 ${esc(asOf)} · 출처 latest.json(스코어링 엔진) · 결측 지표는 0점이 아니라 분모에서 뺀다(절대 규칙 1)`,
    `<div><strong style="font-size:18px">${r.totalScore}</strong> <span class="muted">${esc(r.grade || '')}</span> · 데이터 커버리지 ${Math.round((cov.overall || 0) * 100)}%${minCov ? ` (기준 ${Math.round(minCov * 100)}% 미만이면 등급 '유보')` : ''} · ${check}</div>
     <div class="table-wrap"><table><thead><tr><th>범주</th><th>범주 점수</th><th>가중치</th><th>유효 지표</th></tr></thead><tbody>${catRows}</tbody></table></div>
     <div class="table-wrap" style="margin-top:6px"><table><thead><tr><th></th><th>지표</th><th>원값</th><th>점수</th><th>지표 가중</th><th>연구 근거 ②</th></tr></thead><tbody>${factorRows}</tbody></table></div>
     ${warns ? `<div style="margin-top:6px"><strong>경고</strong><ul style="margin:4px 0;padding-left:18px">${warns}</ul></div>` : ''}${cautions}`);

  // ② 연구 근거 상세
  const used = new Set(DECODE_CATS.flatMap(([k]) => Object.keys(((r.breakdown || {})[k] || {}).detail || {})));
  const evRows = [...used].filter(k => ev[k]).map(k => {
    const e = ev[k];
    const links = e.files.map(f => `<a href="${esc(evBase + f)}" target="_blank" rel="noopener">${esc(f.replace(/\.md$/, ''))}</a>`).join(' · ');
    return `<li><strong>${esc(k)}</strong> <span class="${EVIDENCE_BADGE[e.status][1]}">${EVIDENCE_BADGE[e.status][0]}</span> — ${esc(e.summary)}${links ? `<br><span class="muted" style="font-size:11px">${links}</span>` : ''}</li>`;
  }).join('');
  const sec2 = decodeSection('② 이 점수의 근거는 검증됐나', `출처 docs/factor-evidence.json(${esc((refs && refs.evidence && refs.evidence.updated) || '-')} 갱신) · 국내 백테스트 결과이며 그 기간·방식 밖으로 일반화하지 않는다`,
    r.market !== 'KR' ? '<p class="muted">우리 연구 결과는 국내 표본이다 — 미국 종목의 팩터는 검증한 적이 없다(미국 PIT 재검증 준비 중).</p>'
      : evRows ? `<ul style="margin:0;padding-left:18px">${evRows}</ul>` : '<p class="muted">불러오는 중...</p>');

  // ⑤ 업종·테마 상태 — 측정값 우선
  let sec5 = '';
  if (r.market === 'KR') {
    const ss = state.sectorStrength, ts = state.themeStrength;
    const pctv = v => v == null ? '-' : pctCell(Math.round(v * 1000) / 10);
    const W = ['1w', '1m', '3m', '6m'];
    const g = ss && (ss.groups || []).find(x => (x.tickers || []).includes(r.ticker));
    const cells = st => W.map(k => `<td>${pctv(st.ret[k])}<br><span class="muted" style="font-size:11px">시장 대비 ${pctv(st.rs[k])}</span></td>`).join('');
    const br = st => `${st.breadth20 != null ? Math.round(st.breadth20 * 100) + '%' : '-'} / ${st.breadth60 != null ? Math.round(st.breadth60 * 100) + '%' : '-'}`;
    const secRow = g ? `<tr><td>업종 <strong>${esc(g.group)}</strong> (${g.n}종목)</td>${cells(g)}<td>${br(g)}</td><td>${esc(g.quadrant || '-')}</td></tr>` : '';
    const themes = [];
    for (const node of ((ts && ts.tree) || [])) for (const sub of (node.subs || [])) {
      const m = (sub.members || []).find(x => x.t === r.ticker);
      if (m && sub.stats) themes.push({ node, sub, m });
    }
    const thRows = themes.map(({ node, sub, m }) => `<tr><td>테마 <strong>${esc(node.theme)} › ${esc(sub.theme)}</strong> (${sub.stats.n}종목${m.primary ? '' : ' · 부 테마'})</td>${cells(sub.stats)}<td>${br(sub.stats)}</td><td>${esc(sub.stats.quadrant || '-')}</td></tr>`).join('');
    const top = g && g.capTop && g.capTopWeight >= 0.49 ? `<p class="muted" style="font-size:11px">이 업종 시총의 ${Math.round(g.capTopWeight * 100)}%가 ${esc(g.capTop.name)} 한 종목 — 수익률은 종목 중앙값이라 영향은 작지만 업종 해석 시 주의.</p>` : '';
    const noTickers = ss && ss.groups && ss.groups.length && !ss.groups[0].tickers;
    sec5 = decodeSection('⑤ 업종·테마 상태', `기준 ${esc((ss && ss.asOf) || '-')} · 수익률 = 그룹 종목 중앙값, 시장 대비 = 그룹 − 추천범위 전체 중앙값 · 상승비율 = 20일/60일선 위 종목 비율 · 사분면은 규칙(3개월 상대강도 × 가속 = 1개월−3개월 상대강도)으로 붙인 이름일 뿐 — 측정값을 본다. 관찰용`,
      (secRow || thRows) ? `<div class="table-wrap"><table><thead><tr><th>그룹</th><th>1주</th><th>1개월</th><th>3개월</th><th>6개월</th><th>상승비율 20/60일</th><th>사분면(규칙)</th></tr></thead><tbody>${secRow}${thRows}</tbody></table></div>${top}`
        : `<p class="muted">업종·테마 소속 정보가 없습니다${noTickers ? '(업종 파일에 종목 목록이 아직 없음 — 다음 일일 분석 뒤 표시)' : ''}.</p>`);
  }

  // ⑥ 재무·이익의 질 — 원값만
  const f = ((r.breakdown || {}).fundamental || {}).detail || {};
  const fin = Object.entries(f).map(([k, d]) => `<li>${esc(d.label || k)}: <strong>${fmtRaw(d)}</strong></li>`).join('');
  const sec6 = decodeSection('⑥ 재무·이익의 질', '출처 latest.json 재무 원값(스코어링 입력) · 현금흐름·일회성 이익 구분은 v0 에 없다(데이터 미연결)', fin ? `<ul style="margin:0;padding-left:18px">${fin}</ul>` : '<p class="muted">재무 데이터 없음</p>');

  // ⑦ PBR 비교값 — 저평가 판정 아님
  const pbrOf = x => { const d = (((x.breakdown || {}).valuation || {}).detail || {}).pbr; return d && typeof d.raw === 'number' && d.raw > 0 ? d.raw : null; };
  const mine = pbrOf(r);
  let sec7 = '';
  if (mine != null) {
    const pool = results.filter(x => x.market === r.market && pbrOf(x) != null).map(pbrOf).sort((a, b) => a - b);
    const below = pool.filter(v => v < mine).length;
    const g = state.sectorStrength && (state.sectorStrength.groups || []).find(x => (x.tickers || []).includes(r.ticker));
    let inSec = '';
    if (g) {
      const sp = results.filter(x => g.tickers.includes(x.ticker) && pbrOf(x) != null).map(pbrOf);
      inSec = ` · 같은 업종(${esc(g.group)}) ${sp.length}종목 중 낮은 쪽에서 ${sp.filter(v => v < mine).length + 1}번째`;
    }
    sec7 = decodeSection('⑦ PBR 비교값', `출처 latest.json · 비교 대상 = 추천범위(${r.market}) 중 PBR>0 인 ${pool.length}종목 · <strong>비교값일 뿐 '저평가' 판정이 아니다</strong> — ② 의 PBR 항목(조건부 검증 · 자기 과거 PBR 밴드 기각) 참고`,
      `<p style="margin:0">PBR <strong>${mine.toFixed(2)}</strong>배 · 전체 ${pool.length}종목 중 낮은 쪽에서 ${below + 1}번째(하위 ${Math.round((below + 1) / pool.length * 100)}%)${inSec}</p>`);
  }

  // ⑧ 수급 — 수급 탭과 같은 데이터
  let sec8 = '';
  if (r.market === 'KR') {
    ensureFlows();
    const rows = state.flows && (state.flows.byTicker || {})[r.ticker];
    const sum = (k, n) => rows.slice(-n).reduce((a, x) => a + (x[k] || 0), 0);
    const eokFmt = v => `${v >= 0 ? '+' : ''}${(v / 1e8).toFixed(0)}억`;
    sec8 = decodeSection('⑧ 수급', `출처 수급 탭과 같은 데이터(네이버, 수량×종가 금액 근사) · 수급 범주 가중치 ${weights.supplyDemand != null ? Math.round(weights.supplyDemand * 100) + '%' : '-'}`,
      !state.flows ? '<p class="muted">불러오는 중...</p>' : !rows || !rows.length ? '<p class="muted">수급 데이터 없음</p>'
        : `<p style="margin:0">외국인 5일 ${eokFmt(sum('foreign', 5))} · 20일 ${eokFmt(sum('foreign', 20))} / 기관 5일 ${eokFmt(sum('institution', 5))} · 20일 ${eokFmt(sum('institution', 20))} <span class="muted">(최근 ${rows.length}거래일 데이터)</span></p>`);
  }

  // ⑨ 일정·최근 공시
  const evs = ((state.events && state.events.events) || []).filter(e => e.code === r.ticker);
  const disc = ((state.disclosures && state.disclosures.items) || []).filter(d => d.ticker === r.ticker).slice(0, 8);
  const evHtml = evs.length ? evs.map(e => `<li>${esc(e.date)} ${esc(e.title)} <span class="muted">(${e.status === 'yahoo' ? (e.confirmedBy ? 'Nasdaq 확인' : 'Yahoo 예상') : esc(e.status)})</span></li>`).join('') : '<li class="muted">앞으로 90일 안 수집된 일정 없음(없다는 뜻은 아님)</li>';
  const discHtml = disc.length ? disc.map(d => `<li>${esc(d.rceptDt)} <a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(String(d.reportNm).replace(/\s+/g, ' '))}</a></li>`).join('') : '<li class="muted">최근 공시 목록(공시 탭 범위) 안에 없음</li>';
  const sec9 = decodeSection('⑨ 일정·최근 공시', `출처 events.json(${esc((state.events && state.events.asOf) || '-')}) · disclosures.json(${esc(((state.disclosures && state.disclosures.range) || {}).bgnDe || '-')}~)`,
    `<ul style="margin:0 0 6px;padding-left:18px">${evHtml}</ul><ul style="margin:0;padding-left:18px">${discHtml}</ul>`);

  return `<div style="font-size:13px">${sec1}${sec2}${sec5}${sec6}${sec7}${sec8}${sec9}
    <p class="muted" style="font-size:11px;margin-top:10px">기업 해독 v0 — 자동 데이터만 쓴다. 사업 구조·성장 동력·약세 시나리오 같은 정성 분석은 아직 없다(v1). 이 화면은 점수·추천·매매를 바꾸지 않는다.</p></div>`;
}

function renderChartTab(dt, dailyBars, n, rec) {
  const isUS = dt.market === 'US';
  if (isUS && dt.intraday) dt.intraday = false;  // KIS 분봉조회(FHKST03010230)는 국내주식 전용 - US는 강제로 일봉으로

  let bodyHtml, note;
  if (dt.intraday) {
    const rawOrNull = getHistoricalBars(dt.ticker, kstYmd().replace(/-/g, ''));
    const bars = aggregateBars(rawOrNull || [], Number(dt.tf.replace('m', '')));
    bodyHtml = detailChartSvg(bars, 680, dt.type, state.detail);
    note = rawOrNull === null ? '불러오는 중...' : `${dt.tf} 분봉 · ${bars.length}개 · KIS 스냅샷(요청 시점까지, 실시간 갱신 아님)`;
  } else {
    const rangeN = dt.range >= 9999 ? n : Math.min(dt.range, n);
    const sliced = dailyBars.slice(n - rangeN);
    bodyHtml = detailChartSvg(sliced, 680, dt.type, state.detail);
    note = `일봉 ${sliced.length}개`;
  }

  const retsHtml = [['1일', 1], ['1주', 5], ['1개월', 20], ['3개월', 60], ['6개월', 120], ['1년', 250]]
    .map(([lb, k]) => retChip(lb, retN(rec.c, k))).join('') + retChip('YTD', retYTD(rec.c, rec.d));

  // 1D(분)을 먼저 눌러야 분봉 버튼이 나오던 2단계 구조를 없애고 분봉·기간
  // 버튼을 한 줄에 같이 둔다 - 아무거나 바로 눌러서 전환.
  const tfBtns = isUS ? '' : ['1m', '5m', '15m', '60m'].map(tf =>
    `<button data-detail-tf="${tf}" class="chip ${dt.intraday && dt.tf === tf ? 'active' : ''}">${tf.replace('m', '분')}</button>`).join('');
  const rangeBtns = [['1M', 20], ['3M', 60], ['6M', 120], ['1Y', 250], ['전체', 9999]]
    .map(([lb, v]) => `<button data-detail-range="${v}" class="chip ${!dt.intraday && (v === 9999 ? dt.range >= n : dt.range === Math.min(v, n)) ? 'active' : ''}">${lb}</button>`).join('');
  const typeBtns = ['candle', 'line'].map(t => `<button data-detail-type="${t}" class="chip ${dt.type === t ? 'active' : ''}">${t === 'candle' ? '캔들' : '라인'}</button>`).join('');

  return `
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${retsHtml}</div>
    <div class="group-filter" style="margin-bottom:6px">${tfBtns}${rangeBtns}</div>
    <div class="group-filter" style="margin-bottom:12px">${typeBtns}</div>
    <div class="muted" style="font-size:12px;margin-bottom:4px">${esc(note)}</div>
    <div class="table-wrap">${bodyHtml}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${badgesFor(dailyBars)}</div>
    <p class="muted" style="font-size:11px;margin-top:10px">차트 위에 커서를 올리면(모바일은 탭) 그 봉의 날짜·시고저종·거래량이 표시됩니다. 기간 등락률은 거래일 기준(주=5·월=20·년=250 거래일). MA/볼린저/RSI/52주 지표는 참고용이며 투자 자문이 아닙니다.</p>`;
}

function renderFlowsTab(dt) {
  if (dt.market === 'US') return '<div class="empty" style="padding:30px;text-align:center">미국 종목은 이 수급 데이터를 제공하지 않습니다(KR 전용).</div>';
  ensureFlows();
  if (!state.flows) return '<div class="empty" style="padding:30px;text-align:center">불러오는 중...</div>';
  const rows = (state.flows.byTicker || {})[dt.ticker] || [];
  if (!rows.length) return '<div class="empty" style="padding:30px;text-align:center">수급 데이터가 없습니다.</div>';
  const dateLabels = rows.map(r => r.date.slice(5).replace('-', '/'));
  const seriesRows = [['foreign', '외국인'], ['institution', '기관'], ['individual', '개인']]
    .map(([k, label]) => investorTrendRow(label, rows.map(r => r[k] || 0), dateLabels)).join('');
  return `
    <p class="muted" style="font-size:12px;margin-bottom:10px">개인/외국인/기관 순매수(금액 근사 - 수량×종가) · 최근 ${rows.length}거래일 · ${esc(rows[0].date)}~${esc(rows[rows.length - 1].date)} · 우측=기간합계</p>
    <div style="margin-top:10px">${seriesRows}</div>
    <p class="muted" style="font-size:11px;margin-top:8px">네이버 모바일 API 기준(로그인 불요) - 수량×종가로 금액을 근사한 참고용 수치이며, 그날 실제 체결가 가중평균과는 다를 수 있습니다.</p>`;
}

// ---------- ETF 탭 ----------

function etfTh(key, label) {
  const on = state.etfSortKey === key;
  const arr = on ? (state.etfSortDir === 'asc' ? '▲' : '▼') : '⇅';
  return `<th class="sortable" data-etf-sort="${key}">${label} <span class="arr">${arr}</span></th>`;
}

// 자산군은 종목명 키워드로 분류(KRX API가 정형 카테고리를 안 줌) - build-etf-
// returns.py의 classify_asset()/classify_sub()와 순서·의미 동일(같은 실측 검증).
const ETF_ASSETCLASS_ORDER = ['국내주식', '해외주식', '채권', '원자재', '통화', '리츠·부동산', '혼합자산'];
const ETF_SUBCLASS_ORDER = {
  '해외주식': ['S&P500', '나스닥100', '미국관련', '그외국가'],
  '채권': ['한국국채', '미국국채', '회사채', '채권혼합형(자산배분·구조화)', '기타채권'],
  '국내주식': ['코스피·코스닥(지수)', '반도체', '2차전지', 'AI', '배당', '단일종목(개별주식형)', 'TDF(자산배분)', '기타테마'],
};

function renderEtf() {
  const d = state.etfReturns;
  if (!d || !d.rows || d.rows.length === 0) return '<div class="card empty">아직 ETF 수익률 데이터가 없습니다. Actions가 처음 실행된 후 표시됩니다.</div>';
  const all = d.rows;
  const distByCode = {};
  ((state.etfDist && state.etfDist.rows) || []).forEach(r => { distByCode[r.code] = r; });

  const assetChip = (val, label) => {
    const cnt = val === 'all' ? all.length : all.filter(r => r.assetClass === val).length;
    return `<button data-etf-asset="${esc(val)}" class="chip ${state.etfAssetClass === val ? 'active' : ''}" style="font-size:14px;padding:8px 18px">${esc(label)}<span class="cnt">${cnt}</span></button>`;
  };
  const assetBanner = ['all', ...ETF_ASSETCLASS_ORDER].map(v => assetChip(v, v === 'all' ? '전체' : v)).join('');

  const subOptions = ETF_SUBCLASS_ORDER[state.etfAssetClass] || null;
  let subBanner = '';
  if (subOptions) {
    const inAsset = all.filter(r => r.assetClass === state.etfAssetClass);
    const subChip = (val, label) => {
      const cnt = val === 'all' ? inAsset.length : inAsset.filter(r => r.subClass === val).length;
      return `<button data-etf-sub="${esc(val)}" class="chip ${state.etfSubClass === val ? 'active' : ''}">${esc(label)}<span class="cnt">${cnt}</span></button>`;
    };
    subBanner = `<div class="filter-row">${['all', ...subOptions].map(v => subChip(v, v === 'all' ? '전체' : v)).join('')}</div>`;
  }

  const q = state.etfSearch.trim().toLowerCase();
  const filtered = all.filter(r => {
    if (state.etfAssetClass !== 'all' && r.assetClass !== state.etfAssetClass) return false;
    if (subOptions && state.etfSubClass !== 'all' && r.subClass !== state.etfSubClass) return false;
    if (q && !(String(r.name).toLowerCase().includes(q) || String(r.code).toLowerCase().includes(q))) return false;
    return true;
  });

  const k = state.etfSortKey, dir = state.etfSortDir === 'asc' ? 1 : -1;
  const val = (r) => {
    if (k === 'name') return r.name || '';
    if (k === 'price') return r.price ?? -Infinity;
    if (k === 'distRate' || k === 'distCnt') {
      const dist = distByCode[r.code];
      const v = dist && (k === 'distRate' ? dist.annualDistRatePct : dist.distCountPerYear);
      return v === null || v === undefined ? -Infinity : v;
    }
    const c = (r.changes || {})[k];
    return c === null || c === undefined ? -Infinity : c;
  };
  const rows = [...filtered].sort((a, b) => {
    const x = val(a), y = val(b);
    if (typeof x === 'string') return x.localeCompare(y, 'ko') * dir;
    return (x - y) * dir;
  });

  const lim = limited('etf', [state.etfAssetClass, state.etfSubClass, state.etfSearch, state.etfSortKey, state.etfSortDir].join('|'), rows);
  const body = lim.shown.map(r => {
    const c = r.changes || {};
    const dist = distByCode[r.code];
    return `<tr>
      <td><strong class="etf-pick" data-etf-pick="${esc(r.code)}" title="동일 지수 비교·비슷한 ETF 보기">${esc(r.name)}</strong> <span class="muted">${esc(r.code)}</span></td>
      <td>${fmtPrice(r.price, 'KR')}</td>
      <td>${pctCell(c.d1)}</td>
      <td>${pctCell(c.d7)}</td>
      <td>${pctCell(c.d30)}</td>
      <td>${pctCell(c.d90)}</td>
      <td>${pctCell(c.d180)}</td>
      <td>${pctCell(c.d365)}</td>
      <td>${dist ? pctCell(dist.annualDistRatePct) : '<span class="muted">-</span>'}</td>
      <td>${dist && dist.distCountPerYear != null ? `${dist.distCountPerYear}회${dist.monthlyPay ? ' (월)' : ''}` : '<span class="muted">-</span>'}</td>
    </tr>`;
  }).join('');

  return `${renderEtfCompare()}<div class="card">
    <div class="group-filter" style="margin-bottom:10px">${assetBanner}</div>
    ${subBanner}
    <div class="toolbar" style="margin-top:10px">
      <input class="search" id="etfSearch" placeholder="ETF명·코드 검색" value="${esc(state.etfSearch)}">
      <span class="muted">${rows.length} / ${all.length}개</span>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>
        ${etfTh('name', '종목')}${etfTh('price', '현재가')}${etfTh('d1', '1일')}${etfTh('d7', '1주')}${etfTh('d30', '1개월')}${etfTh('d90', '3개월')}${etfTh('d180', '6개월')}${etfTh('d365', '1년')}${etfTh('distRate', '연분배율')}${etfTh('distCnt', '분배횟수')}
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>${lim.more}
    <p class="muted" style="margin-top:8px">기준일 ${esc(d.asOf || '-')} · 국내 상장 ETF(현재 상장분만) · 컬럼 클릭으로 정렬
      <span style="cursor:help" title="수익률은 캘린더일 기준(휴장일은 직전 거래일 값 대체). 분배율/분배횟수는 FunETF 공개 데이터(${esc((state.etfDist && state.etfDist.generatedAtKST || '').slice(0, 10)) || '-'} 기준, 최근 12개월 내 분배 이력이 있는 종목만·연환산 단리 기준)이며 분배 안 하는 ETF는 '-'입니다.">ⓘ</span></p>
  </div>`;
}

// 다가오는 일정 D-day — scripts/build-events.py. 관찰용. 목록에 없다고 일정이 없는 게 아니다(출처가 모를 뿐)
function renderEvents() {
  const d = state.events;
  if (!d || !d.events) return '<div class="card empty">일정 데이터가 아직 없습니다(events.json 첫 생성 전).</div>';
  const kst = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' })); kst.setHours(0, 0, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  const todayStr = `${kst.getFullYear()}-${pad(kst.getMonth() + 1)}-${pad(kst.getDate())}`;
  const dday = s => Math.round((new Date(s + 'T00:00:00') - kst) / 864e5);
  const pass = e => {
    const sc = state.eventsScope;
    if (sc === 'all') return true;
    if (sc === 'macro') return e.scope === 'macro';
    if (sc === 'kr') return e.market === 'KR';
    if (sc === 'us') return e.market === 'US';
    return e.scope === 'held' || e.scope === 'macro' || e.market === 'KR';   // key: 보유 + 거시 + 국내
  };
  const list = d.events.filter(e => dday(e.date) >= 0 && pass(e));
  const byDate = {};
  list.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));

  // 월 범위: 오늘이 속한 달 ~ 일정이 있는 마지막 달
  const minM = todayStr.slice(0, 7);
  const lastDate = d.events.map(e => e.date).sort().pop() || todayStr;
  const maxM = lastDate.slice(0, 7) > minM ? lastDate.slice(0, 7) : minM;
  let month = state.eventsMonth || minM;
  if (month < minM) month = minM;
  if (month > maxM) month = maxM;
  const shiftM = (m, k) => { const [y, mo] = m.split('-').map(Number); const t = new Date(y, mo - 1 + k, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; };
  const [Y, M] = month.split('-').map(Number);

  const kindIcon = { earnings: '📊', exdiv: '💰', fomc: '🇺🇸', bok: '🇰🇷', expiry: '⏳' };
  // 칸에는 요약만 둔다 — 거시 일정은 아이콘, 보유종목은 📌, 나머지(실적·배당)는 건수 하나. 73건짜리 날도 같은 높이를 유지한다.
  const badges = evs => {
    const macro = ['fomc', 'bok', 'expiry'].filter(k => evs.some(e => e.kind === k)).map(k => kindIcon[k]).join('');
    const held = evs.some(e => e.scope === 'held') ? '📌' : '';
    const ne = evs.filter(e => e.kind === 'earnings').length, nx = evs.filter(e => e.kind === 'exdiv').length;
    return `${macro + held ? `<span class="cal-b">${macro}${held}</span>` : ''}${ne ? `<span class="cal-b muted">📊${ne}</span>` : ''}${nx ? `<span class="cal-b muted">💰${nx}</span>` : ''}`;
  };

  const monthDates = Object.keys(byDate).filter(x => x.slice(0, 7) === month).sort();
  let sel = state.eventsDay && byDate[state.eventsDay] && state.eventsDay.slice(0, 7) === month ? state.eventsDay : null;
  if (!sel) sel = monthDates.find(x => x >= todayStr) || monthDates[0] || null;

  const dow = ['일', '월', '화', '수', '목', '금', '토'];
  const startDow = new Date(Y, M - 1, 1).getDay(), daysIn = new Date(Y, M, 0).getDate();
  let cells = dow.map(x => `<div class="cal-h">${x}</div>`).join('');
  for (let i = 0; i < Math.ceil((startDow + daysIn) / 7) * 7; i++) {
    const day = i - startDow + 1;
    if (day < 1 || day > daysIn) { cells += '<div class="cal-c out"></div>'; continue; }
    const ds = `${Y}-${pad(M)}-${pad(day)}`, evs = byDate[ds];
    cells += `<div class="cal-c${ds === todayStr ? ' today' : ''}${ds === sel ? ' sel' : ''}${evs ? '' : ' empty'}"${evs ? ` data-events-day="${ds}"` : ''}><span class="cal-d">${day}</span>${evs ? badges(evs) : ''}</div>`;
  }
  // 좁은 화면에서는 7열 달력 대신 일정 있는 날만 한 줄씩
  const agenda = monthDates.map(ds => {
    const n = dday(ds), w = dow[new Date(ds + 'T00:00:00').getDay()];
    return `<div class="cal-ag${ds === sel ? ' sel' : ''}" data-events-day="${ds}"><span><b>${ds.slice(5, 7)}/${ds.slice(8, 10)}</b> (${w}) <span class="${n <= 3 ? 'neg' : 'muted'}">${n === 0 ? '오늘' : 'D-' + n}</span></span><span>${badges(byDate[ds])}</span></div>`;
  }).join('');

  const statusBadge = e => e.status === 'official' ? '<span class="muted">공식</span>'
    : e.status === 'rule' ? '<span class="muted">규칙</span>'
    : e.status === 'range' ? `<span class="muted">미정(${esc(e.date)}~${esc(e.dateEnd)})</span>`
    : e.confirmedBy === 'nasdaq' ? '<span class="muted">Nasdaq 확인</span>' : '<span class="muted">Yahoo 예상</span>';
  let detail = '';
  if (sel) {
    const rows = byDate[sel].map(e => {
      const who = e.code ? `<span data-chart="${esc(e.code)}" data-chart-name="${esc(e.name)}" style="cursor:pointer">${e.scope === 'held' ? '📌 ' : ''}<strong>${esc(e.name)}</strong></span> <span class="muted">${esc(e.code)}</span>` : '';
      return `<tr><td>${kindIcon[e.kind] || ''} ${esc(e.title)}</td><td>${who}</td><td>${statusBadge(e)}</td><td class="muted">${esc(e.note || '')}</td></tr>`;
    });
    const lim = limited('evday', sel + '|' + state.eventsScope, rows);
    const n = dday(sel);
    detail = `<div style="margin-top:12px"><strong>${esc(sel)}</strong> <span class="${n <= 3 ? 'neg' : 'muted'}">${n === 0 ? '오늘' : 'D-' + n}</span> <span class="muted">· ${rows.length}건</span></div>
      <div class="table-wrap"><table><tbody>${lim.shown.join('')}</tbody></table></div>${lim.more}`;
  }

  const chip = (v, label) => `<button data-events-scope="${v}" class="chip ${state.eventsScope === v ? 'active' : ''}">${label}</button>`;
  const navBtn = (m, label, ok) => `<button class="chip"${ok ? ` data-events-month="${m}"` : ' disabled style="opacity:.35;cursor:default"'}>${label}</button>`;
  const warn = (d.warnings || []).map(w => `<p class="neg">⚠ ${esc(w)}</p>`).join('');
  return `<div class="card">
    <div class="filter-row">${chip('key', '핵심(보유·거시·국내)')}${chip('macro', '거시')}${chip('kr', '국내')}${chip('us', '미국')}${chip('all', '전체')}</div>
    ${warn}
    <div style="display:flex;align-items:center;gap:10px;margin:10px 0 4px">${navBtn(shiftM(month, -1), '‹', month > minM)}<strong style="font-size:16px;white-space:nowrap">${Y}년 ${M}월</strong>${navBtn(shiftM(month, 1), '›', month < maxM)}</div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">🇺🇸 FOMC · 🇰🇷 금통위 · ⏳ 옵션 만기 · 📌 보유 · 📊 실적 · 💰 배당락</div>
    ${monthDates.length ? '' : '<p class="muted">이 달에 표시할 일정이 없습니다.</p>'}
    <div class="cal-grid">${cells}</div>
    <div class="cal-agenda">${agenda}</div>
    ${detail}
    <p class="muted" style="margin-top:8px">기준 ${esc(d.asOf)} · 앞으로 ${d.horizonDays}일 · 관심종목 ${d.counts.watchlist}개 조회(실패 ${d.counts.yahooFail}) · <strong>목록에 없다고 일정이 없는 것은 아닙니다</strong> · 관찰용
      <span style="cursor:help" title="실적·배당락은 Yahoo 기준이며 확정 여부를 Yahoo 가 알려주지 않습니다. 미국은 Nasdaq 실적 캘린더에 같은 날 있으면 'Nasdaq 확인'. 국내는 Yahoo 가 다루는 대형주만 나옵니다. FOMC·금통위는 공식 페이지에서 옮긴 값, 옵션 만기는 규칙 계산(휴장이면 직전 영업일)입니다.">ⓘ</span></p>
  </div>`;
}

// ETF 동일 지수 비교 패널 — scripts/build-etf-compare.py. 관찰·선택용(점수·추천에 안 쓴다)
function renderEtfCompare() {
  const cmp = state.etfCompare, code = state.etfPick;
  if (!code) return '';
  const E = (cmp && cmp.etfs) || {};
  const me = E[code];
  if (!me) return `<div class="card"><div class="toolbar"><strong>${esc(code)}</strong><button class="chip" data-etf-pick="">닫기</button></div><p class="muted">비교 데이터가 아직 없습니다(etf-compare.json 갱신 전이거나 최근 상장).</p></div>`;
  const pct = (v, d = 2) => (v === null || v === undefined) ? '<span class="muted">-</span>' : pctCell(Number((v * 100).toFixed(d)));
  const eok = v => (v === null || v === undefined) ? '-' : `${Math.round(v / 1e8).toLocaleString()}억`;
  const nameBtn = c => `<span class="etf-pick" data-etf-pick="${esc(c)}" style="cursor:pointer;text-decoration:underline dotted">${esc((E[c] || {}).name || c)}</span>`;
  const gkey = Object.keys(cmp.groups || {}).find(k => cmp.groups[k].includes(code));
  const mult = me.multiplier === null || me.multiplier === undefined ? '측정 불가' : `${me.multiplier}배`;
  let groupHtml = '<p class="muted">같은 지수·같은 배수·같은 환헤지로 묶이는 다른 ETF가 없습니다(또는 액티브·배수 측정 불가).</p>';
  if (gkey) {
    const rows = cmp.groups[gkey].map(c => {
      const e = E[c];
      return `<tr${c === code ? ' style="background:var(--hl,rgba(255,200,0,.12))"' : ''}>
        <td>${c === code ? `<strong>${esc(e.name)}</strong>` : nameBtn(c)} <span class="muted">${esc(c)}</span></td>
        <td>${eok(e.aum)}</td><td>${eok(e.value20)}</td><td>${pct(e.premium)}</td><td>${pct(e.ret, 1)}</td>
        <td>${e.short ? '<span class="muted">상장 1년 미만</span>' : pct(e.retVsGroup)}</td>
        <td>${e.trackErrVsGroup === null || e.trackErrVsGroup === undefined ? '<span class="muted">-</span>' : (e.trackErrVsGroup * 100).toFixed(2) + '%'}</td>
      </tr>`;
    }).join('');
    groupHtml = `<div class="table-wrap"><table><thead><tr><th>종목</th><th>규모(시총)</th><th>20일 평균 거래대금</th><th>괴리율</th><th>1년 수익률</th><th>그룹 대비(%p)</th><th>그룹 대비 추적오차</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const near = (me.near || []).map(([c, r]) => `<li>${nameBtn(c)} <span class="muted">${esc(c)} · 상관 ${r.toFixed(3)}</span></li>`).join('') || '<li class="muted">-</li>';
  const anchorName = { KOSPI200: '코스피200', SP500: 'S&P500', NDX100: '나스닥100' };
  const anchors = Object.entries(me.anchorCorr || {}).map(([a, r]) => `${anchorName[a] || a} ${r.toFixed(2)}`).join(' · ') || '-';
  return `<div class="card">
    <div class="toolbar"><div><strong>${esc(me.name)}</strong> <span class="muted">${esc(code)} · 기초지수 ${esc(me.idx || '-')} · ${mult}${me.hedged ? ' · 환헤지(H)' : ''}${me.active ? ' · 액티브' : ''}</span></div>
      <button class="chip" data-etf-pick="">닫기</button></div>
    <h4 style="margin:10px 0 6px">동일 지수 비교</h4>${groupHtml}
    <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:10px">
      <div><h4 style="margin:0 0 6px">비슷하게 움직이는 ETF <span class="muted">(같은 그룹 제외)</span></h4><ul style="margin:0;padding-left:18px">${near}</ul></div>
      <div><h4 style="margin:0 0 6px">대표 지수와의 상관</h4><p style="margin:0">${anchors}</p></div>
    </div>
    <p class="muted" style="margin-top:8px">기준 ${esc(cmp.asOf || '-')} · 최근 ${esc(String(cmp.window || '-'))}거래일 가격 기준(분배금 미포함) · 배수는 이름이 아니라 지수 대비 실측(시차 흡수) ·
    '그룹 대비'는 그룹 전원이 거래된 날만으로 잰 기간 수익률에서 그룹 중앙값을 뺀 값 — 같은 지수끼리는 환율·시차가 상쇄돼서 지수 대비보다 정확하다. 추적오차에는 분배락일 차이가 들어간다. 총보수는 KRX 일별 데이터에 없어 표시하지 않는다. 관찰용 — 점수·추천에 쓰지 않는다.</p>
  </div>`;
}

const PERIOD_DAYS = { '1m': 30, '3m': 90, '6m': 180, '1y': 365 };

// 오늘(실시간 벽시계) 기준이 아니라 데이터에 실제로 있는 마지막 날짜
// 기준으로 자른다 - A2a/A4는 예약 실행이 아니라 수동 트리거라 며칠~몇 주
// 밀려 있을 수 있고, 그러면 "오늘 기준 1개월"엔 데이터가 하루도 안 걸릴 수
// 있다(실측: 백필 기준일 08-03에 오늘이 09-01이면 "최근 30일"에 딱 하루만
// 남는다). "최근 N일"은 항상 우리가 가진 데이터의 최근 N일이어야 한다.
function filterByPeriod(daily, period) {
  if (!daily.length) return [];
  const days = PERIOD_DAYS[period] || 30;
  const lastDate = new Date(daily[daily.length - 1].date);
  lastDate.setDate(lastDate.getDate() - days);
  const cutoffStr = lastDate.toISOString().slice(0, 10);
  return daily.filter(d => d.date >= cutoffStr);
}

// 일별 개인/외국인/기관 순매수를 나란히 세 막대로 - 부호에 따라 위/아래로
function renderIntradayDetail(code, name) {
  const isToday = !state.live.date;
  if (isToday) seedTodayFromHistory(code);
  const raw = isToday ? candleSeries(code, 400) : getHistoricalBars(code, state.live.date);

  const todayStr = kstYmd();
  // KIS 날짜지정 분봉조회는 오늘 기준 약 1년 전까지만 준다(실측 2026-09-01,
  // 롤링 윈도우라 매일 밀림) - 그 이전은 에러 없이 조용히 빈 데이터만 온다.
  // 여유 5일 두고 min을 걸어 헛조회를 막는다.
  const minDate = new Date(Date.now() + 9 * 3600 * 1000);
  minDate.setUTCDate(minDate.getUTCDate() - 360);
  const minStr = minDate.toISOString().slice(0, 10);
  const dateVal = state.live.date
    ? `${state.live.date.slice(0, 4)}-${state.live.date.slice(4, 6)}-${state.live.date.slice(6, 8)}`
    : todayStr;

  let chartHtml, countLabel, badges = '';
  if (raw === null) {
    chartHtml = '<div class="empty" style="padding:30px;text-align:center">불러오는 중...</div>';
    countLabel = '불러오는 중...';
  } else {
    const bars = aggregateBars(raw, state.live.timeframe);
    chartHtml = detailChartSvg(bars, 640, state.live.chartType, state.live);
    countLabel = `${state.live.timeframe}분봉 · ${bars.length}개${isToday ? ' · 실시간' : ''}`;
    const ticker = state.live.daily && state.live.daily.tickers && state.live.daily.tickers[code];
    if (ticker && ticker.daily && ticker.daily.length) {
      const fullBars = ticker.daily.map(d => ({ date: d.date, o: d.open, h: d.high, l: d.low, c: d.close, v: d.volume }));
      badges = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${badgesFor(fullBars)}</div>`;
    }
  }

  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button data-live-date="today" class="chip ${isToday ? 'active' : ''}">오늘(실시간)</button>
      <input type="date" id="liveDateInput" value="${dateVal}" max="${todayStr}" min="${minStr}"
        title="KIS 분봉 조회는 최근 약 1년까지만 가능합니다"
        style="background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:12px" />
    </div>
    <h2>${esc(name)} <span class="muted" style="font-weight:400;font-size:12px">${countLabel}</span></h2>
    <div class="table-wrap">${chartHtml}</div>${badges}`;
}

function renderPeriodDetail(code, name) {
  const ticker = state.live.daily && state.live.daily.tickers && state.live.daily.tickers[code];

  return `

    <h2>수급 <span class="muted" style="font-weight:400;font-size:12px">개인·외국인·기관 순매수 · 최근 ${sdRows.length}거래일 · ${esc(state.live.daily.asOfSupplyDemand || '-')} 기준 · 우측=기간합계</span></h2>
    <div style="margin-top:10px">${['foreign', 'institution', 'individual'].map(k =>
      investorTrendRow({ foreign: '외국인', institution: '기관', individual: '개인' }[k],
        sdRows.map(r => r[k] || 0), sdRows.map(r => r.date.slice(5).replace('-', '/')))).join('')}</div>`;
