function renderLive() {
  if (!state.live.ws && state.live.status !== 'error') connectLive();
  if (!state.live.selected) state.live.selected = LIVE_WATCHLIST[0][0];

  const statusMap = {
    idle: ['muted', '대기'], connecting: ['muted', '접속 중...'],
    connected: ['ok', '● 실시간 연결됨'], disconnected: ['err', '연결 끊김 - 재접속 중'],
    error: ['err', '연결 실패'],
  };
  const [statusCls, statusLabel] = statusMap[state.live.status] || statusMap.idle;

  const rows = LIVE_WATCHLIST.map(([code, name]) => {
    const t = state.live.ticks[code];
    if (!t) {
      return `<tr><td>${esc(name)}</td><td class="muted">${code}</td>
        <td class="muted">-</td><td class="muted">-</td><td class="muted">-</td><td class="muted">-</td></tr>`;
    }
    const chg = Number(t.changePct);
    const cls = chg > 0 ? 'pos' : chg < 0 ? 'neg' : 'muted';
    const hhmmss = t.time && t.time.length === 6 ? `${t.time.slice(0,2)}:${t.time.slice(2,4)}:${t.time.slice(4,6)}` : '-';
    return `<tr><td>${esc(name)}</td><td class="muted">${code}</td>
      <td>${fmtNum(t.price)}원</td>
      <td class="${cls}">${chg > 0 ? '+' : ''}${t.change} (${chg > 0 ? '+' : ''}${t.changePct}%)</td>
      <td class="muted">${fmtNum(t.accVolume)}</td>
      <td class="muted">${hhmmss}</td></tr>`;
  }).join('');

  const miniCards = LIVE_WATCHLIST.map(([code, name]) => {
    const bars = candleSeries(code, 20);
    const t = state.live.ticks[code];
    const selected = code === state.live.selected;
    const chg = t ? Number(t.changePct) : null;
    const chgCls = chg > 0 ? 'pos' : chg < 0 ? 'neg' : 'muted';
    return `<div data-live-select="${code}" style="cursor:pointer;border-radius:8px;padding:8px;
        border:1px solid ${selected ? 'var(--accent)' : 'var(--border)'};
        background:${selected ? '#1e2a44' : 'var(--card)'}">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-size:12px;font-weight:600">${esc(name)}</span>
        <span class="${chgCls}" style="font-size:11px">${t ? (chg > 0 ? '+' : '') + t.changePct + '%' : '-'}</span>
      </div>
      ${candleSvg(bars, 130, 40, {})}
    </div>`;
  }).join('');

  const selWatch = LIVE_WATCHLIST.find(w => w[0] === state.live.selected);
  const detailName = selWatch ? selWatch[1] : state.live.selected;
  const tickerSelect = `
    <select id="liveTickerSelect" style="background:var(--card);border:1px solid var(--border);color:var(--text);
        border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600">
      ${LIVE_WATCHLIST.map(([code, nm]) => `<option value="${code}" ${code === state.live.selected ? 'selected' : ''}>${esc(nm)}</option>`).join('')}
    </select>`;
  // 분봉을 먼저 눌러야 나오던 상위 토글을 없애고, 분봉·기간 버튼을 한 줄에
  // 같이 둔다 - 아무거나 바로 눌러서 전환(종목 상세 모달과 동일 패턴).
  const timeframeCtrl = [1, 5, 15, 60].map(m =>
    `<button data-live-timeframe="${m}" class="chip ${state.live.view === 'intraday' && state.live.timeframe === m ? 'active' : ''}">${m}분</button>`).join('');
  const periodCtrl = ['1m', '3m', '6m', '1y'].map(p => {
    const label = { '1m': '1개월', '3m': '3개월', '6m': '6개월', '1y': '1년' }[p];
    return `<button data-live-period="${p}" class="chip ${state.live.view === 'period' && state.live.period === p ? 'active' : ''}">${label}</button>`;
  }).join('');
  const typeCtrl = ['candle', 'line'].map(t =>
    `<button data-live-charttype="${t}" class="chip ${state.live.chartType === t ? 'active' : ''}">${t === 'candle' ? '캔들' : '라인'}</button>`).join('');
  const viewToggle = `
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      ${tickerSelect}
    </div>
    <div class="group-filter" style="margin-bottom:8px">${timeframeCtrl}${periodCtrl}</div>
    <div class="group-filter" style="margin-bottom:12px">${typeCtrl}</div>`;
  const detailHtml = state.live.view === 'period'
    ? renderPeriodDetail(state.live.selected, detailName)
    : renderIntradayDetail(state.live.selected, detailName);

  return `<div class="card">
    <h2>실시간 체결가 <span class="${statusCls}" style="font-weight:400;font-size:13px">${statusLabel}</span></h2>
    <p class="muted" style="margin-bottom:10px">
      한국투자증권 모의투자(VTS) 웹소켓 실시간 중계 · 관심종목 ${LIVE_WATCHLIST.length}개 고정 · 장중에만 갱신됩니다. 클릭해서 종목을 바꿀 수 있습니다.
    </p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:18px">${miniCards}</div>

    ${viewToggle}
    ${detailHtml}

    <h2 style="margin-top:20px">종목 현황</h2>
    <div class="table-wrap"><table><thead><tr>
      <th>종목</th><th>코드</th><th>현재가</th><th>전일대비</th><th>누적거래량</th><th>체결시각</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

// ---------- 섹터강도 (관찰용) ----------
// docs/data/sector-strength.json = A1a KSIC 159 세분류를 config/sectorGroups.json 으로
// 20개 그룹에 묶고, 이미 매일 갱신되는 prices.json 으로 상대강도를 낸 것.
// ★ 예측력 주장이 아니다 - Step 0 검증에서 섹터 주도권 신호는 난수 바닥선을 못 넘었다.
const SEC_QUADS = {
  '주도': { color: '#16a34a', desc: '강하고 더 강해지는 중' },
  '부상': { color: '#2563eb', desc: '약했는데 강해지는 중' },
  '둔화': { color: '#d97706', desc: '강했는데 힘이 빠지는 중' },
  '약세': { color: '#dc2626', desc: '약하고 더 약해지는 중' },
};

function secPct(v, digits = 1) {
  if (v === null || v === undefined) return '<span class="muted">-</span>';
  return pctCell((v * 100).toFixed(digits));
}

// 산점도 축: 중기 = (3개월 RS, 1개월−3개월) — 서버가 붙인 분면 그대로 · 단기 = (1개월 RS, 1주−1개월) — 같은 규칙으로 여기서 분면을 붙인다
const secQuadOf = (x, y) => x >= 0 ? (y >= 0 ? '주도' : '둔화') : (y >= 0 ? '부상' : '약세');
function secAxes(g, hz) {
  if (hz !== 'short') return g.rs['3m'] == null || g.accel == null ? null : { x: g.rs['3m'], y: g.accel, q: g.quadrant };
  const a = g.rs['1m'], b = g.rs['1w'];
  return a == null || b == null ? null : { x: a, y: b - a, q: secQuadOf(a, b - a) };
}

// 기간별 색 표 — 그룹 × (1일·1주·1개월·3개월·6개월) EW 상대강도. 색 진하기는 열마다 그 열의 최대 절댓값 기준.
const SEC_HEAT_WINS = [['1d', '1일'], ['1w', '1주'], ['1m', '1개월'], ['3m', '3개월'], ['6m', '6개월']];
function sectorHeatTable(d) {
  const k = state.secHeatSort;
  const gs = d.groups.slice().sort((a, b) => (b.rs[k] ?? -9) - (a.rs[k] ?? -9));
  const mx = Object.fromEntries(SEC_HEAT_WINS.map(([w]) => [w, Math.max(1e-9, ...gs.map(g => Math.abs(g.rs[w] ?? 0)))]));
  const cell = (v, w) => {
    if (v == null) return '<td class="muted" style="text-align:center">-</td>';
    const a = Math.min(1, Math.abs(v) / mx[w]) * 0.6;
    const bg = `rgba(${v >= 0 ? '242,85,90' : '76,141,255'},${a.toFixed(2)})`;
    return `<td style="text-align:right;padding:5px 3px;background:${bg};${w === k ? 'font-weight:700' : ''}">${v >= 0 ? '+' : ''}${(v * 100).toFixed(1)}</td>`;
  };
  const head = SEC_HEAT_WINS.map(([w, l]) => `<th data-secheatsort="${w}" style="text-align:right;cursor:pointer;white-space:nowrap;padding:5px 3px">${l}${w === k ? ' ▼' : ''}</th>`).join('');
  const rows = gs.map(g => `<tr><td style="padding:5px 3px">${esc(g.group)} <span class="muted" style="font-size:11px">${g.n}</span></td>${SEC_HEAT_WINS.map(([w]) => cell(g.rs[w], w)).join('')}</tr>`).join('');
  return `<div class="card"><h2 style="margin:0 0 4px">기간별 강도 <span class="muted" style="font-weight:400;font-size:13px">시장 대비 %p · 빨강 = 시장보다 강함 · 파랑 = 약함 · 열 이름을 누르면 그 기간으로 정렬</span></h2>
    <div class="table-wrap"><table style="font-size:12px"><thead><tr><th style="padding:5px 3px">그룹 <span class="muted" style="font-weight:400;font-size:11px">종목 수</span></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:11px;margin:6px 0 0">값 = 그룹 종목 수익률 중앙값 − 전체 종목 중앙값(EW). 색 진하기는 열마다 그 기간의 가장 큰 값 기준. 관찰용 — 업종 강도로 다음 수익을 맞히는 규칙은 검증에서 근거가 없었다.</p></div>`;
}

// 업종 고유 색 — 업종 이름을 가나다순으로 세운 순번을 7칸씩 건너뛰며 색상환에 놓는다(날마다 같은 색, 이웃 색이 비슷하지 않게).
// 4분면 점과 흐름 사다리 선이 같은 색을 쓴다. 분면 배경색(SEC_QUADS)과는 별개.
function secHues(groups) {
  const names = groups.map(g => g.group).sort((a, b) => a.localeCompare(b, 'ko'));
  return Object.fromEntries(names.map((n, i) => [n, Math.round((i * 7 % names.length) * 360 / names.length)]));
}
const secCol = (hues, name) => `hsl(${hues[name] ?? 0} 70% 66%)`;
const secFocus = () => state.secHot || state.secPick;

function sectorScatter(groups, hz) {
  const pts = groups.map(g => ({ ...g, ax: secAxes(g, hz) })).filter(g => g.ax);
  if (!pts.length) return '';
  const W = 760, H = 440, PAD = 48;
  const xs = pts.map(p => p.ax.x), ys = pts.map(p => p.ax.y);
  const span = (a) => {
    const lo = Math.min(...a, 0), hi = Math.max(...a, 0), m = (hi - lo) * 0.14 || 0.02;
    return [lo - m, hi + m];
  };
  const [x0, x1] = span(xs), [y0, y1] = span(ys);
  const px = v => PAD + (v - x0) / (x1 - x0) * (W - PAD * 2);
  const py = v => H - PAD - (v - y0) / (y1 - y0) * (H - PAD * 2);
  const cx = px(0), cy = py(0);
  const maxN = Math.max(...pts.map(p => p.n));
  const hues = secHues(groups), f = secFocus();
  const cnt = {}; pts.forEach(p => { cnt[p.ax.q] = (cnt[p.ax.q] || 0) + 1; });

  const tint = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" fill="${c}" opacity="0.13"/>`;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:${W}px;min-width:560px" role="img" aria-label="섹터 4분면 산점도">`;
  svg += tint(cx, PAD, W - PAD - cx, cy - PAD, SEC_QUADS['주도'].color);
  svg += tint(PAD, PAD, cx - PAD, cy - PAD, SEC_QUADS['부상'].color);
  svg += tint(cx, cy, W - PAD - cx, H - PAD - cy, SEC_QUADS['둔화'].color);
  svg += tint(PAD, cy, cx - PAD, H - PAD - cy, SEC_QUADS['약세'].color);
  svg += `<line x1="${PAD}" y1="${cy}" x2="${W - PAD}" y2="${cy}" stroke="var(--border)" stroke-dasharray="4 3"/>`;
  svg += `<line x1="${cx}" y1="${PAD}" x2="${cx}" y2="${H - PAD}" stroke="var(--border)" stroke-dasharray="4 3"/>`;
  const corner = (x, y, anchor, q) => `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="13" font-weight="700" fill="${SEC_QUADS[q].color}">${q} <tspan font-weight="400" fill="var(--muted)">${cnt[q] || 0}</tspan></text>`;
  svg += corner(W - PAD - 6, PAD + 16, 'end', '주도') + corner(PAD + 6, PAD + 16, 'start', '부상')
       + corner(W - PAD - 6, H - PAD - 8, 'end', '둔화') + corner(PAD + 6, H - PAD - 8, 'start', '약세');
  const [xl, yl] = hz === 'short' ? ['1개월 상대강도', '1주 가속'] : ['3개월 상대강도', '1개월 가속'];
  svg += `<text x="${W / 2}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)">← 약함    ${xl}    강함 →</text>`;
  svg += `<text x="14" y="${H / 2}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90 14 ${H / 2})">← 둔화    ${yl}    가속 →</text>`;

  const marks = pts.map(p => {
    const r = 6 + 9 * Math.sqrt(p.n / maxN);
    const X = px(p.ax.x), Y = py(p.ax.y), end = X > W - 170;
    return { p, r, X, Y, end, lx: X + (end ? -(r + 5) : r + 5), ly: Y + 4 };
  }).sort((a, b) => a.ly - b.ly);
  // 이름 상자(글자 수 × 11px 추정, 높이 19 실측)끼리 겹치면 아래쪽 이름을 겹친 만큼 내린다. 겹침이 없을 때까지(최대 60회).
  // ponytail: O(n²) 반복, 그룹이 20개 남짓이라 충분하다. 더 늘면 격자 인덱스로 바꾼다.
  const box = m => { const w = m.p.group.length * 11; return { x: m.end ? m.lx - w : m.lx, y: m.ly - 14, w, h: 19 }; };
  for (let pass = 0, moved = true; moved && pass < 60; pass++) {
    moved = false;
    for (let i = 0; i < marks.length; i++) for (let j = 0; j < marks.length; j++) {
      if (i === j) continue;
      const a = box(marks[i]), b = box(marks[j]);
      if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h && (a.y > b.y || (a.y === b.y && i > j))) {
        marks[i].ly = b.y + b.h + 15; moved = true;
      }
    }
  }
  // 두 번에 나눠 그린다: 점(과 이음선)을 모두 그린 뒤 이름을 맨 위에 — 이름이 다른 업종 점 밑에 깔리지 않게. 강조 업종은 각 단계 맨 마지막
  const attrs = m => { const on = m.p.group === f; return { on, op: state.secHot && !on ? 0.2 : 1, c: secCol(hues, m.p.group) }; };
  const dot = m => {
    const { on, op, c } = attrs(m);
    let o = `<g data-secg="${esc(m.p.group)}" style="cursor:pointer" opacity="${op}">`;
    if (Math.abs(m.ly - (m.Y + 4)) > 2) {   // 밀려난 이름은 가는 선으로 원과 이어준다
      o += `<line x1="${m.X.toFixed(1)}" y1="${m.Y.toFixed(1)}" x2="${m.lx.toFixed(1)}" y2="${(m.ly - 4).toFixed(1)}" stroke="${c}" stroke-width="1" opacity="0.6"/>`;
    }
    return o + `<circle cx="${m.X.toFixed(1)}" cy="${m.Y.toFixed(1)}" r="${(on ? m.r + 3 : m.r).toFixed(1)}" fill="${c}" stroke="var(--card)" stroke-width="2"><title>${esc(m.p.group)} · ${m.p.n}종목 · ${esc(m.p.ax.q)}</title></circle></g>`;
  };
  const label = m => {
    const { on, op } = attrs(m);
    return `<g data-secg="${esc(m.p.group)}" style="cursor:pointer" opacity="${op}"><text x="${m.lx.toFixed(1)}" y="${m.ly.toFixed(1)}" text-anchor="${m.end ? 'end' : 'start'}" font-size="12" font-weight="${on ? 700 : 500}" fill="var(--text)" style="paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round">${esc(m.p.group)}</text></g>`;
  };
  const ordered = [...marks.filter(m => m.p.group !== f), ...marks.filter(m => m.p.group === f)];
  ordered.forEach(m => { svg += dot(m); });
  ordered.forEach(m => { svg += label(m); });
  return svg + '</svg>';
}

// 흐름 사다리 — 업종 순위(EW 상대강도)가 6개월 → 3개월 → 1개월 → 1주 → 1일로 어떻게 바뀌었나. 양 끝에 이름을 항상 단다.
function sectorLadder(groups) {
  const order = [['6m', '6개월'], ['3m', '3개월'], ['1m', '1개월'], ['1w', '1주'], ['1d', '1일']];
  const gs = groups.filter(g => order.every(([k]) => g.rs[k] != null));
  if (gs.length < 2) return '';
  const rank = {};
  for (const [k] of order) [...gs].sort((a, b) => b.rs[k] - a.rs[k]).forEach((g, i) => { (rank[g.group] ||= {})[k] = i + 1; });
  const W = 860, top = 34, step = 24, H = top + step * (gs.length - 1) + 24, L = 168, R = 168;
  const X = i => L + i * (W - L - R) / (order.length - 1), Y = r => top + (r - 1) * step;
  const hues = secHues(groups), f = secFocus();
  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;min-width:640px" role="img" aria-label="업종 순위 변화">`;
  order.forEach(([, l], i) => {
    s += `<text x="${X(i)}" y="16" text-anchor="middle" font-size="12" fill="var(--muted)">${l}</text>`;
    s += `<line x1="${X(i)}" y1="${top - 10}" x2="${X(i)}" y2="${H - 12}" stroke="var(--border)"/>`;
  });
  for (let r = 1; r <= gs.length; r++) s += `<text x="${X(0) - 8}" y="${Y(r) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${r}</text>`;
  const draw = g => {
    const on = g.group === f, dim = state.secHot && !on, c = secCol(hues, g.group), rk = rank[g.group];
    const pts = order.map(([k], i) => `${X(i).toFixed(1)},${Y(rk[k]).toFixed(1)}`).join(' ');
    let o = `<g data-secg="${esc(g.group)}" style="cursor:pointer" opacity="${dim ? 0.15 : 1}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${on ? 4 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    order.forEach(([k], i) => { o += `<circle cx="${X(i)}" cy="${Y(rk[k])}" r="${on ? 5 : 3.5}" fill="${c}"/>`; });
    const fw = on ? 700 : 500;
    o += `<text x="${X(0) - 26}" y="${Y(rk['6m']) + 4}" text-anchor="end" font-size="12" font-weight="${fw}" fill="${c}">${esc(g.group)}</text>`;
    o += `<text x="${X(order.length - 1) + 10}" y="${Y(rk['1d']) + 4}" font-size="12" font-weight="${fw}" fill="${c}">${esc(g.group)}</text>`;
    o += `<polyline points="${pts}" fill="none" stroke="transparent" stroke-width="12"/></g>`;   // 잡기 쉬운 넓은 선
    return o;
  };
  gs.filter(g => g.group !== f).forEach(g => { s += draw(g); });
  const sel = gs.find(g => g.group === f);
  if (sel) s += draw(sel);
  return s + '</svg>';
}

// 마우스를 올린 업종만 두 그래프에서 진하게 — 표·나머지 화면은 다시 그리지 않는다
function refreshSecCharts() {
  const d = state.sectorStrength, q = document.getElementById('secQuad'), l = document.getElementById('secLadder');
  if (!d || !q || !l) return;
  q.innerHTML = sectorScatter(d.groups, state.secHz);
  l.innerHTML = sectorLadder(d.groups);
}

// ---------- 테마 트리 (관찰용) ----------
// docs/data/theme-strength.json = config/themeTree.json(손으로 고른 현재 기준 테마)을
// 업종 탭과 같은 build() 로 계산한 것. 값은 EW(소속 종목 수익률 중앙값).
const THEME_WINS = [['1d', '1일'], ['1w', '1주'], ['1m', '1개월'], ['3m', '3개월']];

// 오늘 +5% 이상 오른 종목이 여러 하위 테마에 겹친 수(1일 창만). 표시 전용 — 점수·매매에 쓰지 않는다.
const OVERLAP_MIN_RET = 0.05, OVERLAP_COLOR = { 2: '#22c55e', 3: '#eab308', 4: '#f97316' };
function themeOverlap(tree) {
  const sets = {}, names = {};
  tree.forEach(b => b.subs.forEach(k => k.members.forEach(m => {
    const r = m.ret ? m.ret['1d'] : null;
    if (r === null || r === undefined || r < OVERLAP_MIN_RET) return;
    (sets[m.t] = sets[m.t] || new Set()).add(k.key);
    (names[m.t] = names[m.t] || []).push(k.theme);
  })));
  return { n: t => (sets[t] ? sets[t].size : 0), names: t => names[t] || [] };
}
// 시총대비 수급 = (외국인+기관 순매수) ÷ 시가총액, 가장 최근 일자. 수량×종가 근사 값이라 대략치다.
function flowOverMcap(m) {
  const rows = state.flows && (state.flows.byTicker || {})[m.t];
  if (!rows || !rows.length || !m.capNow) return null;
  const x = rows[rows.length - 1];
  return { v: (x.foreign + x.institution) / m.capNow, date: x.date };
}

// 수급대장 = 시총대비 수급 0.9% 이상(외부 사이트 정의). 테마 줄 = 소속 종목 값의 중앙값 + 대장 수. 표시 전용.
const FLOW_LEAD = 0.009;
function themeFlowStat(members) {
  const v = (members || []).map(flowOverMcap).filter(Boolean).map(f => f.v).sort((a, b) => a - b);
  if (!v.length) return null;
  const mid = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
  return { med: mid, lead: v.filter(x => x >= FLOW_LEAD).length, n: v.length };
}
// 맥락 칩 — 최근 3일 안의 뉴스(good/bad 키워드 규칙)·DART 공시 분류. 방향 판단이 아니라 "무슨 일이 있었나"만 보여 준다.
function ensureStockEvents() {
  if (state.stockEvents !== undefined) return;
  state.stockEvents = 'loading';
  fetch('data/stock-events.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)
    .then(j => { state.stockEvents = j; render(); if (state.detail.open && state.detail.vtab === 'decode') renderStockModal(); });
}
function ctxChips(m, asOf) {
  const day = String(asOf || '').replace(/^(\d{4})-?(\d{2})-?(\d{2})$/, '$1-$2-$3');   // asOf 는 20261001 형태로 온다
  const base = new Date(day + 'T00:00:00+09:00').getTime() - 2 * 86400000;
  if (isNaN(base)) return '';
  const out = [];
  const nv = state.news && state.news.byTicker && state.news.byTicker[m.t];
  if (nv) {
    const seen = {};
    (nv.items || []).forEach(it => {
      if (it.level === 'neutral' || seen[it.level] || !(m.name && (it.title || '').includes(m.name))) return;
      if (new Date(it.pubDate).getTime() < base) return;
      seen[it.level] = 1;
      const col = it.level === 'bad' ? 'var(--bad)' : 'var(--good)';
      out.push(`<span title="${esc(it.title)}" style="font-size:10px;color:${col};border:1px solid ${col};border-radius:8px;padding:0 4px;margin-left:3px;white-space:nowrap">뉴스 ${it.level === 'bad' ? '악재' : '호재'} ${esc((it.flags || []).slice(0, 2).join('·'))}</span>`);
    });
  }
  const ev = state.stockEvents && state.stockEvents !== 'loading' && state.stockEvents.items && state.stockEvents.items[m.t];
  if (ev) {
    const lo = new Date(base).toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }).replace(/-/g, '');
    const cats = {};
    (ev.events || []).forEach(e => { if (e.d >= lo && !/정정/.test(e.nm)) (cats[e.cat] = cats[e.cat] || e); });   // 정정 공시는 원공시와 중복
    Object.keys(cats).forEach(c => out.push(`<span title="${esc(cats[c].nm)} (접수 ${esc(cats[c].d)})" style="font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:0 4px;margin-left:3px;white-space:nowrap">공시 ${esc(c)}</span>`));
  }
  return out.join('');
}

// squarified treemap. items: [{v>0, ...}] 큰 순 정렬. 반환 좌표는 입력과 같은 단위.
function squarify(items, x, y, w, h) {
  const out = [];
  let rest = items.filter(i => i.v > 0), total = rest.reduce((s, i) => s + i.v, 0);
  while (rest.length && w > 0 && h > 0) {
    const side = Math.min(w, h), scale = (w * h) / total;
    let row = [], best = Infinity;
    for (const it of rest) {
      const r = row.concat(it), vs = r.map(q => q.v * scale), s = vs.reduce((a, b) => a + b, 0);
      const worst = Math.max(side * side * Math.max(...vs) / (s * s), (s * s) / (side * side * Math.min(...vs)));
      if (worst > best) break;
      best = worst; row = r;
    }
    const rv = row.reduce((a, b) => a + b.v, 0), thick = rv * scale / side;
    let off = 0;
    for (const it of row) {
      const len = it.v * scale / thick;
      out.push(w >= h ? { ...it, x, y: y + off, w: thick, h: len } : { ...it, x: x + off, y, w: len, h: thick });
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    total -= rv; rest = rest.slice(row.length);
  }
  return out;
}

function heatColor(r, cap) {
  if (r === null || r === undefined) return '#333a48';
  const t = Math.min(Math.abs(r) / cap, 1), base = [58, 66, 86];
  const to = r >= 0 ? [214, 69, 65] : [52, 110, 220];   // 한국식: 상승 빨강·하락 파랑
  return `rgb(${base.map((b, i) => Math.round(b + (to[i] - b) * t)).join(',')})`;
}

}

function marketHeatmap(d, home = false) {   // home: 홈 첫 화면용 — 국내 고정, 국내/미국 칩·각주 생략(2026-10-20)
  const mk = (key, label) => `<button class="chip${state.heatMarket === key ? ' active' : ''}" data-heatmarket="${key}">${label}</button>`;
  const title = t => `<h2 style="margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${t} ${home ? '' : mk('KR', '국내') + mk('US', '미국')}</h2>`;
  if (state.heatMarket === 'US' && !home) {
    return `<div class="card">${title('시장 히트맵')}
      <div id="tvHeatmap" style="height:${(window.innerWidth || 1000) < 700 ? 520 : 620}px"><div class="tradingview-widget-container" style="height:100%;width:100%">
        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div></div>
      <p class="muted" style="font-size:11px;margin:6px 0 0">TradingView 제공 위젯(실시간·지연 시세는 TradingView 기준). 위쪽 막대에서 나스닥100 등으로 바꿀 수 있습니다. 관찰용 — 매매신호가 아닙니다.</p>
    </div>`;
  }
  const st = d.stocks || [];
  if (!st.length) return `<div class="card">${title('시장 히트맵')}<p class="muted">국내 데이터가 아직 없습니다(sector-strength.json stocks).</p></div>`;
  const win = state.heatWin, [winLabel, cap] = HEAT_WINS[win], eq = state.heatSize === 'eq';
  const lq = win === 'live' && state.heatLive && state.heatLive.quotes;
  const rOf = s => {
    if (win !== 'live') return s.r[win];
    const q = lq && lq[s.t];
    return q && q[1] ? q[0] / q[1] - 1 : null;
  };
  // 폰은 세로로 길게. 렌더 시점 창 폭으로 한 번 정한다(리사이즈 재배치는 안 한다)
  const W = Math.min(Math.max((window.innerWidth || 1000) - 80, 280), 1400);
  const H = Math.round(W < 700 ? W * (home ? 1.0 : 1.6) : W * (home ? 0.4 : 0.55));   // 홈은 위아래를 줄인다(2026-10-20 사용자 요청)
  const byG = {};
  st.forEach(s => (byG[s.g] = byG[s.g] || []).push({ ...s, v: eq ? 1 : s.cap }));
  const gcap = Object.fromEntries((d.groups || []).map(g => [g.group, (g.capRet || {})[win]]));
  const groups = Object.entries(byG).map(([g, m]) => ({ g, m: m.sort((a, b) => b.v - a.v), v: m.reduce((s, x) => s + x.v, 0) }))
    .sort((a, b) => b.v - a.v);
  const pct = v => (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%';
  const jo = v => v >= 1e12 ? Math.round(v / 1e12).toLocaleString() + '조' : Math.round(v / 1e8).toLocaleString() + '억';
  const box = (x, y, w, h) => `left:${(x / W * 100).toFixed(3)}%;top:${(y / H * 100).toFixed(3)}%;width:${(w / W * 100).toFixed(3)}%;height:${(h / H * 100).toFixed(3)}%`;
  let html = '';
  for (const G of squarify(groups, 0, 0, W, H)) {
    const head = G.w > 50 && G.h > 40 ? 16 : 0;
    let gr = gcap[G.g];
    if (win === 'live') {   // 장중은 표에 값이 없어 여기서 시총가중(현재 시총 — 하루 안이라 비중 차이는 무시할 만하다)
      const pts = G.m.map(s => [rOf(s), s.cap]).filter(([r]) => r !== null);
      const wsum = pts.reduce((a, [, c]) => a + c, 0);
      gr = wsum ? pts.reduce((a, [r, c]) => a + r * c, 0) / wsum : null;
    }
    html += `<div class="hm-g" style="${box(G.x, G.y, G.w, G.h)}">${head ? `<div class="hm-gh">${esc(G.g)}${gr === null || gr === undefined ? '' : ' ' + pct(gr)}</div>` : ''}</div>`;
    for (const s of squarify(G.m, G.x + 1, G.y + head + 1, G.w - 2, G.h - head - 2)) {
      const r = rOf(s), fs = Math.max(9, Math.min(22, Math.min(s.w / 6, s.h / 2.6)));
      const label = s.w > 38 && s.h > 22
        ? `<span style="font-size:${fs.toFixed(0)}px">${esc(s.n)}</span>${s.h > 36 ? `<span style="font-size:${Math.max(9, fs * 0.8).toFixed(0)}px">${r === null || r === undefined ? '-' : pct(r)}</span>` : ''}` : '';
      const tip = `${s.n} · ${s.g}\n${winLabel} ${r === null || r === undefined ? '-' : pct(r)} · 시총 ${jo(s.cap)}`;
      html += `<div class="hm-s" data-chart="${esc(s.t)}" data-chart-name="${esc(s.n)}" title="${esc(tip)}" style="${box(s.x, s.y, s.w, s.h)};background:${heatColor(r, cap)}">${label}</div>`;
    }
  }
  const chip = (attr, key, label, cur) => `<button class="chip${cur === key ? ' active' : ''}" data-${attr}="${key}">${label}</button>`;
  const hl = state.heatLive;
  const liveNote = hl && hl.error && win === '1d' ? '장중 시세를 못 받아 1일로 표시합니다(VM 응답 없음). "장중"을 누르면 다시 시도합니다.'
    : win !== 'live' ? '' : !hl || hl.error ? '장중 시세 불러오는 중…'
    : `장중 기준 <b>${esc(String(hl.atKst || '').slice(5, 16))}</b> KST · ${hl.n}종목 · VM이 10분마다 갱신, 화면은 2분마다 확인. 장이 끝나면 마지막 스냅샷이 남습니다.`;
  const asOfLabel = win === 'live' && hl && hl.atKst ? `장중 ${esc(String(hl.atKst).slice(5, 16))}` : `기준일 ${esc(d.asOf || '-')}`;
  return `
  <div class="card"${home ? '' : ' id="heatCard"'}>
    ${title(`시장 히트맵 <span class="muted" style="font-weight:400;font-size:13px">${asOfLabel} · ${st.length}종목</span>`)}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px">
      ${Object.keys(HEAT_WINS).map(k => chip('heatwin', k, HEAT_WINS[k][0], win)).join('')}
      <span style="width:10px"></span>
      ${chip('heatsize', 'cap', '면적 = 시총', state.heatSize)}${chip('heatsize', 'eq', '면적 = 동일', state.heatSize)}
    </div>
    ${liveNote && !(home && win === 'live' && hl && !hl.error) ? `<p class="muted" style="font-size:11px;margin:0 0 6px">${liveNote}</p>` : ''}
    <div class="hm" style="aspect-ratio:${W}/${H}">${html}</div>
    ${home ? '' : `<p class="muted" style="font-size:11px;margin:6px 0 0">코스피200+코스닥150(우선주 제외) · 시총 = 종가 × 상장주식수 · 색은 ±${Math.round(cap * 100)}%에서 가장 진함 · 업종 옆 숫자 = 시총가중 수익률 · 종목을 누르면 상세 · 관찰용 — 매매신호 아님</p>`}
  </div>`;
}

// ---------- 섹터강도 서브탭 ----------
// 오늘 급등이 몰린 곳 — 업종·테마별 전일 대비 +5% 이상 종목 수·비율. 텔레그램 장중 알림(전일 대비 ±5%)과 같은 기준.
// 표시 전용: 예측·추천이 아니다(절대 규칙 1). 섹터 주도권 신호는 검증에서 난수 바닥선을 넘지 못했고(findings/sector-leadership-step0),
// 급등·돌파 추격은 기존 시험에서 음의 방향이었다 - '유망 섹터'가 아니라 '오늘 어디가 움직였나'만 보여준다.
const SURGE_PCT = 0.05, SURGE_MIN_HITS = 2, SURGE_MIN_MEMBERS = 5, SURGE_ROWS = 8;
// 급등 비율의 수익률 기준: 히트맵이 '장중'이고 VM 시세가 있으면 장중, 아니면 sector-strength 의 1일(종가). 카드·추천 목록이 같이 쓴다.
function surgeBasis(d) {
  const hl = state.heatLive, lq = hl && hl.quotes;
  const useLive = state.heatWin === 'live' && !!lq;
  const rOf = x => { if (useLive) { const q = lq[x.t]; return q && q[1] ? q[0] / q[1] - 1 : null; } const v = x.r && x.r['1d']; return v == null ? null : v; };
  const basis = useLive && hl.atKst ? `장중 ${esc(String(hl.atKst).slice(5, 16))}` : `${esc(String(d.asOf || '-').replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3'))} 종가 기준`;
  return { rOf, basis };
}
// 종목이 속한 업종의 급등 비율·4분면 — 추천 목록 표시용(점수·추천과 무관, 원자료와 기존 4분면만). KR 만.
function sectorSurgeCell(ticker, market) {
  const d = state.sectorStrength;
  if (market !== 'KR' || !d || !(d.stocks || []).length) return '<span class="muted">-</span>';
  const g = (d.groups || []).find(x => (x.tickers || []).includes(ticker));
  if (!g) return '<span class="muted" title="업종 미분류">-</span>';
  const { rOf } = surgeBasis(d);
  const byT = new Map(d.stocks.map(x => [x.t, x]));
  const rs = (g.tickers || []).map(t => byT.get(t)).filter(Boolean).map(rOf).filter(v => v != null);
  if (!rs.length) return '<span class="muted">-</span>';
  const up = rs.filter(v => v >= SURGE_PCT).length;
  return `${esc(g.group)} <strong>${up}/${rs.length}</strong> <span class="muted">(${Math.round(up / rs.length * 100)}%) · ${esc(g.quadrant || '-')}</span>`;
}

// 시장 전체 급등 군집 — Actions market-movers 가 쓰는 docs/data/market-movers.json (KRX 전 종목, 거래대금 10억↑ 보통주). 관찰용.
function ensureMarketMovers() {
  if (state.marketMovers !== undefined || state._mmLoading) return;
  state._mmLoading = true;
  loadJson('market-movers').then(d => {
    state.marketMovers = d || null; state._mmLoading = false;
    const c = document.getElementById('surgeCard');
    if (c && state.tab === 'sector') c.outerHTML = surgeClusterCard();
  });
}
function surgeClusterCard() {
  if (state.heatMarket !== 'KR') return '';
  const d = state.sectorStrength;
  if (!d || !(d.stocks || []).length) return '';
  ensureMarketMovers();
  const mm = state.marketMovers;
  const scope = state.surgeScope === 'watch' || !mm ? 'watch' : 'market';
  const chip = (k, l) => `<button class="chip${scope === k ? ' active' : ''}" data-surgescope="${k}">${l}</button>`;
  const order = (a, b) => b.share - a.share || b.up - a.up;
  const tbl = (rows, withQuad) => !rows.length ? '<p class="muted" style="margin:6px 0">해당 없음</p>' :
    `<div class="table-wrap"><table><thead><tr><th>${withQuad ? '업종' : '테마'}</th><th>급등</th><th>비율</th><th>급락</th>${withQuad ? '<th>4분면</th>' : ''}<th>1개월 상대강도</th><th>급등 상위</th></tr></thead><tbody>${
      rows.sort(order).slice(0, SURGE_ROWS).map(r => `<tr><td>${esc(r.name)}</td><td>${r.up}/${r.n}</td>
        <td><div style="display:flex;align-items:center;gap:6px"><div style="width:60px;height:8px;background:rgba(148,163,184,.25);border-radius:4px;overflow:hidden"><div style="width:${Math.round(r.share * 100)}%;height:100%;background:#ef4444"></div></div>${Math.round(r.share * 100)}%</div></td>
        <td>${r.dn || '-'}</td>${withQuad ? `<td>${esc(r.quad || '-')}</td>` : ''}
        <td class="${r.rs == null ? '' : r.rs >= 0 ? 'pos' : 'neg'}">${r.rs == null ? '-' : (r.rs >= 0 ? '+' : '') + (r.rs * 100).toFixed(1) + '%p'}</td>
        <td class="muted" style="font-size:12px">${r.top}</td></tr>`).join('')}</tbody></table></div>`;
  const head = (basis, total) => `<h2 style="margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">오늘 급등이 몰린 곳 ${chip('watch', '관심종목')}${chip('market', '시장 전체')}
    <span class="muted" style="font-weight:400;font-size:13px">${basis} · +${SURGE_PCT * 100}% 이상 ${total}종목</span></h2>`;

  if (scope === 'market') {
    const gmap = new Map((d.groups || []).map(g => [g.group, g]));
    const rows = (mm.groups || []).filter(g => g.up >= SURGE_MIN_HITS).map(g => {
      const sg = gmap.get(g.group);
      return { name: g.group, n: g.n, up: g.up, dn: g.dn, share: g.up / g.n, quad: sg && sg.quadrant, rs: sg && sg.rs ? sg.rs['1m'] : null,
        top: (g.top || []).map(t => `${esc(t[1])} ${(t[2] * 100).toFixed(1)}%`).join(' · ') };
    });
    const asOf = String(mm.asOf).replace(/^(\d{4})(\d{2})(\d{2})$/, '$1-$2-$3');
    return `<div class="card" id="surgeCard">${head(`KRX ${esc(asOf)} 종가 · 거래대금 10억↑ 보통주 ${mm.universe.eligible}개`, mm.universe.up)}
      ${tbl(rows, true)}</div>`;
  }

  const { rOf, basis } = surgeBasis(d);
  const byT = new Map(d.stocks.map(x => [x.t, x]));
  const rowOf = (name, tickers, st) => {
    const ms = [...new Set(tickers)].map(t => byT.get(t)).filter(Boolean).map(x => ({ x, r: rOf(x) })).filter(m => m.r != null);
    if (ms.length < SURGE_MIN_MEMBERS) return null;
    const up = ms.filter(m => m.r >= SURGE_PCT), dn = ms.filter(m => m.r <= -SURGE_PCT);
    if (up.length < SURGE_MIN_HITS) return null;
    const rs = st && st.rs ? st.rs['1m'] : null;
    return { name, n: ms.length, up: up.length, dn: dn.length, share: up.length / ms.length, quad: st && st.quadrant, rs,
      top: up.sort((a, b) => b.r - a.r).slice(0, 3).map(m => `${esc(m.x.n)} ${(m.r * 100).toFixed(1)}%`).join(' · ') };
  };
  const secRows = (d.groups || []).map(g => rowOf(g.group, g.tickers || [], g)).filter(Boolean);
  const ts = state.themeStrength, thRows = [];
  for (const node of ((ts && ts.tree) || [])) for (const sub of (node.subs || [])) {
    const r = rowOf(`${node.theme} › ${sub.theme}`, (sub.members || []).map(m => m.t), sub.stats);
    if (r) thRows.push(r);
  }
  const total = d.stocks.filter(x => { const r = rOf(x); return r != null && r >= SURGE_PCT; }).length;
  return `<div class="card" id="surgeCard">${head(basis, total)}
    <h4 style="margin:8px 0 2px">업종</h4>${tbl(secRows, true)}
    <h4 style="margin:10px 0 2px">테마</h4>${tbl(thRows, false)}
  </div>`;
}

// 시장 심리 맥락 — Actions market-breadth 가 쓰는 docs/data/market-breadth.json. 항목별 '10년 중 위치'만, 합산 점수 없음.

      <span>최저 ${esc(it.min)}</span><span>10년 중 <strong style="color:inherit">${it.pct}%</strong> 위치 · 중앙 ${esc(it.median)}</span><span>최고 ${esc(it.max)}</span></div></div>`;
  return `<div class="card" id="breadthCard"><h2 style="margin:0 0 4px">시장 상태 <span class="muted" style="font-weight:400;font-size:13px">KRX ${esc(d.asOf)} 종가 · ${esc(d.since)} 이후 ${d.days.toLocaleString()}거래일 중 위치</span></h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:8px">${d.items.map(tile).join('')}</div>
    <div class="muted" style="font-size:11px;margin-top:6px">코스피+코스닥 보통주(폐지 종목 포함). 위치 = 이력 중 오늘 값 이하인 날의 비율. 그래프는 최근 1년. 합산 점수 없음 — 매매 신호가 아니라 맥락이다.</div></div>`;
}

const SECTOR_SUBS = [['heat', '히트맵'], ['tree', '테마 트리'], ['sens', '민감도'], ['rs', '상대강도']];

// ---------- 미국 기관(13F): Actions us-13f 가 분기마다 쓰는 docs/data/us-13f.json — 맥락 전용 ----------

    }
    return '<div class="card empty">불러오는 중…</div>';
  }
  const d = u13.data;
  if (d.missing) return '<div class="card empty">13F 데이터가 아직 없습니다.</div>';
  const m = d.meta, [P1, P] = m.compare, ft = m.filedThrough;
  const head = `<div class="card"><b>기준 ${esc(P)}</b> <span class="muted">(분기 말) · ${esc(ft.slice(0, 4))}-${esc(ft.slice(4, 6))}-${esc(ft.slice(6))} 제출분까지 · 제출 기관 ${fmtNum(m.filers[P])}곳 · ${esc(P1)} 대비 · 분기 말 45일 뒤 공개되는 롱 보유</span>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${[['flow', '종목별 흐름'], ['mgr', '집중 운용사']].map(([k, l]) =>

    <div class="table-wrap"><table><thead><tr><th>종목</th><th style="text-align:right">보유 기관</th><th class="m-hide">4분기 추이</th>

    ${all.length ? '' : '<p class="muted">일치하는 종목이 없습니다.</p>'}

const U13_CHG = { new: ['신규', 'pos'], add: ['증가', 'pos'], trim: ['감소', 'neg'], exit: ['이탈', 'neg'], same: ['유지', 'muted'] };

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center">${[['inv', '기관별'], ['stk', '종목별']].map(([k, l]) =>
      `<button class="chip${h5.sub === k ? ' active' : ''}" data-h5="${k}">${l}</button>`).join('')}
      <input class="search" id="h5Search" placeholder="${h5.sub === 'inv' ? '기관 이름 검색' : '종목명·코드 검색'}" value="${esc(h5.q)}" style="max-width:220px"></div></div>`;
  return head + (h5.sub === 'stk' ? h5Stocks(d) : h5Investors(d));
}
function h5Table(rows, first) {   // first: 'stock' = 종목 열, 'who' = 보고자 열
  return `<div class="table-wrap" style="margin-top:8px"><table><thead><tr><th>${first === 'stock' ? '종목' : '보고자'}</th><th style="text-align:right">지분율</th>
    <th style="text-align:right">직전 대비</th><th class="m-hide">목적</th><th class="m-hide">공시일</th><th>상태</th></tr></thead><tbody>${rows.map(r => `<tr>
    <td style="white-space:normal">${first === 'stock' ? `<b>${esc(r.name || r.t)}</b> <span class="muted">${esc(r.t)}</span>` : `<b>${esc(r.who)}</b>`}</td>
    <td style="text-align:right">${r.rate == null ? '-' : r.rate.toFixed(2) + '%'}${r.ye != null ? `<div class="muted" style="font-size:11px">연말 ${r.ye}%</div>` : ''}</td>
    <td style="text-align:right" class="${r.chg > 0 ? 'pos' : r.chg < 0 ? 'neg' : 'muted'}">${r.chg == null ? '-' : (r.chg > 0 ? '+' : '') + r.chg.toFixed(2)}</td>
    <td class="muted m-hide">${esc(r.tp || '-')}</td><td class="muted m-hide" style="white-space:nowrap">${h5d(r.date)}</td><td>${h5State(r)}</td></tr>`).join('')}</tbody></table></div>`;
}
function h5Investors(d) {
  const q = h5.q.trim().toLowerCase();
  const list = (q ? d.investors.filter(x => x.who.toLowerCase().includes(q)) : d.investors).slice(0, 40);
  if (!list.length) return '<div class="card empty">일치하는 기관이 없습니다.</div>';
  return list.map(x => {
    const ex = x.rows.filter(r => r.exited).length, st = x.rows.filter(r => r.stale && !r.exited).length;
    return `<details class="card" style="padding:10px 14px"><summary style="cursor:pointer"><b>${esc(x.who)}</b>
      <span class="muted">보유 ${x.n}종목${st ? ` · 오래된 보고 ${st}` : ''}${ex ? ` · 이탈 ${ex}` : ''}</span></summary>${h5Table(x.rows, 'stock')}</details>`;
  }).join('') + `<p class="muted" style="font-size:11px">${q ? '검색 결과' : '보유 종목 수 순'} 최대 40곳</p>`;
}
function h5Stocks(d) {
  if (!h5.byStock) {
    h5.byStock = {};
    for (const x of d.investors) for (const r of x.rows) (h5.byStock[r.t] ||= []).push({ ...r, who: x.who });
    for (const rs of Object.values(h5.byStock)) rs.sort((a, b) => (!!a.exited - !!b.exited) || (!!a.stale - !!b.stale) || ((b.rate || 0) - (a.rate || 0)));
  }
  const q = h5.q.trim().toLowerCase();
  const ts = Object.entries(d.stocks).filter(([t, s]) => h5.byStock[t] && (!q || t.includes(q) || (s.name || '').toLowerCase().includes(q)))
    .sort((a, b) => b[1].n - a[1].n).slice(0, 20);
  if (!ts.length) return '<div class="card empty">일치하는 종목이 없습니다.</div>';
  return ts.map(([t, s]) => `<details class="card" style="padding:10px 14px"${q && ts.length <= 3 ? ' open' : ''}><summary style="cursor:pointer"><b>${esc(s.name)}</b> <span class="muted">${esc(t)} · 5% 보유 ${s.n}${s.nStale ? ` · 오래된 보고 ${s.nStale}` : ''}${s.nExited ? ` · 이탈 ${s.nExited}` : ''}</span></summary>${h5Table(h5.byStock[t], 'who')}</details>`).join('')
    + `<p class="muted" style="font-size:11px">${q ? '검색 결과' : '보유자 많은 순'} 최대 20종목</p>`;
}
document.addEventListener('click', (e) => {
  const t = e.target.closest && e.target.closest('[data-h5]');

  h5.sub = t.dataset.h5;

// ---------- 증권사 의견 일지: Actions invest-opinion 이 평일 쓰는 docs/data/invest-opinion.json(KIS 종목투자의견, 관심종목 KR) — 맥락 전용 ----------

  const dateNav = q || !dates.length ? '' : `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${arrow(older, '이전 날짜', 'M15 18l-6-6 6-6')}
    <select class="mrep-sel" data-op-select aria-label="날짜">${dates.map(x => `<option value="${x}"${x === active ? ' selected' : ''}>${x.slice(2, 4)}.${ymd(x).replace('/', '.')} · ${rows0.filter(r => r.d === x).length}건</option>`).join('')}</select>
    ${arrow(newer, '다음 날짜', 'M9 18l6-6-6-6')}</div>`;
  const pct = v => v == null ? '<span class="muted">-</span>' : `<span class="${v > 0 ? 'pos' : v < 0 ? 'neg' : 'muted'}">${v > 0 ? '+' : ''}${v.toFixed(1)}%</span>`;

  const body = shown.map(r => `<tr>
      <td style="white-space:normal"><b>${esc(nm(r.t))}</b> <span class="muted">${esc(r.t)}</span>${q ? `<br><span class="muted" style="font-size:11px">${ymd(r.d)}</span>` : ''}</td>
      <td>${esc(r.b)}</td>
      <td>${r.po && r.po !== r.o ? `<span class="muted">${esc(r.po)} →</span> ` : ''}${esc(r.o || '-')}</td>
      <td style="text-align:right">${r.tp ? r.tp.toLocaleString() : '-'}${r.ptp && r.ptp !== r.tp ? `<div class="muted" style="font-size:11px">직전 ${r.ptp.toLocaleString()}</div>` : ''}</td>
      <td style="text-align:right">${pct(chgOf(r))}</td>
      <td class="m-hide" style="text-align:right">${pct(r.tp && r.pc ? (r.tp / r.pc - 1) * 100 : null)}</td></tr>`).join('');
  return `<div class="card"><b>증권사 의견 일지</b> <span class="muted">관심종목 · ${ymd(d.asOf)} 기준 · ${ymd(d.since)} 이후 ${d.rows.length.toLocaleString()}건 · 의견·목표가만(리포트 본문 없음)</span>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${KINDS.map(([k, l]) => `<button class="chip${op.kind === k ? ' active' : ''}" data-op-kind="${k}">${l}</button>`).join('')}</div>
    <input class="search" id="opSearch" placeholder="종목명·코드 검색 (전 기간)" value="${esc(op.q)}" style="max-width:240px;margin-bottom:8px">

}
document.addEventListener('click', (e) => {

// ---------- 장 마감 리포트: Claude 루틴이 쓴 reports/market-daily/<날짜>-<kr|us>.{md,facts.json,summary.json} ----------
// 숫자는 facts.json(코드가 수집), 원인·일정은 summary.json(Claude), 원문은 md. 배포 때 data/market-reports/ 로 복사된다.
const mrep = { index: null, sel: null, data: {} };
const mrepGet = (url, kind) => fetch(`${url}?t=${Date.now()}`).then(r => r.ok ? (kind === 'json' ? r.json() : r.text()) : null).catch(() => null);
function loadMarketReport(file) {
  mrep.sel = file;
  history.replaceState(null, '', `#mreport=${file.replace(/\.md$/, '')}`);
  if (mrep.data[file]) return render();
  mrep.data[file] = { loading: true };
  const b = `data/market-reports/${encodeURIComponent(file.replace(/\.md$/, ''))}`;
  Promise.all([mrepGet(`${b}.md`), mrepGet(`${b}.facts.json`, 'json'), mrepGet(`${b}.summary.json`, 'json')])
    .then(([text, facts, summary]) => { mrep.data[file] = { text, facts, summary }; if (state.tab === 'mreport') render(); });
}
function mrepBar(v, max) {   // 0 기준 좌우 막대 — 오른쪽 상승, 왼쪽 하락
  const w = max ? Math.min(50, Math.abs(v) / max * 50) : 0;
  return `<div style="position:relative;height:12px;background:#131a29;border-radius:3px;min-width:80px">
    <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)"></div>
    <div style="position:absolute;top:2px;bottom:2px;${v >= 0 ? 'left' : 'right'}:50%;width:${w}%;background:var(${v >= 0 ? '--up' : '--down'});border-radius:2px"></div></div>`;
}
const mrepSign = (v, unit = '') => v == null ? '-' : `<span class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${Number(v).toLocaleString()}${unit}</span>`;
const mrepT = (iso) => iso ? esc(String(iso).slice(5, 16).replace('T', ' ')) : '';
const MREP_CONF = { 높음: 'var(--accent)', 중간: 'var(--mid)', 낮음: 'var(--muted)', 미확정: 'var(--muted)' };
function mrepHead(title) { return `<h3 style="font-size:14px;margin:0 0 10px">${title}</h3>`; }

function renderMrepBody(file, d) {
  // 시안(artifact LM5VtBCGSzb8f3wVjcFLoS · Report)대로: 지수+한 줄 → 원인 카드 → 업종·수급·시장 폭 → 장 마감 뒤·내일 체크
  const f = d.facts, sm = d.summary || {};
  const kr = file.endsWith('-kr.md');
  const day = file.slice(0, 10);
  const S = (f && f.series) || [];
  const by = (g) => S.filter(r => r.group === g && r.chgPct != null);
  const sym = (x) => S.find(r => r.sym === x && r.close != null);
  const stale = S.filter(r => r.fresh === false);
  const hm = iso => !iso ? '' : String(iso).slice(0, 10) === day ? esc(String(iso).slice(11, 16)) : mrepT(iso);   // 같은 날이면 시각만
  const cardGrid = (cards, min = 330) => cards.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,${min}px),1fr));gap:14px;align-items:start;margin-bottom:14px">${cards.join('')}</div>` : '';
  const out = [];

  // 0) 신선도 배지(있을 때만)
  const badges = [f && f.backfill ? '<span class="chip">백필</span>' : '', !f ? '<span class="chip">숫자 파일 없음</span>' : '',
    stale.length ? `<span class="chip" style="border-color:var(--mid);color:var(--mid)">날짜 다른 값 ${stale.length}</span>` : ''].filter(Boolean).join(' ');
  if (badges) out.push(`<div style="margin-bottom:10px">${badges}</div>`);

  // 1) 지수 카드 + 한 줄
  const idx = by('지수');
  const headline = sm.headline || ((d.text || '').match(/한 줄:\s*(.+)/) || [])[1];
  const krTv = (code) => (((f && f.kr) || {})[code] || {}).tradingValue조원;
  const idxCards = idx.map(r => {
    const diff = r.prevClose != null ? r.close - r.prevClose : null, tv = kr ? krTv(r.name) : null;
    return `<div class="card mrep-idx" style="${r.fresh === false ? 'opacity:.5' : ''}">
      <div class="muted" style="font-size:12px">${esc(r.name)}${r.fresh === false ? ` · ${esc(r.barDate)} 값` : ''}</div>
      <div class="num mrep-big">${Number(r.close).toLocaleString(undefined, { maximumFractionDigits: 2 })}</div>
      <div class="num ${r.chgPct >= 0 ? 'pos' : 'neg'}" style="font-size:15px">${r.chgPct >= 0 ? '▲' : '▼'}${diff != null ? ` ${Math.abs(diff).toLocaleString(undefined, { maximumFractionDigits: Math.abs(diff) >= 100 ? 0 : 2 })} ·` : ''} ${r.chgPct >= 0 ? '+' : '−'}${Math.abs(r.chgPct).toFixed(2)}%</div>
      <div class="muted" style="font-size:12px;margin-top:6px">5일 ${mrepSign(r.chg5dPct, '%')}${tv != null ? ` · 거래대금 <span class="num">${tv.toFixed(1)}조</span>` : ''}</div></div>`;
  });
  if (idxCards.length || headline) out.push(`<div class="mrep-top">${idxCards.join('')}${headline ? `<div class="card mrep-head"><span class="mrep-cap">한 줄</span><p>${esc(headline)}</p></div>` : ''}</div>`);

  // 2) 왜 움직였나 — 근거 시각·반응·반론을 펼쳐 둔다
  const causes = sm.causes || [];
  out.push('<h3 style="font-size:17px;margin:6px 0 12px">왜 움직였나</h3>');
  out.push(causes.length ? cardGrid(causes.map((c, i) => `<article class="card" style="margin:0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:10px"><span class="mrep-no num">${i + 1}</span><strong style="flex:1;font-size:15px">${esc(c.title || '')}</strong>
      <span class="mrep-conf" style="color:${MREP_CONF[c.confidence] || 'var(--muted)'}">확신 ${esc(c.confidence || '-')}</span></div>
    ${(c.evidence || []).length ? `<div class="mrep-ev">${c.evidence.map(e => `<div><span class="num muted" style="font-size:12px">${hm(e.timeKST)}</span> <span class="muted" style="font-size:12px">${esc(e.source || '')}</span>
      <div>${esc(e.text || '')}${e.url ? ` <a href="${esc(e.url)}" target="_blank" rel="noopener">원문↗</a>` : ''}</div></div>`).join('')}</div>` : ''}
    ${c.reaction || c.counter ? `<div class="mrep-rc">${c.reaction ? `<span class="muted">반응</span><span>${esc(c.reaction)}</span>` : ''}${c.counter ? `<span class="muted">반론</span><span style="color:#c9d1dc">${esc(c.counter)}</span>` : ''}</div>` : ''}
  </article>`), 420) : '<div class="card"><p class="muted" style="font-size:13px;margin:0">구조화 요약(summary.json)이 없습니다 — 아래 원문을 보세요.</p></div>');

  const grid = [];
  // 3a) 업종·섹터 — 오늘 막대 + 5일
  const sec = by(kr ? '업종ETF' : '섹터').sort((a, b) => b.chgPct - a.chgPct);
  if (sec.length) {
    const max = Math.max(...sec.map(r => Math.abs(r.chgPct)));
    grid.push(`<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><h3 style="font-size:15px;margin:0">${kr ? '업종 ETF' : '섹터 ETF'}</h3><span class="muted" style="font-size:12px">오늘 · 5일</span></div>${sec.map(r => `
      <div class="mrep-sec"><span>${esc(r.name.replace(/^(KODEX|TIGER|SOL|PLUS|ACE|RISE) /, ''))}</span>${mrepBar(r.chgPct, max)}<span class="num ${r.chgPct >= 0 ? 'pos' : 'neg'}" style="text-align:right">${r.chgPct >= 0 ? '+' : '−'}${Math.abs(r.chgPct).toFixed(2)}</span><span class="num muted" style="text-align:right">${r.chg5dPct == null ? '-' : (r.chg5dPct >= 0 ? '+' : '−') + Math.abs(r.chg5dPct).toFixed(2)}</span></div>`).join('')}</div>`);
  }
  // 3b) 한국: 수급 표 + 시장 폭 · 시총 상위
  if (kr && f) {
    const mk = Object.entries(f.kr || {});
    const flows = mk.filter(([, v]) => v.flows억원 && v.flows억원.외국인 != null);
    const br = mk.filter(([, v]) => v.breadth);
    const flowTable = flows.length ? `<div class="table-wrap"><table class="mrep-tbl"><thead><tr><th>억원</th><th>외국인</th><th>기관</th><th>개인</th><th>프로그램</th></tr></thead><tbody>${flows.map(([code, v]) =>
      `<tr><td>${code} <span class="muted" style="font-size:11px">${/확정/.test(v.note || '') ? '확정' : '잠정'}</span></td>${['외국인', '기관', '개인'].map(k => `<td class="num">${mrepSign(v.flows억원[k])}</td>`).join('')}<td class="num">${v.program억원 && v.program억원.합계 != null ? mrepSign(v.program억원.합계) : '<span class="muted">-</span>'}</td></tr>`).join('')}</tbody></table></div>` : '';
    const breadth = br.map(([code, v]) => {
      const b = v.breadth, up = (b.상승 || 0) + (b.상한 || 0), dn = (b.하락 || 0) + (b.하한 || 0), fl = b.보합 || 0, tot = up + dn + fl || 1;
      return `<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${code}</span><span class="num muted" style="font-size:12px">상승 ${up.toLocaleString()}${b.상한 ? ` (상한 ${b.상한})` : ''} · 보합 ${fl} · 하락 ${dn.toLocaleString()}${b.하한 ? ` (하한 ${b.하한})` : ''}</span></div>
        <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px;gap:2px"><div style="width:${up / tot * 100}%;background:var(--up)"></div><div style="width:${fl / tot * 100}%;background:#3a4350"></div><div style="flex:1;background:var(--down)"></div></div></div>`;
    }).join('');
    grid.push(`<div class="card" style="margin:0"><h3 style="font-size:15px;margin:0 0 12px">수급 · 시장 폭</h3>${flowTable || '<p class="muted" style="font-size:12px">수급 수집 안 됨</p>'}${breadth || '<p class="muted" style="font-size:12px;margin-top:10px">시장 폭 수집 안 됨(과거 날짜는 네이버가 당일만 준다)</p>'}</div>`);
    const top = (mk.find(([c]) => c === 'KOSPI') || [, {}])[1].topByMcap;
    if (top && top.length) grid.push(`<div class="card" style="margin:0"><h3 style="font-size:15px;margin:0 0 10px">KOSPI 시총 상위</h3><table class="mrep-tbl"><tbody>${top.slice(0, 10).map(t => `<tr><td>${esc(t.name)}</td><td class="num">${mrepSign(t.chgPct, '%')}</td><td class="num muted">${t.mcap조원 ?? '-'}조</td></tr>`).join('')}</tbody></table><p class="muted" style="font-size:11px;margin:6px 0 0">지수 기여도 아님 — 등락률과 시총만</p></div>`);
  }
  // 3c) 미국: 금리·위험 · 대형 기술주(정규장 vs 시간외)
  if (!kr && f) {
    const tile = (label, r, val, chg) => r ? `<div class="mrep-tile" style="${r.fresh === false ? 'opacity:.5' : ''}"><div class="muted" style="font-size:11px">${label}</div><div class="num" style="font-size:15px;font-weight:600">${val}</div><div class="num" style="font-size:12px">${chg}</div></div>` : '';
    const v = (x, dg = 2) => Number(x).toLocaleString(undefined, { maximumFractionDigits: dg });
    const tnx = sym('^TNX'), rsp = sym('RSP'), spy = sym('SPY');
    const t2 = f.us2y && f.us2y.value != null ? `<div class="mrep-tile"><div class="muted" style="font-size:11px">2년물 (${esc(f.us2y.date)})</div><div class="num" style="font-size:15px;font-weight:600">${f.us2y.value}%</div><div class="num" style="font-size:12px">${mrepSign(f.us2y.chgBp, 'bp')}</div></div>` : '';
    grid.push(`<div class="card" style="margin:0"><h3 style="font-size:15px;margin:0 0 12px">금리 · 달러 · 위험</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px">
      ${tile('10년물', tnx, tnx ? v(tnx.close, 3) + '%' : '', tnx ? mrepSign(tnx.chgBp, 'bp') : '')}${t2}
      ${[['DX-Y.NYB', '달러인덱스'], ['KRW=X', '원/달러'], ['^VIX', 'VIX'], ['CL=F', 'WTI'], ['GC=F', '금'], ['BTC-USD', '비트코인'], ['EWY', 'EWY(한국)'], ['ES=F', 'S&P 선물'], ['NQ=F', '나스닥 선물']]
        .map(([s, l]) => { const r = sym(s); return tile(l, r, r ? v(r.close) : '', r ? mrepSign(r.chgPct, '%') : ''); }).join('')}</div>
      ${rsp && spy ? `<p style="font-size:12px;margin:10px 0 0">시장 폭: 동일가중 RSP − 시총가중 SPY = ${mrepSign(Math.round((rsp.chgPct - spy.chgPct) * 100) / 100, '%p')} <span class="muted">(양수면 고르게, 음수면 대형주 쏠림)</span></p>` : ''}</div>`);
    const ah = (f.afterHours || []).filter(a => a.regularClose != null);
    if (ah.length) grid.push(`<div class="card" style="margin:0"><h3 style="font-size:15px;margin:0 0 10px">대형 기술주 — 정규장 · 시간외</h3><table class="mrep-tbl"><thead><tr><th>종목</th><th>정규장</th><th>시간외</th><th>시각(ET)</th></tr></thead><tbody>${ah.map(a => `<tr><td>${esc(a.sym)}</td><td class="num">${mrepSign(a.regularChgPct, '%')}</td><td class="num">${a.ahChgPct == null ? '<span class="muted">-</span>' : mrepSign(a.ahChgPct, '%')}</td><td class="num muted">${a.ahTimeET ? esc(a.ahTimeET.slice(11, 16)) : ''}</td></tr>`).join('')}</tbody></table></div>`);
  }
  // 3d) 장 마감 뒤 · 내일 체크(일정·관찰·연구 메모)
  const tl = (rows) => `<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px">${rows.map(x => `<span class="num muted">${hm(x.timeKST)}</span><span>${esc(x.text || '')}</span>`).join('')}</div>`;
  if ((sm.afterClose || []).length) grid.push(`<div class="card" style="margin:0"><h3 style="font-size:15px;margin:0 0 10px">장 마감 뒤</h3>${tl(sm.afterClose)}</div>`);
  if ((sm.watch || []).length || (sm.events || []).length || (sm.researchNotes || []).length) grid.push(`<div class="card" style="margin:0;background:#151d2c"><h3 style="font-size:15px;margin:0 0 10px">${kr ? '내일 체크' : '오늘 한국장 · 오늘 밤 미국'}</h3>
    ${(sm.watch || []).length ? `<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13px">${sm.watch.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    ${(sm.events || []).length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${sm.events.map(e => `<span class="mrep-chip">${esc(String(e.timeKST || '').slice(5, 10))} ${esc(e.text || '')}</span>`).join('')}</div>` : ''}
    ${(sm.researchNotes || []).map(n => `<p class="muted" style="font-size:12px;margin:12px 0 0">연구 메모 · ${esc(n.condition || '')} — ${esc(n.note || '')}</p>`).join('')}</div>`);
  out.push(cardGrid(grid));

  // 4) 수집 안 됨 · 원문
  if (f && (f.missing || []).length) out.push(`<p class="muted" style="font-size:11px;margin-bottom:8px">수집 안 됨: ${f.missing.map(esc).join(' / ')}</p>`);
  if (d.text) out.push(`<details class="card"><summary style="cursor:pointer">원문 리포트</summary><pre style="white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:1.6;margin:10px 0 0">${esc(d.text).replace(/https?:\/\/[^\s)<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`)}</pre></details>`);
  return out.join('');
}

function renderMarketReports() {
  if (mrep.index === null) {
    mrep.index = [];
    mrepGet('data/market-reports/index.json', 'json').then(j => {
      mrep.index = (j && j.files) || [];
      const want = ((location.hash.match(/^#mreport=([\w-]+)/) || [])[1] || '') + '.md';
      if (mrep.index.length) loadMarketReport(mrep.index.includes(want) ? want : mrep.index[0]); else render();
    });
    return '<div class="card empty">불러오는 중…</div>';
  }
  if (!mrep.index.length) return '<div class="card empty">아직 리포트가 없습니다. 평일 18:10(한국)·07:00(미국)에 생깁니다.</div>';
  const byDate = {};
  for (const f of mrep.index) { const m = f.match(/^(\d{4}-\d{2}-\d{2})-(kr|us)\.md$/); if (m) (byDate[m[1]] = byDate[m[1]] || {})[m[2]] = f; }
  const dates = Object.keys(byDate).sort().reverse();                       // 최신이 앞

// VM yt-digest 가 오선의 미국 증시·매경 라이브·소수몽키·매경 월가월부 새 영상을 Gemini 로 요약해 쌓는다. 남의 콘텐츠 요약이라 저장소엔 없고,
// VM /yt 에서 키(X-Pin-Key — '내 관심종목' 동기화와 같은 키)로만 받는다. 맥락 전용 — 점수·매매 불사용.
const YT_URL = 'https://wonithink-stock.duckdns.org/yt';
const yt = { data: null, err: null, ch: '전체', open: {}, at: 0, loading: false };
function ytLoad() {
  if (yt.loading) return;
  yt.loading = true;
  fetch(YT_URL, { headers: { 'X-Pin-Key': lsGet('pinKey', '') } })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { yt.data = j.items || []; yt.err = null; yt.at = Date.now(); })
    .catch(e => { yt.err = e; if (!yt.data) yt.data = []; })
    .finally(() => {
      yt.loading = false;
      if (state.tab !== 'yt') return;
      render();
      if (yt.focus) setTimeout(() => { const el = document.querySelector(`[data-ytid="${yt.focus}"]`); if (el) { el.scrollIntoView(); yt.focus = null; } }, 50);   // 텔레그램 링크(#yt=ID)로 들어오면 그 영상으로
    });
}
function renderYt() {
  if (!lsGet('pinKey', '')) return '<div class="card empty">이 기기에 키가 없습니다. 텔레그램 1:1 방의 동기화 링크(#pinkey=…)를 한 번 열면 보입니다.</div>';
  if (yt.data === null || Date.now() - yt.at > 300000) ytLoad();
  if (yt.data === null) return '<div class="card empty">불러오는 중…</div>';
  if (yt.err && !yt.data.length) return `<div class="card empty">${yt.err === 401 ? '키가 맞지 않습니다. 텔레그램의 동기화 링크를 다시 여세요.' : '불러오지 못했습니다(' + esc(String(yt.err)) + '). 잠시 뒤 다시 열어 보세요.'}</div>`;
  const chans = ['전체', ...new Set(yt.data.map(x => x.channel))];
  const items = yt.data.filter(x => yt.ch === '전체' || x.channel === yt.ch).sort((a, b) => b.published.localeCompare(a.published));
  if (!items.length) return '<div class="card empty">아직 요약이 없습니다. 새 영상이 올라오면 20분 안에 생깁니다.</div>';
  const li = (a) => (a || []).map(p => `<li>${esc(p)}</li>`).join('');
  let day = '', html = '';
  items.forEach((x, i) => {
    const d = x.published.slice(0, 10);
    if (d !== day) { day = d; html += `<h3 style="margin:18px 0 8px">${esc(d.slice(5))}</h3>`; }
    const s = x.digest || {};
    const open = yt.open[x.id] ?? i === 0;
    html += `<details class="card" data-ytid="${esc(x.id)}"${open ? ' open' : ''} style="margin-bottom:10px">
      <summary style="cursor:pointer"><span class="mrep-chip">${esc(x.channel)}</span> <span class="muted" style="font-size:12px">${esc(x.published.slice(11, 16))}</span><br><b>${esc(x.title)}</b></summary>
      <p style="font-weight:600;margin:12px 0 6px">${esc(s.headline || '')}</p>
      ${(s.brief || []).length ? `<ul style="margin:0 0 10px;padding-left:20px;line-height:1.6">${li(s.brief)}</ul>` : ''}
      <h4 style="margin:12px 0 4px">전체 요약</h4>
      <p style="margin:0 0 10px;line-height:1.6">${esc(s.summary || '')}</p>
      ${(s.sections || []).map(sec => `<h4 style="margin:12px 0 4px">${esc(sec.title)}</h4><ul style="margin:0;padding-left:20px;line-height:1.6">${li(sec.points)}</ul>`).join('')}
      ${(s.mentioned || []).length ? `<h4 style="margin:12px 0 4px">언급 종목·자산</h4><ul style="margin:0;padding-left:20px;line-height:1.6">${s.mentioned.map(m => `<li><b>${esc(m.name)}</b> — ${esc(m.view)}</li>`).join('')}</ul>` : ''}
      ${(s.numbers || []).length ? `<h4 style="margin:12px 0 4px">나온 숫자</h4><ul style="margin:0;padding-left:20px">${li(s.numbers)}</ul>` : ''}
      ${(s.caveats || []).length ? `<h4 style="margin:12px 0 4px">유의</h4><ul style="margin:0;padding-left:20px">${li(s.caveats)}</ul>` : ''}
      <p class="muted" style="font-size:12px;margin:12px 0 0"><a href="${esc(x.url)}" target="_blank" rel="noopener">영상 보기 ↗</a> · ${esc(x.model || '')} 요약</p>
    </details>`;
  });
  return `<div class="mrep-tabs" style="flex-wrap:wrap;margin-bottom:12px" role="tablist" aria-label="채널">${chans.map(c => `<button role="tab" aria-selected="${yt.ch === c}" class="${yt.ch === c ? 'on' : ''}" data-ytch="${esc(c)}">${esc(c)}</button>`).join('')}</div>${html}
    <p class="muted" style="font-size:11px">AI(Gemini)가 영상을 듣고 정리한 글이라 틀린 곳이 있을 수 있습니다. 중요한 숫자는 영상에서 확인하세요. 시황 정리이며 매매 권유가 아닙니다.</p>`;
}

function renderRr() {
  if (!lsGet('pinKey', '')) return '<div class="card empty">이 기기에 키가 없습니다. 텔레그램 1:1 방의 동기화 링크(#pinkey=…)를 한 번 열면 보입니다.</div>';
  if (rr.data === null || Date.now() - rr.at > 300000) rrLoad();
  if (rr.data === null) return '<div class="card empty">불러오는 중…</div>';
  if (rr.err && !rr.data.length) return `<div class="card empty">${rr.err === 401 ? '키가 맞지 않습니다. 텔레그램의 동기화 링크를 다시 여세요.' : '불러오지 못했습니다(' + esc(String(rr.err)) + '). 잠시 뒤 다시 열어 보세요.'}</div>`;
  const srcs = ['전체', ...new Set(rr.data.map(x => x.source))];
  const items = rr.data.filter(x => rr.src === '전체' || x.source === rr.src).sort((a, b) => b.published.localeCompare(a.published));
  if (!items.length) return '<div class="card empty">아직 분석한 리포트가 없습니다.</div>';
  const ul = (a) => (a || []).length ? `<ul style="margin:0;padding-left:20px;line-height:1.6">${a.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : '<span class="muted">없음</span>';
  const kv = (a) => (a || []).length ? `<ul style="margin:0;padding-left:20px;line-height:1.6">${a.map(p => `<li><b>${esc(p.k)}</b> — ${esc(p.v)}</li>`).join('')}</ul>` : '<span class="muted">없음</span>';
  const h = (t) => `<h4 style="margin:14px 0 4px">${esc(t)}</h4>`;
  const html = items.map((x, i) => {
    const open = rr.open[x.id] ?? false;
    const mm = (x.mismatches || []).length;
    const counter = (x.counter || []).map(c => `<li><span class="mrep-chip">${c.type === 'stated' ? '리포트가 적음' : '안 보임'}</span> ${esc(c.text)}</li>`).join('');
    const checks = (x.checks || []).length ? `<div style="overflow-x:auto"><table style="width:100%;font-size:12px;border-collapse:collapse"><tr><th align="left">항목</th><th align="left">리포트</th><th align="left">공시(DART·SEC)</th><th align="left">결과</th></tr>${x.checks.map(c => `<tr><td>${esc(c.item)}</td><td>${esc(c.report)}</td><td>${esc(c.dart)}</td><td>${esc(c.result)}</td></tr>`).join('')}</table></div>` : '';
    return `<details class="card" data-rrid="${esc(x.id)}"${open ? ' open' : ''} style="margin-bottom:10px">
      <summary style="cursor:pointer"><span class="mrep-chip">${esc(x.source)}</span> <span class="muted" style="font-size:12px">${esc(x.published)} · ${esc(x.ticker)}</span>${mm ? ` <span class="mrep-chip" style="color:#d33">원문과 안 맞는 곳 ${mm}건</span>` : ' <span class="mrep-chip">안 맞는 곳 0건</span>'}<br><b>${esc(x.name)}</b> — ${esc(x.title)}</summary>
      <p style="font-weight:600;margin:12px 0 6px">${esc(x.verdict)}</p>
      <p class="muted" style="font-size:12px;margin:0">원문 의견: ${esc(x.stance)}</p>
      ${h('주장')}<p style="margin:0;line-height:1.6">${esc(x.claim)}</p>
      ${h('가정(결과를 좌우하는 것)')}${kv(x.assumptions)}
      ${h('밸류에이션')}<p style="margin:0 0 6px;line-height:1.6">${esc((x.valuation || {}).summary || '')}</p>${kv((x.valuation || {}).rows)}
      ${h('반대 근거')}${counter ? `<ul style="margin:0;padding-left:20px;line-height:1.6;list-style:none">${counter}</ul>` : '<span class="muted">없음</span>'}
      ${h('숫자 대조')}${checks}
      ${h('원문과 안 맞는 곳')}${ul(x.mismatches)}
      ${h('확인 못 함')}${ul(x.unknown)}
      ${h('다음 확인 날짜')}${(x.nextDates || []).length ? `<ul style="margin:0;padding-left:20px;line-height:1.6">${x.nextDates.map(d => `<li><b>${esc(d.date)}</b> — ${esc(d.what)}</li>`).join('')}</ul>` : '<span class="muted">없음</span>'}
      <p class="muted" style="font-size:12px;margin:14px 0 0"><a href="${esc(x.url)}" target="_blank" rel="noopener">원문 PDF ↗</a> · 분석 ${esc(x.analyzedAt)} · 읽은 범위: ${esc(x.readCoverage)}</p>
    </details>`;
  }).join('');
  return `<p class="muted" style="font-size:12px;margin:0 0 10px">개인 열람용 — 남의 리포트를 읽고 공시와 대조한 기록입니다. 의견·목표가는 판단 근거로 쓰지 않았고 점수·매매에 연결하지 않습니다. 분석 중 '내 계산'은 제가 만든 산술이라 원문 값과 다를 수 있습니다.</p>
    <div class="mrep-tabs" style="flex-wrap:wrap;margin-bottom:12px" role="tablist" aria-label="출처">${srcs.map(c => `<button role="tab" aria-selected="${rr.src === c}" class="${rr.src === c ? 'on' : ''}" data-rrsrc="${esc(c)}">${esc(c)}</button>`).join('')}</div>${html}`;
}

  else if (state.tab === 'regime') el.innerHTML = renderPortfolio('regime');

  else if (state.tab === 'reco') el.innerHTML = renderReco();

/** 검색어는 innerHTML 재생성 시 포커스를 잃으므로 커서 위치를 복원한다 */
function renderKeepingFocus(inputId = 'stockSearch') {
  const el = document.getElementById(inputId);
  const pos = el ? el.selectionStart : null;
  render();
  const next = document.getElementById(inputId);
  if (next && el) { next.focus(); if (pos !== null) next.setSelectionRange(pos, pos); }
}

document.getElementById('content').addEventListener('click', (e) => {
  const t = e.target;

  const a5m = t.closest('[data-a5-market]');
  if (a5m) { state.a5Market = a5m.dataset.a5Market; state.a5Limit = 100; return render(); }
  if (t.closest('[data-a5-liq]')) { state.a5Liq = !state.a5Liq; state.a5Limit = 100; return render(); }
  if (t.closest('[data-a5-more]')) { state.a5Limit = (state.a5Limit || 100) + 200; return render(); }

  // 보기 전환
  const view = t.closest('[data-view]');
  if (view) { state.viewMode = view.dataset.view; return render(); }

  // 시장/지수 배너
  const mi = t.closest('[data-market-index]');
  if (mi) { state.marketIndexFilter = mi.dataset.marketIndex; return render(); }

  // ETF 자산군/세부 배너
  const ea = t.closest('[data-etf-asset]');
  if (ea) { state.etfAssetClass = ea.dataset.etfAsset; state.etfSubClass = 'all'; return render(); }
  const es = t.closest('[data-etf-sub]');
  if (es) { state.etfSubClass = es.dataset.etfSub; return render(); }
  const evs = t.closest('[data-events-scope]');
  if (evs) { state.eventsScope = evs.dataset.eventsScope; return render(); }
  const em = t.closest('[data-events-month]');
  if (em) { state.eventsMonth = em.dataset.eventsMonth; state.eventsDay = null; return render(); }
  const ed = t.closest('[data-events-day]');
  if (ed) { state.eventsDay = ed.dataset.eventsDay; return render(); }
  const ep = t.closest('[data-etf-pick]');
  if (ep) { state.etfPick = ep.dataset.etfPick || null; render(); if (state.etfPick) window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  // 필터 칩
  const sec = t.closest('[data-sector]');
  if (sec) { state.sectorFilter = sec.dataset.sector; return render(); }
  const gr = t.closest('[data-grade]');
  if (gr) { state.gradeFilter = gr.dataset.grade; return render(); }
  const gp = t.closest('[data-group]');
  if (gp) { state.groupFilter = gp.dataset.group; return render(); }
  if (t.closest('[data-filter-reset]')) { state.sectorFilter = state.gradeFilter = state.groupFilter = 'all'; return render(); }

  const df = t.closest('[data-disc-filter]');
  if (df) { state.discFilter = df.dataset.discFilter; return render(); }
  const ng = t.closest('[data-news-group]');
  if (ng) { state.newsGroup = ng.dataset.newsGroup; return render(); }
  const fm = t.closest('[data-flows-market]');
  if (fm) { state.flowsMarket = fm.dataset.flowsMarket; return render(); }
  const fd = t.closest('[data-flows-date]');
  if (fd) { state.flowsDateIdx = Number(fd.dataset.flowsDate); return render(); }
  const ls = t.closest('[data-live-select]');
  if (ls) { state.live.selected = ls.dataset.liveSelect; return render(); }
  const ltf = t.closest('[data-live-timeframe]');
  if (ltf) { state.live.view = 'intraday'; state.live.timeframe = Number(ltf.dataset.liveTimeframe); return render(); }
  const lct = t.closest('[data-live-charttype]');
  if (lct) { state.live.chartType = lct.dataset.liveCharttype; return render(); }
  const lp = t.closest('[data-live-period]');
  if (lp) { state.live.view = 'period'; state.live.period = lp.dataset.livePeriod; return render(); }
  const ld = t.closest('[data-live-date]');
  if (ld) { state.live.date = null; return render(); }  // "오늘(실시간)" 버튼 - 값은 today뿐

  // 업종 비고 펼치기 (업종 헤더 토글보다 먼저 처리)
  const nt = t.closest('[data-note-toggle]');
  if (nt) { const k = nt.dataset.noteToggle; state.openNotes[k] = !state.openNotes[k]; return render(); }

  // 종목 비고 버튼
  const ib = t.closest('button.info-btn[data-row]');
  if (ib) { const k = ib.dataset.row; state.openRows[k] = !state.openRows[k]; return render(); }

  // 정렬 (ETF 탭 전용 - 종목 스코어 탭의 정렬 상태와 분리)
  const etfSortTh = t.closest('th[data-etf-sort]');
  if (etfSortTh) {
    const k = etfSortTh.dataset.etfSort;
    if (state.etfSortKey === k) state.etfSortDir = state.etfSortDir === 'asc' ? 'desc' : 'asc';
    else { state.etfSortKey = k; state.etfSortDir = k === 'name' ? 'asc' : 'desc'; }
    return render();
  }

  // 정렬
  const sortTh = t.closest('th.sortable');
  if (sortTh) {
    const k = sortTh.dataset.sort;
    if (state.sortKey === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    else { state.sortKey = k; state.sortDir = (k === 'name' || k === 'sector') ? 'asc' : 'desc'; }
    return render();
  }

  // 긴 표 더 보기
  const mb = t.closest('[data-more]');
  if (mb) { const st = state.lim[mb.dataset.more]; if (st) st.n = mb.dataset.all ? Infinity : st.n + LIMIT_STEP; return render(); }

  // 업종 블록 접기
  const st = t.closest('[data-sector-toggle]');
  if (st) { const k = st.dataset.sectorToggle; state.secOpen[k] = !state.secOpen[k]; return render(); }

  // 추천 이력 - 날짜 칩 선택
  const rd = t.closest('[data-reco-date]');
  if (rd) { state.recoDate = rd.dataset.recoDate; return render(); }
  const rm = t.closest('[data-reco-market]');
  if (rm) { state.recoMarket = rm.dataset.recoMarket; return render(); }

  // 종목명 클릭 → 상세 차트 모달 (비고 토글보다 먼저 처리)
  const ch = t.closest('[data-chart]');
  if (ch) { e.stopPropagation(); return openStockDetail(ch.dataset.chart, ch.dataset.chartName, ch.dataset.chartVtab); }

  // 종목 행 클릭 → 비고 토글
  const row = t.closest('tr.clickable[data-row]');
  if (row) { const k = row.dataset.row; state.openRows[k] = !state.openRows[k]; return render(); }
});

// 한글 IME: 조합 중(e.isComposing)에 다시 그리면 입력창이 새로 만들어져 조합이 끊긴다('삼' → 'ㅅㅏㅁ', 2026-09-26 신고).
// 조합 중에는 건너뛰고 조합이 끝날 때(compositionend) 한 번 반영한다.
function onSearchInput(e) {
  if (e.target.id === 'stockSearch') { state.search = e.target.value; return renderKeepingFocus('stockSearch'); }
  if (e.target.id === 'recoSearch') { state.recoSearch = e.target.value; return renderKeepingFocus('recoSearch'); }
  if (e.target.id === 'etfSearch') { state.etfSearch = e.target.value; return renderKeepingFocus('etfSearch'); }
  if (e.target.id === 'a5Search') { state.a5Search = e.target.value; state.a5Limit = 100; return renderKeepingFocus('a5Search'); }
  if (e.target.id === 'u13Search') { u13.q = e.target.value; return renderKeepingFocus('u13Search'); }
  if (e.target.id === 'opSearch') { op.q = e.target.value; return renderKeepingFocus('opSearch'); }
  if (e.target.id === 'h5Search') { h5.q = e.target.value; return renderKeepingFocus('h5Search'); }
}
document.getElementById('content').addEventListener('input', (e) => { if (!e.isComposing) onSearchInput(e); });
document.getElementById('content').addEventListener('compositionend', onSearchInput);

  const w = e.target.closest && e.target.closest('[data-themewin]');
  if (w) { state.themeWin = w.dataset.themewin; return render(); }
  const t = e.target.closest && e.target.closest('[data-themetoggle]');
  if (!t) return;
  const key = t.dataset.themetoggle;
  if (key === '__all') {
    const tree = (state.themeStrength || {}).tree || [];
    const keys = tree.flatMap(b => [b.key, ...b.subs.map(k => k.key)]);
    const openAll = !keys.every(k => state.themeOpen[k]);
    state.themeOpen = openAll ? Object.fromEntries(keys.map(k => [k, true])) : {};
  } else {
    state.themeOpen[key] = !state.themeOpen[key];
  }
  render();
});

// 맨 위 지표 띠·리포트 요약·업종 강약은 가장 최근 한국장 마감 리포트(facts·summary)에서 읽는다(시안 2026-10-13).
const homeRep = { loading: false, file: null, facts: null, summary: null };
function loadHomeReport() {
  if (homeRep.loading) return;
  homeRep.loading = true;
  mrepGet('data/market-reports/index.json', 'json').then(j => {
    const f = ((j && j.files) || []).filter(x => /-kr\.md$/.test(x)).sort().pop();
    if (!f) return;
    const b = `data/market-reports/${encodeURIComponent(f.replace(/\.md$/, ''))}`;
    return Promise.all([mrepGet(`${b}.facts.json`, 'json'), mrepGet(`${b}.summary.json`, 'json')]).then(([facts, summary]) => {
      Object.assign(homeRep, { file: f, facts, summary });
      if (state.tab === 'today') render();
    });
  });
}
// 장중(평일 09:00~15:30 KST) 홈 맨 위 = 지수·잠정 수급(VM /market-trend, 60초) + 관심종목 현재가(VM /kr-intraday, 10분).
// 네이버가 장 상태를 OPEN 이 아니라고 하면(휴장일 등) 또는 자료가 없으면 마감 리포트로 돌아간다(2026-10-20).
// 홈 수급 — 시장당 한 줄, 외국인·기관·개인 순(막대 없이 숫자만, 2026-10-20 사용자 요청)
const flowTable = (rows, unit) => `<table class="home-flow" style="width:100%;font-size:13px"><thead><tr><th></th><th style="text-align:right">외국인</th><th style="text-align:right">기관</th><th style="text-align:right">개인</th></tr></thead><tbody>${

  const mf = state.marketFlows;
  if (mf && mf.markets) {
    const latest = ['KOSPI', 'KOSDAQ'].map(m => { const days = (mf.markets[m] || {}).days || []; return [m, days[days.length - 1]]; }).filter(x => x[1]);
    const blocks = latest.length ? flowTable(latest.map(([m, d]) => [`${m} ${d.date.slice(4, 6)}/${d.date.slice(6, 8)}`,
      ['외국인', '기관합계', '개인'].map(n => (d.items.find(x => x.name === n) || {}).net)]), fmtEok) : '';
    cards.push(card('시장 수급', 'flows', '시장수급',
      blocks ? `${blocks}<p class="muted" style="margin:10px 0 0;font-size:11px">순매수, 가장 최근 확정일 기준</p>` : empty));
  }

  // 2-1) 업종 강약 — 가장 최근 한국장 마감 리포트의 업종 ETF 위·아래 3개
  const sec = ((homeRep.facts && homeRep.facts.series) || []).filter(r => r.group === '업종ETF' && r.chgPct != null).sort((a, b) => b.chgPct - a.chgPct);
  if (sec.length >= 6) {
    const smax = Math.max(...sec.map(r => Math.abs(r.chgPct)));
    const row = r => `<div class="home-bar"><span>${esc(r.name.replace(/^(KODEX|TIGER|SOL|PLUS|ACE|RISE)\s+/, ''))}</span>${mrepBar(r.chgPct, smax)}<span class="num ${r.chgPct >= 0 ? 'pos' : 'neg'}" style="text-align:right">${r.chgPct >= 0 ? '+' : '−'}${Math.abs(r.chgPct).toFixed(2)}%</span></div>`;
    cards.push(card('업종 강약', 'sector', '섹터강도',
      `${sec.slice(0, 3).map(row).join('')}<div style="height:1px;background:var(--border);margin:6px 0"></div>${sec.slice(-3).map(row).join('')}
       <p class="muted" style="margin:10px 0 0;font-size:11px">업종 ETF ${sec.length}개 중 위·아래 3개 · ${homeRep.file.slice(5, 10).replace('-', '/')} 마감</p>`));
  }

  // 3) 앞으로 7일 일정 (핵심: 보유·거시·국내)
  const ev = state.events;
  if (ev && ev.events) {
    const kst = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' })); kst.setHours(0, 0, 0, 0);
    const dday = x => Math.round((new Date(x + 'T00:00:00') - kst) / 864e5);
    const icon = { earnings: '📊', exdiv: '💰', fomc: '🇺🇸', bok: '🇰🇷', expiry: '⏳' };
    const list = ev.events.filter(e => { const n = dday(e.date); return n >= 0 && n <= 7 && (e.scope === 'held' || e.scope === 'macro' || e.market === 'KR'); });
    const rows = list.slice(0, 6).map(e => {
      const n = dday(e.date);
      return `<tr><td class="${n <= 3 ? 'neg' : 'muted'}" style="white-space:nowrap">${n === 0 ? '오늘' : 'D-' + n}</td><td>${icon[e.kind] || ''} ${esc(e.title)}${e.name ? ` · <b>${esc(e.name)}</b>` : ''}</td></tr>`;
    }).join('');
    cards.push(card('7일 안 일정', 'events', '일정',
      rows ? `<div class="table-wrap"><table><tbody>${rows}</tbody></table></div>${list.length > 6 ? `<p class="muted" style="margin:6px 0 0;font-size:11px">외 ${list.length - 6}건</p>` : ''}`
        : '<p class="muted" style="margin:0">앞으로 7일 안에 핵심 일정이 없습니다.</p>'));
  }

  // 4) 꼭 볼 뉴스 5개
  const nb = state.news && state.news.briefing;
  if (nb && nb.length) cards.push(card('꼭 볼 뉴스', 'news', '뉴스', nb.slice(0, 5).map(a => newsRow(a, true)).join('')));

  // 5) 새 공시 (투자영향 큰 유형)
  const di = (state.disclosures && state.disclosures.items) || [];
  const high = di.filter(i => i.level === 'high').sort((a, b) => b.rceptDt.localeCompare(a.rceptDt));
  if (di.length) {
    const rows = high.slice(0, 6).map(i => `<tr><td class="muted" style="white-space:nowrap">${esc(i.rceptDt.slice(4, 6))}/${esc(i.rceptDt.slice(6, 8))}</td><td>${esc(i.name)}</td><td><span class="warn-tag">${esc(i.category)}</span></td><td><a href="${esc(i.url)}" target="_blank" rel="noopener" class="muted" style="text-decoration:none">원문↗</a></td></tr>`).join('');
    cards.push(card('새 공시', 'disclosures', '공시',
      rows ? `<div class="table-wrap"><table><tbody>${rows}</tbody></table></div><p class="muted" style="margin:6px 0 0;font-size:11px">투자영향 큰 유형 ${high.length}건 중 최근 6건</p>`
        : '<p class="muted" style="margin:0">투자영향 큰 공시가 없습니다.</p>'));
  }

  // 6) 내 보유종목
  const hs = (state.portfolio && state.portfolio.holdings) || [];
  if (hs.length) {
    const rows = hs.map(h => `<tr><td><strong>${esc(h.name)}</strong> <span class="muted">${esc(h.ticker)}</span></td><td style="text-align:right">${fmtPct(h.unrealizedPnLPct)}</td><td>${h.stockScore ?? '-'} ${gradeChip(h.stockGrade)}</td></tr>`).join('');
    cards.push(card('내 보유종목', 'holdings', '내 포트폴리오',
      `<div class="table-wrap"><table><thead><tr><th>종목</th><th style="text-align:right">손익</th><th>점수</th></tr></thead><tbody>${rows}</tbody></table></div>`));
  }

  if (regimeCard) cards.push(regimeCard);
  const top = todayTop();
  if (!cards.length && !top) return '<div class="card empty">표시할 데이터가 아직 없습니다.</div>';
  return `${top}<div class="home-grid">${cards.join('')}</div>`;
}

// ---------- 내비게이션: 그룹(위) + 서브탭(아래). state.tab 은 예전처럼 세부 키이고 그룹은 그 위의 묶음일 뿐이다 ----------
const NAV_GROUPS = [
  ['today', '오늘', [['today', '요약'], ['mreport', '마감 리포트'], ['yt', '영상 요약'], ['links', '바로가기']]],
  ['stock', '종목', [['scores', '스코어'], ['a5', '전 종목(A5)'], ['reco', '추천 이력'], ['holdings', '내 포트폴리오'], ['live', '실시간⚡'], ['backtest', '검증(백테스트)']]],
  ['market', '시장·섹터', [['regime', '국면·매크로'], ['flows', '시장수급'], ['sector', '섹터강도'], ['holders', '기관 보유(5%)'], ['us13f', '미국 기관(13F)'], ['cycle', '경기사이클🥚']]],
  ['event', '이벤트·뉴스', [['events', '일정📅'], ['disclosures', '공시'], ['news', '뉴스'], ['opinions', '증권사 의견'], ['rr', '종목 리포트']]],
  ['etf', 'ETF', [['etfwatch', '관심·상위'], ['etf', '전체 목록']]],
];
const NAV_ICON = {   // 폰 아래 탭 막대 아이콘(선 아이콘, currentColor)
  today: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  stock: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  market: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  event: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/>',
  etf: '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/>',
};
const navIcon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICON[k] || ''}</svg>`;
const lastSub = {};   // 그룹별로 마지막에 보던 서브탭
function renderNav() {
  const g = NAV_GROUPS.find(x => x[2].some(t => t[0] === state.tab)) || NAV_GROUPS[0];
  lastSub[g[0]] = state.tab;
  document.getElementById('nav').innerHTML = NAV_GROUPS.map(x => `<button data-navgroup="${x[0]}"${x[0] === g[0] ? ' class="active" aria-current="page"' : ''}>${navIcon(x[0])}<span>${x[1].replace('·', '·<wbr>')}</span></button>`).join('');
  document.getElementById('subnav').innerHTML = g[2].length < 2 ? '' : g[2].map(t => `<button data-tab="${t[0]}"${t[0] === state.tab ? ' class="active"' : ''}>${t[1]}</button>`).join('');
  document.getElementById('side').innerHTML = NAV_GROUPS.map(x => `<div><div class="grp">${x[1]}</div>${x[2].map(t =>
    `<button data-tab="${t[0]}"${t[0] === state.tab ? ' class="active" aria-current="page"' : ''}>${t[1]}</button>`).join('')}</div>`).join('');
}
document.addEventListener('click', (e) => {
  const gb = e.target.closest && e.target.closest('button[data-navgroup]');
  const tb = e.target.closest && e.target.closest('button[data-tab]');
  const go = e.target.closest && e.target.closest('[data-goto]');
  if (!gb && !tb && !go) return;
  if (go) {
    state.tab = go.dataset.goto;
    window.scrollTo(0, 0);
  } else if (gb) {
    const g = NAV_GROUPS.find(x => x[0] === gb.dataset.navgroup);
    state.tab = lastSub[g[0]] || g[2][0][0];
    window.scrollTo(0, 0);   // 폰 아래 탭 막대로 그룹을 바꾸면 맨 위부터
  } else {
    state.tab = tb.dataset.tab;
  }
  renderNav();
  render();
});
{ const m = /^#yt=([\w-]{11})/.exec(location.hash); if (m) { state.tab = 'yt'; yt.open[m[1]] = true; yt.focus = m[1]; } }   // 영상 요약 텔레그램 링크
if (/^#mreport=/.test(location.hash)) state.tab = 'mreport';   // 텔레그램 요약의 링크로 들어오면 그 리포트를 바로 연다
renderNav();

(async function init() {
  let liveWatchlistRaw;
  [state.latest, state.regime, state.portfolio, state.reco, state.backtest, state.cycle, state.macro, state.etf, state.disclosures, state.news, state.marketFlows, state.live.daily, liveWatchlistRaw, state.etfReturns, state.etfDist, state.sectorStrength, state.tradeLevels, state.themeStrength, state.themeSensitivity, state.etfCompare, state.events, state.stockContext, state.rankH5] = await Promise.all([
    loadJson('latest'), loadJson('regime'), loadJson('portfolio'), loadJson('recommendations'), loadJson('backtest'), loadJson('cycles'), loadJson('macro'), loadJson('etf_snapshot'),
    loadJson('disclosures'), loadJson('news'), loadJson('market_flows'), loadJson('watchlist-daily'), loadJson('live-watchlist'), loadJson('etf-returns'), loadJson('etf-distributions'), loadJson('sector-strength'), loadJson('trade-levels'), loadJson('theme-strength'), loadJson('theme-sensitivity'), loadJson('etf-compare'), loadJson('events'), loadJson('stock-context'), loadJson('rank-h5'),
  ]);
  LIVE_WATCHLIST = liveWatchlistRaw ? liveWatchlistRaw.tickers.map(t => [t.ticker, t.name]) : [];
  const updated = state.latest && state.latest.updatedAt ? new Date(state.latest.updatedAt).toLocaleString('ko-KR') : '데이터 없음';
  document.getElementById('updated').textContent = `마지막 갱신: ${updated}`;
  // 종목이 많을 때만 업종별 보기를 기본값으로 (20종목이면 전체 목록이 더 편하다)
  if (state.latest && state.latest.results && state.latest.results.length <= 30) state.viewMode = 'list';
  render();
})();
</script>
