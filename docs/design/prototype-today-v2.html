<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 v2 — Stock Terminal 시안</title>
<!-- 시안 v2 (v1: prototype-today.html 은 그대로). 원칙·토큰: DESIGN_SYSTEM.md · tokens.css.
     데이터는 2026-11-13 스냅샷을 이 파일에 내장한 실제 값이다: 지수 캔들(야후 종가 계열) · 코스피 외국인 순매수(pykrx 일별) ·
     업종별 종목 수익률·시총(docs/data/sector-strength.json) · 후보 점수(docs/data/latest-v2.json). 논리·반증 칸은 파이프라인 3번 설계 전이라 비어 있다.
     차트: TradingView lightweight-charts 4.2.0(캔들·수급, CDN) · 업종 지도는 직접 그린 SVG 트리맵. 빌드 없음. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="tokens.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:var(--font);font-size:var(--fs-body);line-height:var(--lh);color:var(--text-1);background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--text-2)}
.meta{color:var(--text-3);font-size:var(--fs-meta)}

/* 셸 */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:var(--topbar-h) minmax(0,1fr);min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--s-4);padding:0 var(--s-4);background:var(--surface-1);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:var(--s-2);font-weight:600;width:calc(var(--rail-w) - var(--s-4))}
.brand .mark{width:20px;height:20px;border-radius:var(--r-sm);background:var(--text-1);color:var(--surface-1);display:grid;place-items:center;font-size:var(--fs-caption);font-weight:700}
.cmdk{flex:0 1 380px;display:flex;align-items:center;gap:var(--s-2);height:32px;padding:0 var(--s-3);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-3);text-align:left}
.cmdk kbd,.kbd{margin-left:auto;font:inherit;font-size:var(--fs-caption);padding:1px 6px;border:1px solid var(--line-strong);border-radius:var(--r-sm)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:var(--s-3);color:var(--text-2);font-size:var(--fs-meta)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text-2);font-size:var(--fs-meta);font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3)}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-sm);color:var(--text-2)}
.iconbtn:hover,.rail a:hover{background:var(--surface-2)}
.rail{padding:var(--s-3) var(--s-2);border-right:1px solid var(--line);background:var(--surface-1);position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow:auto}
.rail .grp{padding:var(--s-4) var(--s-3) var(--s-1);font-size:var(--fs-caption);color:var(--text-3);font-weight:600}
.rail a{display:flex;align-items:center;gap:10px;height:32px;padding:0 var(--s-3);border-radius:var(--r-sm);color:var(--text-2);font-weight:500;text-decoration:none}
.rail a[aria-current]{background:var(--surface-2);color:var(--text-1);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.rail a[aria-current] svg{color:var(--accent)}

/* 본문 + 서랍 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s-4);padding:var(--s-5);min-width:0;align-items:start}
.content{display:flex;flex-direction:column;gap:var(--s-4);min-width:0}
.panel{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);min-width:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:var(--fs-body);font-weight:600}
.panel-h .right{margin-left:auto;display:flex;align-items:center;gap:var(--s-3)}
.seg{display:inline-flex;padding:2px;border-radius:var(--r-sm);background:var(--surface-2)}
.seg{flex:none}
.seg button{white-space:nowrap;height:24px;padding:0 10px;border-radius:3px;color:var(--text-2);font-size:var(--fs-meta);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-1);font-weight:600;box-shadow:0 0 0 1px var(--line)}

/* 한 줄 시황 */
.brief{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
.brief .h{display:flex;align-items:baseline;gap:var(--s-3);flex-wrap:wrap}
.brief h1{font-size:var(--fs-page);font-weight:700;letter-spacing:-.015em}
.brief p{font-size:var(--fs-title);line-height:1.55;letter-spacing:-.01em;color:var(--text-1)}
.brief p b{font-weight:600}
.strip{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-5);padding-top:var(--s-3);border-top:1px solid var(--line);color:var(--text-2);font-size:var(--fs-meta)}
.strip span b{color:var(--text-1);font-weight:600;margin-left:6px}

/* 차트 */
.chart-wrap{position:relative}
#c-main{height:250px}#c-flow{height:120px;border-top:1px solid var(--line)}
.legend{position:absolute;left:var(--s-4);top:var(--s-2);z-index:2;display:flex;gap:var(--s-4);font-size:var(--fs-meta);color:var(--text-2);pointer-events:none;flex-wrap:wrap}
.legend b{color:var(--text-1);font-weight:600;margin-left:4px}
#treemap{height:380px}

/* 표 */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:right;font-size:var(--fs-caption);font-weight:600;color:var(--text-3);padding:8px var(--s-3);border-bottom:1px solid var(--line-strong);white-space:nowrap;position:sticky;top:0;background:var(--surface-1)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:var(--s-4);width:36px;color:var(--text-3)}
.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td{height:46px;padding:0 var(--s-3);text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background var(--dur) var(--ease)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr[aria-selected="true"]{background:var(--accent-wash);box-shadow:inset 2px 0 0 var(--accent)}
.nm b{font-weight:600}.nm span{margin-left:6px;color:var(--text-3);font-size:var(--fs-meta)}
.stack{display:inline-flex;width:96px;height:6px;gap:2px;vertical-align:middle;margin-left:var(--s-2)}
.stack i{display:block;height:100%;border-radius:2px;min-width:2px}
.c-f{background:var(--text-1)}.c-v{background:var(--text-3)}.c-t{background:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--fs-caption);font-weight:600;background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.tag.warn{background:var(--warn-wash);color:var(--warn)}

/* 서랍(우측 상세) */
.drawer{position:sticky;top:calc(var(--topbar-h) + var(--s-5));max-height:calc(100vh - var(--topbar-h) - 2 * var(--s-5));overflow:auto;display:flex;flex-direction:column}
.drawer .empty{padding:var(--s-6) var(--s-5);color:var(--text-3);display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-start}
.drawer .empty b{color:var(--text-2);font-weight:600}
.d-h{padding:var(--s-4);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s-1)}
.d-h .t{display:flex;align-items:center;gap:var(--s-2)}
.d-h h3{font-size:var(--fs-title);font-weight:700;letter-spacing:-.01em}
.d-sec{padding:var(--s-4);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s-3)}
.d-sec:last-child{border-bottom:0}
.d-sec h4{font-size:var(--fs-caption);font-weight:600;color:var(--text-3)}
.kv{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s-2)}
.kv div{display:flex;flex-direction:column;gap:2px}.kv span{color:var(--text-3);font-size:var(--fs-caption)}.kv b{font-weight:600;font-size:var(--fs-meta)}
.bar{display:grid;grid-template-columns:64px 1fr 40px;gap:var(--s-3);align-items:center;font-size:var(--fs-meta);color:var(--text-2)}
.bar .tr{height:6px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:var(--r-pill)}
.bar .v{text-align:right;color:var(--text-1);font-weight:600}
.slot{padding:var(--s-3);border:1px solid var(--line-strong);border-radius:var(--r-sm);color:var(--text-3);font-size:var(--fs-meta);line-height:1.5}
.slot b{color:var(--text-2);font-weight:600;display:block;margin-bottom:2px}
.x{margin-left:auto;color:var(--text-3)}

/* 명령 팔레트 */
.pal{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.55);display:none;align-items:flex-start;justify-content:center;padding-top:14vh}
.pal[open]{display:flex}
.pal-box{width:min(560px,92vw);background:var(--surface-1);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:var(--shadow-pop);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:var(--s-3);padding:0 var(--s-4);height:48px;border-bottom:1px solid var(--line);color:var(--text-3)}
.pal-in input{flex:1;color:var(--text-1);outline:0}
.pal ul{list-style:none;max-height:320px;overflow:auto;padding:var(--s-2)}
.pal li{display:flex;align-items:center;gap:var(--s-3);padding:8px var(--s-3);border-radius:var(--r-sm);cursor:pointer;color:var(--text-2)}
.pal li[aria-selected="true"]{background:var(--surface-2);color:var(--text-1)}
.pal li .g{margin-left:auto;color:var(--text-3);font-size:var(--fs-meta)}

@media (max-width:1180px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .drawer{position:fixed;left:var(--s-3);right:var(--s-3);bottom:var(--s-3);top:auto;max-height:62vh;z-index:30;box-shadow:var(--shadow-pop);transform:translateY(calc(100% + 140px));visibility:hidden;transition:transform 160ms var(--ease),visibility 0s linear 160ms}
  .drawer.open{transform:none;visibility:visible;transition-delay:0s}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}.brand{width:auto}.cmdk{flex:1}.cmdk kbd,.top-right .pill{display:none}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:56px;z-index:25;display:flex;justify-content:space-around;padding:4px 8px;border-right:0;border-top:1px solid var(--line);overflow:hidden}
  .rail .grp{display:none}
  .rail a{flex-direction:column;justify-content:center;gap:2px;height:48px;padding:0 4px;font-size:var(--fs-caption);flex:1}
  .rail a[aria-current]{box-shadow:none;background:none;color:var(--accent)}
  .stage{padding:var(--s-4) var(--s-4) 76px}
  .hide-sm{display:none}
  .drawer{bottom:68px}
  .legend{position:static;padding:var(--s-2) var(--s-4) 0;gap:var(--s-3)}
  .panel-h .meta{display:none}
  .panel-h .right{margin-left:auto}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-stock" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></symbol>
  <symbol id="i-perf" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-lab" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">S</span><span>Stock Terminal</span></div>
    <button class="cmdk" id="open-pal"><svg class="i"><use href="#i-search"/></svg><span>종목·메뉴 검색</span><kbd>Ctrl K</kbd></button>
    <div class="top-right"><span class="pill"><span class="dot"></span>장 마감 · 11.13 15:30 KST</span>
      <button class="iconbtn" id="theme" aria-label="테마 전환"><svg class="i"><use href="#i-moon"/></svg></button></div>
  </header>
  <nav class="rail" aria-label="주 메뉴">
    <div class="grp">워크스페이스</div>
    <a href="#" aria-current="page"><svg class="i"><use href="#i-today"/></svg>오늘</a>
    <a href="#"><svg class="i"><use href="#i-list"/></svg>후보</a>
    <a href="#"><svg class="i"><use href="#i-stock"/></svg>종목</a>
    <a href="#"><svg class="i"><use href="#i-plan"/></svg>계획·실행</a>
    <a href="#"><svg class="i"><use href="#i-perf"/></svg>성과</a>
    <div class="grp">연구</div>
    <a href="#"><svg class="i"><use href="#i-lab"/></svg>연구실</a>
  </nav>

  <div class="stage">
    <main class="content">
      <section class="panel brief" aria-label="오늘의 시황">
        <div class="h"><h1>오늘</h1><span class="meta" id="asof"></span></div>
        <p id="narr"></p>
        <div class="strip" id="strip"></div>
      </section>

      <section class="panel" aria-labelledby="h-mkt">
        <div class="panel-h"><h2 id="h-mkt">코스피 · 외국인 순매수</h2>
          <div class="right"><span class="meta">시고저종 야후 · 외국인은 코스피 시장 전체(KRX 일별, 억원)</span>
          <div class="seg" id="range" role="group" aria-label="기간"><button data-n="21" aria-pressed="false">1개월</button><button data-n="63" aria-pressed="true">3개월</button><button data-n="999" aria-pressed="false">전체</button></div></div></div>
        <div class="chart-wrap"><div class="legend" id="lg-main"></div><div id="c-main"></div></div>
        <div class="chart-wrap"><div class="legend" id="lg-flow"></div><div id="c-flow"></div></div>
      </section>

      <section class="panel" aria-labelledby="h-map">
        <div class="panel-h"><h2 id="h-map">업종 지도</h2><span class="meta">면적 = 시가총액의 제곱근(초대형주 쏠림 완화) · 색 = 수익률(중립 회색 ↔ 상승 빨강 / 하락 파랑)</span>
          <div class="right"><div class="seg" id="metric" role="group" aria-label="수익률 기간"><button data-k="0" aria-pressed="true">1일</button><button data-k="1" aria-pressed="false">1주</button><button data-k="2" aria-pressed="false">1개월</button></div></div></div>
        <div id="treemap"></div>
      </section>

      <section class="panel" aria-labelledby="h-cand">
        <div class="panel-h"><h2 id="h-cand">후보 종목</h2><span class="meta">점수순 · 신뢰도 80 이상 · 거래 가능</span>
          <div class="right"><span class="meta"><i class="stack" style="width:auto;margin:0;display:inline-flex"><i class="c-f" style="width:14px"></i><i class="c-v" style="width:14px"></i><i class="c-t" style="width:14px"></i></i> 재무 · 가치 · 기술</span></div></div>
        <div class="tbl-wrap"><table class="tbl">
          <caption class="sr">후보 종목 표</caption>
          <thead><tr><th>#</th><th>종목</th><th>점수 구성</th><th class="hide-sm">신뢰도</th><th>1일</th><th class="hide-sm">상태</th></tr></thead>
          <tbody id="cands"></tbody>
        </table></div>
      </section>
    </main>

    <aside class="panel drawer" id="drawer" aria-label="종목 상세"></aside>
  </div>
</div>

<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="검색">
  <div class="pal-box">
    <div class="pal-in"><svg class="i"><use href="#i-search"/></svg><input id="pal-in" placeholder="종목명 · 코드 · 업종 검색" autocomplete="off"><span class="kbd">Esc</span></div>
    <ul id="pal-list" role="listbox"></ul>
  </div>

const dcls = (r) => (r > 0 ? 'up' : r < 0 ? 'down' : 'flat');
const glyph = (r) => (r > 0 ? '▲' : r < 0 ? '▼' : '―');
const eok = (v) => (v < 0 ? '−' : '+') + fmt(Math.abs(v), 0) + '억';
const rgb = (h) => { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, t) => 'rgb(' + a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(',') + ')';

/* ---------- 자료 ---------- */
const candles = D.candles.map(([t, o, h, l, c]) => ({ time: t, open: o, high: h, low: l, close: c }));
const flows = D.flows;                                   // [{time, v(억원)}]
const flowMap = Object.fromEntries(flows.map((f) => [f.time, f.v]));
const byT = {};
D.stocks.forEach((s) => { byT[s.t] = { t: s.t, n: s.n, g: s.g, cap: s.cap, r: s.r }; });
D.cands.forEach((c) => { byT[c.t] = Object.assign(byT[c.t] || { t: c.t, n: c.n }, { score: c.s, conf: c.c, comps: c.comps, state: c.state, flags: c.flags }); });

/* ---------- 한 줄 시황 (숫자에서 규칙으로 만든 문장 — LLM 아님) ---------- */
(function brief() {
  const L = candles[candles.length - 1], P = candles[candles.length - 2];
  const ch = L.close / P.close - 1, hi = Math.max(...candles.map((c) => c.close)), dd = L.close / hi - 1;
  const f5 = flows.slice(-5).reduce((a, f) => a + f.v, 0), fl = flows[flows.length - 1];
  const sgn = (v) => (v < 0 ? '순매도' : '순매수');
  $('#narr').innerHTML = `코스피는 <b class="${dcls(ch)}">${glyph(ch)} ${pct(ch)}</b>로 <b class="num">${fmt(L.close)}</b>에 마감했다. ` +
    `${candles.length}거래일 종가 고점 대비 <b class="${dcls(dd)}">${pct(dd)}</b>. ` +
    `외국인은 11.13 하루 <b class="${dcls(fl.v)}">${eok(fl.v)}</b>(${sgn(fl.v)}), 최근 5거래일 합계 <b class="${dcls(f5)}">${eok(f5)}</b>(${sgn(f5)}).`;
  $('#asof').textContent = '2026년 11월 14일 토요일 · 기준 ' + D.asof.price.slice(5).replace('-', '.') + ' 종가';
  const k = D.kosdaq, v = D.vix;
  $('#strip').innerHTML =
    `<span>코스닥<b class="num ${dcls(k.last / k.prev - 1)}">${fmt(k.last)} ${glyph(k.last / k.prev - 1)} ${pct(k.last / k.prev - 1)}</b></span>` +
    `<span>VIX<b class="num ${dcls(v.last / v.prev - 1)}">${fmt(v.last)} ${glyph(v.last / v.prev - 1)} ${pct(v.last / v.prev - 1)}</b></span>` +
    `<span>점수 기준일<b class="num">${D.asof.score.slice(5).replace('-', '.')}</b></span><span>수급(시장) 기준일<b class="num">${flows[flows.length - 1].time.slice(5).replace('-', '.')}</b></span>`;
})();

/* ---------- 차트 1: 캔들 + 외국인 순매수 (lightweight-charts, 시간축 동기) ---------- */
let chM, chF, sC, sF, syncing = false;
function chartOpts(h, showTime) {
  return { height: h, layout: { background: { type: 'solid', color: cssv('--surface-1') }, textColor: cssv('--text-3'), fontFamily: cssv('--font'), fontSize: 11 },
    grid: { vertLines: { color: cssv('--line') }, horzLines: { color: cssv('--line') } }, rightPriceScale: { borderColor: cssv('--line'), scaleMargins: { top: 0.12, bottom: 0.08 } },
    timeScale: { borderColor: cssv('--line'), visible: showTime, rightOffset: 2 }, crosshair: { mode: 0, vertLine: { color: cssv('--line-strong'), labelBackgroundColor: cssv('--surface-3') }, horzLine: { color: cssv('--line-strong'), labelBackgroundColor: cssv('--surface-3') } },
    handleScale: { mouseWheel: false }, handleScroll: { mouseWheel: false, pressedMouseMove: true } };
}
function buildCharts() {
  const up = cssv('--up'), down = cssv('--down');
  chM = LightweightCharts.createChart($('#c-main'), Object.assign(chartOpts(250, false), { width: $('#c-main').clientWidth }));
  chF = LightweightCharts.createChart($('#c-flow'), Object.assign(chartOpts(120, true), { width: $('#c-flow').clientWidth }));
  sC = chM.addCandlestickSeries({ upColor: up, downColor: down, borderUpColor: up, borderDownColor: down, wickUpColor: up, wickDownColor: down, priceLineVisible: false });
  sC.setData(candles);
  sF = chF.addHistogramSeries({ priceFormat: { type: 'custom', formatter: (v) => fmt(v, 0) }, priceLineVisible: false, lastValueVisible: false });
  sF.setData(flows.map((f) => ({ time: f.time, value: f.v, color: f.v >= 0 ? up : down })));
  const link = (a, b) => a.timeScale().subscribeVisibleLogicalRangeChange((r) => { if (syncing || !r) return; syncing = true; b.timeScale().setVisibleLogicalRange(r); syncing = false; });
  link(chM, chF); link(chF, chM);
  const lm = $('#lg-main'), lf = $('#lg-flow');
  const show = (t) => {
    const c = candles.find((x) => x.time === t) || candles[candles.length - 1], v = flowMap[c.time];
    const dd = c.close / (candles[candles.indexOf(c) - 1] || c).close - 1;
    lm.innerHTML = `<span>${c.time.slice(5).replace('-', '.')}</span><span>시 <b class="num">${fmt(c.open)}</b></span><span>고 <b class="num">${fmt(c.high)}</b></span><span>저 <b class="num">${fmt(c.low)}</b></span><span>종 <b class="num ${dcls(dd)}">${fmt(c.close)} ${glyph(dd)} ${pct(dd)}</b></span>`;
    lf.innerHTML = `<span>외국인 순매수</span>` + (v === undefined ? '<b>—</b>' : `<b class="num ${dcls(v)}">${eok(v)}</b>`);
  };
  show(null);
  [chM, chF].forEach((c) => c.subscribeCrosshairMove((p) => show(p && p.time ? p.time : null)));
  setRange(63);
}
function setRange(n) {
  const len = candles.length, to = len + 1, from = Math.max(0, len - n);
  chM.timeScale().setVisibleLogicalRange({ from, to }); chF.timeScale().setVisibleLogicalRange({ from, to });
}
$('#range').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#range button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  setRange(+b.dataset.n);
});

/* ---------- 업종 지도: 직접 그린 squarified 트리맵(SVG) — 업종 머리글·선택 표시·툴팁을 완전히 제어하려고 라이브러리를 쓰지 않는다 ---------- */
let metricK = 0, selected = null;
const TM_HEAD = 16;
function nodeColor(r) {
  const neutral = rgb(cssv('--surface-3')), up = rgb(cssv('--up')), down = rgb(cssv('--down')), cap = [0.05, 0.10, 0.20][metricK];
  return mix(neutral, r >= 0 ? up : down, Math.min(1, Math.abs(r) / cap) * 0.85);
}
function squarify(nodes, x, y, w, h) {                       // nodes: {v} 내림차순. 각 노드에 x,y,w,h 를 채운다
  if (!nodes.length || w <= 0 || h <= 0) return;
  const total = nodes.reduce((a, n) => a + n.v, 0), k = (w * h) / total;
  nodes.forEach((n) => { n.a = n.v * k; });
  let rest = nodes.slice();
  const worst = (row, sum, side) => { const mx = Math.max(...row.map((n) => n.a)), mn = Math.min(...row.map((n) => n.a)), s2 = side * side; return Math.max(s2 * mx / (sum * sum), (sum * sum) / (s2 * mn)); };
  while (rest.length) {
    const side = Math.min(w, h); let row = [rest[0]], sum = rest[0].a, wr = worst(row, sum, side);
    for (let i = 1; i < rest.length; i++) { const s2 = sum + rest[i].a, r2 = worst(row.concat(rest[i]), s2, side); if (r2 > wr) break; row.push(rest[i]); sum = s2; wr = r2; }
    const thick = sum / side;
    if (w >= h) { let yy = y; row.forEach((n) => { const hh = n.a / thick; Object.assign(n, { x, y: yy, w: thick, h: hh }); yy += hh; }); x += thick; w -= thick; }
    else { let xx = x; row.forEach((n) => { const ww = n.a / thick; Object.assign(n, { x: xx, y, w: ww, h: thick }); xx += ww; }); y += thick; h -= thick; }
    rest = rest.slice(row.length);
  }
}
function drawTree() {
  const box = $('#treemap'), W = box.clientWidth, H = box.clientHeight, bg = cssv('--surface-1'), txt = cssv('--text-1'), sub = cssv('--text-2');
  const groups = {};
  D.stocks.forEach((st) => { (groups[st.g] = groups[st.g] || { name: st.g, v: 0, kids: [] }); groups[st.g].kids.push({ s: st, v: Math.sqrt(st.cap) }); groups[st.g].v += Math.sqrt(st.cap); });
  const gl = Object.values(groups).sort((a, b) => b.v - a.v);
  squarify(gl, 0, 0, W, H);
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="업종별 종목 수익률 지도">`;
  gl.forEach((g) => {
    const gx = g.x + 1, gy = g.y + 1, gw = g.w - 2, gh = g.h - 2, head = gw > 56 && gh > 40 ? TM_HEAD : 0;
    g.kids.sort((a, b) => b.v - a.v); squarify(g.kids, gx, gy + head, gw, gh - head);
    if (head) svg += `<text x="${gx + 2}" y="${gy + 12}" font-size="11" font-weight="600" fill="${sub}" style="pointer-events:none">${g.name}</text>`;
    g.kids.forEach((k) => {
      const st = k.s, r = st.r[metricK], sel = selected === st.t, w = k.w - 1, h = k.h - 1;
      svg += `<g data-t="${st.t}" style="cursor:pointer"><rect x="${k.x.toFixed(1)}" y="${k.y.toFixed(1)}" width="${Math.max(0, w).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="2" fill="${nodeColor(r)}" stroke="${sel ? txt : 'none'}" stroke-width="${sel ? 2 : 0}"/>`;
      if (w > 44 && h > 28) svg += `<text x="${(k.x + 5).toFixed(1)}" y="${(k.y + 15).toFixed(1)}" font-size="11" font-weight="600" fill="#fff" style="pointer-events:none">${st.n.length > Math.floor(w / 8) ? st.n.slice(0, Math.max(2, Math.floor(w / 8))) + '…' : st.n}</text><text x="${(k.x + 5).toFixed(1)}" y="${(k.y + 28).toFixed(1)}" font-size="10" fill="#fff" fill-opacity=".85" style="pointer-events:none">${pct(r)}</text>`;
      svg += `</g>`;
    });
  });
  box.innerHTML = svg + '</svg>';
}
const tip = document.createElement('div');
tip.style.cssText = 'position:fixed;z-index:40;pointer-events:none;display:none;padding:6px 10px;border-radius:6px;background:var(--surface-1);border:1px solid var(--line-strong);box-shadow:var(--shadow-pop);font-size:12px;line-height:1.5';
document.body.appendChild(tip);
function buildTree() {
  const box = $('#treemap');
  drawTree();
  box.addEventListener('click', (e) => { const g = e.target.closest('g[data-t]'); if (g) select(g.dataset.t); });
  box.addEventListener('mousemove', (e) => {
    const g = e.target.closest('g[data-t]'); if (!g) { tip.style.display = 'none'; return; }
    const st = byT[g.dataset.t], r = st.r[metricK];
    tip.innerHTML = `<b>${st.n}</b> <span class="meta num">${st.t}</span><br><span class="meta">${st.g}</span> · <b class="num ${dcls(r)}">${glyph(r)} ${pct(r).replace(/^[+−]/, '')}</b> · 시총 <span class="num">${fmt(st.cap / 1e12, 2)}조</span>`;
    tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 220) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
  box.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}
$('#metric').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#metric button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  metricK = +b.dataset.k; drawTree(); renderCands();
});

/* ---------- 후보 표 ---------- */
function renderCands() {
  $('#cands').innerHTML = D.cands.map((c, i) => {
    const s = byT[c.t], r = s && s.r ? s.r[metricK] : null, tot = c.comps[0] + c.comps[1] + c.comps[2] || 1;
    const w = (x) => Math.max(0, x / 100 * 96);
    return `<tr data-t="${c.t}" tabindex="0" aria-selected="${selected === c.t}"><td class="num">${i + 1}</td>` +
      `<td class="nm"><b>${c.n}</b><span class="num">${c.t}</span></td>` +
      `<td><b class="num">${fmt(c.s, 1)}</b><span class="stack" title="재무 ${c.comps[0]} · 가치 ${c.comps[1]} · 기술 ${c.comps[2]}"><i class="c-f" style="width:${w(c.comps[0])}px"></i><i class="c-v" style="width:${w(c.comps[1])}px"></i><i class="c-t" style="width:${w(c.comps[2])}px"></i></span></td>` +
      `<td class="num hide-sm">${fmt(c.c, 1)}</td>` +
      `<td class="num ${r === null ? 'flat' : dcls(r)}">${r === null ? '—' : glyph(r) + ' ' + pct(r).replace(/^[+−]/, '')}</td>` +
      `<td class="hide-sm"><span class="tag${c.flags.length ? ' warn' : ''}">${c.flags.length ? c.flags[0] : '정상'}</span></td></tr>`;
  }).join('');
}
$('#cands').addEventListener('click', (e) => { const tr = e.target.closest('tr'); if (tr) select(tr.dataset.t); });
$('#cands').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const tr = e.target.closest('tr'); if (tr) select(tr.dataset.t); } });

/* ---------- 서랍: 선택한 종목의 상세 (표·지도·검색에서 모두 같은 서랍을 연다) ---------- */
function drawerEmpty() {
  $('#drawer').innerHTML = `<div class="empty"><b>종목을 선택하세요</b><span>후보 표의 행, 업종 지도의 칸, 검색(Ctrl K)에서 고르면 이곳에 점수 구성·수익률·맥락이 열립니다.</span></div>`;
}
function select(t) {
  selected = t; const s = byT[t]; if (!s) return;
  const r = s.r, rs = ['1일', '1주', '1개월', '3개월', '6개월'];
  const retHtml = r ? `<div class="d-sec"><h4>수익률</h4><div class="kv">${r.map((x, i) => `<div><span>${rs[i]}</span><b class="num ${dcls(x)}">${pct(x)}</b></div>`).join('')}</div></div>`
    : `<div class="d-sec"><h4>수익률</h4><span class="meta">수익률 자료 범위 밖(코스피200+코스닥150 유니버스 밖)</span></div>`;
  const comp = s.comps ? (() => {
    const names = ['재무', '가치', '기술', '수급'], cls = ['c-f', 'c-v', 'c-t', 'c-v'], max = 50;
    return `<div class="d-sec"><h4>점수 구성 (점)</h4>` + s.comps.map((v, i) => `<div class="bar"><span>${names[i]}${i === 3 ? '' : ''}</span><div class="tr"><i class="${cls[i]}" style="width:${Math.min(100, v / max * 100)}%"></i></div><span class="v num">${fmt(v, 1)}</span></div>`).join('') +
      `<span class="meta">수급 축은 가중치 0(정책) — 점수에 반영되지 않음</span></div>`;
  })() : '';
  $('#drawer').innerHTML =
    `<div class="d-h"><div class="t"><h3>${s.n}</h3><button class="iconbtn x" id="d-close" aria-label="닫기"><svg class="i"><use href="#i-close"/></svg></button></div>` +
    `<div class="meta"><span class="num">${s.t}</span>${s.g ? ' · ' + s.g : ''}${s.cap ? ' · 시총 ' + fmt(s.cap / 1e12, 2) + '조' : ''}</div>` +
    (s.score !== undefined ? `<div style="display:flex;align-items:baseline;gap:var(--s-3);margin-top:var(--s-2)"><span class="num" style="font-size:var(--fs-hero);font-weight:600;letter-spacing:-.02em">${fmt(s.score, 1)}</span><span class="meta">점수 · 신뢰도 ${fmt(s.conf, 1)} · ${s.state === 'NORMAL' ? '거래 상태 정상' : s.state}</span></div>` : '') + `</div>` +
    retHtml + comp +
    `<div class="d-sec"><h4>맥락 (점수에 반영되지 않음)</h4><div class="slot"><b>논리 · 반증</b>파이프라인 3번 설계 전 — 연결 예정</div><div class="slot"><b>공시 · 뉴스 · 수급</b>종목 맥락 파이프라인 연결 예정</div><span class="meta">점수 기준일 ${D.asof.score.slice(5).replace('-', '.')}</span></div>`;
  $('#drawer').classList.add('open');
  $('#d-close').addEventListener('click', () => { selected = null; $('#drawer').classList.remove('open'); drawerEmpty(); renderCands(); drawTree(); });
  renderCands(); drawTree();
}

/* ---------- 명령 팔레트 (Ctrl K) ---------- */
const pal = $('#pal'), pin = $('#pal-in'), plist = $('#pal-list');
let pitems = [], psel = 0;
const MENU = [{ n: '오늘', g: '메뉴' }, { n: '후보', g: '메뉴' }, { n: '종목', g: '메뉴' }, { n: '계획·실행', g: '메뉴' }, { n: '성과', g: '메뉴' }, { n: '연구실', g: '메뉴' }];
function palRender() {
  const q = pin.value.trim().toLowerCase();
  const pool = MENU.concat(Object.values(byT).map((s) => ({ n: s.n, t: s.t, g: s.g || '후보' })));
  pitems = pool.filter((x) => !q || x.n.toLowerCase().includes(q) || (x.t && x.t.includes(q)) || (x.g && x.g.toLowerCase().includes(q))).slice(0, 8);
  psel = Math.min(psel, Math.max(0, pitems.length - 1));
  plist.innerHTML = pitems.map((x, i) => `<li role="option" aria-selected="${i === psel}" data-i="${i}"><span>${x.n}</span>${x.t ? `<span class="meta num">${x.t}</span>` : ''}<span class="g">${x.g}</span></li>`).join('') || '<li>결과 없음</li>';
}
function palOpen() { pal.setAttribute('open', ''); pin.value = ''; psel = 0; palRender(); setTimeout(() => pin.focus(), 0); }
function palClose() { pal.removeAttribute('open'); }
function palGo(i) { const x = pitems[i]; if (!x) return; palClose(); if (x.t) select(x.t); }
$('#open-pal').addEventListener('click', palOpen);
pal.addEventListener('mousedown', (e) => { if (e.target === pal) palClose(); });
pin.addEventListener('input', () => { psel = 0; palRender(); });
plist.addEventListener('click', (e) => { const li = e.target.closest('li[data-i]'); if (li) palGo(+li.dataset.i); });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palOpen(); return; }
  if (!pal.hasAttribute('open')) return;
  if (e.key === 'Escape') palClose();
  else if (e.key === 'ArrowDown') { e.preventDefault(); psel = Math.min(pitems.length - 1, psel + 1); palRender(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); psel = Math.max(0, psel - 1); palRender(); }
  else if (e.key === 'Enter') { e.preventDefault(); palGo(psel); }
});

/* ---------- 테마 · 크기 ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
function recolor() {
  const up = cssv('--up'), down = cssv('--down');
  [chM, chF].forEach((c, i) => c.applyOptions(chartOpts(i ? 120 : 250, !!i)));
  sC.applyOptions({ upColor: up, downColor: down, borderUpColor: up, borderDownColor: down, wickUpColor: up, wickDownColor: down });
  sF.setData(flows.map((f) => ({ time: f.time, value: f.v, color: f.v >= 0 ? up : down })));
  drawTree();
}
$('#theme').addEventListener('click', () => {
  const dark = (root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  recolor();
});
new ResizeObserver(() => {
  chM.applyOptions({ width: $('#c-main').clientWidth }); chF.applyOptions({ width: $('#c-flow').clientWidth }); drawTree();
}).observe($('.content'));

buildCharts(); buildTree(); renderCands(); drawerEmpty();
</script>
</body>
