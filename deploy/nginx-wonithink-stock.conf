# /etc/nginx/sites-enabled/wonithink-stock.conf 의 정본(2026-09-22 저장소로 옮김). 시크릿 없음.
# 설치: sudo cp deploy/nginx-wonithink-stock.conf /etc/nginx/sites-enabled/wonithink-stock.conf
#       sudo cp deploy/nginx-stock-ratelimit.conf /etc/nginx/conf.d/stock-ratelimit.conf
#       sudo nginx -t && sudo systemctl reload nginx
#
# ★ 2026-09-22 보안 정리:
#   /accounts  인터넷 차단(403). 실계좌(업비트·빗썸·KIS)·RV20 잔고가 인증 없이 공개돼 있었다.
#              이제 autotrader 웹(로그인)이 같은 VM 안에서 127.0.0.1:8766/accounts 를 읽어 보여 준다.
#   공개 시세(/minute-history·/market-trend·/live-ws)는 공개 대시보드가 쓰므로 열어 두되 IP 별 요청 수를 제한한다
#              (minute-history 한 번이 KIS 조회 여러 건이라, 남용되면 KIS 한도가 소진돼 다른 수집까지 막힌다).
server {
    listen 80;
    server_name wonithink-stock.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wonithink-stock.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/wonithink-stock.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wonithink-stock.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    limit_req_status 429;

    location /minute-history {
        limit_req zone=stock_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin *;
    }

    location /market-trend {
        limit_req zone=stock_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
        add_header Access-Control-Allow-Origin *;
    }

    location /live-ws {
        limit_req zone=stock_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /accounts {
        return 403;
    }

    location / {
        return 200 'stock-live relay ok\n';
        add_header Content-Type text/plain;
    }
    include /etc/nginx/snippets/autotrader.conf;
}
