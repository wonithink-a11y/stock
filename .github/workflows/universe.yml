name: backfill-universe

# A1 — 시점별 유니버스 + corp_code 구간 매핑 + 폐지 사유.
# 첫 실행의 목적은 완성이 아니라 폐지사유 원문 분포와 corp_code 매핑 품질 확보다.
on:
  workflow_dispatch:

concurrency:
  group: backfill-universe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: pip install --quiet "pykrx==1.0.51" pandas requests lxml html5lib

      - name: Build universe
        timeout-minutes: 60
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build-universe.py

      - name: Write manifest
        if: always()
        run: |
          if [ -f data/backfill/universe/intervals.jsonl ]; then
            node scripts/write-manifest.js \
              --stage A1 --stageVersion A1.0 \
              --target data/backfill/universe --kind dir --ext .jsonl \
              --upstream A0.5
          else
            echo "산출물 없음 — manifest 생략"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-diagnostics
          path: data/backfill/universe/_diagnostics.json
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill data/cache)" ]; then
            git add data/backfill/universe data/backfill/manifest data/cache || true
            git commit -m "chore(backfill): A1 시점별 유니버스·corp_code 구간 매핑"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
