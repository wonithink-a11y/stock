name: Probe universe expansion (dry-run, no commit)

# 코스피200/코스닥150/S&P500/나스닥100 병합 시 실제로 몇 종목이 추가되는지
# 정찰 - config/watchlist.json은 안 건드린다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet pykrx==1.2.8 pandas lxml
      - name: Dry-run expand-universe
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/expand-universe.py --dry-run
