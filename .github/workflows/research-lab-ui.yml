name: Update ui/data/findings.json (Research Lab UI)

# research/strategy-lab/findings/*.md를 색인해 ui/data/findings.json(Paper
# Trading Engine "리서치랩" 탭)을 만든다. 순수 로컬 파일 파싱이라 시크릿·
# 네트워크 의존 없음(build_ui_findings.py 상단 주석 참고). ui/data/macro.json을
# macro-regime-ui.yml이 커밋하는 것과 같은 패턴(2026-08-30).

on:
  push:
    branches: [main]
    paths:
      - "research/strategy-lab/findings/**"
      - "research/strategy-lab/build_ui_findings.py"
      - "research/strategy-lab/build_findings_registry.py"
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5'   # 08:00 UTC = 17:00 KST, 평일 안전망

permissions:
  contents: write

concurrency:
  group: research-lab-ui
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/strategy-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ui/data/findings.json
        run: python build_ui_findings.py

      - name: Commit ui/data/findings.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../../ui/data/findings.json
          git diff --staged --quiet || git commit -m "chore: update ui/data/findings.json (research lab)"
          git push
