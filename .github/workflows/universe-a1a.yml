name: backfill-universe-a1a

# A1a — 현재 상장 유니버스 (BF-1.1). 정의는 config/policies/universe.v1.json.
on:
  workflow_dispatch:
    inputs:
      failInjection:
        description: '게이트 검증용. 값을 넣으면 인수 조건을 강제 실패시킨다(빈 값=정상 실행)'
        required: false
        default: ''
        type: string

concurrency:
  group: backfill-universe-a1a
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: pip install --quiet pandas requests lxml html5lib

      - name: Build A1a
        timeout-minutes: 10
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          A1A_FAIL_INJECTION: ${{ inputs.failInjection }}
        run: python scripts/build-universe-a1a.py

      - name: Verify diagnostics contract
        # Build A1a가 exit 0인데 main()이 애초에 안 불렸거나 조기 반환됐다면
        # _diagnostics.json에 acceptance* 필드가 없거나 false로 남는다.
        # "빌드 성공 = 실제로 아무 일도 안 함"을 여기서 잡는다.
        # 필드 세 개를 모두 검사해 스키마 자체를 계약으로 고정한다 — 이후 리팩터링에서
        # acceptanceFails/acceptanceWarns가 조용히 사라져도 즉시 실패해야 한다.
        run: |
          python -c "
          import json
          d = json.load(open('data/backfill/universe/a1a/_diagnostics.json', encoding='utf-8'))
          for k in ('acceptancePassed', 'acceptanceFails', 'acceptanceWarns'):
              assert k in d, f'{k} 필드 없음 — main() 진입 여부 의심'
          assert d['acceptancePassed'] is True, f\"acceptancePassed={d.get('acceptancePassed')} — Build 성공인데 인수 조건은 실패\"
          print('OK: acceptancePassed =', d['acceptancePassed'])
          "

      - name: Write manifest
        if: success()
        run: |
          F=data/backfill/universe/a1a/current.jsonl
          # if: success()가 1차 게이트, 파일 존재가 2차. A1a는 파일이 저장소에
          # 커밋돼 있어 이 test가 항상 참이지만, 산출물이 신규인 하류 단계에서는 유효하다.
          test -f "$F" || { echo "Build 성공인데 산출물이 없다 — 스크립트 계약 위반"; exit 1; }
          N=$(grep -c '' "$F")
          echo "current.jsonl 실측 행 수: $N"
          node scripts/write-manifest.js \
            --stage A1a --stageVersion A1a.2 \
            --target data/backfill/universe/a1a --kind dir --ext .jsonl \
            --upstream A0.5,A0.7 \
            --policies universe \
            --extra "{\"recordCount\":$N}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-a1a-diagnostics
          path: data/backfill/universe/a1a/_diagnostics.json
          if-no-files-found: warn

      - name: Commit
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill/universe/a1a data/backfill/manifest)" ]; then
            git add data/backfill/universe/a1a data/backfill/manifest
            git commit -m "chore(backfill): A1a 현재 상장 유니버스 (UN-1.1)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
