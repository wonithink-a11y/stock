name: market-movers

# 시장 전체 급등 군집 -> docs/data/market-movers.json (scripts/build-market-movers.py, KRX Open API 2콜).
# KRX 는 당일 데이터를 장중에 주지 않는다(실측 2026-10-02 15:00 에 0행) - 올라오는 시각을 아직 모른다.
# 그래서 저녁 20:10 KST 와 다음 날 아침 08:40 KST 두 번 시도한다. 같은 날이면 파일이 바이트 동일해 커밋하지 않는다.
# 표시 전용 - 점수·추천과 무관.

on:
  schedule:
    - cron: '10 11 * * 1-5'   # 20:10 KST
    - cron: '40 23 * * 0-4'   # 08:40 KST (월~금)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-movers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Selftest
        run: python scripts/build-market-movers.py --selftest

      - name: Build market movers
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/build-market-movers.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/market-movers.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update docs/data/market-movers.json (시장 전체 급등 군집)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
