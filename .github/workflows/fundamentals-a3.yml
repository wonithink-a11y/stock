name: backfill-fundamentals-a3

# A3 — 재무 (PIT). 정의는 config/policies/fundamentals.v1.json(FN-1.0).
#
# A2a와 결정적으로 다른 점은 실행이 하루에 끝나지 않는다는 것이다. DART 일 한도가
# 20,000건이라 3,801법인 × 11사업연도 수집은 며칠에 걸친다. 그래서 collect는 매일
# 한 번씩 dispatch로 돌리고, 각 실행은 '오늘 몫'만 하고 진행 상태를 커밋한다.
# 전 샤드가 담당분을 마치면 finalize를 한 번 돌린다.
#
#   mode: collect    오늘 예산만큼 수집 → data/backfill/fundamentals/_shards/ 커밋
#   mode: finalize   전 샤드 병합 → 인수 조건 → 산출물 + manifest → _shards/ 삭제
#
# 예산 소진은 실패가 아니라 정상적인 분할 실행이므로 collect는 exit 0으로 끝난다.
# finalize는 담당분을 안 마친 샤드가 하나라도 있으면 중단한다 — 부분 수집물에
# manifest를 찍으면 하류가 깨진 데이터로 정상 통과한다(교훈43).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '수집(collect) 또는 마감(finalize)'
        required: true
        default: 'collect'
        type: choice
        options: [collect, finalize]
      failInjection:
        description: '게이트 검증용. 값을 넣으면 finalize의 인수 조건을 강제 실패시킨다'
        required: false
        default: ''
        type: string

concurrency:
  group: backfill-fundamentals-a3
  cancel-in-progress: false   # 수집 도중 취소되면 그날 예산만 태우고 진행이 안 남는다

permissions:
  contents: write

env:
  SHARDS: 8
  # 파이썬 stdout은 tty가 아니면 블록 버퍼링이다. collect 샤드는 80분 동안 25법인마다
  # 체크포인트를 찍는데, 그 출력이 버퍼에 남은 채 timeout-minutes의 kill을 맞으면
  # 통째로 사라진다 — 어디까지 갔는지를 말해줄 유일한 기록이 정작 필요한 순간에만
  # 없다. 잡 수준에 둬서 collect·persist·finalize 전부에 걸린다.
  PYTHONUNBUFFERED: '1'

jobs:
  collect:
    if: inputs.mode == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # fail-fast를 끈다. A2a와 반대인 이유: 저쪽은 부분 수집물이 쓸모없지만,
      # 여기서는 한 샤드가 막혀도 나머지 샤드의 진행이 그대로 자산이다(내일 이어받는다).
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4        # 이전 실행이 커밋한 _shards/를 가져온다
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet requests

      - name: Collect shard ${{ matrix.shard }}
        timeout-minutes: 80
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/build-fundamentals-a3.py --shard ${{ matrix.shard }} --shards $SHARDS

      # 자기 샤드의 파일만 올린다. 디렉터리째 올리면 안 된다 — _shards/가 저장소에
      # 커밋돼 있으므로 각 샤드의 checkout에는 남의 상태 파일(어제 버전)도 들어 있고,
      # persist의 merge-multiple: true는 같은 이름을 나중 것으로 덮는다. 즉 추출 순서에
      # 따라 다른 샤드의 오늘치 진행이 어제 버전으로 조용히 되돌아갈 수 있다.
      # collect #1에서 이 문제가 없었던 것은 그때 _shards/가 저장소에 아예 없어서
      # 각 샤드가 자기 파일만 갖고 있었기 때문이다 — 첫 실행이 우연히 안전했을 뿐이다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # 이름에 시도 번호를 넣는다. v4 아티팩트는 불변이라 같은 이름을 두 번 올리면
          # 409로 실패하고, 이 스텝은 if: always()라 **실패한 시도도 이름을 선점한다** —
          # 그래서 재실행이 구조적으로 불가능했다(collect의 샤드 7이 이 경로로 막혔다).
          #
          # overwrite: true는 그 409는 풀지만 다른 손실을 연다. 재실행은 커밋된 상태에서
          # 다시 시작하고 1차 시도의 아티팩트를 보지 않는다. DART 일 한도는 1차가 이미
          # 태웠으므로 재실행이 **덜 진행하고 끝날 수 있고**, 그때 덮어쓰기는 더 나은
          # 상태를 지운다. 이름을 겹치지 않게 두고 **병합에서 고르는** 것이 옳다.
          name: a3-shard-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            data/backfill/fundamentals/_shards/_state-${{ matrix.shard }}.json
            data/backfill/fundamentals/_shards/shard-${{ matrix.shard }}.jsonl
            data/backfill/fundamentals/_shards/_diagnostics-shard-${{ matrix.shard }}.json
          retention-days: 3
          if-no-files-found: warn

  persist:
    # 샤드가 각자 push하지 않는 이유는 A2a와 같다 — 8개 잡이 같은 브랜치에 rebase
    # 경합을 벌인다. 여기서 한 번만 커밋한다.
    #
    # if: success()가 아니다(FN-1.3). 원래는 '중단된 실행의 부분 상태를 남기면 다음
    # 실행이 이미 처리한 법인으로 건너뛴다'가 근거였는데, 그 위험은 게이트가 아니라
    # 상태 모델이 막아야 하는 것이었다 — 이제 하드 실패로 0레코드인 법인은 done이
    # 아니라 hardSkipped에 들어가므로 부분 상태도 정직하다. 반대로 이 게이트는 실재하는
    # 손실을 냈다: collect #1에서 샤드 하나가 정찰 실패로 죽자 정상 종료한 나머지 7샤드의
    # 하루치 진행이 통째로 커밋되지 않았다. 같은 워크플로의 fail-fast: false가 '한 샤드가
    # 막혀도 나머지 진행은 자산이다'라고 적어둔 것과 정면으로 모순이었다.
    #
    # cancelled()만 배제한다. 취소는 '이 실행을 없던 일로 하라'는 지시라 다르다.
    # CLAUDE.md의 'commit 스텝은 if: success()' 규칙은 산출물·manifest에 대한 것이고,
    # 여기가 커밋하는 것은 finalize가 삭제하는 resume 상태뿐이다 — manifest를 찍는
    # finalize 잡의 Commit은 그대로 if: success()다.
    needs: collect
    if: ${{ !cancelled() && inputs.mode == 'collect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Which commit is running
        # 재실행(Re-run jobs)은 **그 실행이 시작된 시점의 커밋**을 다시 돌린다.
        # main을 고쳐도 옛 실행을 재실행하면 옛 코드가 돈다 — 같은 오류가 영원히 난다.
        # 실제로 그 함정에 빠졌다: 526fbe6에서 고친 requests 지연 import가 main에
        # 있는데도 재실행 로그에는 최상단 import requests가 찍혔다. 로그에 SHA가
        # 있었다면 첫 줄에서 알아봤을 것이다.
        run: |
          echo "checkout SHA : ${{ github.sha }}"
          echo "run attempt  : ${{ github.run_attempt }}"
          if [ "${{ github.run_attempt }}" != "1" ]; then
            echo "::warning::재실행이다. 이 잡은 위 SHA의 코드를 돈다 — main의 최신 수정은 반영되지 않는다. 코드를 고쳤다면 재실행이 아니라 새 dispatch가 필요하다."
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: a3-shard-*
          # merge-multiple을 쓰지 않는다. 시도별 아티팩트가 같은 파일명을 담고 있어
          # 합치면 **추출 순서가 승자를 정한다** — 비결정적이고, 진행이 덜 된 시도가
          # 이길 수 있다. 각자 자기 디렉터리에 풀고 아래에서 명시적으로 고른다.
          path: _artifacts/

      - name: Pick best attempt per shard
        # 샤드마다 corpsDone이 가장 많은 시도를 고른다. 상태는 단조 축적이고 모든
        # 시도가 같은 커밋된 상태에서 출발하므로, 더 많이 진행한 것이 덜 진행한 것을
        # 포함한다(todo 순서가 sorted로 결정적이다). '나중 것'이 아니라 '더 나아간 것'을
        # 고르는 것이 상태 모델과 일치한다.
        run: python scripts/pick-shard-artifacts.py _artifacts data/backfill/fundamentals/_shards

      - name: Progress summary
        # 완료 판정은 계산값이라(FN-1.3 원칙 2) 여기에 인라인하지 않는다.
        # 같은 계산이 YAML에 복사되면 계약이 두 벌이 되고 둘이 같이 틀린다(교훈44).
        #
        # continue-on-error다. 이 스텝은 사람이 읽는 요약일 뿐인데, collect #2에서
        # 이것이 실패하자 다음 스텝(Commit progress)이 스킵되어 7샤드의 하루치 진행이
        # 커밋되지 않았다 — persist 게이트를 !cancelled()로 완화해 막으려던 바로 그
        # 실패 모드가 한 층 아래에서 재발했다. 관측이 내구성을 막아서는 안 된다.
        continue-on-error: true
        # 실행 요약 페이지에도 쓴다. 예산 소진은 설계상 exit 0이라 잡이 **초록불인데
        # 담당분은 안 끝난** 상태가 정상적으로 존재한다 — 그 사실이 로그를 펼쳐야만
        # 보이면 초록불을 완료로 읽게 된다. 실제로 그렇게 읽혔다.
        # 완료 여부는 체크마크가 아니라 이 표가 말한다.
        run: |
          python scripts/build-fundamentals-a3.py --summary | tee /tmp/a3-summary.txt
          {
            echo "## A3 수집 진행"
            echo '```'
            cat /tmp/a3-summary.txt
            echo '```'
            echo "> 잡의 초록불은 '정상 종료'이지 '담당분 완료'가 아니다."
            echo "> 예산 소진은 실패가 아니라 분할 실행의 정상 경로다 — 완료 샤드 수를 본다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit progress
        # if를 붙이지 않는다. 위 스텝이 continue-on-error라 실패해도 여기까지 온다.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill/fundamentals/_shards)" ]; then
            git add data/backfill/fundamentals/_shards
            git commit -m "chore(backfill): A3 재무 수집 진행 상태"
            # 5번 다 실패하면 **스텝을 실패시킨다.** 예전에는 for 루프가 그냥 끝나
            # exit 0이 됐다 — persist가 초록불인데 아무것도 push되지 않는 조용한 손실
            # 경로였다. 하루치 수집이 걸린 자리에서 실패는 보여야 한다.
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                pushed=1; break
              fi
              echo "push 재시도 $i"; sleep 5
            done
            if [ "$pushed" != "1" ]; then
              echo "::error::5회 재시도 후에도 push 실패 — 이 실행의 수집 진행이 커밋되지 않았다."
              echo "아티팩트(a3-shard-*, 보존 3일)에 상태가 남아 있으니 만료 전에 회수한다."
              exit 1
            fi
          else
            echo "변경 없음 — 아티팩트에 상태 파일이 있었는지 위 다운로드 스텝을 확인한다"
          fi

  finalize:
    if: inputs.mode == 'finalize'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Policy sanity
        run: node scripts/test-policies.js

      - name: PIT regression test
        # 합성 픽스처로 availableFrom 계약과 계정 매칭 분기를 전부 밟는다
        # (네트워크·수집 산출물 불필요). PIT가 무너지는 실패는 조용하다 —
        # 점수도 등급도 정상으로 보이고 백테스트만 좋아진다. 여기서 먼저 멈춘다.
        run: python scripts/test-fundamentals-a3.py

      - name: Finalize
        env:
          A3_FAIL_INJECTION: ${{ inputs.failInjection }}
        run: python scripts/build-fundamentals-a3.py --finalize

      - name: Verify diagnostics contract
        run: node scripts/verify-diagnostics.js A3

      - name: Quality report (QR-1.0)
        # 산출물이 인수 조건을 통과한 뒤에만 만든다. 실패한 수집물의 품질 리포트는
        # 읽는 사람을 오도한다 — 그 수치는 '통과한 데이터'의 것이 아니다.
        # 계산은 analyze-fundamentals-a3.py 하나에 있고 이 스크립트는 담기만 한다.
        run: |
          python scripts/test-analyze-a3.py
          python scripts/generate-quality-report.py \
            --out data/backfill/fundamentals/a3/_quality.json

      - name: Write manifest
        if: success()
        run: |
          D=data/backfill/fundamentals/a3
          ls -1 "$D"/*.jsonl.gz > /dev/null || { echo "Build 성공인데 산출물이 없다"; exit 1; }
          EXTRA=$(python -c "
          import json
          d = json.load(open('$D/_diagnostics.json', encoding='utf-8'))
          # 수집 계약·정책 버전·승인 규모를 manifest에 남긴다. finalize가 _shards/를
          # 지우므로 이 값들이 '어떤 계약으로 모았는가'의 유일한 생존 기록이다.
          # manifest와 상태의 일치를 여기서 '검사'하지는 않는다 — 이 값이 그 상태에서
          # 나왔으므로 구성상 항상 같고, 그런 검사는 아무것도 잡지 못한다(교훈45).
          # 샤드 간 불일치는 finalize가 이미 중단으로 잡는다.
          ch = d['collectionContractHashes']
          print(json.dumps({
              'recordCount': d['rowCount'],
              'collectionContractHash': ch[0] if len(ch) == 1 else ch,
              'collectionPolicyVersions': d['collectionPolicyVersions'],
              'corpsHardSkipped': d['corpsHardSkipped'],
              'declaredGapsCount': d['declaredGapsCount'],
              'fiscalYearFrom': d['fiscalYearFrom'],
              'fiscalYearTo': d['fiscalYearTo'],
              'corpsWithData': d['corpsWithData'],
              'corpsTargeted': d['corpsTargeted'],
              'corpsWithDataRateByGroup': d['corpsWithDataRateByGroup'],
              'coverageRate': d['coverageRate'],
              'collectionWindow': d['collectionWindow'],
              'reportsFound': d['reportsFound'],
              'periodEndParsedRate': d['periodEndParsedRate'],
              'restatedFiscalYears': d['restatedFiscalYears'],
              'disclosureLagDays': d['disclosureLagDays'],
              'roeAbsOutlierCount': d['roeAbsOutlierCount'],
              'sectorNotPointInTime': d['sectorNotPointInTime'],
          }, ensure_ascii=False))
          ")
          node scripts/write-manifest.js \
            --stage A3 --stageVersion A3.0 \
            --target data/backfill/fundamentals/a3 --kind dir --ext .jsonl.gz \
            --upstream A1a,A1b \
            --policies universe,fundamentals \
            --approvals declaredGapsA3 \
            --extra "$EXTRA"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-a3-diagnostics
          path: |
            data/backfill/fundamentals/a3/_diagnostics.json
            data/backfill/fundamentals/a3/_quality.json
          if-no-files-found: warn

      - name: Commit
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 중간 산출물을 지운다. 남겨두면 전체 데이터의 사본이 저장소에 영구히 쌓이고,
          # 다음 수집이 낡은 상태를 이어받는다.
          rm -rf data/backfill/fundamentals/_shards
          git add -A data/backfill/fundamentals data/backfill/manifest
          if [ -n "$(git status --porcelain data/backfill/fundamentals data/backfill/manifest)" ]; then
            git commit -m "chore(backfill): A3 재무(PIT) 백필"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
