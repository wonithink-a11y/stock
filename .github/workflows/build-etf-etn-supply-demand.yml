name: Build ETF/ETN supply-demand (KRX login)

# ETF/ETN 전종목 일별 수급(개인/외국인/기관 순매수) 백필. KRX_ID/KRX_PW
# 로그인 필요 - probe-etf-etn-supply-demand-krx.yml(2026-09-01)로 Actions
# 환경에서 되는 것까지 확인 후 착수. 종목당 1콜로 전체 기간이 나온다
# (scripts/build-etf-etn-supply-demand.py 상단 주석 참고) - 가격 백필처럼
# 날짜별로 나눠 부를 필요 없음, 대신 종목 수(약 1,536개)만큼 순회한다.
#
# 전체 백필이 끝날 때까지는 수동 트리거만. 다 채워지면 build-etn-price-
# history.yml처럼 매일 자동 스케줄로 전환한다.

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: '이 날짜부터(YYYYMMDD, 포함) - 종목별 재개 지점은 자동으로 이어받음'
        required: false
        default: '20190101'
        type: string
      budget_minutes:
        description: '이번 실행에 쓸 시간(분) - 넘으면 중단하고 다음 실행이 이어받음'
        required: false
        default: '20'
        type: string

permissions:
  contents: write

concurrency:
  group: build-etf-etn-supply-demand
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pykrx
        run: pip install pykrx pandas

      - name: Build ETF/ETN supply-demand
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build-etf-etn-supply-demand.py --from-date "${{ inputs.from_date || '20190101' }}" --budget-minutes "${{ inputs.budget_minutes || '20' }}"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf-etn/supply-demand/
          git diff --staged --quiet || git commit -m "chore: ETF/ETN supply-demand backfill (KRX login)"
          git pull --rebase --autostash origin main
          git push
