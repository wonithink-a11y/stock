name: Stock flows update (per-stock 수급 tab)

# 종목 상세 모달의 '수급' 탭이 읽는 docs/data/stock-flows.json을 KR 전종목
# (docs/data/latest.json 기준, 현재 99개) 갱신한다. 네이버 모바일 API만 쓰므로
# pykrx/KRX 로그인 불요 - scripts/build-stock-flows.py 상단 주석 참고.

on:
  schedule:
    - cron: '35 8 * * 1-5'   # 08:35 UTC = 17:35 KST, 평일 (watchlist-daily-update 5분 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-flows-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build stock flows
        run: python scripts/build-stock-flows.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/stock-flows.json
          git diff --staged --quiet || git commit -m "chore: update docs/data/stock-flows.json (per-stock flows)"
          git pull --rebase --autostash origin main
          git push
