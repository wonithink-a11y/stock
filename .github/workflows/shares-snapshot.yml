name: shares-snapshot

# KRX 상장주식수 현재 스냅샷 -> docs/data/shares-snapshot.json
# scripts/build-shares-snapshot.py 참고. 백필 단계가 아니다 - manifest 없고
# data/backfill/ 에 안 쓴다. sector-strength.json 과 같은 성격의 관찰용 산출물.
#
# ★ 일일 갱신은 이 워크플로가 한다(2026-09-07 분리). daily-analysis 안에
#   스텝으로 붙였더니 KRX 가 252콜에서 막혔다(성공 252/353 + 이월 21 = 273).
#   같은 스크립트를 단독 실행한 전날은 353/353 · 3분55초였다. 원인을 계정
#   한도로 특정하지는 못했지만 단독 실행이 성공한 것은 실측이다.
#   06:40 UTC = 15:40 KST — daily-analysis(07:40 UTC)보다 1시간 앞이라 그쪽
#   checkout 이 그날 스냅샷을 집어가고, KRX 자격증명을 쓰는 다른 워크플로
#   (macro-regime-ui 07:55 · calendar 08:00 · market-flows 09:20)와도 떨어져 있다.
#
# ★ schedule 에는 inputs 가 없다 — limit 은 0(전체), commit 은 true 로 떨어진다.
#   수동 실행의 기본값(limit=10 · commit=false)은 스모크용 그대로 남는다.

on:
  schedule:
    - cron: '40 6 * * 1-5'   # 06:40 UTC = 15:40 KST, 평일 (장 마감 후)
  workflow_dispatch:
    inputs:
      limit:
        description: '스모크용 종목 수 상한. 0=전체(약 353종목)'
        required: false
        default: '10'
        type: string
      commit:
        description: 'true 면 docs/data/shares-snapshot.json 을 커밋한다'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: shares-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet "pykrx==1.2.8" pandas

      - name: Build snapshot
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build-shares-snapshot.py --limit ${{ inputs.limit || 0 }}

      # 스냅샷이 실제로 소비자에게 어떻게 보이는지 같은 실행에서 확인한다.
      # 이 단계는 docs/data/sector-strength.json 을 만들지만 커밋하지 않는다
      # (그 파일의 writer 는 daily-analysis 다).
      - name: Consumer check (sector-strength)
        run: python scripts/build-sector-strength.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shares-snapshot
          path: |
            docs/data/shares-snapshot.json
            docs/data/sector-strength.json
          retention-days: 7
          if-no-files-found: warn

      - name: Commit snapshot
        if: success() && (inputs.commit == 'true' || github.event_name == 'schedule')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- docs/data/sector-strength.json || true
          if [ -n "$(git status --porcelain docs/data/shares-snapshot.json)" ]; then
            git add docs/data/shares-snapshot.json
            git commit -m "chore(shares): KRX 상장주식수 스냅샷"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
