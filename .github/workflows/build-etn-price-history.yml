name: Build ETN price history (KRX Open API backfill)

# ETN 375종목 일별 가격 이력 백필. pykrx엔 애초에 ETN 가격조회 함수가 없어서
# (2026-09-01 확인, GitHub 최신까지) 이 프로젝트가 이미 쓰는 KRX 공식 Open API
# (KRX_OPENAPI_KEY, fetch_krx_etf.py와 같은 키)로 대신한다. 날짜당 1콜로 그날
# ETN 전종목이 나온다 - 이어받기 가능(scripts/build-etn-price-history.py).
#
# API 일일 호출 한도를 몰라서 자동 스케줄 없이 수동 트리거만 둔다 - 12년치를
# 다 채우려면 여러 번 나눠 돌려야 한다. budget_minutes로 한 번에 얼마나
# 돌릴지 정한다.

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: '이 날짜부터(YYYYMMDD, 포함) 과거 방향으로는 안 감 - 스크립트가 캘린더 순서대로 감'
        required: false
        default: '20190101'
        type: string
      budget_minutes:
        description: '이번 실행에 쓸 시간(분) - 넘으면 중단하고 다음 실행이 이어받음'
        required: false
        default: '30'
        type: string

permissions:
  contents: write

concurrency:
  group: build-etn-price-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ETN price history
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
        run: python scripts/build-etn-price-history.py --from-date "${{ inputs.from_date }}" --budget-minutes "${{ inputs.budget_minutes }}"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf-etn/history/
          git diff --staged --quiet || git commit -m "chore: ETN price history backfill (KRX Open API)"
          git pull --rebase --autostash origin main
          git push
