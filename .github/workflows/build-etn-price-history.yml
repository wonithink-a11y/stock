name: Build ETN price history (KRX Open API backfill)

# ETN 375종목 일별 가격 이력 백필. pykrx엔 애초에 ETN 가격조회 함수가 없어서
# (2026-09-01 확인, GitHub 최신까지) 이 프로젝트가 이미 쓰는 KRX 공식 Open API
# (KRX_OPENAPI_KEY, fetch_krx_etf.py와 같은 키)로 대신한다. 날짜당 1콜로 그날
# ETN 전종목이 나온다 - 이어받기 가능(scripts/build-etn-price-history.py).
#
# 2019-01-01~2026-08-31 전체 백필은 완료됨(2026-09-01, 수동 트리거 3회).
# 이제부터는 calendar.yml이 매일 늘려주는 새 거래일 하루치만 이어 받으면
# 되므로 매일 자동 실행으로 전환한다(2026-09-01, 사용자 확인) - 하루 1건
# 콜이라 API 한도 걱정도 거의 없다. calendar.yml(08:00 UTC)이 그날 캘린더를
# 먼저 채워야 이 스크립트가 그 날짜를 볼 수 있으므로 그 뒤로 시간을 둔다.
# 수동 트리거는 그대로 남겨서 나중에 과거 구간을 더 당기거나 재보강할 때 쓴다.

on:
  schedule:
    - cron: '10 8 * * 1-5'   # 08:10 UTC = 17:10 KST, 평일 (calendar.yml 08:00 UTC 다음)
  workflow_dispatch:
    inputs:
      from_date:
        description: '이 날짜부터(YYYYMMDD, 포함) 과거 방향으로는 안 감 - 스크립트가 캘린더 순서대로 감'
        required: false
        default: '20190101'
        type: string
      budget_minutes:
        description: '이번 실행에 쓸 시간(분) - 넘으면 중단하고 다음 실행이 이어받음'
        required: false
        default: '30'
        type: string

permissions:
  contents: write

concurrency:
  group: build-etn-price-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ETN price history
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
        # schedule 트리거는 inputs가 비어있다 - 매일 증분(새 거래일 하루)이니
        # 5분이면 충분, from_date는 전체 이력 시작점 그대로(이미 있는 날짜는
        # 스크립트가 알아서 건너뛴다).
        run: python scripts/build-etn-price-history.py --from-date "${{ inputs.from_date || '20190101' }}" --budget-minutes "${{ inputs.budget_minutes || '5' }}"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf-etn/history/
          git diff --staged --quiet || git commit -m "chore: ETN price history backfill (KRX Open API)"
          git pull --rebase --autostash origin main
          git push
