name: market-report-telegram

# 장 마감 리포트 전달 — Claude 루틴이 reports/market-daily/*.md 를 커밋·push 하면 바로 텔레그램 1:1 방으로 보낸다.
# cron 이 아니라 push 로 깨운다: 이 저장소의 예약 실행은 중앙 4~5시간·최대 12시간 늦지만
# push 이벤트는 커밋 뒤 1분 안에 돈다(2026-10-13 실측, docs/control/시장마감리포트-설계-2026-10-13.md §2).
# ★ 중복 방지: 이번 push 에서 '새로 생긴' 파일(--diff-filter=A)만 보낸다. 같은 날짜·종류 파일을 고쳐 다시 push 해도
#   재발송하지 않는다 — 고친 내용을 다시 받고 싶으면 workflow_dispatch 로 파일을 지정한다.
# 실패하면 notify-failure 가 장애 방으로 알린다(성공→실패 전이).

on:
  push:
    branches: [main, 'claude/**']
    paths: ['reports/market-daily/*.md']
  workflow_dispatch:
    inputs:
      files:
        description: '다시 보낼 파일(공백 구분, 예: reports/market-daily/2026-10-13-kr.md)'
        required: true

concurrency:
  group: market-report-telegram-${{ github.sha }}

jobs:
  send:
    # 백필(과거 날짜 몰아 쓰기)은 커밋 메시지에 [no-telegram] — 대시보드에만 싣고 한꺼번에 보내지 않는다
    if: ${{ !contains(github.event.head_commit.message, '[no-telegram]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 보낼 파일 고르기
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL: ${{ github.event.inputs.files }}
        run: |
          if [ -n "$MANUAL" ]; then
            files="$MANUAL"
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git merge-base origin/main HEAD)   # 새 브랜치: main 과 갈라진 뒤 추가된 것
            fi
            files=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'reports/market-daily/*.md' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "보낼 파일: ${files:-없음}"
      - name: 텔레그램 발송
        if: steps.pick.outputs.files != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_REPORT_CHAT_ID }}
          REPORT_URL_BASE: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}
          REPORT_DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/   # summary.json 있으면 요약+이 링크
          FILES: ${{ steps.pick.outputs.files }}
        run: python scripts/send-telegram-report.py $FILES   # 공백 분리 의도
