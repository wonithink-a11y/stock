name: backfill-price-a2b

# A2b — 폐지분 일봉 가격 (BF-1.1). 정의는 config/policies/price.v1.json의 a2b 블록.
#
# 구조는 A2a와 같다(수집 → artifact → finalize 한 번). 다른 점은 넷이다.
#   1. 대상이 A1b 폐지 후보라 상류가 A0.5·A1b다 (A1a가 아니다)
#   2. 빈 응답이 정상 결과라 수집물이 0행에 가까울 수 있다 — if-no-files-found를
#      error로 두되, 판정은 finalize의 규모·커버리지 게이트가 한다
#   3. 산출물이 하나 더 있다: exitAt 확정값(delisted-exit.jsonl.gz)
#   4. PR-1.5부터 소스가 KIS다(pykrx/Naver 아님) — matrix 병렬 수집을 안 쓴다.
#      KIS 토큰 발급이 5분당 1회로 제한돼(실측) 여러 job이 동시에 발급을 다투면
#      대부분 실패한다. 병렬성은 job이 아니라 프로세스 안 스레드 동시성으로 낸다
#      (a2b.source.concurrency=2). 전량 예상 소요는 약 70분(표본 프로브 근거)이라
#      단일 job으로 충분하다.
#
# A2a와 concurrency 그룹·디렉터리·샤드 경로를 전부 분리한다. 같은 경로를 쓰면
# A2a finalize가 A2b 샤드를 병합하고, manifest 디렉터리 해시가 두 단계를 한 덩어리로
# 묶어 한쪽 재수집이 다른 쪽 하류까지 재실행시킨다.
on:
  workflow_dispatch:
    inputs:
      failInjection:
        description: '게이트 검증용. 값을 넣으면 인수 조건을 강제 실패시킨다(빈 값=정상 실행)'
        required: false
        default: ''
        type: string

concurrency:
  group: backfill-price-a2b
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 정책의 a2b.shards(=1)와 일치시킨다. PR-1.5부터 KIS 토큰 발급 5분당 1회
  # 제한 때문에 job을 나누지 않는다(위 코멘트 4번).
  SHARDS: 1
  # 표본 프로브(40건, seed=20260816) 실측 처리량 약 2.15콜/초·동시성 2 기준
  # 전량(약 9,080콜) 예상 약 70분(범위 33~109분). 여유를 크게 둔다 — 첫 실행이라
  # EGW00201 재시도가 표본보다 많이 걸릴 가능성을 배제하지 않는다.
  PYTHONUNBUFFERED: '1'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet requests

      # KIS 토큰 발급은 5분당 1회 제한이다(실측, probe-minute-kis.py). VM·로컬은
      # 이미 파일 하나(.token_cache_kis.json)를 여러 실행이 공유하지만 Actions는
      # 매 실행이 새 러너라 그 공유가 없다 — 여기서만 restore/save로 흉내낸다.
      # key를 run_id로 유니크하게 둬 매번 새로 저장하고(불변 캐시 제약 회피),
      # restore-keys 접두사로 가장 최근 캐시를 끌어온다. 만료·appkey 불일치는
      # _kis_token()이 그 자리에서 검증하므로 오래된 캐시가 와도 안전하다.
      - name: Restore KIS token cache
        uses: actions/cache/restore@v4
        with:
          path: .token_cache_kis.json
          key: kis-token-cache-${{ github.run_id }}
          restore-keys: |
            kis-token-cache-

      - name: Collect (KIS, 동시성 2, shards=1)
        timeout-minutes: 140
        env:
          # 저장소 시크릿 이름은 KIS_APPKEY/KIS_SECRET이다(gh secret list 실측,
          # 2026-08-16) — 로컬 .env·build-price-a2b.py가 쓰는 KIS_APP_KEY/
          # KIS_APP_SECRET과 이름이 다르다. 여기서만 매핑한다.
          KIS_APP_KEY: ${{ secrets.KIS_APPKEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_SECRET }}
        run: python scripts/build-price-a2b.py --shard 0 --shards $SHARDS

      - name: Save KIS token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .token_cache_kis.json
          key: kis-token-cache-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: a2b-shard-0
          path: data/backfill/price/_shards_a2b/
          retention-days: 1
          if-no-files-found: error

  finalize:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        # build-price-a2b.py가 모듈 최상단에서 requests를 무조건 import한다
        # (--finalize 경로도 마찬가지) — pykrx/pandas는 PR-1.5부터 불필요하다.
        run: pip install --quiet requests

      - uses: actions/download-artifact@v4
        with:
          pattern: a2b-shard-*
          merge-multiple: true
          path: data/backfill/price/_shards_a2b/

      - name: Verify all shards present
        # 샤드 진단이 빠지면 빈 응답 수를 모르고, 그러면 커버리지의 분모가 없다.
        # finalize가 그 경우 중단하지만 여기서 먼저 명시적으로 센다.
        run: |
          N=$(ls data/backfill/price/_shards_a2b/shard-*.jsonl 2>/dev/null | wc -l)
          D=$(ls data/backfill/price/_shards_a2b/_diagnostics-shard-*.json 2>/dev/null | wc -l)
          echo "샤드 파일 $N개 · 샤드 진단 $D개 / 기대 $SHARDS개"
          test "$N" -eq "$SHARDS" || { echo "샤드 누락 — 부분 수집물로 산출할 수 없다"; exit 1; }
          test "$D" -eq "$SHARDS" || { echo "샤드 진단 누락 — 커버리지 분모를 셀 수 없다"; exit 1; }

      - name: A2b regression test
        # 합성 픽스처로 A2b 고유 분기를 밟는다(네트워크·산출물 불필요).
        # exitAt이 조용히 무너지는 축이라 수집 전에 돌린다(교훈49).
        run: python scripts/test-price-a2b.py

      - name: Finalize
        env:
          A2B_FAIL_INJECTION: ${{ inputs.failInjection }}
        run: python scripts/build-price-a2b.py --finalize

      - name: Verify diagnostics contract
        run: node scripts/verify-diagnostics.js A2b

      - name: Write manifest
        if: success()
        run: |
          D=data/backfill/price/a2b
          ls -1 "$D"/*.jsonl.gz > /dev/null || { echo "Build 성공인데 산출물이 없다"; exit 1; }
          EXTRA=$(python -c "
          import json
          d = json.load(open('$D/_diagnostics.json', encoding='utf-8'))
          print(json.dumps({
              'recordCount': d['rowCountAfterExclusion'],
              'recordCountBeforeExclusion': d['rowCount'],
              'candidateCount': d['candidateCount'],
              'tickersWithData': d['tickersWithData'],
              'tickersInAnalysisWindow': d['tickersInAnalysisWindow'],
              'analysisFrom': d['analysisFrom'],
              'emptyCount': d['emptyCount'],
              'missingRate': d['missingRate'],
              'qualityExcludedCount': d['qualityExcludedCount'],
              'exitRecordCount': d['exitRecordCount'],
              'coverageAssumesFailuresOutOfWindow': d['coverageAssumesFailuresOutOfWindow'],
              'exitAtIsLastTradedNotEffectiveDate': d['exitAtIsLastTradedNotEffectiveDate'],
              'environment': d['environment'],
          }, ensure_ascii=False))
          ")
          node scripts/write-manifest.js \
            --stage A2b --stageVersion A2b.0 \
            --target data/backfill/price/a2b --kind dir --ext .jsonl.gz \
            --upstream A0.5,A1b \
            --policies universe,price \
            --extra "$EXTRA"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-a2b-diagnostics
          path: data/backfill/price/a2b/_diagnostics.json
          if-no-files-found: warn

      - name: Commit
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill/price/a2b data/backfill/manifest)" ]; then
            git add data/backfill/price/a2b data/backfill/manifest
            git commit -m "chore(backfill): A2b 폐지분 일봉 가격 + exitAt 확정"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
