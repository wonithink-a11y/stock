name: pipeline

# 종목 발굴~매도 파이프라인(공개 쪽) — 후보 선별 → (논리·반증 주석) → 무효 조건 점검 → 사후 평가.
# 설계 docs/ARCHITECTURE.md · 계약 docs/AGENT_SPEC.md. data/pipeline/ 에 쓰는 것은 이 워크플로 하나다.
# 점수(16:40)·공시(18:10)·해독(20:00)·순위(20:25) 뒤에 돈다. 다음 장 09:05 전에만 끝나면 된다(허용 지연 약 12시간).

on:
  schedule:
    - cron: '40 11 * * 1-5'   # 20:40 KST 평일
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 계약·격리 회귀가 깨진 코드로는 로그에 쓰지 않는다
      - name: Regressions
        run: |
          for f in scripts/test-pipeline-*.py; do python "$f"; done

      - name: Candidates
        run: python -m pipeline candidates

      # 실패한 실행은 커밋하지 않는다(if: always() 금지) — 진단만 아티팩트로 남긴다
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline
          git diff --staged --quiet && exit 0
          git commit -m "chore: pipeline run (후보·주석·평가 기록, 관찰용)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-diagnostics
          path: data/pipeline/diagnostics
          if-no-files-found: ignore
