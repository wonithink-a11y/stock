# 장중 급등락 감시: 한국장·미국장 시간대.
#
# ★★ 실측(2026-09-11): **10분 간격으로 돌지 않는다.** GitHub 이 공개 저장소의
#    고빈도 schedule 을 흘린다 - 한국장 창에서 하루 42회 기대인데 8거래일 전부
#    **실측 1회**였다. cron 을 고쳐서 되는 문제가 아니다(트리거를 바꿔야 하는데,
#    이 워크플로는 docs/data/intraday-state.json 을 커밋하므로 VM 으로 옮기면
#    'VM 에 GitHub 자격증명을 넣지 않는다'는 구조 규칙과 충돌한다 - CLAUDE.md).
#
#    그래서 **간격을 고치는 대신 규칙이 실제 간격을 알게 했다.** suddenMove 는
#    직전 체크가 30분 이내일 때만 판정한다(RULES.suddenMaxGapMinutes) - 즉 지금
#    실행 빈도에서는 **suddenMove 가 사실상 잠들어 있고 dailyMove 만 돈다.**
#    빈도가 회복되면 스스로 깨어난다. 근거·경위: scripts/test-intraday-check.js 머리말.
#
# cron은 UTC 기준. 스크립트가 현재 열린 시장을 다시 판별하므로 여유 있게 잡아도 안전합니다.
#   - KR장: 00:00~06:40 UTC (09:00~15:40 KST)
#   - US장: 13:20~21:10 UTC (서머타임/표준시 모두 커버)
# ⚠️ private 저장소는 Actions 무료 한도(월 2,000분)가 빠듯할 수 있습니다.
#    한도가 걱정되면 '*/10' → '*/20'으로 간격을 늘리세요. public 저장소는 무제한.
name: intraday-alert

on:
  schedule:
    # cron 은 UTC 만 받는다(GitHub 제약). KST 를 같이 적어 산수를 검증 가능하게 둔다.
    - cron: '*/10 0-6 * * 1-5'    # 00:00~06:50 UTC = 09:00~15:50 KST  한국장
    - cron: '*/10 13-21 * * 1-5'  # 13:00~21:50 UTC = 22:00~06:50 KST(+1일)  미국장
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 급등락 체크
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/intraday-check.js

      - name: 상태 파일 커밋
        run: |
          git config user.name "stock-scoring-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add docs/data/intraday-state.json
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: intraday state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          fi
