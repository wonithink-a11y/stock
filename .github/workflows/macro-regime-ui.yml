name: Update ui/data/macro.json (Research Regime Layer)

# 리서치랩 매크로 축(환율·VIX·미국/한국 금리·나스닥·코스피·CPI 등)을 FRED/ECOS/
# Naver에서 받아 research/strategy-lab의 소스 parquet을 새로 만들고,
# docs/data/macro.json(운영, macro.yml이 매일 갱신)과 합쳐 ui/data/macro.json
# (Paper Trading Engine "매크로" 탭)을 만든다. FRED·Naver 차트는 무키,
# ECOS만 ECOS_KEY(사용자 발급) 필요. 원본 parquet은 research/strategy-lab
# 관례대로 커밋하지 않고(.gitignore) 최종 산출물 ui/data/macro.json만 커밋한다.
#
# ★ market_regime_features.parquet(A2a 전량 기반 breadth/trend/correlation)은
# 이 워크플로가 안 건드린다 - 매크로 탭이 그 필드들을 안 쓰고, A2a 전량을
# 매번 다시 읽는 계산이 무거워(로컬 실측 수 분, 완주 확인 못 함) 매일 자동화
# 대상으로 부적합하다고 판단(build_ui_macro.py 상단 주석 참고). 그 데이터가
# 다시 필요해지면 build_regime_features_backfill.py를 별도로 수동 실행한다.
#
# schedule 활성화(2026-08-30, 사용자 확인) - macro_common.py의 load_kr_calendar()가
# data/backfill/calendar.json(수동 전용 A0.5) 대신 pykrx로 KR 거래일을 직접
# 조회하도록 바뀌어(커밋 ff37237) 더 이상 그 동결에 막히지 않는다. cron은
# macro.yml(07:40 UTC 평일)이 끝난 뒤 여유를 두고 잡는다 - workflow_run이
# 이미 그 완료에 체이닝돼 있으니 cron은 이중 안전망이다.
on:
  workflow_run:
    workflows: ["Update macro.json"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '55 7 * * 1-5'   # 07:55 UTC = 16:55 KST, 평일 (macro.yml 15분 뒤)

permissions:
  contents: write

concurrency:
  group: macro-regime-ui
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/strategy-lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet pandas numpy pyarrow pykrx

      - name: VIX (FRED, 무키)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python build_vix_backfill.py

      - name: USD/KRW (FRED, 무키)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python build_usdkrw_backfill.py

      - name: KR macro layer (ECOS+Naver)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python build_macro_layer_backfill.py

      - name: FRED extended (무키)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python build_fred_extended_backfill.py

      - name: Build ui/data/macro.json
        run: python build_ui_macro.py

      - name: Commit ui/data/macro.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../../ui/data/macro.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update ui/data/macro.json (research regime layer)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          fi
