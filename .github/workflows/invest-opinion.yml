name: invest-opinion

# 관심종목 KR 증권사 투자의견 일지 → docs/data/invest-opinion.json (대시보드 이벤트·뉴스 > '증권사 의견').
# scripts/build-invest-opinion.py — KIS 종목투자의견(조회 전용), 관심종목 KR × 1콜(100행 넘으면 기간 분할), 약 3~5분.
# 맥락 전용 — 점수·매매에 쓰지 않는다. KIS 토큰은 price-a2b 와 같은 캐시를 공유한다(발급 5분당 1회 제한).

on:
  schedule:
    - cron: '0 11 * * 1-5'    # 평일 20:00 KST (예정 시각 — Actions 는 몇 시간 늦을 수 있다)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invest-opinion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests

      - name: Restore KIS token cache
        uses: actions/cache/restore@v4
        with:
          path: .token_cache_kis.json
          key: kis-token-cache-${{ github.run_id }}
          restore-keys: |
            kis-token-cache-

      - name: Build
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APPKEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_SECRET }}
          PYTHONIOENCODING: utf-8
        run: python -u scripts/build-invest-opinion.py

      - name: Save KIS token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .token_cache_kis.json
          key: kis-token-cache-${{ github.run_id }}

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/invest-opinion.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update docs/data/invest-opinion.json (증권사 의견 일지)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          exit 1
