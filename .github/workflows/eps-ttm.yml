name: eps-ttm

# 종목별 분기 EPS → TTM PER (종목 분석 카드용) → docs/data/eps-ttm.json + data/eps-ttm/quarters.json(캐시).
# scripts/build-eps-ttm.py — 설계: docs/control/종목분석카드-EPS-PER-분해-설계-2026-09-30.md
# 관심종목 KR 12월 결산 × 분기 보고서. 최신 분기부터 채우고 호출 예산(budget) 안에서 멈춘다 — 첫 백필(≈14,700건)은 예산이 크면 한 번에 끝나고,
# 이후엔 새 공시만 부른다. DART 일일 한도는 40,000(사용자 확인 2026-08-13, fundamentals.v1.json quota)이고 stock-events(≈1,400)·공시 수집(≈400)과 나눠 쓴다.
# 스레드 6개 병렬(2026-10-01): DART 응답이 가끔 분 단위로 멈춰서(직렬 150콜이 32초~122초로 들쭉날쭉) 병렬이 그 정지를 가려 준다.
# 한도 소진(020)은 실패가 아니라 정상 종료다. 이 워크플로는 dispatch 시점의 커밋으로 체크아웃한다 — 같은 워크플로를 겹쳐 dispatch 하면
# 뒤 실행이 앞 실행의 캐시 커밋을 못 봐서 중복 조회·push 충돌이 난다(앞 실행이 끝난 뒤에 돌린다).
# 관찰용 — 점수·매매에 쓰지 않는다.

on:
  schedule:
    - cron: '30 11 * * 1-5'   # 20:30 KST — stock-events(19:40) 뒤
  workflow_dispatch:
    inputs:
      budget:
        description: 'DART 호출 상한(첫 백필 전체 ≈15,000콜, 평소엔 새 공시만이라 수십~수백)'
        required: false
        default: '15000'
        type: string

permissions:
  contents: write

concurrency:
  group: eps-ttm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build eps-ttm
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python -u scripts/build-eps-ttm.py --budget "${{ inputs.budget || '15000' }}" --max-minutes 120

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/eps-ttm.json data/eps-ttm/quarters.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update docs/data/eps-ttm.json (분기 EPS·TTM PER)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
