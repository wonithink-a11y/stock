# 주 1회 (일요일) 누적 이력으로 백테스트 리포트 갱신
# 08:00 UTC 일요일 = 17:00 KST 일요일
name: weekly-backtest

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analysis
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 백테스트 리포트 생성
        run: node scripts/backtest-report.js

      - name: 결과 커밋
        run: |
          git config user.name  "stock-scoring-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/backtest.json docs/data/backtest-v2.json
          git diff --cached --quiet && echo "변경 없음 - 커밋 생략" && exit 0
          git commit -m "chore: weekly backtest report $(date -u +'%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push 재시도 $i..."; sleep 5
          done
          echo "push 최종 실패"; exit 1
