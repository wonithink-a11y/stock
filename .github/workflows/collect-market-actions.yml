name: collect-market-actions
on: { workflow_dispatch: {} }
concurrency: { group: goldenset-write, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/collect-market-actions.js
      - if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/goldenset/ && git diff --cached --quiet || \
            (git commit -m "task-2b: market actions snapshot" && git pull --rebase --autostash && git push)
