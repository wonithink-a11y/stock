name: Fetch disclosures (DART)

# 관심종목(watchlist)의 DART 공시를 매일 조회해 docs/data/disclosures.json 갱신 + 텔레그램 알림.
# STEP2부터는 data/state/, data/state-history/ 도 함께 커밋한다(Event→State 반영 결과).
# 인증키는 저장소 Secrets 로만 주입한다 (코드에 하드코딩 금지).

on:
  schedule:
    # 평일 저녁 (09:10 UTC = 18:10 KST) — 장 마감·정정공시 반영 후.
    - cron: '10 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# state를 쓰는 모든 워크플로(향후 state-expire.yml 포함)와 같은 그룹으로 묶어 직렬화한다.
# rebase는 증상 치료일 뿐이고, 동시 쓰기 자체를 막는 것이 근본 해법이다.
concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  disclosures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch disclosures from DART
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/fetch-disclosures-kr.js

      - name: Commit disclosures + state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/disclosures.json data/state data/state-history
          git diff --staged --quiet && exit 0
          git commit -m "chore: update disclosures + state from DART"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
