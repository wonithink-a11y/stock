name: contract-liab

# 종목별 계약부채 증가(매출 가시성, 종목 분석 카드용) → docs/data/contract-liab.json + data/contract-liab/cache.json(캐시).
# scripts/build-contract-liab.py — 정의는 연구 1단계(research/strategy-lab/contract_liab_revenue.py `cl_amount`)와 같다.
# 관심종목 KR 12월 결산 × 사업보고서 최근 2개 사업연도. 첫 실행 ≈ 관심종목 × 2.2콜(≈800), 이후엔 새 사업연도만(4월 초 한 번 몰리고 그 밖엔 0~수십).
# DART 일일 한도는 eps-ttm·stock-events 와 나눠 쓴다. 관찰용 — 점수·매매에 쓰지 않는다.

on:
  schedule:
    - cron: '20 12 * * 1'     # 월 21:20 KST — 미공시 최신 사업연도는 7일마다 다시 묻는다
  workflow_dispatch:
    inputs:
      budget:
        description: 'DART 호출 상한'
        required: false
        default: '3000'
        type: string

permissions:
  contents: write

concurrency:
  group: contract-liab
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build contract-liab
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          pip install --quiet pandas
          python -u scripts/build-contract-liab.py --budget "${{ inputs.budget || '3000' }}"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/contract-liab.json data/contract-liab/cache.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update docs/data/contract-liab.json (계약부채·매출 가시성)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
