name: Update macro.json

# 매크로 지표(일드커브·VIX·HY스프레드·달러·M2·스타일·폭·KOSPI200 선물 등)를
# FRED/Stooq/Yahoo/Naver/KRX Open API 에서 받아 docs/data/macro.json 으로
# 커밋한다. KOSPI200 선물만 KRX_OPENAPI_KEY(공식 인증키) 필요, 나머지는 무료·무키.

on:
  schedule:
    - cron: '40 7 * * 1-5'   # 07:40 UTC = 16:40 KST, 평일
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: macro-json
  cancel-in-progress: false

jobs:
  macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch macro indicators
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
        run: python scripts/fetch_macro.py

      - name: Fetch ETF/ETN snapshot
        env:
          KRX_OPENAPI_KEY: ${{ secrets.KRX_OPENAPI_KEY }}
        run: python scripts/fetch_krx_etf.py

      - name: Commit macro.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/macro.json docs/data/kospi200fut_history.json docs/data/etf_snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update macro.json"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          fi
