name: backfill-price-a2a

# A2a — 현재 상장분 일봉 가격 (BF-1.1). 정의는 config/policies/price.v1.json.
#
# 실행 축(샤드)과 저장 축(연도)이 분리돼 있다. 샤드는 중간 산출을 artifact로만 넘기고,
# finalize 잡이 병합·정렬·연도 분할·gzip·인수 조건·manifest를 한다.
# 샤드 수를 바꿔도 산출물 바이트가 안 바뀌므로 manifest 해시가 불변이다.
#
# 샤드가 각자 커밋하지 않는 이유: 8개 잡이 같은 브랜치에 rebase 경합을 벌이고,
# 무엇보다 부분 완료 상태에 manifest가 찍힐 수 있다. manifest는 '인수 조건을
# 통과했다'는 뜻이므로 전 샤드가 모인 뒤 한 번만 찍는다.
on:
  workflow_dispatch:
    inputs:
      failInjection:
        description: '게이트 검증용. 값을 넣으면 인수 조건을 강제 실패시킨다(빈 값=정상 실행)'
        required: false
        default: ''
        type: string
  schedule:
    # ★ 월 1회다. A2a 는 매 실행이 **전 연도 파일을 다시 쓴다** - "현재 상장분"만
    # 담는 정의라 상장폐지분이 과거에서도 빠지고 수정주가 재산정이 소급된다
    # (실측 2026-09-03 커밋: 2014년 파일까지 4,794,388 -> 4,180,193 bytes 변경).
    # 한 번에 약 122MB 의 새 blob 이 생기므로 일간이면 연 30GB 다 - .git 이 지금
    # 1.6GB 인 저장소에서 붙일 수 없는 스케줄이다. 월 1회면 연 1.5GB 로 지금
    # 수동 주기와 같다.
    #
    # cron 은 "매월 첫 거래일"을 못 쓴다. 1~5일에 걸어두고 check 잡이 이번 달
    # 데이터가 이미 있으면 스킵해 실제 수집을 한 번으로 만든다.
    - cron: '0 10 1-5 * *'   # 19:00 KST. 첫 거래일 장 마감 뒤

concurrency:
  group: backfill-price-a2a
  cancel-in-progress: true

permissions:
  contents: write

env:
  SHARDS: 8
  # 정책의 requiredVersion과 일치시킨다. 핀을 안 박으면 어느 날 pip이 새 버전을
  # 끌어와 동작이 바뀌고, 그 사실이 manifest 어디에도 안 남는다.
  PYKRX_VERSION: 1.2.8

jobs:
  # 이번 달 수집이 이미 끝났는지만 본다(수 초). workflow_dispatch 는 항상 통과 -
  # 사람이 직접 부른 실행을 게이트가 막으면 디버깅이 불가능해진다.
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check-a2a-refresh-needed.py --selftest
      - id: gate
        run: python scripts/check-a2a-refresh-needed.py >> "$GITHUB_OUTPUT"

  collect:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true      # 한 샤드가 죽으면 나머지도 멈춘다 — 부분 수집물은 쓸 수 없다
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install --quiet "pykrx==${PYKRX_VERSION}" pandas

      - name: Collect shard ${{ matrix.shard }}
        timeout-minutes: 45
        run: python scripts/build-price-a2a.py --shard ${{ matrix.shard }} --shards $SHARDS

      - uses: actions/upload-artifact@v4
        with:
          name: a2a-shard-${{ matrix.shard }}
          path: data/backfill/price/_shards/
          retention-days: 1
          if-no-files-found: error

  finalize:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: pip install --quiet "pykrx==${PYKRX_VERSION}" pandas

      - uses: actions/download-artifact@v4
        with:
          pattern: a2a-shard-*
          merge-multiple: true
          path: data/backfill/price/_shards/

      - name: Verify all shards present
        # artifact가 하나라도 비면 조용히 적은 종목으로 통과할 수 있다.
        # 인수 조건의 minTickersWithData가 2차 방어지만, 여기서 먼저 명시적으로 센다.
        run: |
          N=$(ls data/backfill/price/_shards/shard-*.jsonl 2>/dev/null | wc -l)
          echo "샤드 파일 $N개 / 기대 $SHARDS개"
          test "$N" -eq "$SHARDS" || { echo "샤드 누락 — 부분 수집물로 산출할 수 없다"; exit 1; }

      - name: Quality classification regression test
        # 합성 픽스처로 판별 분기를 전부 밟는다(네트워크·수집 산출물 불필요).
        # 거래량 0·장기 공백·영구 계단·일시 스파이크·제외율 상한이 회귀하면
        # 6백만 행을 다 모으고 나서가 아니라 여기서 멈춘다.
        run: python scripts/test-price-a2a.py

      - name: Finalize
        env:
          A2A_FAIL_INJECTION: ${{ inputs.failInjection }}
        run: python scripts/build-price-a2a.py --finalize

      - name: Verify diagnostics contract
        run: node scripts/verify-diagnostics.js A2a

      - name: Write manifest
        if: success()
        run: |
          D=data/backfill/price/a2a
          ls -1 "$D"/*.jsonl.gz > /dev/null || { echo "Build 성공인데 산출물이 없다"; exit 1; }
          EXTRA=$(python -c "
          import json
          d = json.load(open('$D/_diagnostics.json', encoding='utf-8'))
          print(json.dumps({
              'recordCount': d['rowCountAfterExclusion'],
              'recordCountBeforeExclusion': d['rowCount'],
              'calendarStart': d['calendarStart'],
              'actualDataFrom': d['actualDataFrom'],
              'actualDataTo': d['actualDataTo'],
              'missingRate': d['missingRate'],
              'qualityExcludedCount': d['qualityExcludedCount'],
              'qualityExcludedByReason': d['qualityExcludedByReason'],
              'frontTruncatedTickerDays': d['frontTruncatedTickerDays'],
              'environment': d['environment'],
          }, ensure_ascii=False))
          ")
          node scripts/write-manifest.js \
            --stage A2a --stageVersion A2a.0 \
            --target data/backfill/price/a2a --kind dir --ext .jsonl.gz \
            --upstream A0.5,A1a \
            --policies universe,price \
            --extra "$EXTRA"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-a2a-diagnostics
          path: data/backfill/price/a2a/_diagnostics.json
          if-no-files-found: warn

      - name: Commit
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill/price/a2a data/backfill/manifest)" ]; then
            git add data/backfill/price/a2a data/backfill/manifest
            # 커밋 메시지에 정책 버전을 넣지 않는다. 사람이 관리하는 중복 정보라
            # 실제 정책과 어긋난다(첫 실행이 PR-1.2인데 PR-1.0으로 찍혔다).
            # 버전은 manifest.policyHash · diagnostics가 이미 정확히 기록한다.
            git commit -m "chore(backfill): A2a 현재 상장분 일봉 가격"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
