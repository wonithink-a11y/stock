name: backfill-universe-a1b

# A1b — 폐지 이력 유니버스 (BF-1.1). 정의는 config/policies/universe.v1.json의 a1b 블록.
# 네트워크를 쓰지 않는다 — 입력 3개(A0.7 corpcode / A1a current·excluded)가 모두
# 커밋된 산출물이라 이 잡은 순수 집합 연산이다. 상류가 갱신되면 다시 돌린다.
on:
  workflow_dispatch:
    inputs:
      failInjection:
        description: '게이트 검증용. 값을 넣으면 인수 조건을 강제 실패시킨다(빈 값=정상 실행)'
        required: false
        default: ''
        type: string

concurrency:
  group: backfill-universe-a1b
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # pip 설치 스텝 없음 — build-universe-a1b.py는 표준 라이브러리만 쓴다.
      # 의존성을 '혹시 몰라' 넣으면 네트워크 없는 단계가 네트워크 실패로 죽는다.

      - name: Build A1b
        timeout-minutes: 5
        env:
          A1B_FAIL_INJECTION: ${{ inputs.failInjection }}
        run: python scripts/build-universe-a1b.py

      - name: Verify diagnostics contract
        # 계약은 scripts/verify-diagnostics.js의 표 하나에 있다. YAML에 인라인하면
        # 같은 계약이 워크플로 수만큼 복사되고, 필드를 늘릴 때 한 곳만 고치는 경로가 생긴다.
        run: node scripts/verify-diagnostics.js A1b

      - name: Regression test
        # 개수 임계는 분포를 보지 못한다. 알려진 폐지 5건이 실제로 후보에 있는지는
        # 여기서만 확인된다. manifest는 이 스텝까지 통과해야 찍힌다.
        run: node scripts/test-universe-a1b.js

      - name: Write manifest
        if: success()
        run: |
          F=data/backfill/universe/a1b/delisted.jsonl
          test -f "$F" || { echo "Build 성공인데 산출물이 없다 — 스크립트 계약 위반"; exit 1; }
          N=$(grep -c '' "$F")
          echo "delisted.jsonl 실측 행 수: $N"
          node scripts/write-manifest.js \
            --stage A1b --stageVersion A1b.0 \
            --target data/backfill/universe/a1b --kind dir --ext .jsonl \
            --upstream A0.7,A1a \
            --policies universe \
            --extra "{\"recordCount\":$N}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-a1b-diagnostics
          path: data/backfill/universe/a1b/_diagnostics.json
          if-no-files-found: warn

      - name: Commit
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill/universe/a1b data/backfill/manifest)" ]; then
            git add data/backfill/universe/a1b data/backfill/manifest
            git commit -m "chore(backfill): A1b 폐지 이력 유니버스 (UN-1.2)"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
