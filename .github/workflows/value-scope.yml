name: value-scope

# 'PIT 가치 검증 범위' 표 → docs/data/value-scope.json (scripts/build-value-scope.js).
# 관심종목 KR 마다 PER/PBR 을 시점 보정할 수 있는지(없으면 보류 사유)를 적는다. 저장소 데이터만 읽는 순수 계산(3초) —
# 점수·정책·전략 불변, 표시 전용. 자본 이력은 드물게 바뀌므로 주 1회로 충분하다.
# 데이터가 같으면 파일이 바이트 동일해서 커밋하지 않는다(타임스탬프 없음).

on:
  schedule:
    - cron: '30 11 * * 6'   # 토 20:30 KST — 금요일 일봉·기업행위 갱신 뒤
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: value-scope
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Selftest
        run: node scripts/build-value-scope.js --selftest

      - name: Build value scope
        run: node scripts/build-value-scope.js

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/value-scope.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update docs/data/value-scope.json (PIT 가치 검증 범위)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
