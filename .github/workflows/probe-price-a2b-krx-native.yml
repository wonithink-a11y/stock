name: probe-price-a2b-krx-native

# A2b 대체경로 ③ 정찰 — 수집이 아니라 판정. 소수 종목(005930/000660) 1~2분.
# 결과는 data/backfill/_probe-price-a2b-krx-native.json.
on:
  workflow_dispatch:

concurrency:
  group: probe-price-a2b-krx-native
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet pykrx pandas

      - name: Probe
        timeout-minutes: 5
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/probe-price-a2b-krx-native.py

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-price-a2b-krx-native
          path: data/backfill/_probe-price-a2b-krx-native.json
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill)" ]; then
            git add data/backfill/_probe-price-a2b-krx-native.json
            git commit -m "chore(backfill): A2b 대체경로 ③ KRX-native 프로브 결과"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
