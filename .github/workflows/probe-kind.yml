name: probe-kind

# A1 2차 정찰 — KIND 목록 구조 확정. 1~2분. 결과는 data/backfill/_probe-kind.json.
on:
  workflow_dispatch:

concurrency:
  group: probe-kind
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet pandas requests lxml html5lib

      - name: Probe
        timeout-minutes: 5
        run: python scripts/probe-kind.py

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-kind
          path: data/backfill/_probe-kind.json
          if-no-files-found: warn

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/backfill)" ]; then
            git add data/backfill/_probe-kind.json
            git commit -m "chore(backfill): A1 2차 정찰 — KIND 목록 구조"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && break
              echo "push 재시도 $i"; sleep 5
            done
          else
            echo "변경 없음"
          fi
