name: daily-analysis

# 일일 파이프라인: collect(시세·재무·수급 수집) → analyze(국면·스코어링·포트폴리오·추천이력)
#                 → notify(텔레그램/슬랙 알림) → docs/data/*.json 커밋
# 대시보드는 이 JSON을 raw.githubusercontent 로 읽어 자동 반영됩니다(서버 재배포 불필요).
# 키는 저장소 Secrets 로만 주입한다 (코드에 하드코딩 금지).
#
# GitHub 경로: .github/workflows/daily-analysis.yml

on:
  schedule:
    # 평일 16:40 KST = 07:40 UTC (장 마감 후)
    - cron: '40 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-push
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect market data
        run: node scripts/collect.js

      - name: Analyze & score
        run: node scripts/analyze.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # KRX 상장주식수 현재 스냅샷. 아래 섹터강도의 시총가중이 이걸 1순위로 쓰고
      # 없으면 A3c(분기보고서)로 폴백한다 - A3c 는 마지막 공시 이후의 액면분할·
      # 자사주 소각을 못 봐서 실측으로 최대 5배 틀린 종목이 있었다(LS ELECTRIC,
      # 2026-04-13 5:1 분할 vs A3c 2026-03-18 공시).
      #
      # 종목당 1콜(약 353콜, 4분). 실패해도 파이프라인을 안 죽인다 - 스크립트가
      # 전량 실패 시 파일을 아예 안 써서 어제 스냅샷이 그대로 살아 있고, 그래도
      # 없으면 소비자가 A3c 로 내려간다. 실패는 exit code 가 아니라 산출물의
      # sharesSource/sharesFallbackCount 로 드러난다(scripts/build-shares-snapshot.py).
      - name: Install KRX deps
        continue-on-error: true
        run: pip install --quiet "pykrx==1.2.8" pandas

      - name: Build shares snapshot (KRX)
        continue-on-error: true
        timeout-minutes: 20
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/build-shares-snapshot.py

      # prices.json(방금 analyze 가 쓴 것)을 그대로 읽어 섹터 상대강도 스냅샷을 만든다.
      # 새 수집 없음. 실패해도 일일 파이프라인을 죽이지 않는다(관찰용 지표).
      - name: Build sector strength snapshot
        continue-on-error: true
        run: python scripts/build-sector-strength.py

      # 같은 prices.json 을 읽어 종목별 손절가·목표가·수량 기준을 낸다.
      # config/policies/portfolio.v1.json(PF-1.2)의 규칙을 적용하기만 하고
      # 새 수집도 새 규칙도 없다. ★ 그 정책은 registry 미등록 = 미발효 초안이라
      # 산출물도 status: DRAFT_NOT_ADOPTED 를 달고 나온다 - 화면이 그대로 표시한다.
      - name: Build trade levels
        continue-on-error: true
        run: python scripts/build-trade-levels.py

      - name: Notify (telegram/slack)
        continue-on-error: true   # 알림 실패가 파이프라인을 죽이지 않도록
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify.js

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: daily analysis $(date -u +%Y-%m-%d)"
          # 동시 실행되는 다른 워크플로와의 푸시 경합(fetch first) 방지: rebase 후 재시도
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push 재시도 $i..."; sleep 5
          done
          echo "push 최종 실패"; exit 1
